# AionUi — the multi-agent "Cowork" desktop app (iOfficeAI/AionUi), sandboxed by ops on Wayland.
#
#   ops app import profiles/aionui.toml
#   ops app aionui
#
# AionUi is a free, open-source Electron + React desktop app: ONE interface over 20+ AI agents. It
# ships a built-in agent and auto-detects CLI agents installed on the machine (Claude Code, Codex,
# Gemini CLI, …) to "Cowork" with them — reading files, writing code, generating images, browsing,
# and running scheduled tasks. Under ops it runs CONFINED: it sees only the cage filesystem (the
# project directory you launch it from, bound in, plus its own persistent isolated home), reaches
# only the model-provider hosts you allow below, and its "act on your computer" powers stop at the
# sandbox boundary (bubblewrap + seccomp + an empty netns + the egress allowlist).
#
# NOTE ON CLI CO-WORKING. In the hermetic cage no CLI agent is present unless you provision one, so
# AionUi's auto-detection finds nothing and you Cowork with the BUILT-IN agent only. To also expose,
# say, Claude Code inside the cage, add it under [packages] (e.g. `mise:aqua:anthropics/claude-code`)
# — a later refinement; the built-in agent stands alone.
#
# THE `deb:github:` BACKEND (no third party, tracks upstream automatically). Upstream distributes
# AionUi for Linux only as a `.deb`/`.AppImage`/`.rpm`, none of which install in the hermetic cage.
# AionUi's release ASSET NAMES embed the version (`AionUi-<v>-linux-amd64.deb`), so there is no
# stable `releases/latest/download/…` URL to hard-code. Instead this profile names the GitHub repo
# — `deb:github:iOfficeAI/AionUi` — and ops queries the repo's LATEST release, selects its
# linux-amd64 `.deb` asset, resolves it to a content hash (both pinned in the per-project deb lock),
# and builds a generated derivation that `dpkg-deb -x`-unpacks it and `autoPatchelfHook`s the
# Electron binaries against a curated library set — no from-source build. The build is HOST-SIDE
# (a `.deb` runs no maintainer script, so evaluating it host-side is safe), seeded into the store,
# and offline-reusable after the first launch.
#
# UPGRADES — automatic, like the other `deb:` apps. `ops upgrade deb` re-queries GitHub and rolls
# the pin forward to the newest release (the rebuilt app lands at the next launch); the launch hot
# path never touches GitHub — it reuses the pinned asset offline. No manual version bump.
#
# CA TRUST (why `--use-system-ca`). Under the allowlist ops runs a TLS-terminating proxy with a
# per-session CA. Electron/Chromium ignores the CA-file env vars ops sets and trusts its own NSS
# database (`~/.pki/nssdb`); for a `gui = "wayland"` cage under a filtering posture, ops seeds its
# MITM CA into that NSS db automatically (part of the GUI hole, like fonts), so HTTPS to the allowed
# provider hosts succeeds. `--use-system-ca` tells Electron to consult that store.
#
# DISPLAY + GPU. `gui = "wayland"` binds the host Wayland compositor socket (read-only) and
# provisions fonts, so the Electron window maps. X11 is never offered. Isolation is
# compositor-dependent — Mutter (GNOME) is safe; wlroots compositors (sway, hyprland) expose
# screen-capture/input-injection to ordinary clients (see docs/guide/configuration/gui.md).
# `gpu = true` opens hardware-accelerated rendering (mesa provisioned into ops's own store, the
# render node under `/dev/dri`, the minimal `/sys` DRM subtree the driver needs) — without it a
# Chromium/Electron app on Wayland often produces no buffer and no window maps, so it is on here.
# mesa covers Intel/AMD/nouveau; an NVIDIA-only machine falls back to software (renders, slower).
# The Electron flags: `--no-sandbox` is mandatory and acceptable because bubblewrap + seccomp + the
# empty netns IS the boundary (it replaces Chromium's own redundant sandbox); `--ozone-platform=
# wayland` selects the Wayland backend; `--disable-dev-shm-usage` avoids the small cage `/dev/shm`.
#
# DBUS. `dbus = true` gives the cage its OWN private desktop portal (a `dbus-daemon` +
# `xdg-desktop-portal` with the reference GTK backend, all in-cage), so AionUi's FILE PICKER — the
# "attach a file" / "add a folder to Cowork" dialogs — opens IN-CAGE and lists the cage filesystem
# (the project bind + the isolated home). It also relays desktop notifications and follows your host
# light/dark theme (at launch AND live), and is network-independent (the private bus touches no host
# socket). Requires `gui = "wayland"`. The login keyring is never exposed.
# IN-CAGE BROWSER (for OAuth / "login without an API key"). AionUi opens external URLs via Electron's
# `shell.openExternal` -> `xdg-open`, and (per its own docs) delegates OAuth account login to a CLI
# whose callback is a loopback server. The hermetic cage has no host browser, so the command is a bash
# wrapper (not a bare argv) that installs an `xdg-open` launching an IN-CAGE Chromium for http(s) — so
# the whole flow (the provider consent page + the `localhost:<port>` callback) closes inside the
# sandbox, no host browser, no `forward`. Same pattern as claude-desktop / hermes-desktop. HEAVY: it
# pulls the Chromium closure into the store on first launch (see [packages]). The provider's OWN login
# hosts must be in [network] below — add them from `ops net logs -a aionui` on your first login attempt.
# `--password-store=basic` forces the file cookie store (no keyring in the cage) so the OAuth session
# survives a relaunch. If you only ever use API keys, drop this wrapper + the chromium package for a
# bare `aionui` argv.
cmd = [
    "bash",
    "-c",
    '''
mkdir -p "$HOME/.local/bin"
cat > "$HOME/.local/bin/xdg-open" <<'WRAP'
#!/bin/sh
case "$1" in
  http://*|https://*)
    exec chromium --no-sandbox --ozone-platform=wayland --password-store=basic \
      --no-first-run --no-default-browser-check "$@" ;;
  *)
    exec aionui --no-sandbox --ozone-platform=wayland --disable-dev-shm-usage "$@" ;;
esac
WRAP
chmod +x "$HOME/.local/bin/xdg-open"
export PATH="$HOME/.local/bin:$PATH"

# Under `dbus = true` Electron opens external URLs via `org.freedesktop.portal.OpenURI`, not `xdg-open`
# directly; the portal shows "no apps available" unless a default http/https handler is registered, which
# silently breaks the login links. Register the wrapper as that handler. The Exec path is ABSOLUTE
# ($HOME expanded here) because the portal-launched handler does not inherit this shell's PATH.
mkdir -p "$HOME/.local/share/applications" "$HOME/.config"
cat > "$HOME/.local/share/applications/ops-open-uri.desktop" <<EOF
[Desktop Entry]
Type=Application
Name=ops URL handler
Exec=$HOME/.local/bin/xdg-open %U
MimeType=x-scheme-handler/http;x-scheme-handler/https;
NoDisplay=true
Terminal=false
EOF
cat > "$HOME/.config/mimeapps.list" <<'MIMEAPPS'
[Default Applications]
x-scheme-handler/http=ops-open-uri.desktop
x-scheme-handler/https=ops-open-uri.desktop
MIMEAPPS

exec aionui --no-sandbox --ozone-platform=wayland --disable-dev-shm-usage \
    --use-system-ca --password-store=basic
''',
]

gui = "wayland"
gpu = true
dbus = true

# Give AionUi a real host directory to Cowork on (read/write at its real absolute path), beyond the
# project you launch it from. `binds` is a security field, honored only because this profile lives in
# your trusted config dir. Uncomment and point at a working directory you want the agent to touch.
#binds = [
#    { path = "~/work/aionui", mode = "rw" },
#]

[packages]
# Track the latest GitHub release's linux-amd64 `.deb` automatically (see "THE `deb:github:` BACKEND"
# above). `ops upgrade deb` rolls it forward; no manual version to bump.
aionui = "deb:github:iOfficeAI/AionUi"

# In-cage Chromium for the OAuth/login flow (see the `cmd` wrapper above). HEAVY — pulls a large
# nixpkgs closure into the project store on first launch. Drop this (and the wrapper) if you only use
# API keys.
chromium = "nix:chromium"

# --- Co-worked CLI agents (optional) -----------------------------------------------------------
# AionUi auto-detects an agent by running `<command> --version` (a 3s probe): provisioning a CLI
# onto the cage PATH under its standard command name flips it from "Non installé" to "Disponible".
# Each agent you enable ALSO needs its install/runtime hosts in [network] below, and — to actually
# USE it, not just detect it — its provider key configured in AionUi (Settings → Models) or the
# CLI's own config in the isolated home. Enable the ones you want; comment out the rest.
claude-code = "mise:aqua:anthropics/claude-code"   # → `claude`   (Claude Code)
#codex      = "mise:aqua:openai/codex"              # → `codex`    (Codex CLI)
#droid      = "mise:npm:droid"                      # → `droid`    (Droid)
#opencode   = "mise:opencode"                       # → `opencode` (OpenCode)

[network]
mode = "deny"
# AionUi has NO default provider and NO built-in gateway: you add an API key per provider in the app
# (Settings → Models) and it talks DIRECTLY to that provider's API. The allow-set below covers the
# providers AionUi supports so it works whichever you configure — TRIM IT to only the host(s) you
# actually use for least privilege. If a request is refused, the proxy names the host: watch
# `ops net logs -a aionui` and add it here (or check ahead with `ops test net <url>`).
#
# The app's update check + the `.deb`/`.rpm` it fetches ride GitHub, already covered by ops's
# built-in github/githubusercontent allow-set — no entry needed. "Browse the web" (a Cowork power)
# reaches arbitrary hosts and is DENIED by design (that is the confinement); allow specific hosts
# here if you want the agent to reach them.
allow = [
    "{*} https://generativelanguage.googleapis.com", # Google Gemini (API key)
    "{*} https://api.openai.com",                    # OpenAI
    "{*} https://api.anthropic.com",                 # Anthropic
    "{*} https://openrouter.ai",                     # OpenRouter
    "{*} https://api.deepseek.com",                  # DeepSeek
    "{*} https://api-inference.modelscope.cn",       # ModelScope (Alibaba)
    # Co-worked Claude Code: its `mise:aqua` install pulls the binary from a Google Cloud Storage
    # bucket (github registry is covered by the built-in allow-set). `api.anthropic.com` above
    # already covers its runtime. Remove this if you disable the claude-code package.
    "{GET} https://storage.googleapis.com:443/claude-code-dist-86c565f3-f756-42ad-8dfa-d59b1c096819/*",
    # "Login with Google" for Gemini (instead of an API key) needs the Google OAuth hosts. Because the
    # login runs in the IN-CAGE browser, use the locale-bounded accounts regex — it covers the whole
    # cross-domain flow (accounts.google.com auth → accounts.google.<cctld>/SetSID on your country
    # domain), works in any locale, and is anchored so a look-alike (accounts.google.com.evil.com) is
    # refused — the same pattern claude-desktop / hermes-desktop / vibe use — plus Google's asset/avatar
    # hosts. (accounts.youtube.com's CheckConnection is non-essential; add it to `mute` if it is noisy.)
    #'{*} re:^https://accounts\.google\.[a-z.]{2,7}(/|$)',
    #"{*} https://oauth2.googleapis.com",
    #"{*} https://apis.google.com",
    #"{GET} https://ssl.gstatic.com",
    #"{GET} https://www.gstatic.com",
    #"{GET} https://lh3.googleusercontent.com",
    # A provider that uses a realtime/streaming WebSocket (some voice/live modes) needs `{WS}` on its
    # host, e.g. change its line above to `{*,WS} https://api.openai.com`.
    #
    # AionUi's own app traffic (discovered live via `ops net logs -a aionui`):
    # Chromium spellcheck: redirector.gvt1.com 302-redirects the `.bdic` to a dynamic edge node
    # (r3---sn-*.gvt1.com), so scope by regex to the dict path across every gvt1 subdomain — tight
    # (only /edgedl/chrome/dict/), not the whole Google CDN.
    're:^https://[a-z0-9.-]+\.gvt1\.com/edgedl/chrome/dict/',
    "{*} https://registry.npmjs.org",                          # browser-automation Cowork: AionUi fetches the chrome-devtools-mcp package
]
# Silence denied telemetry: keep refusals to Sentry out of the default `ops net logs` (still denied,
# still counted in `ops net stats`; see them with `--all`). Watch the logs on first run and add any
# other telemetry host AionUi probes.
mute = [
    "*.sentry.io",        # crash/usage telemetry
    "static.aionui.com",  # AionUi's own auto-update feed — the .deb is managed by `ops upgrade deb`, not in-cage
]

# AUTHENTICATION — no [secret]/[env] block. AionUi stores each provider's API key locally (entered
# in Settings → Models), so the key lives in the app's PERSISTENT ISOLATED HOME and travels straight
# from the app to the provider over the MITM-inspected TLS to an allowed host — there is nothing for
# ops to inject. (This is AionUi's design: the key is briefly present in the cage's app config,
# unlike the CLI profiles' never-in-cage header injection. If you would rather ops inject a single
# provider's key host-side and keep it out of the cage entirely, add a `[secret."<host>"]` block +
# an in-cage placeholder like the `codex`/`cline` CLI profiles — but AionUi's multi-key GUI is the
# intended path.)
