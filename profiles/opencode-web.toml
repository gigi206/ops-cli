# opencode web — opencode's browser UI, served headless in the cage, opened in your HOST browser.
#
#   ops app import profiles/opencode-web.toml
#   ops app opencode-web
#   # then open http://127.0.0.1:4096 in your browser
#
# This is the third face of opencode (alongside the `opencode` CLI/TUI and the `opencode-desktop`
# Electron app). `opencode web` runs the SAME opencode server the desktop app wraps, but serves
# its web UI over plain HTTP on the loopback instead of embedding a Chromium — so there is NO
# Electron, NO `gui = "wayland"` hole, and no multi-minute in-cage build. It is the lightest way
# to get the graphical opencode experience under ops: the exact same `mise:opencode` binary as
# the CLI profile, just launched with the `web` subcommand.
#
# HOW THE BROWSER REACHES IT. The cage runs in an empty network namespace (Model B), so a port
# the server binds on the cage's `127.0.0.1` is NOT reachable from the host by default — that is
# the boundary. `forward = [4096]` is the inbound hole (a security field, trusted-only): ops binds
# `127.0.0.1:4096` on the HOST and bridges it to the cage's `127.0.0.1:4096`, so your host browser
# opening `http://127.0.0.1:4096` reaches the in-cage server. The host port and the cage port must
# be the SAME number, so if you change one, change BOTH: the `--port` in `cmd` AND the `forward`
# value. `forward` is a TOP-LEVEL field — never nest it under `[network]`, where it would be
# silently ignored.
#
# `opencode web` binds `127.0.0.1` (IPv4 loopback) by default, which is what the forwarder bridges
# to — do NOT pass `--hostname 0.0.0.0` (that exposes it to your LAN and ops still only forwards
# loopback). The server may try to auto-open a browser; in the hermetic cage there is none, so it
# just serves — open the URL yourself. For a shared machine you can require a login by setting
# OPENCODE_SERVER_PASSWORD (and optionally OPENCODE_SERVER_USERNAME, default `opencode`) in [env];
# for a single-user loopback it is optional.
#
# opencode is MULTI-PROVIDER; its egress depends on the model you use. This template is set up for
# the opencode gateway (Anthropic by default). For a different provider, change the allowlist and
# the [secret] block — see the `opencode` CLI profile for the recipe.
cmd = ["opencode", "web", "--port", "4096"]

# The inbound hole: forward host 127.0.0.1:4096 into the cage at the same port (TOP-LEVEL, not
# under [network]). Change this together with the `--port` above if 4096 is taken on your host.
forward = [4096]

# Your host opencode config/auth, mounted read-write at its real absolute path. `binds` is a
# security field, honored only because this profile lives in your trusted config dir. Uncomment to
# share your host opencode setup with the cage instead of the app's isolated home (the default).
#binds = [
#    { path = "~/.config/opencode", mode = "rw" },       # config
#    { path = "~/.local/share/opencode", mode = "rw" },  # auth + sessions (SQLite)
#]

[packages]
opencode = "mise:opencode"

[network]
mode = "deny"
# Same runtime egress as the `opencode` CLI profile — the web server is the same opencode server.
# models.dev is the read-only model catalogue; opencode.ai is the gateway ("Zen") plus auth and
# the config/theme schemas, opened to every verb with `{*}`. registry.npmjs.org equips opencode
# via mise. If a request is refused, the proxy names the host — watch `ops net logs -a opencode-web`
# and add it here (or check with `ops test net <url>`). For a DIRECT provider instead of the
# gateway, add its host (`{*} https://api.anthropic.com`, `{*} https://api.openai.com`, or
# `{*} https://openrouter.ai`) and fill the [secret] block below.
allow = [
    "{GET} https://models.dev",
    "{GET} https://registry.npmjs.org",
    "{*} https://opencode.ai",
    # /share syncs a session to opencode's servers on demand (HTTPS POST, not a WebSocket).
    #"{*} https://opncd.ai",
    # A WebSocket is opened only by the OpenAI "Responses" transport, targeting the OpenAI
    # provider's own base host — name it with `{WS}` if you use that (see the opencode CLI profile).
    #"{WS} https://api.openai.com",
    # Direct-OpenRouter BYOK: uncomment together with the [secret] block below.
    #"{*} https://openrouter.ai",
]

# The real key is read on the HOST and injected by the egress proxy — never in the cage. Provide
# it on the host as $OPENROUTER_API_KEY (or point `from` at a resolver). The in-cage placeholder
# lets the server issue the request; the proxy substitutes the real key on the wire to
# openrouter.ai. (For a direct provider add its host to `allow` above and keep this block; for
# Anthropic/OpenAI change the host, header, and env var — see the `opencode` CLI profile.)
[env]
#OPENROUTER_API_KEY = "sk-or-ops-placeholder-replaced-by-the-egress-proxy"
# Optional: require a login on the web UI (recommended on a shared machine).
#OPENCODE_SERVER_PASSWORD = "change-me"

#[secret."openrouter.ai"]
#from = "env://OPENROUTER_API_KEY"
#header = "Authorization"
#type = "bearer"
