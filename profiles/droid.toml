# Droid — Factory's terminal coding agent (factory.ai), sandboxed by ops.
#
#   ops app import profiles/droid.toml
#   ops app droid
#
# Droid ships a genuine terminal CLI on npm (the `droid` package), distributed as a
# self-contained native binary resolved through a platform-specific optional dependency
# — so ops equips it in-cage with a node runtime (for the npm install) plus mise's npm
# backend. The native binary needs no node at runtime; the install fetches it from
# registry.npmjs.org, so the first launch in a project needs the network and the allowlist
# below.
#
# CREDENTIAL POSTURE — account-centric (like the freebuff profile), NOT a header-injectable
# provider key. Droid authenticates to a Factory ACCOUNT: an interactive launch logs in, and
# the headless path (`droid exec`) reads a Factory account key `FACTORY_API_KEY` (format
# `fk-…`, generated at app.factory.ai/settings/api-keys). There is no documented per-provider
# env var that Droid reads on its own, so ops does not inject a header here. Instead the
# account credential persists in the app's dedicated, persistent, isolated home (`~/.factory/`),
# never bleeding into the project shell or another app:
#
#   ops app droid        # then log in interactively (the token persists in the isolated home)
#
# Headless use (`droid exec`) reads `FACTORY_API_KEY` from the environment — but ops has NO
# host->cage env passthrough for a credential (its passthrough channel carries only TERM/LANG,
# and the [secret] broker injects an HTTP header on the wire, not an env var). So this profile
# ships no key and no [env]: for unattended use you would add a local `[env] FACTORY_API_KEY =
# "fk-…"` yourself (a plaintext key in the config file — your call), accepting it then lives in
# the isolated cage. The shipped default is the interactive login above. Either way the sandbox
# + the egress allowlist bound everything Droid can reach.
#
# BYOK (optional): Droid can talk DIRECTLY to a model provider instead of Factory's gateway by
# adding a `customModels` entry to `~/.factory/settings.json` (its apiKey may reference an env
# var via `${VAR}`). If you do that, add the provider host to `allow` below — e.g.
# `openrouter.ai`, `api.anthropic.com`, or `api.openai.com`.
#
# If a request is blocked, the proxy reports the host it refused — add it to `allow` (or check
# ahead with `ops test net <url>`).
cmd = "droid"

# Your host Droid config, mounted read-write at its real absolute path. `binds` is a security
# field, honored only because this profile lives in your trusted config dir; `mode = "rw"` lets
# the caged `droid` read and write these host files (Factory login, settings.json). Uncomment to
# share your host Droid setup with the cage instead of the app's isolated home (the default).
#binds = [
#    { path = "~/.factory", mode = "rw" },
#]

[packages]
# A node runtime (the npm install needs it), then Droid itself via mise's npm backend. The
# executed `droid` is a native binary (resolved via the package's optional dependency), so
# node is needed only to install. Both are trusted-only [packages]; this profile is trusted
# by location once imported.
nodejs = "nix:nodejs"
droid = "mise:npm:droid"

# An app is read-by-default ({GET,HEAD}); these are write hosts (install/login/API POSTs), so
# each is opened to all verbs with `{*}`.
[network]
mode = "deny"
allow = [
    # Install: the npm package and its platform binary (an optional dep).
    "{GET} https://registry.npmjs.org",
    # Runtime: Factory's account/login and API gateway. Model traffic flows through Factory's
    # gateway by default (so no separate provider host is needed unless you switch to BYOK).
    "{*} https://app.factory.ai",
    "{*} https://api.factory.ai",
    # (Add `downloads.factory.ai` only if you let Droid self-update its binary, and a model
    #  provider host — e.g. `openrouter.ai` — only if you configure direct BYOK in settings.json.)
    "{*} https://api.workos.com",
    "{GET,HEAD} https://docs.factory.ai",
    "{POST} https://github.com/Factory-AI/factory-plugins.git/git-upload-pack",
    # Uncomment for the direct-OpenRouter BYOK path below.
    #"{*} https://openrouter.ai",
]

# Refusals to keep OUT of the default `ops net log` (SELinux `dontaudit`): hosts we deliberately
# leave DENIED — here Factory's telemetry sink (POST /api/ingest), which a live run hits every few
# seconds and whose `denied-default` lines would drown the ones worth acting on. A `mute` never
# changes the verdict (the telemetry is still refused) and never hides a count (`ops net stats`
# still tallies it); it only keeps the line out of the default log. See it anytime with
# `ops net log --all`, and edit this list from the CLI with `ops net mute|unmute <host> -a droid`.
# Remove the entry here the day you decide to allow the endpoint (uncomment the `{POST} telemetry.factory.ai`
# line above instead).
mute = [
    "telemetry.factory.ai",            # Factory telemetry (POST /api/ingest)
    # Factory's OpenTelemetry collector on Google Cloud Run — a regional host whose `us-central1`
    # (or other region) label varies while the project number `123358924663` stays stable, so a
    # regex covers every regional variant rather than enumerating them. POST /v1/metrics.
    "re:^https://otel-collector-123358924663\\.[^.]+\\.run\\.app",
    "{POST} https://registry.npmjs.org/-/npm/v1/security/advisories/*",  # npm audit (non-essential to install, noisy)
]

# OPTIONAL direct-OpenRouter BYOK (commented). Droid's default is the Factory account above,
# NOT a header-injected provider key — so this block does nothing on its own. It applies only
# if you point Droid at OpenRouter directly via a `customModels` entry in ~/.factory/settings.json
# (apiKey `${OPENROUTER_API_KEY}`) AND uncomment `openrouter.ai` in `allow`. Then the real key is
# read on the HOST and injected by the egress proxy on the wire to openrouter.ai — never in the
# cage; the in-cage placeholder just lets the request go out.
[env]
#OPENROUTER_API_KEY = "sk-or-ops-placeholder-replaced-by-the-egress-proxy"

#[secret."openrouter.ai"]
#from = "env://OPENROUTER_API_KEY"
#header = "Authorization"
#type = "bearer"
