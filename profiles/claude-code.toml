# Claude Code — Anthropic's agentic coding CLI, sandboxed by ops.
#
#   ops app import profiles/claude-code.toml
#   ops app claude-code
#
# The tool is equipped fresh from upstream (mise's `aqua` backend pulls Anthropic's
# standalone `claude` release binary) into the app's persistent home — no host
# mutation, no nixpkgs lag, and none of the unfree-license gate nixpkgs imposes.
# It is equipped at the latest upstream version on the first launch in a project, then pinned to
# that version. Advance an already-installed version with `ops upgrade mise`: it runs `mise upgrade`
# in the app's own home and rolls the aqua package forward to the newest upstream release.
cmd = "claude"

# Your host Claude config, mounted read-write at its real absolute path. `binds` is a
# security field, honored only because this profile lives in your trusted config dir;
# `mode = "rw"` lets the caged claude write back to these host files (login refresh,
# history, project state).
#binds = [
#    { path = "~/.claude", mode = "rw" },
#    { path = "~/.claude.json", mode = "rw" },
#]

[packages]
claude-code = "mise:aqua:anthropics/claude-code"

# Egress is denied by construction except the Anthropic API, the Claude platform host
# the CLI contacts at startup (its connectivity/account check — without it the tool
# reports "Unable to connect to Anthropic services"), the Claude downloads host and the
# Anthropic MCP proxy the CLI reaches for updates and MCP connectors, and the one Google
# Cloud Storage bucket Anthropic ships the `claude` binary from (so the tool can
# self-equip fresh at first launch). The two pure-download hosts — downloads.claude.ai and the
# GCS dist bucket (path-scoped to exactly that bucket, not the rest of GCS) — are method-scoped
# `{GET,HEAD}`, so the agent can only *read* from them, never POST/upload. The API, platform
# (account/connectivity check), and MCP proxy (JSON-RPC: POST/SSE/DELETE) hosts stay open to
# every verb. The agent may run on untrusted project code, but it can only reach these. (If a
# future `claude-code` release moves hosts or needs another verb, the proxy reports the refusal
# — add it; check ahead with `ops test net <url>`.)
# An app is read-by-default ({GET,HEAD}): the API/MCP hosts the agent POSTs to are opened to
# all verbs with `{*}`; the pure download hosts stay `{GET,HEAD}` (least privilege).
#
# Third-party telemetry (the CLI ships operational logs to Datadog) is NOT hard-denied here: in
# `deny` mode any host absent from `allow` is already refused, so Datadog never gets out, and
# the [env] telemetry cut below also stops the CLI from generating that traffic at the source. To
# restore an explicit, self-documenting hard block — a backstop if the mode is ever loosened, and it
# also covers every port plus the raw-TCP path — uncomment the rule below. `deny` always wins; the
# `*.` wildcard covers the apex plus every regional intake host.
[network]
mode = "deny"
# deny = [
#     "*.datadoghq.com:*",  # Datadog telemetry / operational logs
# ]
allow = [
    "{*} https://api.anthropic.com",
    "{*} https://platform.claude.com",
    "{GET} https://downloads.claude.ai",
    "{*} https://mcp-proxy.anthropic.com",
    "{*} https://console.anthropic.com",
    "{GET} https://storage.googleapis.com:443/claude-code-dist-86c565f3-f756-42ad-8dfa-d59b1c096819/*",
]

# BYOK (API-key auth) is commented out below, so this profile ships with no baked-in credential —
# authenticate however you prefer: log in interactively (e.g. a subscription via `/login`, whose
# token persists in the app's isolated home), OR uncomment the ANTHROPIC_API_KEY placeholder and the
# [secret] block to inject an API key host-side. When injected, the real key is read on the HOST as
# $ANTHROPIC_API_KEY (or a resolver, e.g. sops://secrets.yaml#anthropic) and swapped onto the wire by
# the egress proxy; it never enters the cage — the in-cage value stays a placeholder.
[env]
# Cut Claude Code's non-essential / telemetry / error-reporting traffic at the source, so the tool
# never even generates it. CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC is the umbrella (all non-essential
# background traffic at once, except the WebFetch host-safety check, which keeps its own opt-out).
CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC = "1"
DISABLE_TELEMETRY = "1"
DISABLE_ERROR_REPORTING = "1"
# ANTHROPIC_API_KEY = "sk-ant-ops-placeholder-replaced-by-the-egress-proxy"

