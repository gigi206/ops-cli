# Claude Code — Anthropic's agentic coding CLI, sandboxed by ops.
#
#   ops app import profiles/claude-code.toml
#   ops app claude-code
#
# The tool is equipped fresh from upstream (mise's `aqua` backend pulls Anthropic's
# standalone `claude` release binary) into the app's persistent home — no host
# mutation, no nixpkgs lag, and none of the unfree-license gate nixpkgs imposes.
# It is equipped at the latest upstream version on the first launch in a project;
# advancing an already-installed version is not yet automated by `ops upgrade`.
cmd = "claude"

[packages]
claude-code = "mise:aqua:anthropics/claude-code"

# Egress is denied by construction except the Anthropic API and the one Google Cloud
# Storage bucket Anthropic ships the `claude` binary from (so the tool can self-equip
# fresh at first launch). The bucket rule is path-scoped — reads from exactly that
# bucket, not all of GCS. The agent may run on untrusted project code, but it can only
# reach these. (If a future `claude-code` release moves buckets, the proxy reports the
# refused host — add it; check ahead with `ops test net <url>`.)
[network]
mode = "allowlist"
allow = [
    "api.anthropic.com",
    "storage.googleapis.com/claude-code-dist-86c565f3-f756-42ad-8dfa-d59b1c096819/*",
]

# The real API key is read on the HOST and injected into the outbound request by
# the egress proxy — it never enters the cage. Provide it on the host as
# $ANTHROPIC_API_KEY (or point `from` at a resolver, e.g. sops://secrets.yaml#anthropic).
# The in-cage placeholder lets the CLI start and issue the request; the proxy
# strips it and substitutes the real key on the wire.
[env]
ANTHROPIC_API_KEY = "sk-ant-ops-placeholder-replaced-by-the-egress-proxy"

[secret."api.anthropic.com"]
from = "env://ANTHROPIC_API_KEY"
header = "x-api-key"
type = "raw"
