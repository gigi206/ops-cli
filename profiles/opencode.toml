# opencode — a terminal AI coding agent (multi-provider), sandboxed by ops.
#
#   ops app import profiles/opencode.toml
#   ops app opencode
#
# The tool is equipped fresh from upstream (mise's registry resolves `opencode` to
# its standalone release binary) — no nixpkgs lag. It is equipped at the latest
# upstream version on the first launch in a project; advancing an already-installed
# version is not yet automated by `ops upgrade`.
#
# opencode is MULTI-PROVIDER, so its egress depends on the model you use. This
# template is set up for Anthropic; for another provider, change the allowlist and
# the [secret] block (e.g. OpenAI: allow "api.openai.com", header "Authorization",
# type "bearer", env OPENAI_API_KEY). If a request is blocked, the proxy reports
# the host it refused — add it to `allow` (or check with `ops test net <url>`).
cmd = "opencode"

[packages]
opencode = "mise:opencode"

[network]
mode = "deny"
# api.anthropic.com: the provider API — opened to every verb with `{*}` (an app is read-by-default,
# and the CLI POSTs completions). models.dev: the model catalogue — a read-only fetch, `{GET,HEAD}`.
allow = [
  "{GET} https://models.dev",
  "{GET} https://registry.npmjs.org",
  "{*} https://opencode.ai",
  # opencode opens a WebSocket to its service. A WebSocket is a distinct capability a plain `{*}`
  # does NOT grant (a bidirectional, uninspected channel) — it must be named explicitly. If opencode
  # still logs "Falling back from WebSockets to HTTPS", `ops net logs -a opencode` shows the refused
  # WS host (flagged `ws`, reason `denied-method`); move this `{WS}` grant to that host.
  "{WS} https://opencode.ai",
]

# The real key is read on the HOST and injected by the egress proxy — never in the
# cage. Provide it on the host as $ANTHROPIC_API_KEY (or a resolver).
[env]
#OPENROUTER_API_KEY = "sk-or-ops-placeholder-replaced-by-the-egress-proxy"

#[secret."openrouter.ai"]
#from = "env://OPENROUTER_API_KEY"
#header = "Authorization"
#type = "bearer"
