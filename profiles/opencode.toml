# opencode — a terminal AI coding agent (multi-provider), sandboxed by ops.
#
#   ops app import profiles/opencode.toml
#   ops app opencode
#
# The tool is equipped fresh from upstream (mise's registry resolves `opencode` to
# its standalone release binary) — no nixpkgs lag. It is equipped at the latest
# upstream version on the first launch in a project; advancing an already-installed
# version is not yet automated by `ops upgrade`.
#
# opencode is MULTI-PROVIDER, so its egress depends on the model you use. This
# template is set up for Anthropic; for another provider, change the allowlist and
# the [secret] block (e.g. OpenAI: allow "api.openai.com", header "Authorization",
# type "bearer", env OPENAI_API_KEY). If a request is blocked, the proxy reports
# the host it refused — add it to `allow` (or check with `ops test net <url>`).
cmd = "opencode"

[packages]
opencode = "mise:opencode"

[network]
mode = "deny"
# opencode.ai: the opencode gateway ("Zen", e.g. `opencode.ai/zen/v1/chat/completions`) plus auth and
# the config/theme schemas — opened to every verb with `{*}` (an app is read-by-default, and the CLI
# POSTs completions through the gateway). For a DIRECT provider instead of the gateway, add its host
# here (`{*} https://api.anthropic.com` for Anthropic, `{*} https://api.openai.com` for OpenAI) and
# fill the [secret] block below. models.dev: the model catalogue, a read-only fetch. registry.npmjs.org:
# equipping opencode via mise.
allow = [
  "{GET} https://models.dev",
  "{GET} https://registry.npmjs.org",
  "{*} https://opencode.ai",
  # /share syncs a session to opencode's servers on demand (the `/share` command), by HTTPS POST — not
  # a WebSocket. Uncomment to allow sharing.
  #"{*} https://opncd.ai",
  # opencode streams completions over HTTPS (SSE), NOT a WebSocket, so the default posture
  # (Anthropic, or a model routed through the opencode gateway) needs no `{WS}` grant — and it
  # never opens a WebSocket to `opencode.ai`. A WebSocket is opened only by the OpenAI "Responses"
  # transport, and it targets the OpenAI provider's OWN base host: `api.openai.com` for a direct
  # key, or your gateway host if you route OpenAI through one. A WebSocket is a distinct capability
  # a plain `{*}` does NOT grant (a bidirectional, uninspected channel), so it must be named with
  # `{WS}`. To pin the exact host: run `ops net logs -a opencode` while opencode runs and look for a
  # `WS` row — a refused one reads `deny … WS … (denied-default|denied-method)` with NO `ws` marker;
  # an established one is flagged `ws` (that marker shows only on a successful `101` upgrade). Then
  # uncomment the line below and set it to that host.
  #"{WS} https://api.openai.com",
]

# The real key is read on the HOST and injected by the egress proxy — never in the
# cage. Provide it on the host as $ANTHROPIC_API_KEY (or a resolver).
[env]
#OPENROUTER_API_KEY = "sk-or-ops-placeholder-replaced-by-the-egress-proxy"

#[secret."openrouter.ai"]
#from = "env://OPENROUTER_API_KEY"
#header = "Authorization"
#type = "bearer"
