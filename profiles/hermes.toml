# Hermes — NousResearch's open-source agentic CLI (Hermes), sandboxed by ops.
#
#   ops app import profiles/hermes.toml
#   ops app hermes
#
# Hermes is a Python agent published to PyPI as a pure `py3-none-any` wheel, so ops installs
# it with uv instead of building it from source. `nix:uv` puts the uv installer on PATH and
# `nix:python312` the interpreter (Hermes requires Python >=3.11,<3.14). mise's pipx backend
# STRIPS PEP 508 extras from an install token, and this profile needs the `[voice]` extra (and
# more) for `/voice on`, so the launch `cmd` below installs Hermes itself: it creates a uv venv in
# the app's persistent home, runs `uv pip install 'hermes-agent[<extras>]'` into it once
# (idempotent — re-installing only when the extras list changes), then execs the venv's `hermes`.
# The first launch resolves the wheels from PyPI in a few tens of MiB and seconds; later launches
# reuse the warm venv. The install lays down the `hermes`, `hermes-acp`, and `hermes-agent` CLIs.
#
# (Hermes also ships as a nix flake — `flake:github:NousResearch/hermes-agent#default` — which
# ADDITIONALLY bundles the node-based TUI/web front-ends, at the cost of a multi-minute, ~2 GiB
# in-cage `nix build` on the first launch. This profile favours the fast PyPI install and the
# `hermes` CLI, including its built-in `--tui`/`--cli` modes; swap the [packages] block for a
# single `hermes = "flake:github:NousResearch/hermes-agent#default"` if you need the node
# front-ends, and add `registry.npmjs.org` to the allowlist for that build.)
#
# Hermes is BYOK and multi-provider. This template keys it to OpenRouter (Hermes' default
# provider — one key, hundreds of models, OpenAI-compatible bearer auth). BYOK is commented
# out below, so this profile ships with no baked-in credential. Uncomment the [env] placeholder
# and the [secret] block, and provide $OPENROUTER_API_KEY on the host, to have the egress proxy
# inject the key on the wire to openrouter.ai — the plaintext never enters the cage. To use a
# different provider, change the allowlist host + the [secret] block + the env var — e.g.
# Anthropic (api.anthropic.com, ANTHROPIC_API_KEY, header "x-api-key", type "raw") or OpenAI
# (api.openai.com, OPENAI_API_KEY, header "Authorization", type "bearer"). If a request is
# blocked, the proxy reports the host it refused — add it to `allow` (or check ahead with
# `ops test net <url>`).
cmd = ["bash", "-c", "set -e; VENV=\"$HOME/.hermes-venv\"; EXTRAS=\"web,pty,cli,voice,vision,cron,mcp,exa,firecrawl,youtube,edge-tts,acp\"; if [ ! -x \"$VENV/bin/hermes\" ] || ! grep -qxF \"$EXTRAS\" \"$VENV/.ops-extras\" 2>/dev/null; then uv venv --clear --python 3.12 \"$VENV\"; . \"$VENV/bin/activate\"; uv pip install \"hermes-agent[$EXTRAS]\"; echo \"$EXTRAS\" > \"$VENV/.ops-extras\"; fi; exec \"$VENV/bin/hermes\""]

# AUDIO — Hermes has a first-class terminal voice mode (push-to-talk Ctrl+B: Whisper speech-to-text,
# confirmation beeps, and text-to-speech that reads the reply). It captures and plays through
# `sounddevice`/PortAudio → the ALSA API; Hermes explicitly supports running over a PulseAudio socket
# (it honors `PULSE_SERVER`). `audio = true` provisions the PulseAudio client + the ALSA→PulseAudio
# shim (alsa-plugins + an asound.conf routing `default` → pulse), so both capture and playback reach
# the host — see docs/guide/configuration/audio.md. A security field, trusted-only: the PulseAudio bus
# exposes the microphone AND all system-audio output. Comment it out if you never use voice mode.
# (Local Whisper downloads its model on first use — if voice STT fails offline, allow the model host.)
audio = true

# Your host Hermes config, mounted read-write at its real absolute path. `binds` is a security
# field, honored only because this profile lives in your trusted config dir; `mode = "rw"` lets
# the caged `hermes` read and write these host files (login, settings, sessions). Uncomment to
# share your host Hermes setup with the cage instead of the app's isolated home (the default).
#binds = [
#    { path = "~/.hermes", mode = "rw" },
#]

[packages]
# uv (the installer) and a supported Python, both from nixpkgs and on PATH before the launch cmd
# runs its `uv pip install`. Hermes itself is installed by that cmd (see the top note), not here —
# mise's pipx backend cannot carry the extras. Both are trusted-only [packages]; this profile is
# trusted by location once imported.
#
# The curated feature set is the EXTRAS list in the cmd above. `[voice]` adds the terminal
# voice-mode deps (sounddevice, numpy, local faster-whisper STT) that `/voice on` needs, and
# `audio = true` above provides the actual microphone access; without the extra, voice mode aborts
# with "Voice mode requires sounddevice and numpy". `[voice]`'s Whisper model and `[edge-tts]`'s
# text-to-speech fetch runtime assets on first use from hosts NOT in the allowlist below — the
# first `/voice on` will show the refused host in `ops net log -a hermes`; add it with `ops net
# allow -a hermes <url>` (installing the extra ≠ the feature works offline).
uv     = "nix:uv"
python = "nix:python312"

[network]
mode = "deny"
allow = [
    # Runtime — the LLM provider. With a BYOK key (the [secret] block below) that is OpenRouter;
    # with the NousResearch account login instead (no BYOK key set — the shipped default), the
    # model traffic goes to the account's own API: portal is the OAuth token endpoint, and
    # inference-api serves the models (GET /v1/models, POST /v1/chat/completions).
    "{*} https://openrouter.ai",
    "{*} https://portal.nousresearch.com",
    "{*} https://inference-api.nousresearch.com",
    # Runtime: model catalogs (read-only; TTL-cached on disk, fail-soft if blocked).
    "{*} https://hermes-agent.nousresearch.com",
    "{GET} https://models.dev",
    # Voice STT (`/voice on` / Ctrl+B): the local faster-whisper model is fetched from Hugging Face
    # on first use — metadata/resolve on huggingface.co, the model blobs via the Xet CDN under
    # *.xethub.hf.co (read-only, cached in the app home after). Live-verified via hermes-web.
    "{GET,HEAD} https://huggingface.co",
    "{GET,HEAD} https://*.xethub.hf.co",
    # Voice replies (edge-tts): Microsoft's free online TTS endpoint (a WebSocket the proxy relays).
    # Host from the edge-tts package source; the first spoken reply confirms it in `ops net log`.
    "{GET} https://speech.platform.bing.com",
    # Install-time (the launch cmd's `uv pip install`): the Python wheels and the package index.
    "{GET} https://files.pythonhosted.org",
    "{GET} https://pypi.org",
    # (cache.nixos.org + github.com — the nix binary cache for uv and Python — are already in
    # ops's built-in nix-cache allow-set, so they need no entry here.)
]

# The real API key is read on the HOST and injected by the egress proxy — never in the cage.
# Uncomment both blocks and provide $OPENROUTER_API_KEY on the host to enable BYOK; the in-cage
# placeholder lets Hermes start and issue the request, and the proxy substitutes the real key
# on the wire to openrouter.ai.
[env]
#OPENROUTER_API_KEY = "sk-or-ops-placeholder-replaced-by-the-egress-proxy"

#[secret."openrouter.ai"]
#from = "env://OPENROUTER_API_KEY"
#header = "Authorization"
#type = "bearer"
