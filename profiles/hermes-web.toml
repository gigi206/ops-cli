# Hermes — NousResearch's open-source agent, served as a browser dashboard by sbx.
#
#   sbx app import profiles/hermes-web.toml
#   sbx app run hermes-web        # then open http://127.0.0.1:9119 in your host browser
#
# A second way to run Hermes alongside `sbx app run hermes` (the terminal CLI). Hermes ships a
# browser dashboard — `hermes dashboard` serves a FastAPI/React SPA (the built `web_dist/`
# bundle, packaged inside the wheel) on 127.0.0.1:9119. sbx serves it headless in the cage
# (`--no-open`, no in-cage browser) and forwards the host's localhost:9119 into the cage, so
# you reach the same agent in a real browser UI on the host: chat with streaming tool output,
# side-by-side previews, a file browser, settings — no terminal.
#
# sbx equips Hermes via the flake's `#default` output —
# `flake:github:NousResearch/hermes-agent#default` in [packages] — so `sbx upgrade flake` rolls it
# forward. That one package bundles the Python agent (uv2nix, its own interpreter), the node
# front-ends, the web dashboard assets (`web_dist`), and every optional extra (web/voice/edge-tts/
# mcp/…), all wired by the derivation's own wrapper (it sets HERMES_WEB_DIST / HERMES_TUI_DIR /
# HERMES_NODE) — so the dashboard's server AND its `/chat` node terminal work with no manual
# `nix:nodejs`/`HERMES_TUI_DIR` plumbing. sbx builds the flake IN-CAGE with `nix build`: the FIRST
# launch is a multi-minute, ~2 GiB build (its PyPI + npm source fetches ride the allowlist below,
# through nix's fetcher); later launches reuse the warm build offline.
#
# CREDENTIAL POSTURE — identical to the CLI profile. Hermes is BYOK and multi-provider; this
# template keys it to OpenRouter (Hermes' default — one key, hundreds of models, OpenAI-
# compatible bearer auth). BYOK is commented out below, so this profile ships with no baked-in
# credential. Uncomment the [env] placeholder and the [secret] block, and provide
# $OPENROUTER_API_KEY on the host, to have the egress proxy inject the key on the wire to
# openrouter.ai — the plaintext never enters the cage. To use a different provider, change the
# allowlist host + the [secret] block + the env var — e.g. Anthropic (api.anthropic.com,
# ANTHROPER_API_KEY, header "x-api-key", type "raw") or OpenAI (api.openai.com, OPENAI_API_KEY,
# header "Authorization", type "bearer"). The dashboard itself may ask you to complete an auth
# step in the browser (the same provider login, or a local dashboard password); that traffic
# rides the allowlist below. If a request is blocked, the proxy reports the host it refused —
# add it to `allow` (or check ahead with `sbx test net <url>`).
cmd = ["hermes", "dashboard", "--no-open"]

# Forward the host's localhost:9119 into the cage so your host browser reaches the dashboard.
# `hermes dashboard` binds 127.0.0.1:9119 inside the cage; this hole bridges it to the host. A
# port already in use on the host fails the launch closed. Must stay a top-level key: written
# after a `[table]` header, TOML would fold it into that table (e.g. `network.forward`) and it
# would be silently ignored.
forward = [9119]

# Your host Hermes config, mounted read-write at its real absolute path. `binds` is a security
# field, honored only because this profile lives in your trusted config dir; `mode = "rw"` lets
# the caged `hermes` read and write these host files (login, settings, sessions). Uncomment to
# share your host Hermes setup with the cage instead of the app's isolated home (the default).
#binds = [
#    { path = "~/.hermes", mode = "rw" },
#]

# Microphone + audio playback for the dashboard's voice mode (`/voice on`). A security field,
# honored only because this profile is trusted by location; it provisions the PulseAudio client +
# the ALSA→PulseAudio shim and binds the host's PulseAudio socket into the cage. The PulseAudio bus
# is NOT per-client isolated — it exposes the microphone AND all system-audio output — so this is
# trusted-only. Comment it out if you never use voice mode. Must stay a top-level key (like
# `forward`): written after a `[table]` header, TOML would fold it into that table and drop it.
audio = true

[packages]
# Hermes via the flake's `#default` output, built in-cage — so `sbx upgrade flake` rolls it forward.
# One package supplies the interpreter, the node runtime, the web dashboard assets, the `/chat` tab's
# embedded TUI, and every optional extra — so there is no separate `nix:uv`/`nix:python`/`nix:nodejs`
# and no launch-time `pip install`, and the `/chat` node terminal that used to need a manual
# `nix:nodejs` + `HERMES_TUI_DIR` sentinel now works natively (the derivation's wrapper sets both).
# Trusted-only [packages]; this profile is trusted by location once imported. First launch builds it
# (~2 GiB, minutes); the build's PyPI + npm source fetches ride the allowlist below.
#
# The `#default` build bundles the `full` extra set (voice, edge-tts, exa, firecrawl, mcp, and the
# chat-platform / cloud SDKs), so every dashboard feature is available — heavier than the old curated
# venv, but upgradeable and self-wiring. Some extras fetch runtime assets on FIRST USE — `voice`'s
# Whisper model from Hugging Face, `edge-tts` from a Microsoft endpoint — which ARE in the allowlist
# below (see the voice entries); a host the proxy refuses shows in `sbx net log -a hermes-web`, add
# it with `sbx net allow -a hermes-web <url>`.
hermes = "flake:github:NousResearch/hermes-agent#default"

[network]
mode = "deny"
# Silence the cloud-metadata probe (169.254.169.254 / AWS IMDS) that a cloud SDK in the closure
# fires on startup to auto-discover credentials. There is nothing to discover off-cloud, and the
# proxy refuses link-local/metadata addresses by construction (SSRF guard) — the verdict is
# unchanged, this only drops the noisy denied line from the default `sbx net log` (SELinux
# dontaudit semantics). Still visible via `sbx net log --all`.
mute = ["169.254.169.254"]
allow = [
    # Runtime — the LLM provider. With a BYOK key (the [secret] block below) that is OpenRouter;
    # with the NousResearch account login instead (no BYOK key set — the shipped default), the
    # model traffic goes to the account's own API: portal is the OAuth token endpoint, and
    # inference-api serves the models (GET /v1/models, POST /v1/chat/completions). The dashboard's
    # own auth flow rides these same hosts.
    "{*} https://openrouter.ai",
    "{*} https://portal.nousresearch.com",
    "{*} https://inference-api.nousresearch.com",
    # Runtime: model catalogs (read-only; TTL-cached on disk, fail-soft if blocked).
    "{*} https://hermes-agent.nousresearch.com",
    "{GET} https://models.dev",
    # Hermes' "pet" gallery (agent/pet) — a public, read-only pixel-art sprite gallery: the manifest
    # (petdex.dev/api/manifest, 307 → R2) and the sprite assets (assets.petdex.dev), all pinned to
    # *.petdex.dev by Hermes (anti-SSRF), GET-only, no data sent. Cosmetic; drop this line if you do
    # not want the pixel pets.
    "{GET} https://*.petdex.dev",
    # Voice STT (`/voice on`): the local faster-whisper model is fetched from Hugging Face on first
    # use — metadata/resolve on huggingface.co, the model blobs via the Xet CDN under *.xethub.hf.co
    # (read-only, cached in the app home after the first download). Live-verified.
    "{GET,HEAD} https://huggingface.co",
    "{GET,HEAD} https://*.xethub.hf.co",
    # Voice replies / read-aloud (edge-tts) — Microsoft's free online TTS, over a WebSocket. `{WS}` is
    # the explicit WebSocket opt-in (sbx gates a WS behind it) and `{GET}` covers the voice-list fetch.
    # Two things make it work under the MITM allowlist: sbx sets `wss_proxy` so the WS routes through
    # the proxy (a WS client resolves its proxy by URL scheme — `https_proxy` alone would not cover it,
    # and it would connect directly and fail DNS in the empty netns); and the audio hole's Python shim
    # points certifi at sbx's CA, so edge-tts (which pins certifi) trusts the MITM. Live-verified.
    "{GET,WS} https://speech.platform.bing.com",
    # Build-time (the in-cage `nix build` of the flake): the Python wheels + index for uv2nix, and
    # the npm registry for the node TUI/web front-ends — all fetched through nix's fetcher.
    "{GET} https://files.pythonhosted.org",
    "{GET} https://pypi.org",
    "{GET} https://registry.npmjs.org",
    # The flake build fetches the hermes-agent repo over git smart-HTTP. Its ref-discovery GET
    # (`…/info/refs`) already rides the built-in `{GET,HEAD} github.com`; only the fetch negotiation
    # is a POST, so open EXACTLY that one endpoint — POST-only, this repo only (never a push, never
    # another repo, never the rest of github). If the build ever git-fetches another path the proxy
    # names it; add it the same scoped way.
    "{POST} https://github.com/NousResearch/hermes-agent.git/git-upload-pack",
    # (cache.nixos.org + codeload/*.githubusercontent — the nix binary cache + tarball hosts — are
    # already in sbx's built-in nix-cache allow-set, so they need no entry here.)
]

# The real API key is read on the HOST and injected by the egress proxy — never in the cage.
# Uncomment both blocks and provide $OPENROUTER_API_KEY on the host to enable BYOK; the in-cage
# placeholder lets Hermes start and issue the request, and the proxy substitutes the real key
# on the wire to openrouter.ai.
[env]
# No HERMES_TUI_DIR needed — the flake's `#default` wrapper sets it (and HERMES_NODE / HERMES_WEB_DIST)
# to the bundled TUI/web assets, so the `/chat` node terminal works out of the box.
#OPENROUTER_API_KEY = "sk-or-sbx-placeholder-replaced-by-the-egress-proxy"

#[secret."openrouter.ai"]
#from = "env://OPENROUTER_API_KEY"
#header = "Authorization"
#type = "bearer"