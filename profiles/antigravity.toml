# Antigravity IDE — Google's agentic IDE (desktop, Electron / VS Code fork), sandboxed by sbx.
#
#   sbx app import profiles/antigravity-ide.toml
#   sbx app run antigravity-ide
#
# This is the GRAPHICAL IDE (a VS Code / Windsurf-class fork), distinct from the `agy` terminal CLI
# (profiled in `agy.toml`). Google ships the v2 Linux IDE **only as a plain `.tar.gz`** from its Edge
# download CDN — no official `.deb`, no `.AppImage`, no nixpkgs attribute, no official flake — so sbx
# packages the tarball directly with the `tarball:` backend. Confined by sbx, the editor sees only the
# cage filesystem (the project you launch it from + its own persistent isolated home), reaches only
# the hosts you allow, and its powers stop at the sandbox boundary (bubblewrap + seccomp + an empty
# netns + the egress allowlist).
#
# THE `tarball:resolve` BACKEND (auto-upgrade). Google's download URL is **version-stamped**
# (`.../stable/<version>-<execution_id>/...`) with no stable "latest" alias, so a direct
# `tarball:<url>` would freeze at one version. Instead this profile uses `tarball:resolve` paired with
# the `[tarball.antigravity-ide]` table below: sbx runs its `resolve` command in a hermetic sandbox to
# discover the newest release's download URL, then pins it per project on first launch. `sbx upgrade
# tarball` re-runs the command and **rolls forward** to the newest — no manual URL bump. The tarball is
# fetched + `tar -xz`-unpacked + `autoPatchelfHook`'d into sbx's store HOST-SIDE (safe: a tarball runs
# no build script), seeded and offline-reusable. FIRST LAUNCH resolves + builds it, pulling the Electron
# closure (~220 MiB tarball plus its runtime closure — a few minutes, over your HOST network, NOT the
# cage allowlist). Later launches reuse the pinned build offline (the resolve command does NOT re-run).
#
# CA TRUST (why `--use-system-ca`). Under the allowlist sbx runs a TLS-terminating proxy with a
# per-session CA. Electron/Chromium ignores the CA-file env vars sbx sets and trusts its own NSS
# database (`~/.pki/nssdb`), so it would otherwise fail every HTTPS with `ERR_CERT_AUTHORITY_INVALID`.
# For a `gui = "wayland"` cage under a filtering posture, sbx seeds its MITM CA into the cage's NSS db
# automatically (part of the GUI hole, like fonts) — no per-profile shim needed. The app only has to
# be told to consult that store, hence `--use-system-ca` (the IDE's native `language_server` binary,
# which POSTs to Google's Cloud Code backend, honours sbx's CA-file env vars and needs no extra help).
#
# DISPLAY + GPU + DBUS. `gui = "wayland"` binds the host Wayland socket (read-only) and provisions
# fonts so the window maps (X11 is never offered; isolation is compositor-dependent — Mutter/GNOME is
# safe, wlroots exposes screen-capture/input-injection, see docs/guide/configuration/gui.md).
# `gpu = true` opens hardware-accelerated rendering (mesa into sbx's store + the `/dev/dri` render node
# + the minimal `/sys` DRM subtree); a Chromium/Electron app on Wayland with no working GL often
# produces no buffer and NO window maps. mesa covers Intel/AMD/nouveau; an NVIDIA-only machine falls
# back to software (still renders, slower). `dbus = true` gives the cage its OWN private desktop portal
# (an in-cage `dbus-daemon` + `xdg-desktop-portal` with the reference GTK backend), so the IDE's FILE
# CHOOSER opens IN-CAGE and lists only the cage filesystem, seeds + follows your host light/dark theme,
# and bridges `org.freedesktop.Notifications` — while the login keyring stays absent. The Electron
# flags: `--no-sandbox` is mandatory and acceptable (bwrap + seccomp + the empty netns IS the boundary,
# replacing Chromium's own redundant sandbox); `--ozone-platform=wayland` selects the Wayland backend;
# `--disable-dev-shm-usage` avoids the small cage `/dev/shm`. (`audio` is NOT enabled — add `audio =
# true` only if you use a voice feature; see docs/guide/configuration/audio.md.)
#
# CREDENTIAL POSTURE — account / Google OAuth, NOT a header-injectable API key. Antigravity signs in
# with **Google Sign-In**; Google does not support a bring-your-own Gemini API key here. There is
# therefore no HTTP header for sbx's `[secret]` broker to strip-and-inject, and this profile ships
# **no `[secret]` block** (contrast the BYOK profiles like `cline`/`opencode`). You log in ONCE inside
# the cage; the token then persists in the app's dedicated, persistent, isolated home. The sandbox +
# the egress allowlist still bound everything the agent can reach.
#
# LOGIN FLOW — VERIFIED on a real Google login. The IDE (a VS Code fork) opens the Google consent in
# an external browser and receives the result back as the deep-link `antigravity-ide://oauth-success`,
# handed to the running single-instance editor via `--open-url` (a standard VS Code CLI flag). The
# hermetic cage has no browser and no `xdg-open`, so the `cmd` preamble below wires an in-cage Chromium
# for the http(s) consent and routes the deep-link back to `antigravity-ide --open-url`.
#
#   THE `dbus = true` DETAIL (handled by sbx-core). Under `dbus = true` the in-cage Chromium opens the
#   `antigravity-ide://` callback via the desktop PORTAL (`xdg-desktop-portal.OpenURI`), not `xdg-open`
#   — and the portal launches a handler only if it is in the *registered/recommended* desktop-database
#   index (built by `update-desktop-database`), not merely the mimeapps.list default; without the index
#   it shows **"No apps available"**. sbx-core's portal hole now builds that index automatically
#   (provisions `desktop-file-utils` + runs `update-desktop-database` in the background), so the login
#   works under `dbus = true` with no per-profile step (verified end-to-end). If a future portal change
#   ever regresses this, the escape is `sbx app run antigravity --dbus=false` for the login ONCE
#   (Chromium then uses `xdg-open` directly, no portal/index) — the token persists in the isolated home,
#   and daily use returns to `dbus = true`.
#
#   The allowlist below is grounded on a real login (the `agy` Google chain + the observed
#   `cloudcode-pa` model backend + the VS Code CDN); if a request is refused, watch
#   `sbx net logs -a antigravity --all` and add the host (or check ahead with `sbx test net <url>`).
# A pragmatic one-time escape: `sbx app run antigravity-ide --net shared` for the login only (host
# network, no allowlist whack-a-mole; the token persists in the isolated home), then strict daily use.
#
# CAVEATS (honest):
#   * Quitting — a GUI Electron app ignores a single Ctrl+C and closing the window may not quit. Press
#     Ctrl+C twice within 2s to force-quit the session, or `sbx session stop <id>` from another terminal.
#   * Credential persistence — the app may want the system keyring (Secret Service / dbus), which the
#     hermetic cage does not provide, and should fall back to a file under the isolated home
#     (`--password-store=basic` forces Chromium's file store). Confirm the login survives a relaunch.
#   * In-app self-update — the IDE self-updates in the background from the same updater API + gvt1 CDN.
#     A self-downloaded binary is NOT autoPatchelf'd, so it cannot run in the cage — the in-app updater
#     is inert; **`sbx upgrade tarball` is the real upgrade path**. Those hosts are muted below.
#   * The real build + launch + Google login with your account is the pending live validation, as for
#     every GUI profile (heavy build; not a per-run committed test).
#
# `--password-store=basic` (on both the app and Chromium): Chromium normally encrypts its session
# cookie with a key from the OS keyring (over dbus), which the cage's private bus does not expose — so
# without it the cookie cannot be re-decrypted next launch and you are logged out. `basic` forces the
# file store in the isolated $HOME (a weak fixed key — acceptable: the token lives only in the per-app
# isolated cage home, never the project shell).
cmd = [
    "bash",
    "-c",
    '''
# IN-CAGE BROWSER LOGIN (adapted from cursor.toml / claude-desktop.toml). Antigravity's Google
# Sign-In opens an external browser for the consent, then hands the result back as a deep-link to the
# running editor. The hermetic cage has no browser and no `xdg-open`, so this preamble wires an
# in-cage Chromium for the http(s) consent and routes the deep-link back to `antigravity-ide
# --open-url`, so the whole flow closes inside the cage. See the header's LIVE-GATE note: the deep-link
# scheme (`antigravity` below) is the VS Code-fork convention and UNVERIFIED — correct it if the
# editor does not complete the login after the Google consent.

# Chromium managed policy: auto-launch the deep-link with no confirmation dialog, else the callback
# never reaches the editor and login silently fails. /etc is a writable cage tmpfs; Chromium reads
# /etc/chromium/policies/managed/. (The scheme is the VERIFIED `antigravity-ide` — see the header.)
mkdir -p /etc/chromium/policies/managed 2>/dev/null && cat > /etc/chromium/policies/managed/sbx-antigravity-protocol.json <<'POLICY'
{"AutoLaunchProtocolsFromOrigins":[{"allowed_origins":["*"],"protocol":"antigravity-ide"}]}
POLICY

# xdg-open routing by scheme: http(s) -> the in-cage Chromium (the Google consent); else (the deep-link
# callback, whatever its scheme) -> `antigravity-ide --open-url` so it reaches the running editor
# (the VS Code-fork single-instance handler). `--no-sandbox` on the editor branch too: it only hands the
# deep-link to the single-instance app and quits, but still boots far enough to hit Chromium's SUID
# sandbox (sbx's build strips the setuid bit off chrome-sandbox), which aborts FATAL without it.
mkdir -p "$HOME/.local/bin"
cat > "$HOME/.local/bin/xdg-open" <<'WRAP'
#!/bin/sh
case "$1" in
  http://*|https://*)
    exec chromium --no-sandbox --ozone-platform=wayland --password-store=basic \
      --no-first-run --no-default-browser-check "$@" ;;
  *)
    exec antigravity-ide --no-sandbox --ozone-platform=wayland --disable-dev-shm-usage --open-url "$@" ;;
esac
WRAP
chmod +x "$HOME/.local/bin/xdg-open"
export PATH="$HOME/.local/bin:$PATH"

# Under `dbus = true` the cage has a real portal, so Electron opens external URLs via
# `org.freedesktop.portal.OpenURI` instead of calling `xdg-open` — and the portal shows "no apps
# available" unless a default handler is registered, silently breaking the auth links. Register the
# wrapper as the default handler for the web + `antigravity` schemes. The Exec path is ABSOLUTE ($HOME
# expanded here) because the portal-launched handler does not inherit this shell's PATH. (If the scheme
# is not `antigravity-ide`, fix the two `x-scheme-handler/antigravity-ide` lines.)
mkdir -p "$HOME/.local/share/applications" "$HOME/.config"
cat > "$HOME/.local/share/applications/sbx-open-uri.desktop" <<EOF
[Desktop Entry]
Type=Application
Name=sbx URL handler
Exec=$HOME/.local/bin/xdg-open %U
MimeType=x-scheme-handler/http;x-scheme-handler/https;x-scheme-handler/antigravity-ide;
NoDisplay=true
Terminal=false
EOF
cat > "$HOME/.config/mimeapps.list" <<'MIMEAPPS'
[Default Applications]
x-scheme-handler/http=sbx-open-uri.desktop
x-scheme-handler/https=sbx-open-uri.desktop
x-scheme-handler/antigravity-ide=sbx-open-uri.desktop
MIMEAPPS

# (The desktop-database INDEX the in-cage portal needs to resolve this deep-link handler — else it
# shows "No apps available" for the OAuth callback under `dbus = true` — is built by sbx-core's portal
# hole automatically: it provisions `desktop-file-utils` and runs `update-desktop-database` in the
# background. No per-profile step is needed; this wrapper only WRITES the handler above.)

exec antigravity-ide --no-sandbox --ozone-platform=wayland --disable-dev-shm-usage \
    --use-system-ca --password-store=basic
''',
]

gui = "wayland"
gpu = true
dbus = true

# Your host Antigravity IDE config/login, mounted read-write at its real absolute path (so the caged
# editor shares your host login/settings). `binds` is a security field, honored only because this
# profile lives in your trusted config dir. Uncomment to share your host setup with the cage instead
# of the app's isolated home (the default). Paths UNCONFIRMED — verify with a real run before relying.
#binds = [
#    { path = "~/.config/Antigravity", mode = "rw" },
#]

[packages]
# Google's official prebuilt IDE tarball, tracked automatically via the auto-upgrade resolver form
# (see `[tarball.antigravity-ide]` below). Trusted-only [packages]; this profile is trusted by location
# once imported. Provisioned + autoPatchelf'd HOST-SIDE (Electron, no source build).
antigravity-ide = "tarball:resolve"
# An in-cage Chromium for the Google Sign-In flow (see the `cmd` wrapper above). HEAVY — this pulls a
# large nixpkgs closure into the project store on the first launch (seeded + offline-reusable after).
chromium = "nix:chromium"

# The auto-upgrade resolver: sbx runs `resolve` in a HERMETIC sandbox (sbx's own base tools — curl,
# grep, sed, coreutils — never the host's; sbx's store + CA bundle bound; the HOST network, NOT this
# profile's `[network]` allowlist — provisioning is host-side, the allowlist governs runtime egress),
# captures the `.tar.gz` URL it prints on stdout, validates it, and pins its
# content hash. `sbx upgrade tarball` re-runs it and rolls forward; a no-op upgrade never re-downloads.
# The command queries Google's official auto-updater version API (a JSON array, newest release first),
# reads `version` + `execution_id` from element [0] with base tools (NO jq needed — if you ever needed
# it, add `jq = "nix:jq"` above and it would be on the resolver's PATH), and builds the download URL on
# Google's official Edge CDN (`gvt1.com`, the CDN Chrome ships from). VERIFIED LIVE: this exact command
# prints `…/stable/2.1.1-6123990880747520/linux-x64/Antigravity%20IDE.tar.gz`, which resolves HTTP 200
# / ~220 MiB / application/gzip. `printf` (not `echo`) prints the URL with no trailing newline.
[tarball.antigravity-ide]
resolve = ["sh", "-c", '''
api="https://antigravity-ide-auto-updater-974169037036.us-central1.run.app/releases"
data=$(curl -fsS "$api")
ver=$(printf '%s' "$data" | grep -oE '"version":"[^"]*"' | head -1 | sed 's/.*:"//;s/"$//')
eid=$(printf '%s' "$data" | grep -oE '"execution_id":"[^"]*"' | head -1 | sed 's/.*:"//;s/"$//')
printf 'https://edgedl.me.gvt1.com/edgedl/release2/j0qc3/antigravity/stable/%s-%s/linux-x64/Antigravity%%20IDE.tar.gz' "$ver" "$eid"
''']

# An app is read-by-default ({GET,HEAD}); a host the editor/agent WRITES to (POSTing completions,
# tokens) is opened to all verbs with `{*}`. Grounded on the `agy` CLI profile's Google chain +
# claude-desktop's Google Sign-In set. See the header's LIVE-GATE note — refine from `sbx net logs`.
[network]
mode = "deny"
# NOTE on HTTP/2: `cloudcode-pa` serves BOTH HTTP/1.1 (the REST account-setup + agent calls) and
# HTTP/2 (gRPC). A `[network] http2 = [...]` entry makes the MITM *h2-only* for that host (fail-closed,
# no h1 fallback), which BREAKS the h1 account-setup call (`blocked (http2-required)`), so it is NOT
# used here — the backend works over h1, exactly as it did before (observed: 104 h1 requests to
# `daily-cloudcode-pa`). Only add an `http2` entry if a host is proven h2-*only*.
allow = [
    # Model / agent traffic — Google's Cloud Code (Gemini Code Assist) backend, the host the caged
    # agent + the native language_server POST completions to (observed on the `agy` CLI + the IDE spike).
    # `daily-` is the same backend's staging channel. All verbs (request bodies).
    "{*} https://cloudcode-pa.googleapis.com",
    "{*} https://daily-cloudcode-pa.googleapis.com",
    # Docs / bootstrap — a read-only fetch (from the `agy` profile).
    "{GET} https://antigravity.google",
    #
    # Google Sign-In ("Continue with Google") — the consent renders in the in-cage Chromium (see the
    # `cmd` wrapper); the OAuth result returns as the deep-link the editor handles, so the flow closes
    # inside the cage. Google's sign-in domain is a bounded regex so it works in ANY locale (Google
    # serves the consent + the `/accounts/SetSID` cross-domain cookie step from the COUNTRY domain —
    # .com/.fr/.co.uk/… — not always .com). Anchored to `accounts.google.<tld>` so a look-alike
    # (accounts.google.com.evil.com) is REFUSED (verified). Do NOT hardcode a single ccTLD.
    '{*} re:^https://accounts\.google\.[a-z.]{2,7}(/|$)',
    "{*} https://oauth2.googleapis.com",
    "{*} https://apis.google.com",
    # The OAuth userinfo endpoint the login reads after the token exchange (path-scoped — this host
    # serves many other Google APIs). From the `agy` profile.
    "{GET} https://www.googleapis.com/oauth2/*",
    # Google Sign-In page assets + the avatar the userinfo response points at.
    "{GET} https://www.gstatic.com",
    "{GET} https://ssl.gstatic.com",
    "{GET} https://fonts.gstatic.com",
    "{GET} https://fonts.googleapis.com",
    "{GET} https://lh3.googleusercontent.com",
    #
    # The VS Code-fork asset CDN — Antigravity (a VS Code fork) fetches extension / built-in metadata
    # here (observed live: `GET main.vscode-cdn.net/extensions/chat.json`). Allowed so extensions and
    # the built-in chat surface work. If extension *install* (not just metadata) is later denied, add
    # the query host too — a fork may use `marketplace.visualstudio.com`, Open VSX `open-vsx.org`, or
    # its own; check `sbx net logs -a antigravity --all` and add it.
    "{*} https://main.vscode-cdn.net",
    # The extension MARKETPLACE — Antigravity (a VS Code fork) queries + downloads extensions from
    # Open VSX (observed live: `open-vsx.org` denied while browsing extensions). `main.vscode-cdn.net`
    # above is only the asset CDN; this is the gallery/query host, so extensions need BOTH. All verbs
    # (the gallery protocol OPTIONS-preflights + POSTs an `extensionquery`). Remove if you do not want
    # the extension marketplace reachable.
    "{*} https://open-vsx.org",
    # The Open VSX CONTENT CDN — the gallery (`open-vsx.org`) serves the query/metadata, but the
    # extension packages themselves (`.vsix` + `package.json`) are downloaded from this Eclipse
    # Foundation CDN (observed: `OPTIONS/GET …/golang/Go/…/package.json` when installing an
    # extension). Read-only download + its CORS preflight, so GET/HEAD/OPTIONS. Both hosts are needed
    # to install an extension; remove if you do not want the marketplace reachable.
    "{GET,HEAD,OPTIONS} https://openvsx.eclipsecontent.org",
]
# Silence deliberately-DENIED noise so `sbx net logs` reads clean (a `mute` never changes the verdict —
# the host stays denied and still counts in `sbx net stats`; see them with `--all`). These are
# telemetry / feature flags / the inert in-app self-updater / Chromium's own background services.
mute = [
    # Telemetry + feature flags (from the `agy` CLI profile).
    "play.googleapis.com",              # Google Play Services telemetry
    "antigravity-unleash.goog",         # Unleash feature flags (remote toggles)
    "playwright.azureedge.net",         # Playwright browser-driver download…
    "playwright-akamai.azureedge.net",  # …and its two CDN fallback mirrors
    "playwright-verizon.azureedge.net",
    # The IN-APP self-updater — inert in the cage (a self-downloaded binary is not autoPatchelf'd);
    # `sbx upgrade tarball` is the real upgrade path. Its version API + the gvt1 download CDN (the
    # build fetches the tarball over the HOST network, not this allowlist, so gvt1 is not needed here).
    "antigravity-ide-auto-updater-974169037036.us-central1.run.app",
    "edgedl.me.gvt1.com",
    # The in-cage Chromium's own background services — irrelevant to the login: crash reporting, clock
    # sync, device check-in, the ML "optimization guide", the component/extension + app updater, Play
    # logging, Safe Browsing, form autofill, and the cross-domain sign-in cookie check.
    "*.sentry.io",
    "clients2.google.com",
    "android.clients.google.com",
    "optimizationguide-pa.googleapis.com",
    "update.googleapis.com",
    "play.google.com",
    "safebrowsing.googleapis.com",
    "content-autofill.googleapis.com",
    "accounts.youtube.com",
    "redirector.gvt1.com",
    # VS Code telemetry (Antigravity is a VS Code fork) — Microsoft's OneCollector endpoint (browser +
    # mobile events subdomains). Denied; muted.
    "*.events.data.microsoft.com",
    # Google push/sync signaling, Chromium's password-leak check, and Google page chrome (favicon,
    # account `async/folae`) — none needed for the agent or the login (which completes without them).
    "signaler-pa.googleapis.com",
    "passwordsleakcheck-pa.googleapis.com",
    "www.google.com",
    # Google Tag Manager — analytics / marketing tags, not functional. Denied; muted.
    "www.googletagmanager.com",
]
