# `jcode` — a Rust terminal coding agent: what it needs to be installed and to reach its own services.
#
#   sbx bundle import examples/bundle/jcode.toml
#   # then in an app profile:   use = ["jcode"]
#
# Derived from `examples/app/jcode.toml`, whose namesake profile now names this bundle in `use`
# (thin profile): the bundle is the single source of truth for the agent's packages, env and
# egress, while the app keeps its own command, posture and BYOK choices. A test pins the two
# artifacts together, so they cannot drift apart.
#
# It carries no `cmd` and no posture: the consuming app keeps its own command, network mode,
# `gui`/`gpu`/`audio`/`dbus`, limits and home scope. The egress entries below land in that app's
# OWN `[network]` table — an app that declares none gets a warning instead, because inventing one
# could move its posture.
#
# NO PROVIDER HOST, deliberately. jcode is BYOK with no default provider — the profile leaves
# every provider host commented for the user to choose, and a bundle may only carry what its
# profile declares. The consuming app therefore opens its OWN provider host (and supplies the
# key). The install needs no `allow` entry either: the GitHub release download rides sbx's
# built-in read-only allow-set (github.com + *.githubusercontent.com).
#
# The telemetry mute + opt-outs below are the tool's own, independent of the model: the
# fire-and-forget POSTs stay denied (a `mute` never changes the verdict) and the env vars cut
# them at the source.
#
# FIELD ORDER MATTERS. The arrays come BEFORE the sub-tables: TOML reads a key after a
# `[table]` header as belonging to that table, so an `allow` written below `[…packages]` would
# silently become `packages.allow` — an unknown key, dropped without a word.

[bundle.jcode]
mute = [
    "telemetry.jcode.sh",  # install/session/feedback events (denied); see `sbx net log --all`
]

[bundle.jcode.env]
JCODE_NO_TELEMETRY = "1"  # telemetry opt-out (upstream also honors DO_NOT_TRACK and ~/.jcode/no_telemetry)
JCODE_NO_BROWSER = "1"    # no browser in the empty netns: fall back to the paste/device login flow

[bundle.jcode.packages]
jcode = "mise:github:1jehuang/jcode"  # upstream's own Rust release binary
