# `aider` — the AI pair-programming CLI: what it needs to be installed and to reach its own services.
#
#   sbx bundle import examples/bundle/aider.toml
#   # then in an app profile:   use = ["aider"]
#
#   REQUIRES egress groups — import them once (they are shared, not per-agent):
#     sbx net groups import examples/net-groups/pypi.toml
#
# Derived from `examples/app/aider.toml`, whose namesake profile now names this bundle in `use`
# (thin profile): the bundle is the single source of truth for the agent's packages, env and
# egress, while the app keeps its own command, posture and BYOK choices. A test pins the two
# artifacts together, so they cannot drift apart.
#
# It carries no `cmd` and no posture: the consuming app keeps its own command, network mode,
# `gui`/`gpu`/`audio`/`dbus`, limits and home scope. The egress entries below land in that app's
# OWN `[network]` table — an app that declares none gets a warning instead, because inventing one
# could move its posture.
#
# NO PROVIDER HOST, deliberately. Aider is BYOK with no default provider — the profile leaves
# every provider host commented for the user to choose (`api.openai.com`, `api.anthropic.com`,
# `openrouter.ai`, `generativelanguage.googleapis.com`, or a `tcp://localhost:<port>` relay to a
# local model), and a bundle may only carry what its profile declares. The consuming app
# therefore opens its OWN provider host (and supplies the key). What is here is the install lane
# plus the analytics mute, which are the same whatever model you point it at.
#
# FIELD ORDER MATTERS. The arrays come BEFORE the sub-tables: TOML reads a key after a
# `[table]` header as belonging to that table, so an `allow` written below `[…packages]` would
# silently become `packages.allow` — an unknown key, dropped without a word.

[bundle.aider]
allow = [
    # Install-time (mise's pipx backend runs `uv tool install aider-chat`): the Python
    # wheels and the package index, resolved from PyPI on first launch — the shared
    # `@pypi` group.
    "@pypi",
]
mute = [
    "us.i.posthog.com",  # aider's analytics (refused by the allowlist; it disables PostHog itself on the failure)
]

[bundle.aider.packages]
aider = "mise:pipx:aider-chat"  # the tool itself, from PyPI via uv
uv = "nix:uv"                   # mise's pipx backend runs `uv tool install`
python = "nix:python312"        # an interpreter in aider's `>=3.10,<3.15` range
