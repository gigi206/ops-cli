# `crush` — Charm's "glamourous agentic coding" terminal: what it needs to be installed and to reach its own services.
#
#   sbx bundle import examples/bundle/crush.toml
#   # then in an app profile:   use = ["crush"]
#   REQUIRES egress groups — import them once (they are shared, not per-agent):
#     sbx net groups import examples/net-groups/github-install.toml
#
# Derived from `examples/app/crush.toml`, whose namesake profile now names this bundle in `use`
# (thin profile): the bundle is the single source of truth for the agent's packages, env and
# egress, while the app keeps its own command, posture and BYOK choices. A test pins the two
# artifacts together, so they cannot drift apart.
#
# It carries no `cmd` and no posture: the consuming app keeps its own command, network mode,
# `gui`/`gpu`/`audio`/`dbus`, limits and home scope. The egress entries below land in that app's
# OWN `[network]` table — an app that declares none gets a warning instead, because inventing one
# could move its posture.
#
# The hosts below are the tool's own lanes: Hyper (Charm's first-party provider — the default
# route), Catwalk (the provider registry it refreshes on startup), and GitHub (OAuth device
# flow, the Copilot API, MCP catalog). The other 24+ PROVIDER hosts are BYOK and the profile
# leaves them commented — a bundle may only carry what its profile declares, so the consuming
# app opens its OWN provider host (and supplies the key).
#
# FIELD ORDER MATTERS. The arrays come BEFORE the sub-tables: TOML reads a key after a
# `[table]` header as belonging to that table, so an `allow` written below `[…packages]` would
# silently become `packages.allow` — an unknown key, dropped without a word.

[bundle.crush]
allow = [
    # First-party Hyper — Charm's subscription model API, the default provider when no other
    # `*_API_KEY` is set.
    "{*} https://hyper.charm.land",
    # Catwalk — the community-supported model registry Crush pulls on startup to refresh its
    # provider list.
    "{GET} https://catwalk.charm.land",
    # GitHub — OAuth device flow, token exchange, the Copilot API, and `api.github.com` for
    # the MCP server catalog. `{GET}` for the catalog and the device-code page; `{*}` for the
    # post-flow token exchange and Copilot POSTs.
    "@github-install",
    "{*} https://api.githubcopilot.com",
]

[bundle.crush.env]
CRUSH_DISABLE_METRICS = "1"  # vendor-recommended opt-out for the in-binary pseudonymous metrics
DO_NOT_TRACK = "1"           # the universal "respect the convention" knob

[bundle.crush.packages]
crush = "mise:github:charmbracelet/crush"  # the static-pie Go release binary; no runtime deps
