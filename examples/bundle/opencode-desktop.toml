# `opencode-desktop` — the opencode desktop app: what it needs to be installed and to reach its own
# services.
#
#   sbx bundle import examples/bundle/opencode-desktop.toml
#   # then in an app profile:   use = ["opencode-desktop"]
#
#   REQUIRES egress groups — import them once (they are shared, not per-agent):
#     sbx net groups import examples/net-groups/models-catalog.toml
#     sbx net groups import examples/net-groups/npm-runtime.toml
#
# Derived from `examples/app/opencode-desktop.toml`, whose namesake profile names this bundle in
# `use` (thin profile): the bundle is the single source of truth for the app's packages, env and
# egress, while the profile keeps its own command, posture and BYOK choices. A test pins the two
# artifacts together, so they cannot drift apart.
#
# It carries no `cmd` and no posture: the consuming app keeps its own command, network mode,
# `gui`/`gpu`/`audio`/`dbus`, limits and home scope. An Electron app needs `gui = "wayland"` and
# `gpu = true` to map a window at all, so a consuming profile that names this bundle without them
# gets a package it cannot display.
#
# DISTINCT FROM THE `opencode` BUNDLE, deliberately. That one carries the CLI (`mise:opencode`);
# this one carries the desktop artifact, a GitHub-release `.deb` whose version-stamped asset
# `sbx upgrade deb` rolls forward. Both wrap the same opencode server, which is why their egress
# is the same shape.
#
# NO PROVIDER KEY. opencode is multi-provider: the gateway path needs only the hosts below, and a
# direct-provider (BYOK) posture is the consuming app's choice, so it opens that host and supplies
# the key itself.
#
# FIELD ORDER MATTERS. The arrays come BEFORE the sub-tables: TOML reads a key after a
# `[table]` header as belonging to that table, so an `allow` written below `[…packages]` would
# silently become `packages.allow` — an unknown key, dropped without a word.

[bundle.opencode-desktop]
allow = [
    # The read-only model catalogue, and the npm package opencode pulls at startup
    # (`@opencode-ai/plugin`) — both shared lanes rather than per-agent copies.
    "@models-catalog",
    "@npm-runtime",
    # The gateway ("Zen") plus auth and the config/theme schemas, opened to every verb because the
    # app POSTs completions through it.
    "{*} https://opencode.ai",
]
mute = [
    # The desktop app POSTs crash/usage envelopes to Sentry, already refused by the allowlist.
    "*.sentry.io",
]

[bundle.opencode-desktop.packages]
# Track the latest GitHub release's linux-amd64 `.deb` automatically — the pin is the release's
# version-stamped asset, rolled by `sbx upgrade deb`.
opencode-desktop = "deb:github:anomalyco/opencode"
