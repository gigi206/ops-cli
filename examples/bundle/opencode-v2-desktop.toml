# `opencode-v2-desktop` — the opencode v2 desktop app: what it needs to be installed and to reach
# its own services.
#
#   sbx bundle import examples/bundle/opencode-v2-desktop.toml
#   # then in an app profile:   use = ["opencode-v2-desktop"]
#
#   REQUIRES egress groups — import them once (they are shared, not per-agent):
#     sbx net groups import examples/net-groups/models-catalog.toml
#     sbx net groups import examples/net-groups/npm-runtime.toml
#     sbx net groups import examples/net-groups/chromium-spellcheck.toml
#     sbx net groups import examples/net-groups/npm-audit.toml
#     sbx net groups import examples/net-groups/npm-jsr.toml
#
# Derived from `examples/app/opencode-v2-desktop.toml`, whose namesake profile names this bundle in
# `use` (thin profile): the bundle is the single source of truth for the app's packages, env and
# egress, while the profile keeps its own command, posture and BYOK choices. A test pins the two
# artifacts together, so they cannot drift apart.
#
# It carries no `cmd` and no posture: the consuming app keeps its own command, network mode,
# `gui`/`gpu`/`audio`/`dbus`, limits and home scope. An Electron app needs `gui = "wayland"` and
# `gpu = true` to map a window at all, so a consuming profile that names this bundle without them
# gets a package it cannot display.
#
# DISTINCT FROM THE `opencode-desktop` BUNDLE, deliberately. That one carries the v1 desktop app, a
# GitHub-release `.deb` (`deb:github:anomalyco/opencode`) — and upstream publishes v2 outside
# GitHub Releases (v2 tags carry no Release object; the binaries live on `opencode.ai/files/bin`),
# so no `github:` locator can ever offer it. This bundle therefore rides `deb:resolve` against the
# vendor's own update channel instead, the same channel the `opencode-v2` CLI bundle reads. Each app
# equips in its own home, so the two lines coexist: keep `opencode-desktop` for v1, add
# `opencode-v2-desktop` for v2.
#
# NO PROVIDER KEY. opencode is multi-provider: the gateway path needs only the hosts below, and a
# direct-provider (BYOK) posture is the consuming app's choice, so it opens that host and supplies
# the key itself.
#
# FIELD ORDER MATTERS. The arrays come BEFORE the sub-tables: TOML reads a key after a
# `[table]` header as belonging to that table, so an `allow` written below `[…packages]` would
# silently become `packages.allow` — an unknown key, dropped without a word.

allow = [
    # The read-only model catalogue, and the npm lane opencode's plugin loader installs plugin
    # packages from at runtime — both shared lanes rather than per-agent copies.
    "@models-catalog",
    "@npm-runtime",
    # The gateway ("Zen") plus auth and the config/theme schemas, opened to every verb because the
    # app POSTs completions through it. The same host serves the app's own update feed
    # (`/update/api/latest/desktop/opencode/`).
    "{*} https://opencode.ai",
    # Chromium's spellcheck dictionary, through the shared lane (GET-only, path-scoped).
    "@chromium-spellcheck",
]
mute = [
    # The desktop app POSTs crash/usage envelopes to Sentry, already refused by the allowlist.
    "*.sentry.io",
    "@npm-audit",
    "@npm-jsr",
]

[packages]
# The v2 desktop app's `.deb`, auto-upgraded through the resolver below. The key is also the name of
# the launcher the `deb:` backend installs, so the consuming profile's command is
# `opencode-v2-desktop`, and it cannot collide with the v1 app's `opencode-desktop`.
opencode-v2-desktop = "deb:resolve"

# The `deb:resolve` command for the package above. sbx runs it in a hermetic sandbox (its own base
# tools; the HOST network, because provisioning is host-side and an allowlist governs runtime
# egress), captures the URL it prints, validates it is an https `.deb`, and pins it with its content
# hash, so `sbx upgrade` rolls the app forward. A warm launch reuses the pin offline and never
# re-runs this.
#
# The vendor's update channel (`/update/api/latest/desktop`) names the current version and every
# distribution artifact (URL + sha256 each), so the resolver reads the `.deb` for this machine out
# of it rather than reconstructing a path — a constant alias would break the next launch with a hash
# mismatch the moment upstream ships a new build.
#
# ARCHITECTURE: the channel names the `.deb` by Debian architecture (`amd64`/`arm64`), so the
# resolver maps `uname -m` onto it and refuses anything else by name.
[deb.opencode-v2-desktop]
resolve = [
    "sh",
    "-c",
    'case "$(uname -m)" in x86_64) f=opencode-desktop-linux-amd64.deb ;; aarch64) f=opencode-desktop-linux-arm64.deb ;; *) echo "opencode-v2-desktop: the vendor publishes no $(uname -m) build" >&2; exit 1 ;; esac; u=$(curl -fsSL https://opencode.ai/update/api/latest/desktop | grep -oE "https://opencode\.ai/files/bin/[^\"]*/$f" | head -1); [ -n "$u" ] || { echo "opencode-v2-desktop: the update channel named no $f build" >&2; exit 1; }; echo "$u"',
]
