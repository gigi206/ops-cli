# `command-code` — "the coding agent that learns your taste": what it needs to be installed and to reach its own services.
#
#   sbx bundle import examples/bundle/command-code.toml
#   # then in an app profile:   use = ["command-code"]
#   REQUIRES egress groups — import them once (they are shared, not per-agent):
#     sbx net groups import examples/net-groups/github-install.toml
#     sbx net groups import examples/net-groups/npm-registry.toml
#
# Derived from `examples/app/command-code.toml`, whose namesake profile now names this bundle in `use`
# (thin profile): the bundle is the single source of truth for the agent's packages, env and
# egress, while the app keeps its own command, posture and BYOK choices. A test pins the two
# artifacts together, so they cannot drift apart.
#
# It carries no `cmd` and no posture: the consuming app keeps its own command, network mode,
# `gui`/`gpu`/`audio`/`dbus`, limits and home scope. The egress entries below land in that app's
# OWN `[network]` table — an app that declares none gets a warning instead, because inventing one
# could move its posture.
#
# The hosts below are the tool's own lanes: the first-party `api.commandcode.ai` (`taste-1`
# sessions, auth, account — the conservative default route), the npm install lane, and GitHub
# for taste push/pull. The PROVIDER hosts are BYOK and the profile leaves them commented
# (OpenAI, Anthropic, Gemini, xAI, DeepSeek, OpenRouter, …) — a bundle may only carry what its
# profile declares, so the consuming app opens its OWN provider host (and supplies the key).
#
# FIELD ORDER MATTERS. The arrays come BEFORE the sub-tables: TOML reads a key after a
# `[table]` header as belonging to that table, so an `allow` written below `[…packages]` would
# silently become `packages.allow` — an unknown key, dropped without a word.

[bundle.command-code]
allow = [
    # Install: mise's npm backend fetches the packument and the tarball in-cage, so the
    # registry is subject to this policy — opened read-only as a whole, like the other
    # npm-backed profiles.
    "@npm-registry",
    # First-party Command Code API — auth, account, the `taste-1` model sessions, MCP
    # registry. The binary POSTs to `api.commandcode.ai` for every prompt.
    "{*} https://api.commandcode.ai",
    # Taste push/pull — profiles are git repos in the GitHub registry.
    "@github-install",
]
mute = [
    "api.axiom.co",                  # OTel sink (Axiom.io) — `@opentelemetry/*` deps
    "ingestion.claicode.com",         # legacy third-party telemetry host
    "staging-api.commandcode.ai",     # vendor staging API
    "staging.commandcode.ai",         # vendor staging UI
    "console.anthropic.com",          # referenced in help text only (model picker links)
    "auth.openai.com",                # referenced in the `cmd login` OAuth flow
    "claude.ai",                      # referenced in help text only
    "mcp.notion.com",                 # referenced as an MCP example
    "commandcode.ai",                 # marketing / docs site
]

[bundle.command-code.packages]
nodejs = "nix:nodejs"            # Command Code requires `node >= 22` per its `engines` field
command-code = "mise:npm:command-code"  # the vendor's own npm scope (bins `cmd` / `command-code`)
