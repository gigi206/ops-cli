# `antigravity` — Google's Antigravity IDE: what it needs to be installed, to sign in, and to reach
# its own services.
#
#   sbx bundle import examples/bundle/antigravity.toml
#   # then in an app profile:   use = ["antigravity"]
#
#   REQUIRES egress groups — import them once (they are shared, not per-agent):
#     sbx net groups import examples/net-groups/chromium-background.toml
#     sbx net groups import examples/net-groups/chromium-spellcheck.toml
#     sbx net groups import examples/net-groups/google-signin-incage.toml
#
# Derived from `examples/app/antigravity.toml`, whose namesake profile names this bundle in `use`
# (thin profile): the bundle is the single source of truth for the app's packages, env and egress,
# while the profile keeps its own command, posture and credential choices. A test pins the two
# artifacts together, so they cannot drift apart.
#
# It carries no `cmd` and no posture: the consuming app keeps its own command, network mode,
# `gui`/`gpu`/`audio`/`dbus`, limits and home scope. An Electron IDE needs `gui = "wayland"` and
# `gpu = true` to map a window at all, and the Google Sign-In needs the `xdg-open`/deep-link
# preamble `examples/app/antigravity.toml` writes — a consuming profile without them gets a package
# it cannot display or log into.
#
# THE TARBALL IS AUTO-UPGRADED. `tarball:resolve` plus the resolver below re-derives the current
# download URL from Google's own auto-updater version API, so `sbx upgrade` rolls it
# forward. The resolver travels with the package it resolves, which is why it belongs here.
#
# FIELD ORDER MATTERS. The arrays come BEFORE the sub-tables: TOML reads a key after a
# `[table]` header as belonging to that table, so an `allow` written below `[…packages]` would
# silently become `packages.allow` — an unknown key, dropped without a word.

allow = [
    # Chromium's spellcheck dictionary, through the shared lane (GET-only, path-scoped).
    "@chromium-spellcheck",
    # Model / agent traffic — Google's Cloud Code (Gemini Code Assist) backend, the host the caged
    # agent and the native language server POST completions to. `daily-` is the same backend's
    # staging channel. All verbs (request bodies).
    "{*} https://cloudcode-pa.googleapis.com",
    "{*} https://daily-cloudcode-pa.googleapis.com",
    # Docs / bootstrap — a read-only fetch.
    "{GET} https://antigravity.google",
    # Google Sign-In ("Continue with Google") in the in-cage browser — the country-domain consent
    # and `/accounts/SetSID` step, the token endpoint and the page's assets — through the shared
    # lane.
    "@google-signin-incage",
    # The OAuth userinfo endpoint the login reads after the token exchange, path-scoped because
    # this host serves many other Google APIs.
    "{GET} https://www.googleapis.com/oauth2/*",
    # The VS Code-fork asset CDN — Antigravity fetches extension and built-in metadata here.
    "{*} https://main.vscode-cdn.net",
    # The extension MARKETPLACE (Open VSX): the gallery protocol OPTIONS-preflights and POSTs an
    # `extensionquery`, so all verbs. Remove it in the consuming app if you do not want the
    # marketplace reachable.
    "{*} https://open-vsx.org",
    # The Open VSX CONTENT CDN — the gallery serves metadata, the packages themselves come from
    # this Eclipse Foundation host. Both are needed to install an extension.
    "{GET,HEAD,OPTIONS} https://openvsx.eclipsecontent.org",
]
# Deliberately-DENIED noise, kept out of the default `sbx net logs`. A `mute` never changes the
# verdict (still denied, still counted by `sbx net stats`; see them with `--all`).
mute = [
    # Telemetry + feature flags.
    "play.googleapis.com",              # Google Play Services telemetry
    "antigravity-unleash.goog",         # Unleash feature flags (remote toggles)
    "playwright.azureedge.net",         # Playwright browser-driver download…
    "playwright-akamai.azureedge.net",  # …and its two CDN fallback mirrors
    "playwright-verizon.azureedge.net",
    # The IN-APP self-updater — inert in the cage (a self-downloaded binary is not autoPatchelf'd);
    # `sbx upgrade` is the real upgrade path. Its version API and the gvt1 download CDN are
    # reached HOST-SIDE by the resolver below, not through a cage allowlist.
    "antigravity-ide-auto-updater-974169037036.us-central1.run.app",
    "edgedl.me.gvt1.com",
    # The in-cage Chromium's own background services — irrelevant to the login.
    "@chromium-background",
    # Crash reporting (the app's own, not Chromium's).
    "*.sentry.io",
    # VS Code telemetry (Antigravity is a VS Code fork) — Microsoft's OneCollector endpoint.
    "*.events.data.microsoft.com",
    # Google page chrome (favicon, account `async/folae`). The sign-in lane admits its GETs; this
    # keeps anything else it sends out of the default log.
    "www.google.com",
    # Google Tag Manager — analytics / marketing tags, not functional.
    "www.googletagmanager.com",
]

# The Google access token the agent holds is sent to the account profile endpoint
# (`www.googleapis.com/oauth2/*`) and to its Cloud Code service, which the outbound tripwire reads
# as a leak unless the hosts are declared one service. Measured with the `agy` CLI, which runs the
# same engine against the same hosts: without the group, every Cloud Code call after the first is
# refused `outbound-secret`. Not measured in the IDE.
shared_credential = [[
    "www.googleapis.com",
    "cloudcode-pa.googleapis.com",
    "daily-cloudcode-pa.googleapis.com",
]]

[packages]
# Google's official prebuilt IDE tarball, tracked automatically through the resolver below.
# Provisioned and autoPatchelf'd HOST-SIDE (Electron, no source build).
antigravity-ide = "tarball:resolve"
# An in-cage Chromium for the Google Sign-In flow. HEAVY — a large nixpkgs closure on first launch,
# seeded and offline-reusable after, and shared with every other Chromium profile in your store.
chromium = "nix:chromium"

# The auto-upgrade resolver. sbx runs `resolve` in a HERMETIC sandbox (sbx's own base tools, never
# the host's; the HOST network, because provisioning is host-side and the allowlist governs runtime
# egress), captures the `.tar.gz` URL it prints, validates it, and pins its content hash. The
# command queries Google's official auto-updater version API (a JSON array, newest first), reads
# `version` and `execution_id` from element [0] with base tools (no jq), and builds the download
# URL on Google's official Edge CDN. `printf` rather than `echo`, so the URL carries no trailing
# newline.
#
# ARCHITECTURE: x86_64 only. The CDN path carries the architecture, and the `linux-arm64` sibling
# of the build it names answers 404 — Google publishes the Linux IDE for x86_64 alone. The resolver
# stops on any other host rather than pinning bytes that cannot run there.
[tarball.antigravity-ide]
resolve = ["sh", "-c", '''
case "$(uname -m)" in x86_64) ;; *) echo "antigravity-ide: Google publishes the Linux IDE for x86_64 only" >&2; exit 1 ;; esac
api="https://antigravity-ide-auto-updater-974169037036.us-central1.run.app/releases"
data=$(curl -fsS "$api")
ver=$(printf '%s' "$data" | grep -oE '"version":"[^"]*"' | head -1 | sed 's/.*:"//;s/"$//')
eid=$(printf '%s' "$data" | grep -oE '"execution_id":"[^"]*"' | head -1 | sed 's/.*:"//;s/"$//')
printf 'https://edgedl.me.gvt1.com/edgedl/release2/j0qc3/antigravity/stable/%s-%s/linux-x64/Antigravity%%20IDE.tar.gz' "$ver" "$eid"
''']
