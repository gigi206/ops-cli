# `grok` — xAI's Grok CLI: what it needs to be installed and to reach its own services.
#
#   sbx bundle import examples/bundle/grok.toml
#   # then in an app profile:   use = ["grok"]
#
# Derived from `examples/app/grok.toml`, whose namesake profile now names this bundle in `use`
# (thin profile): the bundle is the single source of truth for the agent's packages, env and
# egress, while the app keeps its own command, posture and BYOK choices. A test pins the two
# artifacts together, so they cannot drift apart.
#
# It carries no `cmd` and no posture: the consuming app keeps its own command, network mode,
# `gui`/`gpu`/`audio`/`dbus`, limits and home scope. The egress entries below land in that app's OWN
# `[network]` table — an app that declares none gets a warning instead, because inventing one could
# move its posture.
#
# The two lines below are the INSTALL host (xAI's artifact bucket, path-scoped) and the BYOK API
# host. The xAI-ACCOUNT path uses different hosts (`accounts.x.ai`, `cli-chat-proxy.grok.com`); the
# profile leaves them commented, so the bundle does not carry them either — an app that signs in
# with an account adds those two itself.
#
# FIELD ORDER MATTERS. The arrays come BEFORE the sub-tables: TOML reads a key after a `[table]`
# header as belonging to that table, so an `allow` written below `[…packages]` would silently become
# `packages.allow` — an unknown key, dropped without a word.

[bundle.grok]
allow = [
    "{GET} https://storage.googleapis.com/grok-build-public-artifacts/*",
    "{*} https://api.x.ai",
]
mute = [
    "api.mixpanel.com",
]

[bundle.grok.env]
GROK_DISABLE_AUTOUPDATER = "1"  # sbx owns upgrades; the CLI must not replace its pinned install

[bundle.grok.packages]
# xAI's own release binary, fetched from its artifact bucket — and the ONE package in this
# collection that names a version, because without it the agent does not start at all.
#
# The aqua registry entry for this tool is `type: http`: it builds the download URL from a template
# (`…/cli/grok-{{.Version}}-linux-x86_64`) and carries no `repo_owner`, no `repo_name` and no
# `version_source`. mise therefore has nowhere to ask what versions exist, and an unversioned
# request resolves to nothing: the launch fails with `no versions found for aqua:x.ai/cli/grok`
# before the agent is ever reached. Naming a version skips the question mise cannot answer, and the
# URL template does the rest.
#
# THE COST, STATED PLAINLY: `sbx upgrade mise` cannot roll this one forward. It rolls a `mise:`
# package by asking the backend for a newer version, which is the same question that has no answer
# here. Nothing else on the vendor's side helps either, and this was checked rather than assumed:
# the bucket refuses anonymous listing, and there is no `latest`/`stable` alias and no version
# manifest beside the binaries. So this pin moves when a person moves it.
#
# THE TRIGGER THAT RETIRES THE PIN: either xAI publishes something enumerable (a listable bucket, a
# `latest` alias, a version endpoint), or sbx grows a prebuilt backend for a RAW binary — today
# `tarball:`/`deb:`/`appimage:` all unpack an archive, and this artifact is a bare executable, which
# is why the `<backend>:resolve` family cannot serve it. Either one turns this back into an
# unversioned request.
#
# Do not take the version from the aqua registry: it pins `0.2.2`, published in May, while the
# bucket serves this one. Bump by probing the vendor's URL template for the next version.
grok = "mise:aqua:x.ai/cli/grok@1.0.4"
