# `grok` — xAI's Grok CLI: what it needs to be installed and to reach its own services.
#
#   sbx bundle import examples/bundle/grok.toml
#   # then in an app profile:   use = ["grok"]
#
# Derived from `examples/app/grok.toml`, whose namesake profile now names this bundle in `use`
# (thin profile): the bundle is the single source of truth for the agent's packages, env and
# egress, while the app keeps its own command, posture and BYOK choices. A test pins the two
# artifacts together, so they cannot drift apart.
#
# It carries no `cmd` and no posture: the consuming app keeps its own command, network mode,
# `gui`/`gpu`/`audio`/`dbus`, limits and home scope. The egress entries below land in that app's OWN
# `[network]` table — an app that declares none gets a warning instead, because inventing one could
# move its posture.
#
# The two lines below are the INSTALL host (xAI's artifact bucket, path-scoped) and the BYOK API
# host. The xAI-ACCOUNT path uses different hosts (`accounts.x.ai`, `cli-chat-proxy.grok.com`); the
# profile leaves them commented, so the bundle does not carry them either — an app that signs in
# with an account adds those two itself.
#
# FIELD ORDER MATTERS. The arrays come BEFORE the sub-tables: TOML reads a key after a `[table]`
# header as belonging to that table, so an `allow` written below `[…packages]` would silently become
# `packages.allow` — an unknown key, dropped without a word.

[bundle.grok]
allow = [
    "{GET} https://storage.googleapis.com/grok-build-public-artifacts/*",
    "{*} https://api.x.ai",
]
mute = [
    "api.mixpanel.com",
]

[bundle.grok.env]
GROK_DISABLE_AUTOUPDATER = "1"  # sbx owns upgrades; the CLI must not replace its pinned install

[bundle.grok.packages]
# xAI's own release binary, taken from its artifact bucket host-side.
#
# NOT `mise:aqua:`, and the reason is worth stating because it looks like the obvious choice. The
# aqua registry entry for this tool is `type: http`: it builds the download URL from a template
# (`…/cli/grok-{{.Version}}-linux-x86_64`) and carries no `repo_owner`, no `repo_name` and no
# `version_source`. mise therefore has nowhere to ask what versions exist, so an unversioned request
# resolves to nothing and the launch fails with `no versions found` before the agent is reached,
# while a versioned one pins the agent at a build a person has to bump by hand.
#
# `binary:resolve` answers both halves. The artifact is a bare executable rather than an archive,
# which is exactly what that backend is for, and the `resolve` command below asks the vendor what
# the current version is, so `sbx upgrade binary` rolls this agent forward like every other.
grok = "binary:resolve"

# The vendor's own version source, and the whole of what sbx knows about xAI: the backend itself is
# agnostic, so every fact about this vendor lives here rather than in sbx.
#
# `…/cli/stable` is the channel file the CLI's own updater reads; it answers with the version and
# nothing else (`1.0.4`). The command turns that into the download URL the same template the aqua
# registry uses builds, and sbx re-validates the result before fetching it.
#
# `tr -d` guards the one thing that would break silently: the body arrives today with no trailing
# newline, and a version with a stray one appended would produce a URL that 404s rather than an
# error anyone could read.
#
# This runs host-side in sbx's hermetic resolve cage, not in the agent's cage, so it uses the host
# network rather than the `allow` list above — that list governs the agent's own egress at runtime.
[bundle.grok.binary.grok]
resolve = [
    "sh",
    "-c",
    'v=$(curl -fsSL https://storage.googleapis.com/grok-build-public-artifacts/cli/stable | tr -d "\r\n"); [ -n "$v" ] || { echo "grok: the vendor channel named no version" >&2; exit 1; }; echo "https://storage.googleapis.com/grok-build-public-artifacts/cli/grok-$v-linux-x86_64"',
]
