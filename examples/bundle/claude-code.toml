# `claude-code` — Anthropic's agentic coding CLI: what it needs to be installed and to reach its own services.
#
#   sbx bundle import examples/bundle/claude-code.toml
#   # then in an app profile:   use = ["claude-code"]
#
# Derived from `examples/app/claude-code.toml`, whose namesake profile now names this bundle in `use`
# (thin profile): the bundle is the single source of truth for the agent's packages, env and
# egress, while the app keeps its own command, posture and BYOK choices. A test pins the two
# artifacts together, so they cannot drift apart.
#
# It carries no `cmd` and no posture: the consuming app keeps its own command, network mode,
# `gui`/`gpu`/`audio`/`dbus`, limits and home scope. The egress entries below land in that app's
# OWN `[network]` table — an app that declares none gets a warning instead, because inventing one
# could move its posture.
#
# FIELD ORDER MATTERS. The arrays come BEFORE the sub-tables: TOML reads a key after a
# `[table]` header as belonging to that table, so an `allow` written below `[…packages]` would
# silently become `packages.allow` — an unknown key, dropped without a word.

[bundle.claude-code]
allow = [
    # The Claude API: the account/connectivity check plus the `/voice` speech-to-text WebSocket
    # (`api.anthropic.com/api/ws/speech_to_text/voice_stream`). `{*,WS}` = all HTTP verbs AND the
    # WebSocket: sbx requires an explicit `WS` opt-in that a plain `{*}` does NOT cover (a WS is an
    # unredactable bidirectional channel), so without the `WS` voice dictation reads `denied-method`.
    "{*,WS} https://api.anthropic.com",
    "{*} https://platform.claude.com",
    "{GET} https://downloads.claude.ai",
    "{*} https://mcp-proxy.anthropic.com",
    "{*} https://console.anthropic.com",
    "{GET} https://storage.googleapis.com:443/claude-code-dist-86c565f3-f756-42ad-8dfa-d59b1c096819/*",
]

[bundle.claude-code.packages]
claude-code = "mise:aqua:anthropics/claude-code"

[bundle.claude-code.env]
CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC = "1"
DISABLE_TELEMETRY = "1"
DISABLE_ERROR_REPORTING = "1"
