# `sigit` — siGit Code: what it needs to be installed and to fetch its local model.
#
#   sbx bundle import examples/bundle/sigit.toml
#   # then in an app profile:   use = ["sigit"]
#   REQUIRES egress groups — import them once (they are shared, not per-agent):
#     sbx net groups import examples/net-groups/npm-audit.toml
#     sbx net groups import examples/net-groups/npm-registry.toml
#
# Derived from `examples/app/sigit.toml`, whose namesake profile now names this bundle in `use`
# (thin profile): the bundle is the single source of truth for the agent's packages, env and
# egress, while the app keeps its own command, posture and BYOK choices. A test pins the two
# artifacts together, so they cannot drift apart.
#
# It carries no `cmd` and no posture: the consuming app keeps its own command, network mode,
# `gui`/`gpu`/`audio`/`dbus`, limits and home scope.
#
# NO PROVIDER HOST AND NO CREDENTIAL — not an omission. siGit Code runs the model in-process; the
# two Hugging Face lanes below are how it fetches the GGUF on first launch, read-only, and once that
# is on disk it needs no model host at all. A consuming app inherits exactly that: an agent it can
# run with no key to supply and nothing to leak.
#
# FIELD ORDER MATTERS. The arrays come BEFORE the sub-tables: TOML reads a key after a `[table]`
# header as belonging to that table, so an `allow` written below `[…packages]` would silently become
# `packages.allow` — an unknown key, dropped without a word.

[bundle.sigit]
allow = [
    "@npm-registry",
    "{GET} https://huggingface.co",
    "{GET} https://*.hf.co",
]
mute = [
    "@npm-audit",
    "html.duckduckgo.com",
]

[bundle.sigit.packages]
nodejs = "nix:nodejs"                # the npm entry point is a JS shim
sigit = "mise:npm:@smbcloud/sigit"   # upstream's documented npm package
