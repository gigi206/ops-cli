# `autohand` — the Autohand Code CLI: what it needs to be installed and to reach its own services.
#
#   sbx bundle import examples/bundle/autohand.toml
#   # then in an app profile:   use = ["autohand"]
#   REQUIRES egress groups — import them once (they are shared, not per-agent):
#     sbx net groups import examples/net-groups/github-install.toml
#     sbx net groups import examples/net-groups/npm-registry.toml
#
# Derived from `examples/app/autohand.toml`, whose namesake profile now names this bundle in `use`
# (thin profile): the bundle is the single source of truth for the agent's packages, env and
# egress, while the app keeps its own command, posture and BYOK choices. A test pins the two
# artifacts together, so they cannot drift apart.
#
# It carries no `cmd` and no posture: the consuming app keeps its own command, network mode,
# `gui`/`gpu`/`audio`/`dbus`, limits and home scope. The egress entries below land in that app's
# OWN `[network]` table — an app that declares none gets a warning instead, because inventing one
# could move its posture.
#
# The hosts below are the tool's own lanes: the first-party backend (`api.autohand.ai` auth +
# account, `code.autohand.ai` agent loop), the npm install lane, and GitHub for MCP installs and
# slash-command/skill fetches. The PROVIDER hosts are BYOK and the profile leaves them commented
# (OpenAI, xAI, DeepSeek, Cerebras, Z.AI, Bedrock, Vertex, NVIDIA NIM, …) — a bundle may only
# carry what its profile declares, so the consuming app opens its OWN provider host (and supplies
# the key). The first-party `code.autohand.ai` above is the conservative default route.
#
# FIELD ORDER MATTERS. The arrays come BEFORE the sub-tables: TOML reads a key after a
# `[table]` header as belonging to that table, so an `allow` written below `[…packages]` would
# silently become `packages.allow` — an unknown key, dropped without a word.

[bundle.autohand]
allow = [
    # First-party Autohand API — auth, account, the `code.autohand.ai` agent loop, the
    # `api.autohand.ai` backend.
    "{*} https://api.autohand.ai",
    "{*} https://code.autohand.ai",
    # Install: mise's npm backend fetches the packument and the tarball in-cage, so the
    # registry is subject to this policy — opened read-only as a whole, like the other
    # npm-backed profiles.
    "@npm-registry",
    # GitHub — MCP server installs and the slash-command/skill fetches the agent runs from
    # inside the cage. `{GET}` only.
    "@github-install",
]

[bundle.autohand.packages]
nodejs = "nix:nodejs"              # Autohand Code requires `node >= 22` per its `engines` field
autohand-cli = "mise:npm:autohand-cli"  # the vendor's own npm scope (bin `autohand`)
