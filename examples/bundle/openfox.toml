# `openfox` — the OpenFox CLI: what it needs to be installed.
#
#   sbx bundle import examples/bundle/openfox.toml
#   # then in an app profile:   use = ["openfox"]
#
# Derived from `examples/app/openfox.toml`, whose namesake profile now names this bundle in `use`
# (thin profile): the bundle is the single source of truth for the agent's packages, env and
# egress, while the app keeps its own command, posture and BYOK choices. A test pins the two
# artifacts together, so they cannot drift apart.
#
# It carries no `cmd` and no posture: the consuming app keeps its own command, network mode,
# `gui`/`gpu`/`audio`/`dbus`, limits and home scope.
#
# NO EGRESS RULES, unlike the other agent bundles — and that is faithful to the profile it comes
# from: `examples/app/openfox.toml` runs under `network = "shared"`, so it never had an allowlist to
# derive one from. An app that names this bundle gets the tool and must state that agent's reach
# itself (watch `sbx net logs -a <app>` under a filtering posture, and add what it asks for).
#
# FIELD ORDER MATTERS. The arrays come BEFORE the sub-tables: TOML reads a key after a
# `[table]` header as belonging to that table, so an `allow` written below `[…packages]` would
# silently become `packages.allow` — an unknown key, dropped without a word.

[bundle.openfox]
# The install step mise's `--ignore-scripts` leaves undone, and the reason this bundle is complete
# rather than a package a consuming app cannot start. OpenFox depends on two NATIVE node addons —
# `better-sqlite3` (its session DB) and `node-pty` (its integrated terminal) — whose compiled
# `.node` binaries are placed by a package install script, which mise deliberately does not run. A
# plain install therefore leaves them absent and the agent exits at startup with "Could not locate
# the bindings file … better_sqlite3.node".
#
# `npm rebuild` DOWNLOADS the prebuilt binaries rather than compiling them (they are published for
# this platform), so no C++ toolchain is needed — but it does fetch, which is why the npm registry
# is in the consuming app's reach. It runs inside the cage, under that app's own posture.
#
# The guard is the step's own, and it must be: sbx runs a `provision` on every launch and does not
# remember that one succeeded. Keying on the artifact also self-heals — after `sbx upgrade mise`
# rolls openfox into a fresh install directory the marker is absent again, so the addons are rebuilt
# for the new tree.
provision = [
    "bash",
    "-c",
    '''
set -eu
of="$(mise where 'npm:openfox')/lib/node_modules/openfox"
marker="$of/node_modules/better-sqlite3/build/Release/better_sqlite3.node"
if [ ! -e "$marker" ]; then
  echo "openfox: building native addons (better-sqlite3, node-pty) that mise's --ignore-scripts skips …" >&2
  ( cd "$of" && npm rebuild better-sqlite3 node-pty )
fi
''',
]

[bundle.openfox.packages]
nodejs = "nix:nodejs"  # mise's npm backend needs a node runtime inside the cage
openfox = "mise:npm:openfox"
