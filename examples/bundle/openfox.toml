# `openfox` — the OpenFox CLI: what it needs to be installed.
#
#   sbx bundle import examples/bundle/openfox.toml
#   # then in an app profile:   use = ["openfox"]
#
# Derived from `examples/app/openfox.toml`, whose namesake profile now names this bundle in `use`
# (thin profile): the bundle is the single source of truth for the agent's packages, env and
# egress, while the app keeps its own command, posture and BYOK choices. A test pins the two
# artifacts together, so they cannot drift apart.
#
# It carries no `cmd` and no posture: the consuming app keeps its own command, network mode,
# `gui`/`gpu`/`audio`/`dbus`, limits and home scope.
#
# NO EGRESS RULES, unlike the other agent bundles — and that is faithful to the profile it comes
# from: `examples/app/openfox.toml` runs under `network = "shared"`, so it never had an allowlist to
# derive one from. An app that names this bundle gets the tool and must state that agent's reach
# itself (watch `sbx net logs -a <app>` under a filtering posture, and add what it asks for).
#
# FIELD ORDER MATTERS. The arrays come BEFORE the sub-tables: TOML reads a key after a
# `[table]` header as belonging to that table, so an `allow` written below `[…packages]` would
# silently become `packages.allow` — an unknown key, dropped without a word.

[bundle.openfox]
# The install step mise's `--ignore-scripts` leaves undone, and the reason this bundle is complete
# rather than a package a consuming app cannot start. OpenFox depends on two NATIVE node addons —
# `better-sqlite3` (its session DB), whose compiled `.node` binary is placed by a package install
# script, which mise deliberately does not run. A plain install therefore leaves it absent and the
# agent exits at startup with "Could not locate the bindings file … better_sqlite3.node".
#
# `npm rebuild` DOWNLOADS the prebuilt binary rather than compiling it (better-sqlite3's install
# script is `prebuild-install || node-gyp rebuild`, and the download reaches GitHub releases, which
# sbx's built-in set already allows), so no C++ toolchain is needed — but it does fetch, which is
# why the npm registry is in the consuming app's reach. It runs inside the cage, under that app's
# own posture.
#
# Only better-sqlite3 is rebuilt. `node-pty` ships `prebuilds/linux-x64/pty.node` in the tree, so
# there is nothing to build for it — and rebuilding it FAILS by construction: its `prepare` script
# runs `tsc -b ./src/tsconfig.json` while the published tarball carries `src/unix` and `src/win`
# without that tsconfig, so npm aborts the whole rebuild on a TypeScript error and takes
# better-sqlite3 down with it. Asking for the addon that is genuinely missing, and only that one,
# is what keeps this step honest.
#
# The guard is the step's own, and it must be: sbx runs a `provision` on every launch and does not
# remember that one succeeded. Keying on the artifact also self-heals — after `sbx upgrade mise`
# rolls openfox into a fresh install directory the marker is absent again, so the addons are rebuilt
# for the new tree.
provision = [
    "bash",
    "-c",
    '''
set -eu
# The two directories this step needs are FOUND, never assumed: a `mise:npm:` install has carried
# more than one layout (the package beside its dependencies under `lib/node_modules/<pkg>`, and a
# pnpm-style store under `node_modules/.mise/`), and hardcoding one is what silently broke this step
# before — npm printed "rebuilt dependencies successfully" while building nothing.
root="$(mise where 'npm:openfox')"
bs="$(find "$root" -maxdepth 6 -type d -path '*/node_modules/better-sqlite3' -print -quit)"
if [ -z "$bs" ]; then
  echo "openfox: cannot find better-sqlite3 under $root — the install layout changed again" >&2
  exit 1
fi
marker="$bs/build/Release/better_sqlite3.node"
# `sbx app upgrade openfox` raises SBX_UPGRADE to ask for a re-install; without it the guard
# below keeps the fetch to once.
if [ ! -e "$marker" ] || [ -n "${SBX_UPGRADE:-}" ]; then
  echo "openfox: fetching the better-sqlite3 binding that mise's --ignore-scripts skips …" >&2
  # `prebuild-install` is run DIRECTLY rather than through `npm rebuild`, because the pnpm-style
  # layout links no `node_modules/.bin`: npm cannot find the helper its own install script names,
  # falls back to `node-gyp rebuild`, and dies for want of a Python and a C++ toolchain the cage has
  # no reason to carry. The helper is in the tree — it is a dependency of better-sqlite3 — so
  # invoking it by path does the one thing that is actually needed: download the binding published
  # for this platform.
  pbi="$(find "$root" -maxdepth 6 -type f -path '*/prebuild-install/bin.js' -print -quit)"
  if [ -z "$pbi" ]; then
    echo "openfox: prebuild-install is not in the install tree under $root" >&2
    exit 1
  fi
  ( cd "$bs" && node "$pbi" )
  # The binding is the point, so a silent no-op is a failure: the helper reports success either way.
  [ -e "$marker" ] || { echo "openfox: no better_sqlite3.node was produced in $bs" >&2; exit 1; }
fi
''',
]

[bundle.openfox.packages]
nodejs = "nix:nodejs"  # mise's npm backend needs a node runtime inside the cage
openfox = "mise:npm:openfox"
