# `stakpak` — the Stakpak DevOps agent: what it needs to be installed and to reach its own service.
#
#   sbx bundle import examples/bundle/stakpak.toml
#   # then in an app profile:   use = ["stakpak"]
#
# Derived from `examples/app/stakpak.toml`, which stays the self-contained way to run this agent on
# its own (`sbx app import`, one step, nothing else needed). This bundle is for an app that EMBEDS
# the agent — an orchestrator spawning it as a subprocess — so that app states the requirement ONCE
# instead of copying it. A test pins the two artifacts together, so they cannot drift apart.
#
# It carries no `cmd` and no posture: the consuming app keeps its own command, network mode,
# `gui`/`gpu`/`audio`/`dbus`, limits and home scope. In particular it does NOT carry any grant an
# infrastructure agent might want (a Docker socket, a kubeconfig bind) — those are the consuming
# app's decision, deliberately.
#
# One package and no runtime dependency: upstream's release binary is a static ELF.
#
# FIELD ORDER MATTERS. The arrays come BEFORE the sub-tables: TOML reads a key after a `[table]`
# header as belonging to that table, so an `allow` written below `[…packages]` would silently become
# `packages.allow` — an unknown key, dropped without a word.

[bundle.stakpak]
allow = [
    "{*} https://apiv2.stakpak.dev",
]
mute = [
    "discord.com",
    "api.slack.com",
    "api.telegram.org",
]

[bundle.stakpak.packages]
stakpak = "mise:github:stakpak/agent"  # upstream's own static Rust release binary
