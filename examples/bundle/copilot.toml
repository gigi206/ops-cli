# `copilot` — the GitHub Copilot CLI: what it needs to be installed and to reach its own services.
#
#   sbx bundle import examples/bundle/copilot.toml
#   # then in an app profile:   use = ["copilot"]
#
# Derived from `examples/app/copilot.toml`, which stays the self-contained way to run this agent on
# its own (`sbx app import`, one step, nothing else needed). This bundle is for an app that EMBEDS
# the agent — an orchestrator spawning it as a subprocess — so that app states the requirement ONCE
# instead of copying it. A test pins the two artifacts together, so they cannot drift apart.
#
# It carries no `cmd` and no posture: the consuming app keeps its own command, network mode,
# `gui`/`gpu`/`audio`/`dbus`, limits and home scope. The egress entries below land in that app's OWN
# `[network]` table — an app that declares none gets a warning instead, because inventing one could
# move its posture.
#
# FIELD ORDER MATTERS. The arrays come BEFORE the sub-tables: TOML reads a key after a `[table]`
# header as belonging to that table, so an `allow` written below `[…packages]` would silently become
# `packages.allow` — an unknown key, dropped without a word.

[bundle.copilot]
allow = [
    "{*} https://github.com/login/*",
    "{*} https://api.github.com",
    "{*} https://*.githubcopilot.com",
    "{*} https://copilot-proxy.githubusercontent.com",
    "{*} https://origin-tracker.githubusercontent.com",
]
mute = [
    "collector.github.com",
    "copilot-telemetry.githubusercontent.com",
    "default.exp-tas.com",
]

[bundle.copilot.packages]
copilot = "mise:aqua:github/copilot-cli"  # the official GitHub release binary; no node runtime
