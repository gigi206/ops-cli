# `warp` — the Warp Agent CLI: what it needs to be installed and to reach its own services.
#
#   sbx bundle import examples/bundle/warp.toml
#   # then in an app profile:   use = ["warp"]
#
# Derived from `examples/app/warp.toml`, whose namesake profile now names this bundle in `use`
# (thin profile): the bundle is the single source of truth for the agent's packages, env and
# egress, while the app keeps its own command, posture and BYOK choices. A test pins the two
# artifacts together, so they cannot drift apart.
#
# It carries no `cmd` and no posture: the consuming app keeps its own command, network mode,
# `gui`/`gpu`/`audio`/`dbus`, limits and home scope. The egress entries below land in that app's
# OWN `[network]` table — an app that declares none gets a warning instead, because inventing one
# could move its posture.
#
# FIELD ORDER MATTERS. The arrays come BEFORE the sub-tables: TOML reads a key after a
# `[table]` header as belonging to that table, so an `allow` written below `[…packages]` would
# silently become `packages.allow` — an unknown key, dropped without a word.

[bundle.warp]
allow = [
    # Login + API + artifact endpoint. The device-code login (the CLI prints a verification link
    # and a code, then polls until you approve in any browser) and the account portal both live
    # on app.warp.dev, and `app.warp.dev/download/agent-cli/artifact?os=…&arch=…` is the 302
    # entry to the release tarballs the bootstrap wrapper resolves. `{*,WS}`: an app is
    # read-by-default ({GET,HEAD}), the CLI POSTs to its API, and the binary's URL table also
    # shows a WebSocket against app.warp.dev (streaming).
    "{*,WS} https://app.warp.dev",
    # Conversation transport, read out of the binary's outbound URL table: sessions sync to your
    # Warp account over `wss://sessions.app.warp.dev`, and agent events stream over GraphQL on
    # `wss://rtc.app.warp.dev/graphql/v2`. A WebSocket is a distinct capability a plain `{*}`
    # does NOT grant (a bidirectional, uninspected channel), so each is named `{WS}`.
    "{WS} https://sessions.app.warp.dev",
    "{WS} https://rtc.app.warp.dev",
    # Release downloads: the bootstrap tarball (after the app.warp.dev 302) and the background
    # auto-updater (`channel_versions.json` + the versioned tarballs, fetched while the CLI
    # runs). Read-only, so `{GET,HEAD}` — least privilege.
    "{GET,HEAD} https://releases.warp.dev",
]

# Telemetry: the binary bakes in a Sentry DSN (`o540343.ingest.sentry.io`) for crash/error
# reporting and a RudderStack analytics dataplane (`warpianwzlfqdq.dataplane.rudderstack.com`).
# In `deny` mode any host absent from `allow` is already refused, so neither ever gets out; the
# `mute` silences the outbox for the two hosts (a mute never changes the verdict — still refused —
# and never hides a count, `sbx net stats` still tallies it).
mute = [
    "o540343.ingest.sentry.io",                  # crash / error reporting (DSN baked into the binary)
    "warpianwzlfqdq.dataplane.rudderstack.com",  # product analytics (dataplane baked into the binary)
]

[bundle.warp.packages]
# The bootstrap wrapper in `examples/app/warp.toml` downloads + extracts the release tarball.
# `curl` is in sbx's base toolset; `tar` + `gzip` are NOT (same gap `pool.toml`, `devin.toml`,
# and `cursor-agent.toml` cite), so the `nix:` backend provisions them host-side, seeded,
# offline-reusable.
#
# liblzma: the Warp CLI binary itself is a foreign (non-nix) binary that links exactly one
# library the hermetic cage lacks — `liblzma.so.5` (measured with `ldd` on the shipped
# `warp-tui-stable`; everything else it needs — libz, libgcc_s, glibc — the base userland already
# provides through its nix-ld shim). Declared here so it is host-provisioned; the wrapper finds
# its `lib/` by store-path name (a content-addressed path cannot be written literally — the same
# pattern `odysseus.toml` uses for libstdc++). The nixpkgs attribute is the full `xz` package —
# there is no `liblzma` attribute in the pinned revision (checked against the same
# `github:NixOS/nixpkgs/0954f7…` flake sbx resolves), and `xz` is split, so its `-bin` output on
# PATH carries no libraries: the wrapper globs the `out` output's `lib/`.
gnutar   = "nix:gnutar"
gzip     = "nix:gzip"
xz       = "nix:xz"
