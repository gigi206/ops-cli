# `prime-agent` — Prime Intellect's prime-agent: the runtime its installer needs, plus the hosts it reaches.
#
#   sbx bundle import examples/bundle/prime-agent.toml
#   # then in an app profile:   use = ["prime-agent"]
#
#   REQUIRES egress groups — import them once (they are shared, not per-agent):
#     sbx net groups import examples/net-groups/npm-registry.toml
#     sbx net groups import examples/net-groups/pypi.toml
#
# Derived from `examples/app/prime-agent.toml`, whose namesake profile names this bundle in `use` (thin
# profile): the bundle is the single source of truth for what this agent needs, while the profile
# keeps its own command, posture and credential choices. A test pins the two artifacts together,
# so they cannot drift apart.
#
# It carries no `cmd` and no posture: the consuming app keeps its own command, network mode,
# `gui`/`gpu`/`audio`/`dbus`, limits and home scope.
#
# THE AGENT IS A VENDOR BOOTSTRAP, and the bundle carries it. Prime Intellect publishes no package
# sbx could ride, only an installer script, so `[packages]` names the runtime and the tools the
# agent looks up on PATH, and the install itself is the `provision` below — the one-time step sbx
# runs before the consuming app's `cmd`. Naming this bundle gets the agent, not just the hosts it
# reaches. What the app still owes is its own `cmd`: the installer writes into a prefix under the
# app's home, so the launch puts that prefix on PATH before exec'ing the agent (the step is a
# separate process, so nothing it exports survives into the command).
#
# UPGRADE. A bootstrap install rides no `[packages]` backend, so there is no lock to roll: what
# advances the agent is running its installer again, which always resolves the current release.
#     sbx app upgrade prime-agent
# re-runs this step in the app's cage with SBX_UPGRADE set, and the guard below yields to it. For
# one launch only: `sbx app run prime-agent --env PRIME_AGENT_SBX_UPDATE=1`. Auth, sessions and
# harness state live elsewhere in the app home and are untouched either way.
#
# FIELD ORDER MATTERS. The arrays come BEFORE the sub-tables: TOML reads a key after a
# `[table]` header as belonging to that table, so an `allow` written below `[…packages]` would
# silently become `packages.allow` — an unknown key, dropped without a word.

[bundle.prime-agent]
# The vendor installer, run once inside the cage. `pipefail` surfaces a failed `curl … | bash` as a
# clean install error rather than later as `prime-agent: not found`. Node and uv are already on PATH
# from `[packages]`, so the installer's interactive offers to install them are never reached; it
# still asks once, on a terminal, before installing ("Install? [Y/n]") — with no terminal it
# proceeds without asking. `PRIME_AGENT_BOOTSTRAP_KERNEL_ON_INSTALL` answers its SECOND question, so
# the Python kernel is prepared during the install rather than on the first use of the tool. It is
# `export`ed rather than written as a `VAR=1 curl …` prefix, which would bind to `curl` and never
# reach the shell reading the script.
#
# The guard is the step's own, and it must be: sbx runs a `provision` on every launch and does not
# remember that one succeeded. Keying it on the installed binary also self-heals — remove the prefix
# and the next launch installs again.
provision = [
    "bash",
    "-c",
    '''
set -eo pipefail
# `npm install -g` needs a writable prefix, and the nix node's own prefix lives in the read-only
# store, so the global install is pinned into the app's isolated home. The consuming app puts the
# same prefix on PATH for the launch.
export NPM_CONFIG_PREFIX="$HOME/.npm-global"
export PATH="$NPM_CONFIG_PREFIX/bin:$PATH"
# Guard on the VERSION, not merely on the binary's existence. The vendor publishes this agent as an
# npm package that is NOT on the public registry, so no sbx backend can pin it and this step is the
# only thing that advances it — and a guard that just asks "is it installed?" never fires again,
# leaving the agent at whatever the first launch fetched until someone runs a re-install by hand.
# Both halves of the comparison already exist: the release channel is a few bytes of text, and the
# installed version is in the package's own manifest.
#
# The channel is read through the SAME variable the vendor installer reads, so what this compares
# against is what an install would actually fetch.
served="$(curl -fsSL --max-time 10 "https://pub-728493de92a943e2a9b2d17b4719f318.r2.dev/${PRIME_AGENT_RELEASE_CHANNEL:-stable}" 2>/dev/null | tr -d '[:space:]' | sed 's/^v//' || true)"
installed="$(node -p "require('$NPM_CONFIG_PREFIX/lib/node_modules/prime-agent/package.json').version" 2>/dev/null || true)"
# One definition of "it moved", read by the condition below and by the line that explains it. An
# unreachable channel or an unreadable manifest leaves it EMPTY on purpose: a failed fetch is not
# evidence that anything moved, and treating it as one would re-download on every offline launch.
moved=""
if [ -n "$served" ] && [ -n "$installed" ] && [ "$served" != "$installed" ]; then
  moved="$installed -> $served"
fi
if [ ! -x "$NPM_CONFIG_PREFIX/bin/prime-agent" ] || [ -n "$moved" ] || [ -n "${SBX_UPGRADE:-}${PRIME_AGENT_SBX_UPDATE:-}" ]; then
  [ -z "$moved" ] || echo "prime-agent: the release channel moved ($moved) — re-installing …" >&2
  export PRIME_AGENT_BOOTSTRAP_KERNEL_ON_INSTALL=1
  curl -fsSL https://app.primeintellect.ai/prime-agent/install.sh | bash
fi
''',
]
allow = [
    # The installer script's host and the release bucket it pulls the build from.
    "{GET} https://app.primeintellect.ai",
    "{GET} https://pub-728493de92a943e2a9b2d17b4719f318.r2.dev",
    # What the agent installs at runtime: npm packages, and the wheels its Python kernel resolves.
    "@npm-registry",
    "@pypi",
]

[bundle.prime-agent.packages]
# The runtime the installer and the agent need, and the two tools the agent looks up on PATH
# before falling back to a download. The agent itself arrives through the profile's `cmd`.
nodejs = "nix:nodejs"
uv = "nix:uv"        # the Python kernel's resolver
git = "nix:git"      # called directly for repository state
ripgrep = "nix:ripgrep"
fd = "nix:fd"

[bundle.prime-agent.env]
# The agent's Node runtime reaches its endpoints through Node's built-in fetch (undici), which
# ignores http_proxy/https_proxy unless this is set — and in the empty netns a bypassed fetch
# dies with `EAI_AGAIN` before the proxy is ever consulted.
NODE_USE_ENV_PROXY = "1"
