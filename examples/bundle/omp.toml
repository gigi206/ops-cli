# `omp` — can1357's high-capability fork of Pi: what it needs to be installed and to reach its own services.
#
#   sbx bundle import examples/bundle/omp.toml
#   # then in an app profile:   use = ["omp"]
#
# Derived from `examples/app/omp.toml`, whose namesake profile now names this bundle in `use`
# (thin profile): the bundle is the single source of truth for the agent's packages, env and
# egress, while the app keeps its own command, posture and BYOK choices. A test pins the two
# artifacts together, so they cannot drift apart.
#
# It carries no `cmd` and no posture: the consuming app keeps its own command, network mode,
# `gui`/`gpu`/`audio`/`dbus`, limits and home scope. The egress entries below land in that app's
# OWN `[network]` table — an app that declares none gets a warning instead, because inventing one
# could move its posture.
#
# The single entry is the tool's own site. The MODEL host is BYOK and the profile leaves it
# commented (Anthropic, OpenRouter, OpenAI, xAI, …) — a bundle may only carry what its profile
# declares, so the consuming app opens its OWN provider host (and supplies the key). The
# `/collab` session relay (`my.omp.sh`) is refused by default and stays out of the bundle —
# an app that joins sessions adds it itself. The GitHub install traffic rides sbx's built-in
# nix-cache allow-set.
#
# FIELD ORDER MATTERS. The arrays come BEFORE the sub-tables: TOML reads a key after a
# `[table]` header as belonging to that table, so an `allow` written below `[…packages]` would
# silently become `packages.allow` — an unknown key, dropped without a word.

[bundle.omp]
allow = [
    "{GET} https://omp.sh",
]

[bundle.omp.packages]
omp = "mise:github:can1357/oh-my-pi"  # the single Bun-compiled standalone binary; glibc only
