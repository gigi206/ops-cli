# `agy` — Google's Antigravity CLI: what it needs to be installed and to reach its own services.
#
#   sbx bundle import examples/bundle/agy.toml
#   # then in an app profile:   use = ["agy"]
#
# Derived from `examples/app/agy.toml`, whose namesake profile now names this bundle in `use`
# (thin profile): the bundle is the single source of truth for the agent's packages, env and
# egress, while the app keeps its own command, posture and BYOK choices. A test pins the two
# artifacts together, so they cannot drift apart.
#
# The Google ACCOUNT sign-in hosts are NOT here — they are the account lane rather than this
# agent's, so they come from the shared `google-oauth` egress group (accounts.google.com,
# oauth2.googleapis.com, www.googleapis.com/oauth2/*, lh3.googleusercontent.com), which the
# consuming app names in its own [network] allow as `"@google-oauth"` — `examples/app/agy.toml`
# does exactly that, after `sbx net groups import examples/net-groups/google-oauth.toml`.
#
# It carries no `cmd` and no posture: the consuming app keeps its own command, network mode,
# `gui`/`gpu`/`audio`/`dbus`, limits and home scope. The egress entries below land in that app's
# OWN `[network]` table — an app that declares none gets a warning instead, because inventing one
# could move its posture.
#
# FIELD ORDER MATTERS. The arrays come BEFORE the sub-tables: TOML reads a key after a
# `[table]` header as belonging to that table, so an `allow` written below `[…packages]` would
# silently become `packages.allow` — an unknown key, dropped without a word.

allow = [
    # The agent's OWN product hosts. The Google account sign-in hosts (accounts.google.com,
    # oauth2.googleapis.com, www.googleapis.com/oauth2/*, lh3.googleusercontent.com) live in the
    # consuming app's own [network] allow, not here.
    "{GET} https://antigravity-cli-auto-updater-974169037036.us-central1.run.app",
    "{GET} https://antigravity.google",
    "{*} https://cloudcode-pa.googleapis.com",
    "{*} https://daily-cloudcode-pa.googleapis.com",
]
mute = [
    "play.googleapis.com",
    "antigravity-unleash.goog",
    "playwright.azureedge.net",
    "playwright-akamai.azureedge.net",
    "playwright-verizon.azureedge.net",
]

# The Google access token this agent holds is first sent to the account profile endpoint
# (`www.googleapis.com/oauth2/v2/userinfo`), then to its Cloud Code service, which the outbound
# tripwire reads as a leak unless the hosts are declared one service: without this group, every
# `daily-cloudcode-pa` call after the first is refused `outbound-secret` and `agy -p` stops at its
# eligibility check. The telemetry host `play.googleapis.com` stays out of the group and refused.
shared_credential = [[
    "www.googleapis.com",
    "cloudcode-pa.googleapis.com",
    "daily-cloudcode-pa.googleapis.com",
]]

[packages]
agy = "mise:aqua:google-antigravity/antigravity-cli"
