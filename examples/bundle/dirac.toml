# `dirac` — the Dirac CLI: what it needs to be installed, and the egress that install requires.
#
#   sbx bundle import examples/bundle/dirac.toml
#   # then in an app profile:   use = ["dirac"]
#   REQUIRES egress groups — import them once (they are shared, not per-agent):
#     sbx net groups import examples/net-groups/npm-audit.toml
#     sbx net groups import examples/net-groups/npm-registry.toml
#
# Derived from `examples/app/dirac.toml`, whose namesake profile now names this bundle in `use`
# (thin profile): the bundle is the single source of truth for the agent's packages, env and
# egress, while the app keeps its own command, posture and BYOK choices. A test pins the two
# artifacts together, so they cannot drift apart.
#
# It carries no `cmd` and no posture: the consuming app keeps its own command, network mode,
# `gui`/`gpu`/`audio`/`dbus`, limits and home scope.
#
# NO PROVIDER HOST, deliberately. Dirac is BYOK with no default provider, so the profile leaves every
# provider host commented for the user to choose — and a bundle may only carry what its profile
# declares. The consuming app therefore opens its OWN provider host (and supplies the key). What is
# here is the install lane plus the telemetry mutes, which are the same whatever model you point it at.
#
# `ripgrep` IS NOT PLUMBING. Dirac's search stack shells out to `rg`, and the npm dependency that
# would ship it is defeated by mise's `--ignore-scripts`; Dirac resolves the binary from PATH, so this
# `nix:` package is what makes its search work at all. It belongs to the tool, hence to the bundle.
#
# FIELD ORDER MATTERS. The arrays come BEFORE the sub-tables: TOML reads a key after a `[table]`
# header as belonging to that table, so an `allow` written below `[…packages]` would silently become
# `packages.allow` — an unknown key, dropped without a word.

[bundle.dirac]
allow = [
    "@npm-registry",
]
mute = [
    "dirac.run",
    "us.i.posthog.com",
    "us.posthog.com",
    "@npm-audit",
]

[bundle.dirac.packages]
nodejs = "nix:nodejs"          # Dirac is a node CLI
dirac = "mise:npm:dirac-cli"   # upstream's own npm scope
ripgrep = "nix:ripgrep"        # the agent's content search, resolved from PATH
