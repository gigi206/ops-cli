# `cursor-agent` — the Cursor Agent CLI: the tooling its bootstrap install needs, plus the hosts it reaches.
#
#   sbx bundle import examples/bundle/cursor-agent.toml
#   # then in an app profile:   use = ["cursor-agent"]
#
# Derived from `examples/app/cursor-agent.toml`, whose namesake profile names this bundle in `use` (thin
# profile): the bundle is the single source of truth for what this agent needs, while the profile
# keeps its own command, posture and credential choices. A test pins the two artifacts together,
# so they cannot drift apart.
#
# It carries no `cmd` and no posture: the consuming app keeps its own command, network mode,
# `gui`/`gpu`/`audio`/`dbus`, limits and home scope.
#
# THE AGENT IS A VENDOR BOOTSTRAP, and the bundle carries it. Cursor publishes no package sbx could
# ride, only an installer script, which is why `[packages]` names an archiver rather than the CLI:
# the download itself is the `provision` below, the one-time step sbx runs before the consuming
# app's `cmd`. Naming this bundle gets the agent. What the app still owes is its own `cmd`: the
# installer writes into the app's home, and a step is a separate process, so the launch is what puts
# that directory on PATH.
#
# UPGRADE. A bootstrap install rides no `[packages]` backend, so there is no lock to roll. The
# installer carries no update logic of its own either — it always downloads and overwrites with the
# version `cursor.com/install` currently serves — so re-running it IS the upgrade:
#     sbx app upgrade cursor-agent
# re-runs this step in the app's cage with SBX_UPGRADE set, and the guard below yields to it. For
# one launch only: `sbx app run cursor-agent --env CURSOR_AGENT_SBX_UPDATE=1`. The login lives
# elsewhere in the app home and is untouched either way.
#
# FIELD ORDER MATTERS. The arrays come BEFORE the sub-tables: TOML reads a key after a
# `[table]` header as belonging to that table, so an `allow` written below `[…packages]` would
# silently become `packages.allow` — an unknown key, dropped without a word.

[bundle.cursor-agent]
# Cursor's official installer, run once inside the cage — contained by bubblewrap + seccomp + the
# empty netns + the allowlist below — into the app's isolated home. `pipefail` makes a failed
# `curl … | bash` surface as a clean install error rather than later as `cursor-agent: not found`.
#
# The guard is the step's own, and it must be: sbx runs a `provision` on every launch and does not
# remember that one succeeded. Keying it on the installed binary also self-heals — remove it and the
# next launch installs again.
provision = [
    "bash",
    "-c",
    '''
set -eo pipefail
if [ ! -x "$HOME/.local/bin/cursor-agent" ] || [ -n "${SBX_UPGRADE:-}${CURSOR_AGENT_SBX_UPDATE:-}" ]; then
  curl https://cursor.com/install -fsS | bash
fi
''',
]
allow = [
    # The vendor site and its download host (the bootstrap fetch), then the agent's own backends.
    "{GET} https://cursor.com",
    "{GET} https://downloads.cursor.com",
    "{*} https://*.cursor.sh",
    # A git fetch of the Notion plugin over smart HTTP: github.com is already readable through sbx's
    # built-in set, so only the upload-pack POST is authorized, as the EXACT URL.
    "{POST} https://github.com/makenotion/cursor-notion-plugin/git-upload-pack",
    # The hosted Notion MCP connector.
    "{*} https://mcp.notion.com",
]

[bundle.cursor-agent.packages]
# What the bootstrap install unpacks with; the CLI itself arrives through the profile's `cmd`.
gnutar = "nix:gnutar"
gzip = "nix:gzip"

[bundle.cursor-agent.env]
# The CLI's Node runtime reaches its endpoints through Node's built-in fetch (undici), which
# ignores http_proxy/https_proxy unless this is set — and in the empty netns a bypassed fetch
# dies with `EAI_AGAIN` before the proxy is ever consulted.
NODE_USE_ENV_PROXY = "1"
