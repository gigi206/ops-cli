# `hermes` — NousResearch's Hermes agent: what it needs to be installed and to reach its own services.
#
#   sbx bundle import examples/bundle/hermes.toml
#   # then in an app profile:   use = ["hermes"]
#
# Derived from `examples/app/hermes.toml`, which stays the self-contained way to run this
# agent on its own (`sbx app import`, one step, nothing else needed). This bundle is for an app
# that EMBEDS the agent — an orchestrator spawning it as a subprocess — so that app states the
# requirement ONCE instead of copying it. A test pins the two artifacts together, so they cannot
# drift apart.
#
# It carries no `cmd` and no posture: the consuming app keeps its own command, network mode,
# `gui`/`gpu`/`audio`/`dbus`, limits and home scope. The egress entries below land in that app's
# OWN `[network]` table — an app that declares none gets a warning instead, because inventing one
# could move its posture.
#
# NOT carried, deliberately: `chromium`, `agent-browser` — that stack is only useful
# under a `gui` posture, which a bundle cannot set, and it is a large closure to pull in unasked.
# Add it to the consuming app together with its `gui` line if you want it.
#
# FIELD ORDER MATTERS. The arrays come BEFORE the sub-tables: TOML reads a key after a
# `[table]` header as belonging to that table, so an `allow` written below `[…packages]` would
# silently become `packages.allow` — an unknown key, dropped without a word.

[bundle.hermes]
allow = [
    "{*} https://openrouter.ai",
    "{*} https://portal.nousresearch.com",
    "{*} https://inference-api.nousresearch.com",
    "{*} https://hermes-agent.nousresearch.com",
    "{GET} https://models.dev",
    "{GET} https://*.petdex.dev",
    "{GET,HEAD} https://huggingface.co",
    "{GET,HEAD} https://*.xethub.hf.co",
    "{GET,WS} https://speech.platform.bing.com",
    "{GET} https://registry.npmjs.org",
]
mute = [
    "https://registry.npmjs.org/-/npm/v1/security/advisories/*",
]

[bundle.hermes.packages]
hermes = "flake:github:NousResearch/hermes-agent#default"
nodejs = "nix:nodejs"  # mise's npm backend needs a node runtime inside the cage

[bundle.hermes.env]
AGENT_BROWSER_ARGS = "--no-sandbox,--disable-dev-shm-usage"
