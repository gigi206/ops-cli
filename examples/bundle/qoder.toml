# `qoder` — the Qoder CLI: what it needs to be installed and to reach its own services.
#
#   sbx bundle import examples/bundle/qoder.toml
#   # then in an app profile:   use = ["qoder"]
#
# Derived from `examples/app/qoder.toml`, which stays the self-contained way to run this agent on its
# own (`sbx app import`, one step, nothing else needed). This bundle is for an app that EMBEDS the
# agent — an orchestrator spawning it as a subprocess — so that app states the requirement ONCE
# instead of copying it. A test pins the two artifacts together, so they cannot drift apart.
#
# It carries no `cmd` and no posture: the consuming app keeps its own command, network mode,
# `gui`/`gpu`/`audio`/`dbus`, limits and home scope.
#
# The egress here is the **GLOBAL** site. An app that runs the China edition (`QODER_SITE=CN`) opens
# the `*.qoder.com.cn` hosts itself — see the profile, which lists them commented.
#
# `ripgrep` IS NOT PLUMBING: Qoder's search shells out to `rg`, and the packaged copy is defeated by
# mise's `--ignore-scripts`. It resolves the binary from PATH, so this `nix:` package is what makes
# its search work. It belongs to the tool, hence to the bundle.
#
# FIELD ORDER MATTERS. The arrays come BEFORE the sub-tables: TOML reads a key after a `[table]`
# header as belonging to that table, so an `allow` written below `[…packages]` would silently become
# `packages.allow` — an unknown key, dropped without a word.

[bundle.qoder]
allow = [
    "{GET} https://registry.npmjs.org",
    "{*} https://api2.qoder.sh",
    "{*} https://openapi.qoder.sh",
    "{*} https://center.qoder.sh",
]
mute = [
    "{POST} https://registry.npmjs.org/-/npm/v1/security/advisories/*",
    "download.qoder.com",
]

[bundle.qoder.packages]
nodejs = "nix:nodejs"                  # the CLI is a JS bundle
qodercli = "mise:npm:@qoder-ai/qodercli"  # the vendor's own npm scope; the command is `qodercli`
ripgrep = "nix:ripgrep"                # its content search, resolved from PATH
