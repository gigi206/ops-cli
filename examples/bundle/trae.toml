# `trae` — ByteDance's Trae CLI: the install step its source checkout needs, plus the hosts it reaches.
#
#   sbx bundle import examples/bundle/trae.toml
#   # then in an app profile:   use = ["trae"]
#
#   REQUIRES egress groups — import them once (they are shared, not per-agent):
#     sbx net groups import examples/net-groups/github.toml
#     sbx net groups import examples/net-groups/pypi.toml
#
# Derived from `examples/app/trae.toml`, whose namesake profile names this bundle in `use` (thin
# profile): the bundle is the single source of truth for what this agent needs, while the profile
# keeps its own command, posture and credential choices. A test pins the two artifacts together,
# so they cannot drift apart.
#
# It carries no `cmd` and no posture: the consuming app keeps its own command, network mode,
# `gui`/`gpu`/`audio`/`dbus`, limits and home scope.
#
# `git` is already in sbx's base toolset, so the clone the `provision` below runs needs no package.
#
# FIELD ORDER MATTERS. The arrays come BEFORE the sub-tables: TOML reads a key after a
# `[table]` header as belonging to that table, so an `allow` written below `[…packages]` would
# silently become `packages.allow` — an unknown key, dropped without a word.

# The install step itself: Trae Agent is published as a source repository rather than a package, so
# what "installed" means here is a clone plus an isolated `uv tool install`, which puts `trae-cli`
# on PATH. That is why this bundle is complete where a package declaration alone could not be — and
# why it names `uv` and an interpreter rather than the agent.
#
# `uv tool install .` builds an ISOLATED environment, so the agent's dependencies never collide with
# anything else in the cage, and it is the upstream-recommended path (`uv sync --all-extras` works
# too but leaves nothing on PATH). The Python is pinned to 3.12 because the project's
# `pyproject.toml` requires `>=3.12`.
#
# The guard is the step's own, and it must be: sbx runs a `provision` on every launch and does not
# remember that one succeeded. Keying on the installed entry point also self-heals — remove the
# isolated home and the next launch clones and builds again. To move the checkout forward
# deliberately, roll it with `sbx app upgrade trae` (which raises SBX_UPGRADE for this app's
# install step), or ask for one launch only with `sbx app run trae --env TRAE_SBX_UPDATE=1`.
provision = [
    "bash",
    "-c",
    '''
set -eo pipefail
src="$HOME/.trae/src"
bin_link="$HOME/.local/bin/trae-cli"
venv="$HOME/.local/share/uv/tools/trae-agent"
repo_url="https://github.com/bytedance/trae-agent.git"
# The guard RUNS the tool's interpreter rather than testing the entry point. The tool's venv links
# its `bin/python` into the nix store, so an interpreter that moves — which is what `sbx upgrade nix`
# followed by a collection does — leaves `trae-cli` and its venv in place around a dead link: a guard
# keyed on `-x "$bin_link"` passes forever while every launch ends on "bad interpreter". Running it
# covers the absent, the half-created and the stale install at once.
if ! "$venv/bin/python" -c '' 2>/dev/null || [ -n "${SBX_UPGRADE:-}${TRAE_SBX_UPDATE:-}" ]; then
  # A stale venv is removed rather than repaired, and `--force` below lets the install replace the
  # entry point that venv leaves behind in `~/.local/bin`.
  rm -rf "$src" "$venv"
  git clone --depth 1 "$repo_url" "$src"
  cd "$src"
  # `--with docker --with pexpect --with unidiff`: upstream's start-up path imports these
  # unconditionally (`base_agent.py` → `docker_manager.py`) while declaring them only under the
  # `evaluation` extra, so a default install resolves and then dies at `ModuleNotFoundError` before
  # the CLI prints anything — measured, one module at a time. They are added individually rather
  # than through the extra, which would also drag `datasets`; the cage has no Docker to talk to
  # anyway, so what is needed is only that the imports succeed. Drop them once upstream makes that
  # import optional or moves the dependencies.
  #
  # `-c`: the checkout ships a `uv.lock`, and `uv tool install` reads none, resolving every unpinned
  # dependency to its newest release instead. Upstream pins `mcp` exactly but leaves `pydantic`
  # open, and a pydantic newer than the lock removed a private helper that pinned `mcp` imports,
  # so a fresh install dies at `ImportError` before the CLI prints anything. Exporting the lock as
  # constraints installs the versions upstream resolved and tested, extras included, so the three
  # `--with` modules land at their locked versions too.
  uv export --frozen --no-hashes --all-extras --no-emit-project --output-file "$src/.sbx-constraints.txt" >/dev/null
  uv tool install --force --python python3.12 -c "$src/.sbx-constraints.txt" --with docker --with pexpect --with unidiff .
fi
''',
]
allow = [
    # The clone, and the wheels `uv tool install` resolves. No provider host: Trae is BYOK across
    # many providers, so the consuming app opens the one it uses and supplies the key.
    "@github",
    "@pypi",
]

[packages]
# The install substrate; the CLI itself arrives through the `provision` above.
uv = "nix:uv"             # `uv tool install .` from the checkout
python = "nix:python312"  # the interpreter the project requires
