# `snow` — the Snow CLI: what it needs to be installed.
#
#   sbx bundle import examples/bundle/snow.toml
#   # then in an app profile:   use = ["snow"]
#
# Derived from `examples/app/snow.toml`, which stays the self-contained way to run this agent on its
# own (`sbx app import`, one step, nothing else needed). This bundle is for an app that EMBEDS the
# agent — an orchestrator spawning it as a subprocess — so that app states the requirement ONCE
# instead of copying it. A test pins the two artifacts together, so they cannot drift apart.
#
# It carries no `cmd` and no posture: the consuming app keeps its own command, network mode,
# `gui`/`gpu`/`audio`/`dbus`, limits and home scope.
#
# NO PROVIDER HOST, deliberately. Snow is BYOK with no default provider, so the profile leaves every
# provider host commented for the user to choose — and a bundle may only carry what its profile
# declares. The consuming app therefore opens its OWN provider host (and supplies the key). What is
# here is the install lane, which is the same whatever model you point it at.
#
# FIELD ORDER MATTERS. The arrays come BEFORE the sub-tables: TOML reads a key after a `[table]`
# header as belonging to that table, so an `allow` written below `[…packages]` would silently become
# `packages.allow` — an unknown key, dropped without a word.

[bundle.snow]
allow = [
    "{GET} https://registry.npmjs.org",
]
mute = [
    "{POST} https://registry.npmjs.org/-/npm/v1/security/advisories/*",
]

[bundle.snow.packages]
nodejs = "nix:nodejs"     # Snow is a node CLI
snow = "mise:npm:snow-ai" # the author's own npm package
