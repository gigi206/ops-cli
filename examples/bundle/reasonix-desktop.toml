# `reasonix-desktop` — the Reasonix desktop shell (an Electron app): what it needs to be installed
# and the host it reaches.
#
#   sbx bundle import examples/bundle/reasonix-desktop.toml
#   # then in an app profile:   use = ["reasonix-desktop"]
#
#   REQUIRES an egress group — import it once (it is shared, not per-agent):
#     sbx net groups import examples/net-groups/chromium-spellcheck.toml
#
# Derived from `examples/app/reasonix-desktop.toml`, whose namesake profile names this bundle in
# `use` (thin profile): the bundle is the single source of truth for the app's packages, env and
# egress, while the profile keeps its own command, posture and credential choices. A test pins the
# two artifacts together, so they cannot drift apart.
#
# It carries no `cmd` and no posture: the consuming app keeps its own command, network mode,
# `gui`/`gpu`/`audio`/`dbus`, limits and home scope. `dbus = true` matters more than usual here —
# the portal is what serves the desktop's light/dark scheme that this shell follows.
#
# WHY THERE IS NO `libs` LIST AND NO ENVIRONMENT. Earlier releases (this bundle was first written
# against `desktop-v1.20.0`) were a Wails app on WebKitGTK and needed both; `desktop-v1.39.0` is
# Electron (`resources/build.json` names Electron 44.2.0), and the resolver below always takes the
# newest `desktop-v*` release. The Chromium runtime it bundles is covered by the `deb:` backend's
# built-in library set, and the Go service it starts, `usr/bin/reasonix-desktop`, links only libc.
# The Electron flags it needs in a cage are in the profile's command.
#
# FIELD ORDER MATTERS. The arrays come BEFORE the sub-tables: TOML reads a key after a
# `[table]` header as belonging to that table, so an `allow` written below `[…packages]` would
# silently become `packages.allow` — an unknown key, dropped without a word.

allow = [
    # Chromium's spellcheck dictionary, through the shared lane (GET-only, path-scoped).
    "@chromium-spellcheck",
    # The provider host the shell POSTs completions to. The `deb:resolve` command and the build both
    # run HOST-SIDE, on the host network, so neither needs an entry.
    "{*} https://api.deepseek.com",
]
mute = [
    "crash.reasonix.io",  # the vendor's crash reporter, refused by construction
]

[packages]
reasonix-desktop = "deb:resolve"

# The `deb:resolve` command for the package above: print the newest `desktop-v*` release's `.deb`
# URL and nothing else. `jq` is in sbx's base toolset, so the resolver cage needs no extra package.
#
# ARCHITECTURE: amd64 only, and the resolver says so rather than fetching the wrong bytes. Upstream
# does build the desktop app for arm64, but publishes it there as a tarball and attaches the `.deb`
# for amd64 alone — and a `deb:` package cannot take a tarball. Moving the whole declaration to
# `tarball:` is what would open aarch64, at the cost of the dpkg unpacking and the autoPatchelf pass
# this backend performs; it is not done here because the amd64 `.deb` is what upstream tests.
[deb.reasonix-desktop]
resolve = [
    "sh",
    "-c",
    "case \"$(uname -m)\" in x86_64) ;; *) echo \"reasonix-desktop: upstream ships the .deb for amd64 only — its $(uname -m) build is a tarball, which this backend cannot take\" >&2; exit 1 ;; esac; curl -fsSL 'https://api.github.com/repos/esengine/DeepSeek-Reasonix/releases?per_page=30' | jq -r '[.[] | select(.tag_name | startswith(\"desktop-v\"))][0].assets[] | select(.name==\"Reasonix-linux-amd64.deb\") | .browser_download_url'",
]
