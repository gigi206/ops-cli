# `muse` — Meta's Muse CLI: the install step it needs, plus the hosts it reaches.
#
#   sbx bundle import examples/bundle/muse.toml
#   # then in an app profile:   use = ["muse"]
#
# Derived from `examples/app/muse.toml`, whose namesake profile names this bundle in `use` (thin
# profile): the bundle is the single source of truth for what this agent needs, while the profile
# keeps its own command, posture and credential choices. A test pins the two artifacts together,
# so they cannot drift apart.
#
# It carries no `cmd` and no posture: the consuming app keeps its own command, network mode,
# `gui`/`gpu`/`audio`/`dbus`, limits and home scope.
#
# THE AGENT IS A VENDOR BOOTSTRAP, and the bundle carries it. Meta publishes no package sbx could
# ride, only an installer script, which is why this bundle declares no `[packages]` at all: the
# download is the `provision` below, the one-time step sbx runs before the consuming app's `cmd`.
#
# What the app still owes is its own `cmd`, which here is the PATH export the launch needs. The
# CLI also resolves the local zone the FHS way; every cage carries the zone database and an
# `/etc/localtime` for that, so neither this bundle nor the profile has anything to arrange.
# Which zone is the user's `timezone` field, not an app's to choose.
#
# UPGRADE. A bootstrap install rides no `[packages]` backend, so there is no lock to roll: what
# advances the CLI is running its installer again, which always resolves the current channel.
#     sbx app upgrade muse
# re-runs this step in the app's cage with SBX_UPGRADE set, and the guard below yields to it. For
# one launch only: `sbx app run muse --env MUSE_SBX_UPDATE=1`.
#
# FIELD ORDER MATTERS. The arrays come BEFORE the sub-tables: TOML reads a key after a
# `[table]` header as belonging to that table, so an `allow` written below `[…env]` would
# silently become `env.allow` — an unknown key, dropped without a word.

[bundle.muse]
# Meta's official installer, run once inside the cage, so the per-project build that `mise:`
# backends automate is instead carried by the vendor's own script. `MUSE_INSTALL_DIR` pins the
# launcher to ~/.local/bin; `MUSE_NO_MODIFY_PATH=1` stops the installer from editing shell rc files
# (the consuming app exports PATH for the launch anyway). Both sit on the `bash` that runs the
# script, NOT in front of `curl`: an environment prefix binds to its own command, so on the left of
# the pipe the installer would see neither, and it would append its own PATH line to the isolated
# home's `~/.profile`.
#
# The guard is the step's own, and it must be: sbx runs a `provision` on every launch and does not
# remember that one succeeded. Keying it on the installed launcher also self-heals — remove it and
# the next launch installs again.
provision = [
    "bash",
    "-c",
    '''
set -eo pipefail
# Guard on the VERSION, not merely on the launcher's existence. The vendor installs a small launcher
# script beside a versioned payload (`muse-bin-<version>`), and its own `.muse-version` records which
# payload is active — so a guard keyed on the launcher stops firing after the first install while the
# payload stays where it was. Measured: a launcher dated 2026-08-06 was still running a 0.1.0-R708.1
# payload on 2026-09-04, when the channel had long served 1.0.2-R2040.1.
#
# The channel is read through the SAME variable the vendor launcher reads, so what this compares
# against is what an install would fetch. `grep`+`cut` rather than a JSON parser, because the cage
# carries no jq and the field is unambiguous: `min_version` cannot match a pattern that requires a
# quote immediately before `version`.
served="$(curl -fsSL --max-time 10 "${MUSE_CHANNEL_URL:-https://api.meta.ai/muse-code/channels/muse-stable}" 2>/dev/null | grep -oE '"version":"[^"]*"' | head -1 | cut -d'"' -f4 || true)"
installed="$(cat "$HOME/.local/bin/.muse-version" 2>/dev/null | tr -d '[:space:]' || true)"
# One definition of "it moved", read by the condition below and by the line that explains it. An
# unreachable channel or an unreadable version file leaves it EMPTY on purpose: a failed fetch is not
# evidence that anything moved, and treating it as one would re-download 263 MiB on every offline
# launch.
moved=""
if [ -n "$served" ] && [ -n "$installed" ] && [ "$served" != "$installed" ]; then
  moved="$installed -> $served"
fi
if [ ! -x "$HOME/.local/bin/muse" ] || [ -n "$moved" ] || [ -n "${SBX_UPGRADE:-}${MUSE_SBX_UPDATE:-}" ]; then
  [ -z "$moved" ] || echo "muse: the release channel moved ($moved) — re-installing …" >&2
  curl -fsSL https://dev.meta.ai/install.sh \
    | MUSE_INSTALL_DIR="$HOME/.local/bin" MUSE_NO_MODIFY_PATH=1 bash
fi
''',
]
allow = [
    # The release channel, the model API, the asset host and the account login.
    "{GET} https://dev.meta.ai",
    "{*}   https://api.meta.ai",
    "{GET}  https://lookaside.facebook.com",
    "{*}   https://auth.meta.com",
]

[bundle.muse.env]
# sbx owns upgrades, so tell the CLI not to replace itself behind the pin.
MUSE_NO_AUTO_UPDATE = "1"
