# `muse` — Meta's Muse CLI: the zone database it needs, plus the hosts it reaches.
#
#   sbx bundle import examples/bundle/muse.toml
#   # then in an app profile:   use = ["muse"]
#
# Derived from `examples/app/muse.toml`, whose namesake profile names this bundle in `use` (thin
# profile): the bundle is the single source of truth for what this agent needs, while the profile
# keeps its own command, posture and credential choices. A test pins the two artifacts together,
# so they cannot drift apart.
#
# It carries no `cmd` and no posture: the consuming app keeps its own command, network mode,
# `gui`/`gpu`/`audio`/`dbus`, limits and home scope.
#
# THE AGENT IS A VENDOR BOOTSTRAP, and the bundle carries it. Meta publishes no package sbx could
# ride, only an installer script, which is why `[packages]` names no CLI: the download is the
# `provision` below, the one-time step sbx runs before the consuming app's `cmd`. What `[packages]`
# does name is the zone database, because the tool reads local time and a cage ships none.
#
# What the app still owes is its own `cmd`, and here it is more than a PATH export: the cage's /etc
# is synthesized per launch, so the `/etc/localtime` links the CLI's cron store needs cannot be laid
# down by a step that exited. They live in `examples/app/muse.toml`, beside the launch they shape.
#
# UPGRADE. A bootstrap install rides no `[packages]` backend, so there is no lock to roll: what
# advances the CLI is running its installer again, which always resolves the current channel.
#     sbx app upgrade muse
# re-runs this step in the app's cage with SBX_UPGRADE set, and the guard below yields to it. For
# one launch only: `sbx app run muse --env MUSE_SBX_UPDATE=1`.
#
# FIELD ORDER MATTERS. The arrays come BEFORE the sub-tables: TOML reads a key after a
# `[table]` header as belonging to that table, so an `allow` written below `[…packages]` would
# silently become `packages.allow` — an unknown key, dropped without a word.

[bundle.muse]
# Meta's official installer, run once inside the cage, so the per-project build that `mise:`
# backends automate is instead carried by the vendor's own script. `MUSE_INSTALL_DIR` pins the
# launcher to ~/.local/bin; `MUSE_NO_MODIFY_PATH=1` stops the installer from editing shell rc files
# (the consuming app exports PATH for the launch anyway). Both sit on the `bash` that runs the
# script, NOT in front of `curl`: an environment prefix binds to its own command, so on the left of
# the pipe the installer would see neither, and it would append its own PATH line to the isolated
# home's `~/.profile`.
#
# The guard is the step's own, and it must be: sbx runs a `provision` on every launch and does not
# remember that one succeeded. Keying it on the installed launcher also self-heals — remove it and
# the next launch installs again.
provision = [
    "bash",
    "-c",
    '''
set -eo pipefail
if [ ! -x "$HOME/.local/bin/muse" ] || [ -n "${SBX_UPGRADE:-}${MUSE_SBX_UPDATE:-}" ]; then
  curl -fsSL https://dev.meta.ai/install.sh \
    | MUSE_INSTALL_DIR="$HOME/.local/bin" MUSE_NO_MODIFY_PATH=1 bash
fi
''',
]
allow = [
    # The release channel, the model API, the asset host and the account login.
    "{GET} https://dev.meta.ai",
    "{*}   https://api.meta.ai",
    "{GET}  https://lookaside.facebook.com",
    "{*}   https://auth.meta.com",
]

[bundle.muse.packages]
# The zone database the CLI reads; the tool itself arrives through the profile's `cmd`.
tzdata = "nix:tzdata"

[bundle.muse.env]
# sbx owns upgrades, so tell the CLI not to replace itself behind the pin.
MUSE_NO_AUTO_UPDATE = "1"
