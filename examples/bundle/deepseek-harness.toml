# `deepseek-harness` — DeepSeek's agent harness (`dsh`): what it needs to be installed and to reach
# its own service.
#
#   sbx bundle import examples/bundle/deepseek-harness.toml
#   # then in an app profile:   use = ["deepseek-harness"]
#
#   REQUIRES egress groups — import them once (they are shared, not per-agent):
#     sbx net groups import examples/net-groups/npm-registry.toml
#     sbx net groups import examples/net-groups/npm-audit.toml
#     sbx net groups import examples/net-groups/npm-jsr.toml
#
# Derived from `examples/app/deepseek-harness.toml`, whose namesake profile names this bundle in
# `use` (thin profile): the bundle is the single source of truth for the agent's packages, env and
# egress, while the app keeps its own command, posture and BYOK choices. A test pins the two
# artifacts together, so they cannot drift apart.
#
# It carries no `cmd` and no posture: the consuming app keeps its own command, network mode,
# `gui`/`gpu`/`audio`/`dbus`, limits and home scope. The egress entries below land in that app's
# OWN `[network]` table — an app that declares none gets a warning instead, because inventing one
# could move its posture.
#
# ONE PROVIDER HOST, and it is the agent's own. Unlike a BYOK-multi-provider agent, `dsh` ships a
# native DeepSeek route as its default (`deepseek-official`), and its `web_search` tool calls a
# second endpoint on that same host, so `api.deepseek.com` is a requirement of the agent rather
# than a user's choice of provider. The KEY is not here: the consuming app supplies it, because
# whether it arrives as an in-cage placeholder the egress proxy replaces or as a key stored inside
# the cage is a posture decision, not a package one.
#
# THE NODE IS PART OF THE INSTALL. dsh's boot reaches Node's internal module loader through the
# native addon `node-addon-require-builtin`, which locates it by recognizing the machine code of one
# compiled V8 getter, and it recognizes the code of the official Node.js builds only. On nixpkgs'
# node it fails with `Unsupported/no-getter`, and dsh has no other route to the loader, so it dies at
# boot. The bundle therefore names the official build, which mise installs from `nodejs.org`. Every
# native piece of dsh's closure — that addon, the Landlock runner, ripgrep and `node-pty` — arrives
# as a platform prebuild mise places even under `--ignore-scripts`, so nothing is compiled in the
# cage and the bundle carries no toolchain.
#
# FIELD ORDER MATTERS. The arrays come BEFORE the sub-tables: TOML reads a key after a
# `[table]` header as belonging to that table, so an `allow` written below `[…packages]` would
# silently become `packages.allow` — an unknown key, dropped without a word.

allow = [
    # Install-time (mise's npm backend): the packument, the dsh tarballs, and the platform
    # packages carrying the native binaries — the shared `@npm-registry` group.
    "@npm-registry",
    # Install-time (mise's node backend): the official Node.js release tarball and the
    # `SHASUMS256.txt` it is checked against. Read-only.
    "{GET} https://nodejs.org/dist/*",
    # Runtime: chat completions and the `web_search` tool's `/anthropic/v1` endpoint, one host,
    # opened to every verb because both are POSTed.
    "{*} https://api.deepseek.com",
]
mute = [
    "@npm-audit",  # npm's audit endpoint: POSTed by the install, irrelevant to whether it succeeded
    "@npm-jsr",  # the JSR mirror the resolver probes: nothing here is installed from it
]

# THE VENDOR PUBLISHES FASTER THAN mise's FRESHNESS DELAY, so the package resolves to no version
# and neither the first launch's equip nor `sbx app upgrade deepseek-harness` can proceed. The
# consuming app's command is downstream of that: it starts with `mise where` under `set -eu`, so it
# fails at its first line whenever the package is not installed. Naming the package here lifts the delay
# for it alone, at the cost of accepting a build this vendor published moments ago.
# THE TRIGGER THAT REMOVES THE LINE: `dsh` starts publishing at a cadence slower than the delay,
# which for a package still on `-rc` tags most likely means its first stable release.
accepts_fresh_releases = ["dsh"]

[packages]
dsh = "mise:npm:@deepseek-ai/dsh"  # the harness itself, from npm
# The OFFICIAL Node.js build, not nixpkgs' one (see the header). `lts` follows Node's long-term
# support line, which stays inside both dsh's `engines` (`>=24.9`) and the range the native addon is
# built and tested for (Node 20 to 26), and mise rolls it forward with the rest of the app.
nodejs = "mise:node@lts"           # runs dsh and performs its npm install

[env]
# mise picks the client that performs an `npm:` install itself (`npm.package_manager = "auto"`), and
# the one it picks refuses this package: the install ends in `aube install failed: user aborted
# `mise add @deepseek-ai/dsh``, with no prompt a caller could answer. The reference client installs
# it without complaint, so this bundle names it rather than leaving the choice to be made for it.
#
# Scoped to this bundle on purpose. The setting governs every `npm:` package in a cage, and every
# other one sbx ships installs fine under the default; the cage this bundle builds carries exactly
# one npm package, so naming the client here changes nothing else. Measured cost on a package that
# works either way: 22 s instead of 18 s, once, when the app home is first filled.
#
# THE TRIGGER THAT REMOVES THIS: the default client installs `@deepseek-ai/dsh` without aborting.
MISE_NPM_PACKAGE_MANAGER = "npm"
