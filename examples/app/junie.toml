# Junie — JetBrains' LLM-agnostic coding agent (the CLI), sandboxed by sbx.
#
#   sbx app import examples/app/junie.toml
#   sbx app run junie
#
# THIS PROFILE IS NOT SELF-CONTAINED, on purpose. The agent's package and hosts come from a shared
# BUNDLE, so import it too:
#     sbx bundle import examples/bundle/junie.toml
#     sbx app import    examples/app/junie.toml
# One extra step, and it buys the thing that was actually broken here: a hand-copy of an agent's
# requirements silently falls behind the agent.
#
#   EGRESS GROUPS — shared lanes, imported once (shared, not per-agent):
#     sbx net groups import examples/net-groups/npm-registry.toml
#     sbx net groups import examples/net-groups/npm-audit.toml
#
# JetBrains publishes Junie from its own npm scope (`@jetbrains/junie`) — but that package is only
# a SHIM: its `postinstall` downloads the real build (a ~260 MB zip of a JVM application with a
# bundled JetBrains Runtime) from `github.com/JetBrains/junie/releases`, installs a launcher shim
# at `~/.local/bin/junie`, and keeps versions under `~/.local/share/junie/` — all inside the app's
# persistent isolated home here. `sbx upgrade mise` rolls the shim package; the shim itself
# manages its own release channels afterwards (`junie --eap`, `--nightly`, …).
#
# WHY THE BUNDLE CARRIES AN INSTALL STEP. mise's npm backend installs with
# `--ignore-scripts=true` — a deliberate security default: it will not run arbitrary package
# scripts — so the vendor's postinstall never runs and a plain `junie` exits with
# "[Junie] Shim not found at …". The `junie` bundle declares that vendor script as its `provision`,
# and sbx runs it before this command, in this cage; the step's own guard (the shim's existence in
# the persistent home) is what keeps it to once, and the extraction is pure JavaScript (the package
# bundles `yauzl`), so the cage needs no `unzip`. (`mise where` accepts a SCOPED package name and
# answers with the install directory; what sits under it is not fixed — both
# `lib/node_modules/<scope>/<name>` and `node_modules/<scope>/<name>` have shipped — so the step
# finds the one that is present rather than naming one.)
#
# THE CAVEAT THAT WAS: the build Junie downloads at runtime is a JVM application sbx never patches
# (unlike a `nix:`/`deb:`/`tarball:` package, autoPatchelf'd host-side), running through the cage's
# `nix-ld` shim. That is now measured rather than feared — the install completes in-cage and
# `junie --version` answers `26.8.10 (2651.6)`. Getting there took two fixes, both in the bundle:
# the vendor's postinstall downloads with Node's `fetch`, which ignores the proxy without
# `NODE_USE_ENV_PROXY` (it died on `EAI_AGAIN github.com`), and its install step must be guarded on
# a version's CONTENTS — the script writes the shim and creates `versions/<v>/` before downloading
# into it, so a failed download leaves both behind and any guard keyed on them never retries.
#
# CREDENTIAL POSTURE — three ways in, per JetBrains' own docs:
#   - a **JetBrains account** (OAuth in a browser — the hermetic cage has none, so complete it on
#     your host, or run the flow in-cage with a Chromium as `examples/app/vibe.toml` shows);
#   - a **Junie API key** from junie.jetbrains.com/cli, read from `JUNIE_API_KEY` — pass it per
#     launch (`sbx app run junie --env JUNIE_API_KEY=…`) or inject it host-side (the commented
#     `[env]` + `[secret]` blocks below);
#   - **BYOK** against your own provider (Anthropic, OpenAI, Google, xAI, OpenRouter): add that
#     provider's host to `allow` and its key the same way the BYOK profiles do (see `cline.toml`).
#
# UNVERIFIED (like every profile until run with a real account): the live authentication and the
# model traffic through sbx's MITM. The runtime download and the JVM launch under nix-ld are not
# among them any more — both were exercised in a cage.
# Grounded here: the packaging and its postinstall trap (read out of the published package and the
# vendor installer), the auth methods (JetBrains' README + CLI docs), and the JetBrains hosts (read
# out of the shipped application).
cmd = "junie"

# Your host Junie install/config, mounted read-write at its real absolute path. `binds` is a
# security field, honored only because this profile lives in your trusted config dir; `mode = "rw"`
# lets the caged `junie` read and write these host files. Uncomment to share your host Junie setup
# with the cage instead of the app's isolated home (the default) — which also skips the download,
# since the shim and versions already exist there.
#binds = [
#    { path = "~/.local/share/junie", mode = "rw" },
#]

# --- The agent's requirements come from its bundle ------------------------------------------------
# `use` pulls in the `junie` BUNDLE — the package(s), the hosts it must reach, and its mutes — from
# one declaration shared with the bundle file itself, so this profile cannot fall behind when the
# agent's requirements change — including the install step that turns the shim into a working
# agent, which sbx runs before `cmd`. The bundle is COMPLETE: an app that names it gets the agent.
#
# IMPORT THE BUNDLE FIRST — it is not in this file:
#     sbx bundle import examples/bundle/junie.toml
# Without it the launch warns that the bundle is undeclared and the agent is simply absent.
use = ["junie"]

# No `[packages]` here: the agent's packages come from its bundle — see `use` above.

# An app is read-by-default ({GET,HEAD}); the AI service carries POSTs, so the bundle opens it to
# all verbs. This table stays: the bundle's egress entries land in the consuming app's OWN
# `[network]` table, and an app that declares none gets a warning rather than an invented posture.
# Check what the bundle adds with `sbx bundle junie`, and what the launch ends up with via
# `sbx config show --app junie`.
[network]
mode = "deny"
allow = [
    # The install lane, the JetBrains distribution host, the AI service and the account login all
    # arrive with the bundle. BYOK instead: uncomment the ONE provider you use (and supply its key
    # as `cline.toml` shows).
    #"{*} https://api.anthropic.com",
    #"{*} https://api.openai.com",
    #"{*} https://openrouter.ai",
]

# --- Junie API key (commented) — the in-cage placeholder lets the CLI start and issue its request;
# the proxy strips it and substitutes the real key, read on the HOST (as $JUNIE_API_KEY, or via a
# resolver such as sops://secrets.yaml#junie), on the wire to the AI service. The bearer form is
# the standard one for this API; confirm against `sbx net logs -a junie` on your first real run. ---
#[env]
#JUNIE_API_KEY = "sbx-placeholder-replaced-by-the-egress-proxy"

#[secret."api.jetbrains.ai"]
#from = "env://JUNIE_API_KEY"
#header = "Authorization"
#type = "bearer"
