# Claude Desktop — Anthropic's official desktop app (Chat + Cowork + Code), sandboxed by sbx.
#
#   sbx bundle import examples/bundle/claude-desktop.toml
#   sbx app import    examples/app/claude-desktop.toml
#   sbx app run claude-desktop
#
# THIS PROFILE IS NOT SELF-CONTAINED, on purpose. The app's `.deb`, the sign-in browser, the
# environment it reads and the hosts it reaches come from a shared BUNDLE, so import it too:
#     sbx bundle import examples/bundle/claude-desktop.toml
#     sbx app import    examples/app/claude-desktop.toml
# One extra step, and it buys the thing that was actually broken here: a hand-copy of an app's
# requirements silently falls behind the app.
#
#   EGRESS GROUPS — shared lanes, imported once (shared, not per-agent):
#     sbx net groups import examples/net-groups/chromium-background.toml
#
# This is the GRAPHICAL app whose **Code** tab runs the same Claude Code engine as the
# `claude-code` CLI profile (its terminal sibling), plus the Chat and Cowork tabs, parallel
# sessions, visual diff review, and an integrated terminal + editor. Anthropic ships an official
# **Linux beta** (Ubuntu 22.04+/Debian 12+, x86_64/arm64) as a `.deb`; the docs live on the Claude
# Code docs site (code.claude.com/docs/en/desktop-linux). Neither a `.deb` nor the apt repo installs
# in the hermetic cage, so sbx packages it with the `deb:` backend.
#
# THE `deb:` BACKEND. sbx fetches Anthropic's prebuilt `.deb` directly, resolves it to a content
# hash (pinned in the per-project deb lock), and builds a generated derivation that `dpkg-deb -x`-
# unpacks it and `autoPatchelfHook`s the Electron binaries against a curated library set — no apt,
# no maintainer scripts, no from-source build. The build is HOST-SIDE (like `nix:`), safe because a
# `.deb` runs no build script; the result is seeded into the store and offline-reusable. FIRST
# LAUNCH resolves + builds it, pulling the Electron closure (~145 MiB `.deb` plus its runtime
# closure — a couple of minutes, over your host network, NOT the cage allowlist). Later launches
# reuse the pinned build offline.
#
# VERSIONS — tracked automatically. Anthropic's apt pool has **no "latest" URL** (each `.deb` is
# version-stamped `claude-desktop_<ver>_amd64.deb`), so instead of hand-pinning one version this
# profile uses the `deb:apt:` backend pointed at the pool's `Packages` index: sbx reads the index,
# picks the **newest** version's `.deb`, and pins it per project on first launch. `sbx upgrade deb`
# re-reads the index and **rolls forward** to the newest — no manual URL bump. (sbx does no GPG/
# InRelease signature check and expects this single-application pool — the same TLS-plus-unpack trust
# level as a direct `deb:` URL.) ARCH: the index below is `binary-amd64` (x86_64); on arm64 point it
# at `.../binary-arm64/Packages` instead.
#
# CA TRUST (why `--use-system-ca`). Under the allowlist sbx runs a TLS-terminating proxy with a
# per-session CA. Electron/Chromium ignores the CA-file env vars sbx sets and trusts its own NSS
# database (`~/.pki/nssdb`), so a Chromium app would otherwise fail every HTTPS with
# `ERR_CERT_AUTHORITY_INVALID`. For a `gui = "wayland"` cage under a filtering posture, sbx seeds
# its MITM CA into the cage's NSS db automatically (part of the GUI hole, like fonts) — no per-
# profile shim needed. The app only has to be told to consult that store, hence `--use-system-ca`.
# (The bundled Claude Code engine in the Code tab is Node-based and DOES honour sbx's CA-file env
# vars, so it needs no extra help.)
#
# DISPLAY + GPU + AUDIO + DBUS — `gui = "wayland"` binds the host Wayland
# socket (read-only) and provisions fonts so the window maps (X11 is never offered; isolation is
# compositor-dependent — Mutter/GNOME is safe, wlroots exposes screen-capture/input-injection, see
# docs-site/docs/guide/configuration/gui.md). `gpu = true` opens hardware-accelerated rendering (mesa's
# drivers into sbx's store + the `/dev/dri` render node + the minimal `/sys` DRM subtree); without
# it a Chromium/Electron app on Wayland often produces no buffer and no window maps. mesa covers
# Intel/AMD/nouveau; an NVIDIA-only machine falls back to software (still renders, slower).
# `audio = true` provisions the PulseAudio client library (`libpulse.so.0`, absent from the app's
# own closure, which carries only ALSA) and binds the host PulseAudio socket into the cage, so the
# microphone and sound work (voice input). It is trusted-only because the PulseAudio bus exposes the
# microphone AND every system-audio `.monitor` source (recording all host output), see
# docs-site/docs/guide/configuration/audio.md.
# `dbus = true` gives the cage its OWN private desktop portal (a `dbus-daemon` +
# `xdg-desktop-portal` with the reference GTK backend, all in-cage), so the app's FILE CHOOSER opens
# IN-CAGE and lists only the cage filesystem (a host-privileged file manager over the host bus would
# never be summonable from the cage). It also seeds your host light/dark theme at launch and follows
# it live, and a host-side relay bridges `org.freedesktop.Notifications` so desktop notifications
# work — while the login keyring (`org.freedesktop.secrets`) stays absent. The Electron flags: `--no-sandbox` is
# mandatory and acceptable (bubblewrap + seccomp + the empty netns IS the boundary, replacing
# Chromium's own redundant sandbox); `--ozone-platform=wayland` selects the Wayland backend;
# `--disable-dev-shm-usage` avoids the small cage `/dev/shm`.
#
# CREDENTIAL POSTURE — account / OAuth, NOT a header-injectable API key. Claude Desktop signs in
# with your **claude.ai subscription or your organization's SSO**; the docs are explicit that
# "Desktop doesn't accept a Claude Console API key directly" (use the `claude-code` CLI profile for
# API-key BYOK). There is therefore no HTTP header for sbx's `[secret]` broker to strip-and-inject,
# and this profile ships **no `[secret]` block** (contrast the BYOK profiles). You log in ONCE inside
# the cage; the token then persists in the app's dedicated, persistent, isolated home. The sandbox +
# the egress allowlist still bound everything the agent can reach.
#
# CAVEATS (honest, learned from live runs):
#   * LOGIN — both email and Google work. "Continue with email" (Claude emails a code you type into
#     the window) is the simplest: it stays in the app's own webview and needs nothing extra.
#     "Continue with Google" opens the consent in the IN-CAGE Chromium (via `shell.openExternal` ->
#     the `[open]` routing below); Google then redirects to the deep-link
#     `claude://login/google-auth?code=…&anon_id=…`, which Chromium hands to the running claude-desktop
#     (Electron single-instance), and the app completes the login — the `anon_id` is the app's own
#     cross-session bridge, so the browser's cookie jar is NOT the channel (a common misconception).
#     The browser MUST be in-cage: a HOST browser's `claude://` would find no claude-desktop on the
#     host. The `cmd` writes a Chromium managed policy so that deep-link opens with no
#     confirmation dialog. Google is the heavier path (it pulls Chromium); if you only ever use
#     email, drop the `[open]` table + the `chromium` package, and the `cmd` with them.
#   * Quitting — a single Ctrl+C does nothing (a GUI Electron app ignores SIGINT) and closing the
#     window does NOT quit (Claude Desktop is a tray/background app and the cage exposes no tray). Press
#     **Ctrl+C twice within 2s** to force-quit the session (sbx terminates the cage), or `sbx session stop <id>`
#     from another terminal. The launch prints the hint.
#   * Credential persistence — the app may want the system keyring (Secret Service / dbus), which the
#     hermetic cage does not provide, and should fall back to a file under the isolated home. Confirm
#     the login survives a relaunch.
#   * `deb:` build — PROVEN host-side (the `.deb` unpacks, autoPatchelfs, and wraps its launcher). Two
#     sbx-core fixes made it work and now benefit every Electron `deb:` app: the extraction drops the
#     setuid bit on Chromium's `chrome-sandbox` (an unprivileged nix builder cannot set setuid), and
#     the curated lib set gained `libseccomp`/`libcap_ng` (wanted by the Cowork `virtiofsd` helper).
#     The app RUNS the build; whether every tab (Chat/Cowork/Code) is fully functional in the cage —
#     Cowork's VM helper in particular needs KVM the cage does not grant — is for your live session.
#
# If a request is refused, the proxy names the host — watch `sbx net logs -a claude-desktop` and add
# it below (or check ahead with `sbx test net <url>`).
# The `[open]` table below is what makes "Continue with Google" work IN the cage. Why: the app opens
# the Google consent with Electron's `shell.openExternal`, and expects the OAuth result back as the
# deep-link `claude://login/google-auth?code=…&anon_id=…`, which Electron's single-instance mechanism
# delivers to the already-running app. So http(s) is routed to an IN-CAGE Chromium for the consent and
# `claude` back to claude-desktop, and the whole flow closes inside the sandbox. The command stays a
# small bash wrapper for the one thing a declaration cannot express: a Chromium managed policy so
# Chromium follows the `claude://`
# redirect with no "open external app?" confirmation dialog (without it the code never reaches the app
# and the login silently fails — the real bug behind "the browser signed in but the app didn't").
# A HOST browser cannot do this: its `claude://` would find no claude-desktop installed on the host.
# Chromium gets the cage flags (`--no-sandbox` since bwrap+seccomp is the boundary; Wayland; the file
# password store), and trusts the egress MITM CA because sbx seeds it into the shared `~/.pki/nssdb`
# (catrust). You can also just sign in with EMAIL — that stays in the app's webview and needs none of
# this (see the header).
#
# `--password-store=basic` (on both the app and Chromium): Chromium normally encrypts its session
# cookie with a key from the OS keyring (Secret Service, over dbus), which the cage's private bus does
# not expose — so without it the cookie cannot be re-decrypted next launch and you are logged out.
# `basic` forces the file store in the isolated $HOME (a weak fixed key — acceptable: the token already
# lives only in the per-app isolated cage home, never the project shell).
cmd = [
    "bash",
    "-c",
    '''
# Chromium managed policy: auto-launch the `claude://` deep-link (the Google-login callback) with no
# confirmation dialog, else the code never reaches the app and login silently fails. /etc is a
# writable cage tmpfs; Chromium reads /etc/chromium/policies/managed/. (Full rationale in the header.)
mkdir -p /etc/chromium/policies/managed 2>/dev/null && cat > /etc/chromium/policies/managed/sbx-claude-protocol.json <<'POLICY'
{"AutoLaunchProtocolsFromOrigins":[{"allowed_origins":["*"],"protocol":"claude"}]}
POLICY


exec claude-desktop --no-sandbox --ozone-platform=wayland --disable-dev-shm-usage \
    --use-system-ca --password-store=basic "$@"
''',
]

gui = "wayland"
gpu = true
audio = true
dbus = true

# Your host Claude Desktop config/login, mounted read-write at its real absolute path (so the caged
# app shares your host login/state). `binds` is a security field, honored only because this profile
# lives in your trusted config dir. Uncomment to share your host setup with the cage instead of the
# app's isolated home (the default). The exact config paths are UNCONFIRMED for the Linux beta —
# verify with a real run before relying on them.
#binds = [
#    { path = "~/.config/Claude", mode = "rw" },
#]

# --- The app's requirements come from its bundle --------------------------------------------------
# `use` pulls in the `claude-desktop` BUNDLE — the tracked `.deb`, the sign-in Chromium, the
# telemetry opt-outs and every host the app reaches — from one declaration shared with the bundle
# file itself, so this profile cannot fall behind when the app's requirements change. What the
# bundle may never carry is posture: the `gui`/`gpu`/`audio`/`dbus` grants and the sign-in preamble
# in `cmd` stay here.
#
# THE BUNDLE IS NOT IN THIS FILE — import it too, in either order:
#     sbx bundle import examples/bundle/claude-desktop.toml
# Without it the launch warns that the bundle is undeclared and the app is simply absent.
use = ["claude-desktop"]

# No `[packages]` here: the app's packages come from its bundle — see `use` above.

# The API/auth/MCP hosts carry request bodies, so each is opened to all verbs with `{*}`; a
# pure-download host is scoped to `{GET}` (least privilege — no HEAD, the app never issues one).
# Grounded on Anthropic's documented "Network access requirements" (code.claude.com/docs/en/network-
# config). `raw.githubusercontent.com` (changelog / plugin marketplace) is already covered by sbx's
# built-in nix-cache/github allow-set, so it is not repeated here.
# Where a link opens, declared rather than scripted. `http`/`https` go to the in-cage Chromium for
# the web auth (Google consent, the device re-verification page); `claude` is the OAuth callback the
# provider redirects to, which must reach the desktop app. One declaration covers both ways a link
# is opened — a tool calling `xdg-open` and an Electron app calling the portal under `dbus = true` —
# and sbx freezes the routing, so nothing running in the cage can answer a sign-in link instead.
#
# Must stay below every top-level key: written above one, TOML would fold that key into this table.
[open]
http = ["chromium", "--no-sandbox", "--ozone-platform=wayland", "--password-store=basic", "--no-first-run", "--no-default-browser-check"]
https = ["chromium", "--no-sandbox", "--ozone-platform=wayland", "--password-store=basic", "--no-first-run", "--no-default-browser-check"]
claude = ["claude-desktop", "--no-sandbox", "--ozone-platform=wayland", "--disable-dev-shm-usage"]

[network]
mode = "deny"
allow = [
    # The Anthropic API and account hosts, the UI asset hosts, the MCP proxy, the artifact domain
    # and the Google Sign-In chain all arrive with the `claude-desktop` bundle (`use` above) and are
    # unioned into this list at resolution — inspect them with `sbx bundle claude-desktop`, and see
    # the launch's own view with `sbx config show --app claude-desktop`.
    #
    # Enterprise routing — if your org routes Desktop to Google Vertex, Bedrock, Microsoft Foundry,
    # or an LLM gateway, model traffic goes THERE instead of the hosts above; add that host and see
    # the enterprise network-config docs.
]
# Silence the denied telemetry so `sbx net logs` reads clean: the app POSTs crash/usage envelopes to
# Sentry and feature-flag/analytics to Statsig, both already refused (`denied-default`). `mute` keeps
# those refusals out of the default log (still denied, still counted in `sbx net stats`; see them with
# `--all`). Add any other refused telemetry host you spot in the log — a `mute` never opens egress.
mute = [
    # Nothing here: the Sentry/Statsig/Datadog envelopes, the Intercom widget, the Segment and
    # first-party metrics endpoints, `@chromium-background` and the Google account-bar hosts all
    # arrive with the bundle and are unioned in at resolution.
]

# No `[env]` table here: the telemetry opt-outs that cut Claude Code's non-essential traffic at the
# source ride the bundle with the package that reads them — see `sbx bundle claude-desktop`.
