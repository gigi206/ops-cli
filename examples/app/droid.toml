# Droid — Factory's terminal coding agent (factory.ai), sandboxed by sbx.
#
#   sbx bundle import examples/bundle/droid.toml
#   sbx app import examples/app/droid.toml
#   sbx app run droid
#
# THIS PROFILE IS NOT SELF-CONTAINED, on purpose. The agent's package and hosts come from a shared
# BUNDLE, so import it too:
#     sbx bundle import examples/bundle/droid.toml
#     sbx app import examples/app/droid.toml
# One extra step, and it buys the thing that was actually broken here: a hand-copy of an agent's
# requirements silently falls behind the agent.
#
# Droid ships a genuine terminal CLI on npm (the `droid` package), distributed as a
# self-contained native binary resolved through a platform-specific optional dependency
# — so sbx equips it in-cage with a node runtime (for the npm install) plus mise's npm
# backend. The native binary needs no node at runtime; the install fetches it from
# registry.npmjs.org, so the first launch in a project needs the network and the allowlist
# below.
#
# CREDENTIAL POSTURE — account-centric (like the freebuff profile), NOT a header-injectable
# provider key. Droid authenticates to a Factory ACCOUNT: an interactive launch logs in, and
# the headless path (`droid exec`) reads a Factory account key `FACTORY_API_KEY` (format
# `fk-…`, generated at app.factory.ai/settings/api-keys). There is no documented per-provider
# env var that Droid reads on its own, so sbx does not inject a header here. Instead the
# account credential persists in the app's dedicated, persistent, isolated home (`~/.factory/`),
# never bleeding into the project shell or another app:
#
#   sbx app run droid        # then log in interactively (the token persists in the isolated home)
#
# Headless use (`droid exec`) reads `FACTORY_API_KEY` from the environment, and the [secret]
# broker injects an HTTP header on the wire, not an env var, so this profile ships no key and no
# [env]. For unattended use, pass the key for a single launch, accepting that it then lives in the
# cage env:
#     sbx app run droid --env FACTORY_API_KEY=… -- exec "<task>"
# (`--env` is an authoritative one-shot override read on the HOST; the value reaches the cage env
# for that launch only, so the key never lands in the committed profile. `$SBX_ENV_FACTORY_API_KEY`
# works too.) The shipped default is the interactive login above. Either way the sandbox
# + the egress allowlist bound everything Droid can reach.
#
# BYOK (optional): Droid can talk DIRECTLY to a model provider instead of Factory's gateway by
# adding a `customModels` entry to `~/.factory/settings.json` (its apiKey may reference an env
# var via `${VAR}`). If you do that, add the provider host to `allow` below — e.g.
# `openrouter.ai`, `api.anthropic.com`, or `api.openai.com`.
#
# If a request is blocked, the proxy reports the host it refused — add it to `allow` (or check
# ahead with `sbx test net <url>`).
cmd = "droid"

# The cage's summary (/opt/sbx/contract-summary.md: what it may reach, which files it protects, which
# operations it offers) appended to Droid's system prompt, so a refused host or a read-only file reads
# as the sandbox rather than as a fault to work around. sbx places the option right after `cmd`,
# which Droid honors for its interactive session. `droid exec` ignores an option given before the
# subcommand without a word, so a headless run carries the summary only when you pass it again after
# `exec`:
#     sbx app run droid -- exec --append-system-prompt-file /opt/sbx/contract-summary.md "your task"
# Both the interactive and that `exec` form were checked in the request Droid sends to its model;
# whether the model then acts on it was not measured. Bound to this `cmd`: a project that sets its
# own `cmd` for this app writes its own `contract`, or has none.
contract = { arg = "--append-system-prompt-file" }

# Your host Droid config, mounted read-write at its real absolute path. `binds` is a security
# field, honored only because this profile lives in your trusted config dir; `mode = "rw"` lets
# the caged `droid` read and write these host files (Factory login, settings.json). Uncommented,
# the bind appears at that host path and not under the cage's `$HOME` (`/home/sandbox`), so the
# app keeps its isolated home and reaches these files only by their absolute path.
#binds = [
#    { path = "~/.factory", mode = "rw" },
#]

# --- The agent's requirements come from its bundle ------------------------------------------------
# `use` pulls in the `droid` BUNDLE — the package(s), the environment it reads, the hosts it must
# reach, and its telemetry mutes — from one declaration shared with the bundle file itself, so this
# profile cannot fall behind when the agent's requirements change.
#
# THE BUNDLE IS NOT IN THIS FILE — import it too, in either order:
#     sbx bundle import examples/bundle/droid.toml
# Without it the launch warns that the bundle is undeclared and the agent is simply absent.
use = ["droid"]

# No `[packages]` here: the agent's package comes from its bundle — see `use` above.

# An app is read-by-default ({GET,HEAD}); these are write hosts (install/login/API POSTs), so
# each is opened to all verbs with `{*}`.
[network]
mode = "deny"
# The agent's OWN hosts are NOT listed here — they arrive with its bundle (`use` above) and are
# unioned into this list at resolution. Check what that adds with `sbx bundle droid`, and what the
# launch ends up with via `sbx config show --app droid`.
allow = [
    # Install: the npm package and its platform binary (an optional dep).
    # Runtime: Factory's account/login and API gateway. Model traffic flows through Factory's
    # gateway by default (so no separate provider host is needed unless you switch to BYOK).
    # (Add `downloads.factory.ai` only if you let Droid self-update its binary, and a model
    #  provider host — e.g. `openrouter.ai` — only if you configure direct BYOK in settings.json.)
    # Uncomment for the direct-OpenRouter BYOK path below.
    #"{*} https://openrouter.ai",
]

# Refusals to keep OUT of the default `sbx net logs` (SELinux `dontaudit`): hosts we deliberately
# leave DENIED — here Factory's telemetry sink (POST /api/ingest), which a live run hits every few
# seconds and whose `denied-default` lines would drown the ones worth acting on. A `mute` never
# changes the verdict (the telemetry is still refused) and never hides a count (`sbx net stats`
# still tallies it); it only keeps the line out of the default log. See it anytime with
# `sbx net logs --all`, and edit this list from the CLI with `sbx net mute|unmute <host> -a droid`.
# Remove the entry here the day you decide to allow the endpoint (uncomment the `{POST} telemetry.factory.ai`
# line above instead).
mute = [
    # Factory's OpenTelemetry collector on Google Cloud Run — a regional host whose `us-central1`
    # (or other region) label varies while the project number `123358924663` stays stable, so a
    # regex covers every regional variant rather than enumerating them. POST /v1/metrics.
]

# OPTIONAL direct-OpenRouter BYOK (commented). Droid's default is the Factory account above,
# NOT a header-injected provider key — so this block does nothing on its own. It applies only
# if you point Droid at OpenRouter directly via a `customModels` entry in ~/.factory/settings.json
# (apiKey `${OPENROUTER_API_KEY}`) AND uncomment `openrouter.ai` in `allow`. Then the real key is
# read on the HOST and injected by the egress proxy on the wire to openrouter.ai — never in the
# cage; the in-cage placeholder just lets the request go out.
[env]
#OPENROUTER_API_KEY = "sk-or-sbx-placeholder-replaced-by-the-egress-proxy"

#[secret."openrouter.ai"]
#from = "env://OPENROUTER_API_KEY"
#header = "Authorization"
#type = "bearer"
