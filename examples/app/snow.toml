# Snow — an agentic coding CLI compatible with OpenAI, Anthropic, Gemini and DeepSeek, sandboxed by
# sbx.
#
#   sbx bundle import examples/bundle/snow.toml
#   sbx app import examples/app/snow.toml
#   sbx app run snow
#
# THIS PROFILE IS NOT SELF-CONTAINED, on purpose. The agent's package and hosts come from a shared
# BUNDLE, so import it too:
#     sbx bundle import examples/bundle/snow.toml
#     sbx app import examples/app/snow.toml
# One extra step, and it buys the thing that was actually broken here: a hand-copy of an agent's
# requirements silently falls behind the agent.
#
# Snow ships on npm as `snow-ai`, published from the author's own repository (`MayDay-wpf/snow-cli`,
# which the package's `repository` and `homepage` both point at). It is a node CLI, so the cage gets
# a node runtime alongside it; `sbx upgrade mise` rolls it forward.
#
# NO `cmd` WRAPPER IS NEEDED, and the skipped install script is a small win here. mise's npm backend
# installs with `--ignore-scripts=true`; Snow's `postinstall` places nothing — it geolocates you via
# `ipapi.co` in order to print a mirror tip for users in China. Skipping it costs the tip and avoids
# the lookup. Its native optional dependencies (`@napi-rs/canvas`, `sharp`) are prebuilt
# platform packages with no install script of their own, so they survive intact.
#
# BYOK, MULTI-PROVIDER — no vendor account. Snow's first run walks you through a provider: OpenAI,
# Anthropic, Gemini, or any OpenAI-compatible endpoint (which is how it reaches DeepSeek and the
# rest). Pick ONE below: uncomment its allowlist host, its `[env]` placeholder and its `[secret]`
# block. The real key is read on the HOST and injected by the egress proxy on the wire — never in
# the cage. An unedited launch installs and starts but reaches no model until you make that choice.
#
# ITS WEB-SEARCH TOOL IS A SEPARATE GRANT. Snow can search the web through Jina
# (`api.jina.ai`), which is its own key and its own host — left commented below, so the agent has no
# outbound reach you did not ask for.
#
# UNVERIFIED (like every profile until run with a real key): the live authentication and the model
# traffic through sbx's MITM. Grounded here: the packaging and the postinstall's behaviour (read out
# of the published package), and the provider endpoints (read out of the shipped bundle).
# The command hands Snow the cage's summary (/opt/sbx/contract-summary.md: what it may reach, which
# files it protects, which operations it offers) through a global `onUserMessage` hook: the file
# `~/.snow/hooks/onUserMessage.json` runs `/etc/snow/sbx-contract-hook.js`, which returns the summary
# as `additionalContext` on the first message of a conversation and nothing afterwards, so Snow
# prepends it once, to your own first message, and your system prompt and `ROLE.md` stay as they are.
# The script lives in the cage's own `/etc` for this launch only; the hook file lives in the app's
# isolated home, which only this app's cages read. The hook file is rewritten at every launch, removed
# by a launch without a summary, and an `onUserMessage.json` of yours is left untouched (the summary
# is then not added). Two limits: a project's own `.snow/hooks/onUserMessage.json` replaces the global
# one for that project, and Snow keeps 8 KiB of a hook's context, so a longer summary is cut. A
# `snow --ask` run triggers no hook and does not receive it. No option is used: Snow's startup
# parameters carry no instructions, and `SNOW_CONFIG_DIR` would move your config. Arguments after
# `sbx app run snow --` reach Snow verbatim through `"$@"`.
cmd = [
    "bash",
    "-c",
    '''
s=/opt/sbx/contract-summary.md
d="$HOME/.snow/hooks"
f="$d/onUserMessage.json"
m='sbx: the cage summary, rewritten at every launch'
if [ -r "$s" ] && mkdir -p /etc/snow 2>/dev/null && cat > /etc/snow/sbx-contract-hook.js <<'HOOK'
let input = "";
process.stdin.on("data", (c) => (input += c)).on("end", () => {
  let n = 0;
  try { n = JSON.parse(input).messageCount || 0; } catch {}
  if (n !== 0) return;
  const text = require("fs").readFileSync("/opt/sbx/contract-summary.md", "utf8");
  process.stdout.write(JSON.stringify({ additionalContext: text }));
});
HOOK
then
  if [ ! -e "$f" ] || grep -qsF "$m" "$f"; then
    mkdir -p "$d" && printf '%s\n' \
      '[{"description": "'"$m"'", "hooks": [{"type": "command", "enabled": true,' \
      ' "command": "node /etc/snow/sbx-contract-hook.js"}]}]' > "$f.tmp" && mv -f "$f.tmp" "$f"
  fi
elif grep -qsF "$m" "$f"; then
  rm -f "$f"
fi
exec snow "$@"
''',
    # `$0` placeholder: the arguments after `--` arrive as `$1 $2 …`.
    "snow",
]

# Your host Snow config, mounted read-write at its real absolute path. `binds` is a security field,
# honored only because this profile lives in your trusted config dir; `mode = "rw"` lets the caged
# `snow` read and write these host files. Uncommented, the bind appears at that host path and not
# under the cage's `$HOME` (`/home/sandbox`), so the app keeps its isolated home and reaches these
# files only by their absolute path.
#binds = [
#    { path = "~/.snow", mode = "rw" },
#]

# --- The agent's requirements come from its bundle ------------------------------------------------
# `use` pulls in the `snow` BUNDLE — the package(s), the environment it reads, the hosts it must
# reach, and its telemetry mutes — from one declaration shared with the bundle file itself, so this
# profile cannot fall behind when the agent's requirements change.
#
# THE BUNDLE IS NOT IN THIS FILE — import it too, in either order:
#     sbx bundle import examples/bundle/snow.toml
# Without it the launch warns that the bundle is undeclared and the agent is simply absent.
use = ["snow"]

# No `[packages]` here: the agent's package comes from its bundle — see `use` above.

# An app is read-by-default ({GET,HEAD}); a completions endpoint is a POST, so a provider host is
# opened to all verbs with `{*}`.
[network]
mode = "deny"
# The agent's OWN hosts are NOT listed here — they arrive with its bundle (`use` above) and are
# unioned into this list at resolution. Check what that adds with `sbx bundle snow`, and what the
# launch ends up with via `sbx config show --app snow`.
allow = [
    # Install: the packument (version resolution, also used by `sbx upgrade mise`) and the tarball.
    # Runtime: uncomment the ONE provider you configured (and its key below). A DeepSeek or other
    # OpenAI-compatible endpoint goes here too, as its own host.
    #"{*} https://api.openai.com",
    #"{*} https://api.anthropic.com",
    #"{*} https://generativelanguage.googleapis.com",
    # Its web-search tool, if you enable it (needs a Jina key of its own).
    #"{*} https://api.jina.ai",
]

# Refusals to keep OUT of the default `sbx net log` (SELinux `dontaudit`): npm's audit endpoint. A
# `mute` never changes the verdict (it stays refused) and never hides a count. See everything with
# `sbx net log --all`; edit with `sbx net mute|unmute <rule> -a snow`.
mute = [
]

# --- Provider key (commented) — uncomment the placeholder and the matching [secret] block. The
# in-cage placeholder lets Snow start and issue its request; the proxy strips it and substitutes the
# real key, read on the HOST, on the wire to the provider. ---
[env]
#OPENAI_API_KEY = "sk-sbx-placeholder-replaced-by-the-egress-proxy"
#ANTHROPIC_API_KEY = "sk-ant-sbx-placeholder-replaced-by-the-egress-proxy"

#[secret."api.openai.com"]
#from = "env://OPENAI_API_KEY"
#header = "Authorization"
#type = "bearer"
#[secret."api.anthropic.com"]
#from = "env://ANTHROPIC_API_KEY"
#header = "x-api-key"
#type = "raw"
