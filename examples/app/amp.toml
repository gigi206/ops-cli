# Amp — the coding agent from the Amp team (formerly Sourcegraph Amp), sandboxed by sbx.
#
#   sbx app import examples/app/amp.toml
#   sbx app run amp
#
# THIS PROFILE IS NOT SELF-CONTAINED, on purpose. The agent's package, environment and hosts come
# from a shared BUNDLE, so import it too:
#     sbx bundle import examples/bundle/amp.toml
#     sbx app import    examples/app/amp.toml
# One extra step, and it buys the thing that was actually broken here: a hand-copy of an agent's
# requirements silently falls behind the agent.
#
#   EGRESS GROUPS — shared lanes, imported once (shared, not per-agent):
#     sbx net groups import examples/net-groups/npm-registry.toml
#     sbx net groups import examples/net-groups/npm-audit.toml
#
# Amp ships on npm as `@ampcode/cli` — a small JS wrapper whose real payload is a single-file
# native binary published as a PLATFORM OPTIONAL DEPENDENCY (`@ampcode/cli-linux-x64`, an ELF
# compiled by Bun, ~111 MiB). Verified against the published tarball at
# `@ampcode/cli@0.0.1785961745-gfab117`: the wrapper at `bin/amp.exe` is a 141-byte ASCII
# placeholder; the package's `install.cjs` (its `postinstall` script) hardlinks or copies the
# platform binary from the optional dep over the placeholder — after which `bin/amp.exe` IS the
# ELF, and `amp` runs it directly. sbx installs it in-cage with mise's npm backend over a node
# runtime; `sbx upgrade mise` rolls it forward.
#
# The previous package name `@sourcegraph/amp` was an alias to `@ampcode/cli` and was removed on
# 2026-06-15 (per `ampcode.com/news/npm-package-changes`); this profile only refers to the new
# name.
#
# WHY `cmd` IS A WRAPPER, NOT A BARE `amp`. mise's npm backend installs with
# `--ignore-scripts=true` — a deliberate security default: it will not run arbitrary package
# scripts. The Amp `postinstall` is exactly the kind of script this default blocks, so a plain
# install leaves the 141-byte placeholder in place and `amp` exits with an error. The wrapper
# below simply runs the package's OWN FALLBACK — `cli-wrapper.cjs`, which `require.resolve` the
# platform optional dep and `spawnSync` its `amp` binary. No placement, no file copy, no extra
# network: the optional dep was already on disk after mise fetched it, and the wrapper hands
# `argv` straight to the native binary. The same shape works whether or not `install.cjs` ever
# ran (e.g. after a future `sbx upgrade mise` that re-fetches the wrapper with a fresh
# placeholder). `mise where` accepts a SCOPED package name and answers with the install
# directory, whose layout is `lib/node_modules/<scope>/<name>` — verified against a real scoped
# install. If the query ever fails, `set -eu` aborts the launch with mise's own message instead
# of running a half-installed CLI.
#
# CREDENTIAL POSTURE — an Amp account, with a headless key. `amp login` opens a browser (which the
# hermetic cage does not have), so the practical path is `AMP_API_KEY`, documented in the Amp
# Owner's Manual for non-interactive environments. Two ways to supply it:
#   - host-side injection (the sbx way, key never in the cage): uncomment the `[env]` placeholder
#     and the `[secret]` block below;
#   - or pass it for a single launch: `sbx app run amp --env AMP_API_KEY=…` (never baked in here).
# Settings live at `~/.config/amp/settings.json` inside the app's isolated home; AGENTS.md files
# at `~/.config/amp/AGENTS.md` and `~/.config/AGENTS.md` are auto-included.
#
# UNVERIFIED (like every profile until run with a real account): the live authentication and the
# model traffic through sbx's MITM. Grounded here: the packaging and its `cli-wrapper.cjs`
# fallback (read out of the published tarball), the `AMP_*` environment keys and the `ampcode.com`
# endpoints (read out of the shipped binary), and the bearer-token shape of the `Authorization`
# header.
cmd = [
    "bash",
    "-c",
    """
set -eu
amp="$(mise where 'npm:@ampcode/cli')/lib/node_modules/@ampcode/cli"
# Skip the vendor's postinstall (mise blocks scripts on purpose) and use the package's own JS
# fallback, which require.resolve's the platform optional dep and spawns the native binary
# directly. No placement, no network — the binary is already on disk beside it.
exec node "$amp/cli-wrapper.cjs" "$@"
""",
    "amp",
]

# Your host Amp settings, mounted read-write at their real absolute path. `binds` is a security
# field, honored only because this profile lives in your trusted config dir; `mode = "rw"` lets
# the caged `amp` read and write these host files (settings, AGENTS.md, login). Uncomment to
# share your host Amp setup with the cage instead of the app's isolated home (the default).
#binds = [
#    { path = "~/.config/amp", mode = "rw" },
#    { path = "~/.config/AGENTS.md", mode = "rw" },
#]

# --- The agent's requirements come from its bundle ------------------------------------------------
# `use` pulls in the `amp` BUNDLE — the package(s), the environment it reads, the hosts it must
# reach, and its telemetry mutes — from one declaration shared with the bundle file itself, so this
# profile cannot fall behind when the agent's requirements change. What the bundle cannot carry is
# the install repair: that is the wrapper in `cmd` above, and it stays here with the rest of this
# app's posture.
#
# IMPORT THE BUNDLE FIRST — it is not in this file:
#     sbx bundle import examples/bundle/amp.toml
# Without it the launch warns that the bundle is undeclared and the agent is simply absent.
use = ["amp"]

# No `[packages]` here: the agent's packages come from its bundle — see `use` above.

# An app is read-by-default ({GET,HEAD}). This table stays even though it names nothing: the
# bundle's egress entries land in the consuming app's OWN `[network]` table, and an app that
# declares none gets a warning rather than an invented posture. Check what the bundle adds with
# `sbx bundle amp`, and what the launch ends up with via `sbx config show --app amp`.
[network]
mode = "deny"
allow = [
    # Nothing here: the install lane (`@npm-registry`) and Amp's own hosts arrive with the bundle
    # and are unioned in at resolution. A host the flow reaches that is not in the union is refused
    # and named — watch `sbx net logs -a amp`, or check ahead with `sbx test net <url>`.
]

# --- BYOK-style account key (commented). The in-cage placeholder lets the CLI start and issue its
# request; the proxy strips it and substitutes the real key, read on the HOST (as $AMP_API_KEY, or
# via a resolver such as sops://secrets.yaml#amp), on the wire to ampcode.com. ---
#[env]
#AMP_API_KEY = "sbx-placeholder-replaced-by-the-egress-proxy"

#[secret."ampcode.com"]
#from = "env://AMP_API_KEY"
#header = "Authorization"
#type = "bearer"
