# OpenFox — a local-LLM web coding agent (github.com/co-l/openfox), sandboxed by sbx.
#
#   sbx app import examples/app/openfox.toml
#   sbx app run openfox
#
# THIS PROFILE IS NOT SELF-CONTAINED, on purpose. The agent's package and hosts come from a shared
# BUNDLE, so import it too:
#     sbx bundle import examples/bundle/openfox.toml
#     sbx app import    examples/app/openfox.toml
# One extra step, and it buys the thing that was actually broken here: a hand-copy of an agent's
# requirements silently falls behind the agent.
#
#   # then open http://127.0.0.1:10369 in your browser
#
# OpenFox is a Node.js/TypeScript coding agent with a "Plan → Builder" workflow, an integrated
# terminal, and sub-agents — but instead of a cloud provider it drives a LOCAL, OpenAI-compatible
# LLM backend (vLLM / sglang / ollama / llama.cpp). It ships as the npm package `openfox` (Node
# >= 24) and, unlike a TUI CLI, serves a WEB dashboard: it starts a local HTTP server (default
# 127.0.0.1:10369) and you drive it from your browser.
#
# THE TWO LOOPBACK CROSSINGS, AND WHY THE POSTURE STAYS FILTERED. OpenFox sits on both sides of
# the boundary: it TALKS to a LLM on your machine's `localhost` (OPENFOX_LLM_URL default
# `http://localhost:8000/v1`; ollama is usually :11434, llama.cpp :8080) and it SERVES a web UI you
# open in your host browser. The sbx posture is Model-B — an EMPTY network namespace whose
# `127.0.0.1` is the CAGE's own loopback, NOT the host's — so each direction needs its own crossing,
# and each has one:
#
#  - OUTBOUND (cage → your LLM): a `tcp://localhost:<port>` allow rule. sbx opens a listener inside
#    the cage on that exact address:port and relays it, through the host-side proxy, to the service
#    on YOUR loopback — so `http://localhost:8000/v1` works verbatim, with no tunnel to write. The
#    rule is the fence: only the ports named below cross, and nothing else on your loopback is
#    exposed to the agent.
#  - INBOUND (your browser → the UI): `forward = [10369]`, which bridges that host loopback port
#    into the cage. Open `http://127.0.0.1:10369` as usual.
#
# So egress stays FILTERED, which is what `network = "shared"` would have thrown away: under
# `shared` the agent — and any code it runs in its integrated terminal — reaches any network your
# host can. Here it reaches your LLM's port and the npm registry, and nothing else. Everything the
# cage enforces either way is unchanged: HERMETIC FILESYSTEM isolation (openfox sees only this
# project + its own isolated $HOME — never your host $HOME, SSH keys, other projects, or secrets),
# the SECCOMP denylist (no mount/ns/ptrace kernel-LPE surface), CGROUP limits (anti fork-bomb /
# OOM), and a dedicated persistent $HOME.
#
# A `tcp://` rule is a RAW SPLICE: the bytes are relayed unread, so the model traffic is not
# inspected the way an `https://` host is (no path/verb filtering, no credential injection). That is
# the right trade for a local backend speaking cleartext HTTP on your own machine, and the host:port
# allowlist is still the fence. If your LLM runs on a REMOTE host instead, name it as an ordinary
# inspected rule (`allow = ["{*} https://<llm-host>"]`) and drop the `tcp://` lines.
#
# ONE SPELLING TRAP, measured: the cage's `/etc/hosts` gives `localhost` both `127.0.0.1` and `::1`,
# and the listener is IPv4. A client that retries the second address is fine (curl and Node do), but
# one that only tries the first fails with "connection refused". Pin `127.0.0.1` in OPENFOX_LLM_URL
# below if you hit that.
#
# THE ESCAPE HATCH, if the crossing ever fails you (an unusual backend, a client that will not take
# the listener): `sbx app run openfox --net shared` gives the cage the host network for that launch
# only, leaving the profile filtered. You keep bubblewrap + seccomp + the isolated home + the minimal
# /dev; what you lose for that launch is egress FILTERING, so the agent and anything its terminal
# runs can reach any network your host can. Diagnose first with `sbx net logs -a openfox`: a named
# deny is a port to add to `allow`, not a reason to drop the allowlist.
#
# NATIVE ADDONS — carried by the bundle, not by this command. OpenFox depends on two NATIVE node
# addons — `better-sqlite3` (its session DB) and `node-pty` (its integrated terminal) — whose
# compiled `.node` binaries are placed by a package install script that mise deliberately does not
# run, so a plain install leaves the agent crashing at startup with "Could not locate the bindings
# file … better_sqlite3.node". The `openfox` bundle declares the `npm rebuild` that heals it as its
# `provision`, and sbx runs that before this command, in this cage: the fetch is therefore subject
# to the allowlist below, and the step is skipped once the binary exists. `cmd` is back to being
# what this app runs. Keeping openfox as a `mise:npm:` entry in its bundle means `sbx upgrade mise`
# still rolls it, and the fresh install directory that follows is what makes the step run again.
#
# The web server auto-opens a browser by default; the hermetic cage has none, so `cmd` passes
# `--no-browser` and you open the URL yourself. Do NOT set OPENFOX_HOST=0.0.0.0 (that exposes the
# UI to your LAN); keep the 127.0.0.1 default.
cmd = ["openfox", "--no-browser"]

# The INBOUND crossing: your browser's `http://127.0.0.1:10369` is bridged into the cage, where
# openfox serves the UI on the same port. Keep this in step with OPENFOX_PORT if you change it.
forward = [10369]

# Your host OpenFox config, mounted read-write at its real absolute path. `binds` is a security
# field, honored only because this profile lives in your trusted config dir; `mode = "rw"` lets the
# caged `openfox` read and write these host files. Uncomment to share your host OpenFox setup with
# the cage instead of the app's isolated home (the default). The exact config path is UNCONFIRMED
# (verify with a real run before relying on it).
#binds = [
#    { path = "~/.config/openfox", mode = "rw" },
#]

# --- The agent's requirements come from its bundle ------------------------------------------------
# `use` pulls in the `openfox` BUNDLE — the package(s), the environment it reads, the hosts it must
# reach, and its telemetry mutes — from one declaration shared with the bundle file itself, so this
# profile cannot fall behind when the agent's requirements change.
#
# IMPORT THE BUNDLE FIRST — it is not in this file:
#     sbx bundle import examples/bundle/openfox.toml
# Without it the launch warns that the bundle is undeclared and the agent is simply absent.
use = ["openfox"]

# No `[packages]` here: the agent's package comes from its bundle — see `use` above.

[network]
mode = "deny"
# The OUTBOUND crossings. Each `tcp://localhost:<port>` line opens a listener inside the cage on that
# port and relays it to the service on YOUR loopback — one port at a time, so declaring your LLM's
# port does not expose the rest of what listens on your machine. OpenFox probes the common ones on
# first run (8000 vLLM, 11434 ollama, 8080 llama.cpp): a probe to a port not listed here is refused
# by the allowlist, so uncomment the one your backend serves (or all three, if you switch between
# them). The npm entry is the in-cage `npm rebuild` from `cmd` above; the release assets it then
# downloads ride the built-in github allow-set.
allow = [
    "tcp://localhost:8000",    # vLLM — the OPENFOX_LLM_URL default
    #"tcp://localhost:11434",  # ollama
    #"tcp://localhost:8080",   # llama.cpp
    "{GET,HEAD} https://registry.npmjs.org",
]

[env]
# LLM BACKEND. On first run OpenFox auto-detects a local OpenAI-compatible backend by probing common
# localhost ports (8000 vLLM, 11434 ollama, 8080 llama.cpp) — it finds the ones `[network] allow`
# opens above, and no other. If auto-detection does not find yours, or you want to pin it, set these
# (uncomment + adjust; `127.0.0.1` rather than `localhost` sidesteps the IPv6 trap in the header):
#OPENFOX_LLM_URL = "http://127.0.0.1:11434/v1"   # ollama; vLLM default is http://127.0.0.1:8000/v1
#OPENFOX_MODEL_NAME = "qwen2.5-coder:32b"         # the model your backend serves
#OPENFOX_REASONING_EFFORT = "medium"              # if your model supports it
# The web UI port (must match --port if you add one to `cmd`):
#OPENFOX_PORT = "10369"
#
# No [secret] block: the LLM is local and needs no cloud API key. If your local backend requires a
# token, most OpenAI-compatible servers accept any non-empty value — set it in your backend and, if
# OpenFox needs it, provide it here (your call; it then lives in the isolated cage). The proxy
# cannot inject it for you: a `tcp://` destination is spliced unread, so there is no request head to
# add a header to.
