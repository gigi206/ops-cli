# AionUi — the multi-agent "Cowork" desktop app (iOfficeAI/AionUi), sandboxed by sbx on Wayland.
#
#   sbx bundle import examples/bundle/opencode.toml
#   sbx app import    examples/app/aionui.toml
#   sbx app run aionui
#
#   EGRESS GROUPS — shared lanes, imported once (shared, not per-agent):
#     sbx net groups import examples/net-groups/npm-runtime.toml
#
# AionUi is a free, open-source Electron + React desktop app: ONE interface over 20+ AI agents. It
# ships a built-in agent and auto-detects CLI agents installed on the machine (Claude Code, Codex,
# Gemini CLI, …) to "Cowork" with them — reading files, writing code, generating images, browsing,
# and running scheduled tasks. Under sbx it runs CONFINED: it sees only the cage filesystem (the
# project directory you launch it from, bound in, plus its own persistent isolated home), reaches
# only the model-provider hosts you allow below, and its "act on your computer" powers stop at the
# sandbox boundary (bubblewrap + seccomp + an empty netns + the egress allowlist).
#
# NOTE ON CLI CO-WORKING. In the hermetic cage AionUi's auto-detection finds only the CLI agent this
# profile names — nothing of your host install leaks in. **OpenCode is named by default** (see `use`
# below); Claude Code, Codex and Droid are listed commented beside it.
#
# THIS PROFILE IS NOT SELF-CONTAINED, on purpose. The agent's package and hosts come from a shared
# BUNDLE, so import it too:
#     sbx bundle import examples/bundle/opencode.toml
#     sbx app import    examples/app/aionui.toml
# One extra step, and it buys the thing that was actually broken here: a hand-copy of an agent's
# requirements silently falls behind the agent (this file used to miss `platform.claude.com`). The
# other standalone agent profiles point at their own bundles the same way; only the profiles
# without a bundle (desktop/web builds) stay one-step imports.
# With `use` empty you Cowork with AionUi's BUILT-IN agent alone, which needs no CLI.
#
# THE `deb:github:` BACKEND (no third party, tracks upstream automatically). Upstream distributes
# AionUi for Linux only as a `.deb`/`.AppImage`/`.rpm`, none of which install in the hermetic cage.
# AionUi's release ASSET NAMES embed the version (`AionUi-<v>-linux-amd64.deb`), so there is no
# stable `releases/latest/download/…` URL to hard-code. Instead this profile names the GitHub repo
# — `deb:github:iOfficeAI/AionUi` — and sbx queries the repo's LATEST release, selects its
# linux-amd64 `.deb` asset, resolves it to a content hash (both pinned in the per-project deb lock),
# and builds a generated derivation that `dpkg-deb -x`-unpacks it and `autoPatchelfHook`s the
# Electron binaries against a curated library set — no from-source build. The build is HOST-SIDE
# (a `.deb` runs no maintainer script, so evaluating it host-side is safe), seeded into the store,
# and offline-reusable after the first launch.
#
# UPGRADES — automatic, like the other `deb:` apps. `sbx upgrade deb` re-queries GitHub and rolls
# the pin forward to the newest release (the rebuilt app lands at the next launch); the launch hot
# path never touches GitHub — it reuses the pinned asset offline. No manual version bump.
#
# CA TRUST (why `--use-system-ca`). Under the allowlist sbx runs a TLS-terminating proxy with a
# per-session CA. Electron/Chromium ignores the CA-file env vars sbx sets and trusts its own NSS
# database (`~/.pki/nssdb`); for a `gui = "wayland"` cage under a filtering posture, sbx seeds its
# MITM CA into that NSS db automatically (part of the GUI hole, like fonts), so HTTPS to the allowed
# provider hosts succeeds. `--use-system-ca` tells Electron to consult that store.
#
# DISPLAY + GPU. `gui = "wayland"` binds the host Wayland compositor socket (read-only) and
# provisions fonts, so the Electron window maps. X11 is never offered. Isolation is
# compositor-dependent — Mutter (GNOME) is safe; wlroots compositors (sway, hyprland) expose
# screen-capture/input-injection to ordinary clients (see docs-site/docs/guide/configuration/gui.md).
# `gpu = true` opens hardware-accelerated rendering (mesa provisioned into sbx's own store, the
# render node under `/dev/dri`, the minimal `/sys` DRM subtree the driver needs) — without it a
# Chromium/Electron app on Wayland often produces no buffer and no window maps, so it is on here.
# mesa covers Intel/AMD/nouveau; an NVIDIA-only machine falls back to software (renders, slower).
# The Electron flags: `--no-sandbox` is mandatory and acceptable because bubblewrap + seccomp + the
# empty netns IS the boundary (it replaces Chromium's own redundant sandbox); `--ozone-platform=
# wayland` selects the Wayland backend; `--disable-dev-shm-usage` avoids the small cage `/dev/shm`.
#
# DBUS. `dbus = true` gives the cage its OWN private desktop portal (a `dbus-daemon` +
# `xdg-desktop-portal` with the reference GTK backend, all in-cage), so AionUi's FILE PICKER — the
# "attach a file" / "add a folder to Cowork" dialogs — opens IN-CAGE and lists the cage filesystem
# (the project bind + the isolated home). It also relays desktop notifications and follows your host
# light/dark theme (at launch AND live), and is network-independent (the private bus touches no host
# socket). Requires `gui = "wayland"`. The login keyring is never exposed.
# IN-CAGE BROWSER (for OAuth / "login without an API key"). AionUi opens external URLs via Electron's
# `shell.openExternal` -> `xdg-open`, and (per its own docs) delegates OAuth account login to a CLI
# whose callback is a loopback server. The hermetic cage has no host browser, so the `[open]` table
# below sends http(s) to an IN-CAGE Chromium — the provider consent page and the `localhost:<port>`
# callback both resolve inside the sandbox, no host browser, no `forward`. Same pattern as
# claude-desktop / hermes-desktop. HEAVY: it pulls the Chromium closure into the store on first
# launch (see [packages]). The provider's OWN login
# hosts must be in [network] below — add them from `sbx net logs -a aionui` on your first login attempt.
# `--password-store=basic` forces the file cookie store (no keyring in the cage) so the OAuth session
# survives a relaunch. If you only ever use API keys, drop the `[open]` table + the chromium package.
#
# MANAGED NODE RUNTIME (why the wrapper stages it). AionUi's backend, AionCore, ships a bundled Node
# runtime under `resources/bundled-aioncore/…/managed-resources/node/` and, at first start, copies it
# into its own data dir — preserving the source's file modes — then REWRITES two files in that copy
# (`blank_user_npmrc`, `blank_global_npmrc`, which it uses to neutralise any ambient npm config).
# Everything in a nix store path is canonicalised READ-ONLY (0444/0555), so the copy lands read-only
# and that rewrite fails with EACCES. AionCore reports `bundled Node runtime failed validation …
# Permission denied (os error 13)` and the app opens on "AionUi installation is incomplete — the
# managed Node runtime cannot start". Nothing is missing: it is a permission mode, not a missing file,
# and no derivation can fix it (nix strips write bits after the install phase). So the wrapper stages
# the runtime itself — a mode-preserving copy plus `u+w` — which makes AionCore's pre-install check
# succeed, so it skips its own copy and uses the staged tree. Copies ~140 MB into the app home on the
# first launch (a reflink where the filesystem supports it) and is a no-op afterwards; AionCore then
# installs into that tree itself, which measured ~210 MB once settled.
# The stage repeats on one other event: when the staged runtime stops RUNNING, which is what
# reclaiming the nixpkgs revision it was copied from does to it (see the guard in `cmd`). The copy is
# replaced, and AionCore's own install inside it goes with it, to be redone against the new runtime —
# which is the point, an install linked against reclaimed store paths is not worth keeping — but it
# is not free, so it is tied to that event and to nothing else.
# RESIDUAL: the bundled CLIs beside it (`managed-resources/cli/`, ~590 MB — claude, codex) are
# installed ON DEMAND, only when you pick one as the agent, and may hit the same read-only-rewrite
# failure. That path was not exercised, so it is not staged here; the co-worked CLIs below come from
# [packages] instead and are unaffected.
cmd = [
    "bash",
    "-c",
    '''

# AionCore's bundled Node runtime, staged WRITABLE out of the read-only store (see the note above).
# The app root is derived from the launcher on PATH, never hard-coded: the `.deb` is rebuilt at a new
# content-addressed path on every `sbx upgrade deb`.
APPROOT=$(dirname "$(dirname "$(command -v aionui)")")
NODESRC="$APPROOT/opt/AionUi/resources/bundled-aioncore/linux-x64/managed-resources/node"
NODEDEST="$HOME/.config/AionUi/aionui/runtime/node"
for v in "$NODESRC"/*/; do
    [ -d "$v" ] || continue
    n=$(basename "$v")
    # The staged tree is a COPY out of the store, so it carries the store paths of the revision that
    # built the `.deb`: `bin/node`'s ELF interpreter (glibc's `ld-linux`) and the shebangs of the npm
    # and corepack shims beside it. A new nixpkgs revision rebuilds the app against new ones and
    # `sbx gc --prune` reclaims the old revision, at which point the copy points at paths that are
    # gone while remaining a directory that is present, executable and writable. So the guard RUNS
    # the staged binary instead of testing that it is there: exec is what fails when the loader is
    # reclaimed, and neither the runtime's name nor its modes move on that event. The one binary
    # answers for the shims too — its loader and their `bash` are held alive by the same revision
    # gcroot, so they are reclaimed together. `-w` stays a test of its own, since exec never sees it:
    # AionCore rewrites `blank_user_npmrc`/`blank_global_npmrc` inside the copy, which is what fails
    # on a tree staged read-only.
    [ -w "$NODEDEST/$n/bin/node" ] && "$NODEDEST/$n/bin/node" --version >/dev/null 2>&1 && continue
    echo "sbx: staging the bundled Node runtime ($n) into the app home (first launch, or after the runtime's store paths were reclaimed)" >&2
    mkdir -p "$NODEDEST"
    # A tree copied out of the store and never chmod-ed carries the store's own modes, and `rm -rf`
    # cannot unlink inside a directory it may not write: the restage would fail on exactly the state
    # it exists to repair. Make it writable first, ignoring the case where there is nothing there.
    chmod -R u+w "$NODEDEST/$n" 2>/dev/null || true
    rm -rf "$NODEDEST/$n"
    cp -r --reflink=auto "$NODESRC/$n" "$NODEDEST/" && chmod -R u+w "$NODEDEST/$n"
done

exec aionui --no-sandbox --ozone-platform=wayland --disable-dev-shm-usage \
    --use-system-ca --password-store=basic "$@"
''',
]

gui = "wayland"
gpu = true
dbus = true

# --- The co-worked CLI agent ----------------------------------------------------------------------
# AionUi auto-detects an agent by running `<command> --version` (a 3s probe): having a CLI on the
# cage PATH under its standard command name flips it from "Non installé" to "Disponible".
#
# The agent is named here rather than restated: `use` pulls in that agent's BUNDLE — its package, the
# environment it reads, and the hosts it must reach — from one declaration shared with the agent's own
# profile, so this file cannot fall behind when the agent's requirements change. It did exactly that
# before: this profile carried a hand-copy of Claude Code's hosts that was missing
# `platform.claude.com`, which the CLI contacts at EVERY startup — the co-worked agent was unusable
# and nothing said why.
#
# THE BUNDLE IS NOT IN THIS FILE — import it too, in either order:
#     sbx bundle import examples/bundle/opencode.toml
# Without it the launch warns that the bundle is undeclared and the agent is simply absent.
#
# To co-work a different agent, swap the name AND import that bundle. To actually USE it (not just
# have AionUi detect it) you still need its provider key — in AionUi (Settings → Models) or in the
# CLI's own config inside this app's isolated home.
use = ["opencode"]
#use = ["claude-code"]   # → `claude`   (Claude Code)
#use = ["codex"]         # → `codex`    (Codex CLI)
#use = ["droid"]         # → `droid`    (Droid)

# Give AionUi a real host directory to Cowork on (read/write at its real absolute path), beyond the
# project you launch it from. `binds` is a security field, honored only because this profile lives in
# your trusted config dir. Uncomment and point at a working directory you want the agent to touch.
#binds = [
#    { path = "~/work/aionui", mode = "rw" },
#]

# Where a web link opens: the in-cage Chromium. One declaration covers both ways a link is opened —
# a tool calling `xdg-open` and an Electron app calling the portal under `dbus = true` — and sbx
# freezes the routing, so nothing running in the cage can answer a sign-in link in its place.
#
# The hand-written wrapper this replaces also had a catch-all branch handing every OTHER scheme to
# `aionui`. It was speculative: the registered handler only ever claimed http/https, so the portal
# never used it. If AionUi answers a scheme of its own, declare it here as one more key; an
# undeclared scheme is printed rather than opened.
#
# Must stay below every top-level key: written above one, TOML would fold that key into this table.
[open]
http = ["chromium", "--no-sandbox", "--ozone-platform=wayland", "--password-store=basic", "--no-first-run", "--no-default-browser-check"]
https = ["chromium", "--no-sandbox", "--ozone-platform=wayland", "--password-store=basic", "--no-first-run", "--no-default-browser-check"]

[packages]
# Track the latest GitHub release's linux-amd64 `.deb` automatically (see "THE `deb:github:` BACKEND"
# above). `sbx upgrade deb` rolls it forward; no manual version to bump.
aionui = "deb:github:iOfficeAI/AionUi"

# In-cage Chromium for the OAuth/login flow (see the `[open]` table above). HEAVY — pulls a large
# nixpkgs closure into the project store on first launch. Drop this (and the table) if you only use
# API keys.
chromium = "nix:chromium"

# The co-worked agent's own package comes from its bundle — see `use` near the top of this file.

[network]
mode = "deny"
# AionUi has NO default provider and NO built-in gateway: you add an API key per provider in the app
# (Settings → Models) and it talks DIRECTLY to that provider's API. The allow-set below covers the
# providers AionUi supports so it works whichever you configure — TRIM IT to only the host(s) you
# actually use for least privilege. If a request is refused, the proxy names the host: watch
# `sbx net logs -a aionui` and add it here (or check ahead with `sbx test net <url>`).
#
# The app's update check + the `.deb`/`.rpm` it fetches ride GitHub, already covered by sbx's
# built-in github/githubusercontent allow-set — no entry needed. "Browse the web" (a Cowork power)
# reaches arbitrary hosts and is DENIED by design (that is the confinement); allow specific hosts
# here if you want the agent to reach them.
allow = [
    "{*} https://generativelanguage.googleapis.com", # Google Gemini (API key)
    "{*} https://api.openai.com",                    # OpenAI
    "{*} https://api.anthropic.com",                 # Anthropic
    "{*} https://openrouter.ai",                     # OpenRouter
    "{*} https://api.deepseek.com",                  # DeepSeek
    "{*} https://api-inference.modelscope.cn",       # ModelScope (Alibaba)
    # The co-worked agent's OWN hosts are NOT listed here — they arrive with its bundle (`use` near
    # the top of this file) and are unioned into this list at resolution. Check what that adds with
    # `sbx bundle opencode`, and what the launch ends up with via `sbx config show --app aionui`.
    # Switching agents therefore needs no edit here: swap the `use` name and import that bundle.
    #
    # A DIRECT provider for the co-worked agent, rather than its own gateway, is already covered by
    # the provider hosts above (Anthropic / OpenAI / OpenRouter / DeepSeek) — configure the key in
    # that CLI's own config inside this app's isolated home.
    # "Login with Google" for Gemini (instead of an API key) needs the Google OAuth hosts. Because the
    # login runs in the IN-CAGE browser, use the locale-bounded accounts regex — it covers the whole
    # cross-domain flow (accounts.google.com auth → accounts.google.<cctld>/SetSID on your country
    # domain), works in any locale, and is anchored so a look-alike (accounts.google.com.evil.com) is
    # refused — the same pattern claude-desktop / hermes-desktop / vibe use — plus Google's asset/avatar
    # hosts. (accounts.youtube.com's CheckConnection is non-essential; add it to `mute` if it is noisy.)
    #'{*} re:^https://accounts\.google\.[a-z.]{2,7}(/|$)',
    #"{*} https://oauth2.googleapis.com",
    #"{*} https://apis.google.com",
    #"{GET} https://ssl.gstatic.com",
    #"{GET} https://www.gstatic.com",
    #"{GET} https://lh3.googleusercontent.com",
    # A provider that uses a realtime/streaming WebSocket (some voice/live modes) needs `{WS}` on its
    # host, e.g. change its line above to `{*,WS} https://api.openai.com`.
    #
    # AionUi's own app traffic (discovered live via `sbx net logs -a aionui`):
    # Chromium spellcheck: redirector.gvt1.com 302-redirects the `.bdic` to a dynamic edge node
    # (r3---sn-*.gvt1.com), so scope by regex to the dict path across every gvt1 subdomain — tight
    # (only /edgedl/chrome/dict/), not the whole Google CDN.
    're:^https://[a-z0-9.-]+\.gvt1\.com/edgedl/chrome/dict/',
    "@npm-runtime",                          # browser-automation Cowork: AionUi fetches the chrome-devtools-mcp package
]
# Silence denied telemetry: keep refusals to Sentry out of the default `sbx net logs` (still denied,
# still counted in `sbx net stats`; see them with `--all`). Watch the logs on first run and add any
# other telemetry host AionUi probes.
mute = [
    "*.sentry.io",        # crash/usage telemetry
    "static.aionui.com",  # AionUi's own auto-update feed — the .deb is managed by `sbx upgrade deb`, not in-cage
]

# AUTHENTICATION — no [secret]/[env] block. AionUi stores each provider's API key locally (entered
# in Settings → Models), so the key lives in the app's PERSISTENT ISOLATED HOME and travels straight
# from the app to the provider over the MITM-inspected TLS to an allowed host — there is nothing for
# sbx to inject. (This is AionUi's design: the key is briefly present in the cage's app config,
# unlike the CLI profiles' never-in-cage header injection. If you would rather sbx inject a single
# provider's key host-side and keep it out of the cage entirely, add a `[secret."<host>"]` block +
# an in-cage placeholder like the `codex`/`cline` CLI profiles — but AionUi's multi-key GUI is the
# intended path.)
