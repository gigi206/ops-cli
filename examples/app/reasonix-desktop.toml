# reasonix-desktop — the Reasonix desktop shell (reasonix.io), sandboxed by sbx.
#
#   sbx bundle import examples/bundle/reasonix-desktop.toml
#   sbx app import examples/app/reasonix-desktop.toml
#   sbx app run reasonix-desktop
#
# THIS PROFILE IS NOT SELF-CONTAINED, on purpose. The `.deb`, its resolver, its provider host and
# its crash-reporter mute come from a shared BUNDLE, so import it too:
#     sbx bundle import examples/bundle/reasonix-desktop.toml
#     sbx app import examples/app/reasonix-desktop.toml
# One extra step, and it buys the thing that was actually broken here: a hand-copy of an app's
# requirements silently falls behind the app.
#
#   EGRESS GROUPS — shared lanes, imported once (shared, not per-agent):
#     sbx net groups import examples/net-groups/chromium-spellcheck.toml
#
# PACKAGING — a prebuilt `.deb` of an Electron app. `desktop-v1.39.0` ships Electron 44.2.0
# (`resources/build.json`) at `usr/lib/reasonix/app/Reasonix`, with the Go service it starts,
# `usr/bin/reasonix-desktop`, the static Go CLI `usr/bin/reasonix` and `usr/bin/reasonix-launcher`
# beside it. Earlier releases (this profile was first written against `desktop-v1.20.0`) were a
# Wails shell on WebKitGTK; the resolver always takes the newest release, so what the bundle used
# to carry for WebKitGTK is gone. The command passes the Electron flags every Electron profile
# here needs: without `--no-sandbox` the app aborts at start on Chromium's setuid sandbox helper,
# which the nix store cannot make setuid root; bubblewrap + seccomp + the empty netns are the
# boundary instead.
#
# `reasonix-launcher` is deliberately not the entry point: it resolves the shell through a writable
# `current.json` install layout it manages itself (the vendor's own updater), while versions move
# through `sbx upgrade --app reasonix-desktop` here.
#
# UPGRADES — `deb:resolve`, because this repo publishes TWO release trains from one repository (the
# CLI as `v<x>` and the desktop as `desktop-v<x>`), so `/releases/latest` alternates between them
# and a `deb:github:` locator would find no `.deb` at all whenever the CLI release is the newer one.
# The bundle's resolve command picks the newest `desktop-v*` tag explicitly. sbx runs it in a
# hermetic sandbox (its own base tools — `curl`, `jq`, `sed`, … — on PATH), re-validates the URL it
# prints, and pins it with its content hash; `sbx upgrade --app reasonix-desktop` re-runs it to roll
# forward.
#
# DISPLAY — `gui = "wayland"` binds the host compositor socket read-only and provisions fonts;
# `gpu = true` opens hardware rendering (mesa into sbx's own store, the render node under /dev/dri,
# the minimal /sys DRM subtree). Isolation is compositor-dependent: Mutter (GNOME) is safe, wlroots
# compositors expose screen capture and input injection to ordinary clients (see
# docs-site/docs/guide/configuration/gui.md). On an NVIDIA card mesa cannot drive the render node
# and EGL falls back to software (`libEGL warning: … driver (null)`): the window still draws, just
# without acceleration — the same NVIDIA gap every GUI profile has.
#
# THE AGENT'S SHELL TOOL — Reasonix confines the commands its agent runs in a bubblewrap cage of
# its own, and refuses to run them unconfined when it cannot ("bash sandbox requested but
# unavailable on this host"). Providing `nix:bubblewrap` does NOT fix it: measured in this cage,
# `bwrap --dev-bind / / true` fails with "No permissions to create a new namespace" — an
# unprivileged user namespace cannot nest inside the one sbx already runs in on a host whose
# AppArmor restricts them. The cage IS the boundary here, so the answer is to turn the vendor's own
# nested sandbox off, in Reasonix's settings (`[sandbox] bash = "off"` in its `config.toml`, or
# Settings -> Sandbox), and let sbx confine the shell.
#
# CREDENTIAL — the same DeepSeek BYOK posture as `reasonix.toml`: the real key is read on the HOST
# and substituted by the egress proxy on the wire, never in the cage. See the `[env]` note and the
# `[secret]` block at the bottom.
#
# VERIFIED on this profile with `desktop-v1.39.0`: the resolve command, the host-side build, and a
# launch that keeps running on a Wayland session. UNVERIFIED (like every profile until run with a
# real key): the sign-in and the model traffic through sbx's MITM. Grounded here: the payload layout
# and the Go service's ELF NEEDED list, read out of the built package.
# The command hands Reasonix the cage's summary (/opt/sbx/contract-summary.md: what it may reach,
# which files it protects, which operations it offers) as a user instruction file: a copy at
# `~/.reasonix/CLAUDE.md`. Reasonix loads all three of `REASONIX.md`, `AGENTS.md` and `CLAUDE.md`
# from its home, then the project's, so your own files still apply beside it; `CLAUDE.md` is the
# name a Reasonix user is least likely to keep there. It is a copy, not a link: Reasonix rejects an
# instruction file whose link leaves its directory. The copy lives in the app's isolated home, which
# only this app's cages read: it is rewritten at every launch, removed by a launch without a summary,
# and a `CLAUDE.md` of yours is left untouched (the summary is then not added). Measured with the
# `reasonix` CLI, whose engine this app embeds; not measured in the desktop app. Arguments after
# `sbx app run reasonix-desktop --` reach it verbatim through `"$@"`.
cmd = [
    "bash",
    "-c",
    '''
s=/opt/sbx/contract-summary.md
d="$HOME/.reasonix"
f="$d/CLAUDE.md"
m='<!-- sbx: the cage summary, rewritten at every launch -->'
if [ -r "$s" ]; then
  if [ ! -e "$f" ] || grep -qsF "$m" "$f"; then
    mkdir -p "$d" && { printf '%s\n' "$m"; cat "$s"; } > "$f.tmp" && mv -f "$f.tmp" "$f"
  fi
elif grep -qsF "$m" "$f"; then
  rm -f "$f"
fi
exec reasonix-desktop --no-sandbox --ozone-platform=wayland --disable-dev-shm-usage --use-system-ca \
  --password-store=gnome-libsecret "$@"
''',
    # `$0` placeholder: the arguments after `--` arrive as `$1 $2 …`.
    "reasonix-desktop",
]

gui = "wayland"
gpu = true
# `audio = true` binds the host sound server so the shell can play notification sounds and page
# media. Read the trade first: that bus exposes the MICROPHONE and every `.monitor` source, i.e.
# what the rest of your desktop is playing — drop this line if the shell has no reason to make
# noise. `dbus = true` gives the cage its OWN private portal (a session bus + xdg-desktop-portal
# in-cage, never the host bus): the portal seeds the host colour scheme at launch and sbx's theme
# relay follows every host switch. It also gives the shell a real file dialog and the keyring the
# `--password-store=gnome-libsecret` flag names.
# Both are security fields, honored only because this profile lives in your trusted config dir;
# `dbus` requires `gui = "wayland"`, which is set above.
audio = true
dbus = true

# --- The app's requirements come from its bundle --------------------------------------------------
# `use` pulls in the `reasonix-desktop` BUNDLE — the `.deb`, its auto-upgrade resolver, its provider
# host and its crash-reporter mute — from one declaration shared with the bundle file itself. The
# posture (`gui`/`gpu`/`dbus`) stays here: a bundle may never widen it.
#
# THE BUNDLE IS NOT IN THIS FILE — import it too, in either order:
#     sbx bundle import examples/bundle/reasonix-desktop.toml
# Without it the launch warns that the bundle is undeclared and the app is simply absent.
use = ["reasonix-desktop"]

# No `[packages]` table here, and no `[deb.reasonix-desktop]` resolver: both come from the bundle.

# An app is read-by-default ({GET,HEAD}); the completions endpoint is a POST, so the provider host is
# opened to all verbs with `{*}`. The `deb:resolve` command and the build both run HOST-SIDE, on the
# host network, so neither needs an entry here.
[network]
mode = "deny"
allow = [
    # The provider host arrives with the bundle (`use` above) and is unioned into this list at
    # resolution — inspect it with `sbx bundle reasonix-desktop`.
]

mute = [
    # Nothing here: the vendor's crash reporter is muted by the bundle.
]

# The real API key is read on the HOST and injected by the egress proxy — never in the cage. To key
# the provider, uncomment both blocks below. This profile declares no `[env]` table of its own, so
# the one uncommented here is its only `[env]` header; keep it that way, since a duplicate table is
# invalid TOML and the whole profile would fail to parse.
#
#[env]
#DEEPSEEK_API_KEY = "sk-sbx-placeholder-replaced-by-the-egress-proxy"
#
#[secret."api.deepseek.com"]
#from = "env://DEEPSEEK_API_KEY"
#header = "Authorization"
#type = "bearer"
