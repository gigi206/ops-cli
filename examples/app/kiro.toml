# Kiro CLI — AWS's agentic coding CLI (the rebranded Amazon Q Developer CLI), sandboxed by sbx.
#
#   sbx bundle import examples/bundle/kiro.toml
#   sbx app import    examples/app/kiro.toml
#   sbx app run kiro -- login --license free   # authenticate once (in-cage browser, see below)
#   sbx app run kiro -- chat                    # agentic chat/coding mode (strict egress)
#   sbx app run kiro                            # the CLI (kiro-cli)
#
# THIS PROFILE IS NOT SELF-CONTAINED, on purpose. The CLI package, the sign-in browser and the
# hosts they reach come from a shared BUNDLE, so import it too:
#     sbx bundle import examples/bundle/kiro.toml
#     sbx app import    examples/app/kiro.toml
# One extra step, and it buys the thing that was actually broken here: a hand-copy of an agent's
# requirements silently falls behind the agent.
#
#   EGRESS GROUPS — shared lanes, imported once (shared, not per-agent):
#     sbx net groups import examples/net-groups/chromium-background.toml
#
# Kiro CLI is a **native glibc terminal program** (a Rust TUI: kiro-cli + kiro-cli-chat +
# kiro-cli-term) — NOT an Electron/Chromium app. It runs like any other CLI in the cage; the
# in-cage Chromium below is used ONLY to complete the OAuth sign-in, never for daily runs.
#
# It is packaged from nixpkgs' own `kiro-cli` derivation (`nix:kiro-cli`): built host-side
# into sbx's shared store (once, then seeded per project — no per-project rebuild of the
# ~530 MB artifact), from the official vendor `.tar.gz` that nixpkgs pins and autoPatchelfs.
# `kiro-cli` is proprietary (an `unfree` nixpkgs package); a `[packages]` declaration is
# trusted-only, so sbx builds it. Its version tracks sbx's pinned nixpkgs channel and rolls
# forward with `sbx upgrade nix`.
#
# ── LOGIN: the in-cage browser (default flow) ─────────────────────────────────────────────
# `kiro-cli login` (without `--use-device-flow`) opens its sign-in page in a browser and then
# waits on a `http://localhost:3128` OAuth callback. In a hermetic cage the host browser cannot
# reach the CAGE's loopback, so the login happens IN the cage: kiro-cli opens the page by calling
# `xdg-open <url>`, and the `[open]` table below routes that to an **in-cage Chromium**. You complete Google / GitHub / Builder ID sign-in in that Chromium; the redirect to
# `http://localhost:3128` is a normal http URL Chromium follows back to kiro-cli's own in-cage
# listener, so the whole flow closes inside the cage. The token persists in the app's isolated
# `$HOME` — login is a one-time step.
#
#     sbx app run kiro -- login --license free    # Builder ID / Google / GitHub
#     sbx app run kiro -- login --license pro     # enterprise Identity Center
#
# This works under the STRICT `deny` allowlist below — the `[network]` block already permits the
# Kiro sign-in hosts AND the Google Sign-In chain (including the `accounts.google.<ccTLD>/SetSID`
# cross-domain cookie step, the classic blank-SetSID-page blocker). GitHub / Builder ID sign-in
# stay on their own domains and need even less. Once the token is persisted, daily use needs no
# browser (`sbx app run kiro -- chat`; the token refresh hits the already-allowed `oidc.*`).
#
# TWO ESCAPES if a login still stalls on a blank/partial page:
#   * A refused host. Watch `sbx net log -a kiro --all` for a `denied-*` line and add it:
#     `sbx net allow <host> -a kiro`. Chromium's own stderr is captured in `chromium-login.log`
#     in the app home (path via `sbx app show kiro`) — read it to see what the page is waiting on.
#   * `sbx app run kiro --net allow -- login …` — allow-by-default instead of the allowlist, for the
#     login only (you keep bubblewrap + seccomp + the isolated home + the minimal /dev, AND the proxy,
#     so `sbx net log -a kiro --all` still names every host the flow touched). The token then
#     persists, and daily use returns to the strict default. `--net shared` opens the same doors but
#     drops the proxy entirely, logs and MITM CA included: last resort only.
#
# HONEST GATE (cannot be pre-verified): the in-cage Chromium is a fresh, cookie-less profile, and
# some IdPs — Google in particular — may wall "unusual/insecure browser" or a 2FA step in exactly
# this setup. The transport is proven; whether the IdP lets you finish is your account's call. If
# Google balks, use GitHub or Builder ID, or the device flow (next section).
#
# ── LOGIN fallback: the device flow (no browser) ──────────────────────────────────────────
# `--use-device-flow` polls instead of opening a browser — useful if the in-cage Chromium login
# is blocked. kiro-cli prints ONLY a one-time CODE (`Confirm the following code in the browser`);
# in the sandbox it does NOT print the verification URL and does NOT open a browser. Open the URL
# yourself on the HOST and enter the code:
#
#     sbx app run kiro -- login --license free --use-device-flow
#     Builder ID / Google / GitHub (`--license free`):  https://view.awsapps.com/start/#/device
#     Identity Center (`--license pro`):                 your org's SSO start URL, #/device
#
# The device code expires in ~10 MINUTES. Open the URL and enter the code promptly. If the CLI
# stays on `Logging in...` forever, the code was never confirmed in a browser (or has since
# expired) — Ctrl-C and re-run login to get a fresh code, then open the URL right away.
#
# NOTE on the callback port: kiro-cli's OAuth callback binds `localhost` on a dynamically chosen
# port (it tries a candidate list and takes the first free one — 3128 under the empty netns, but
# 4649 and others have been seen; do not assume 3128). Under `--net shared` this is the HOST
# loopback — fine unless something already listens on the chosen port; under the strict default the
# cage has its own empty-netns loopback, so any candidate is free and there is never a clash.
# The telemetry opt-out this profile used to carry here now lives in the `kiro` bundle as its
# `provision` step: it is an install-shaped act, it belongs with the tool rather than with the
# command, and `sbx upgrade` can reach it there — a step written into `cmd` is replayed at every
# launch but can never be rolled.
#
# Tip: to diagnose a login stall, kiro-cli's `login` writes NO log file of its own (only `chat`
# does) — its trace goes to stdout only when enabled. Capture it without disturbing the interactive
# method menu (which is on stderr) by redirecting just stdout:
#     sbx app run kiro --env KIRO_LOG_LEVEL=trace --env KIRO_LOG_STDOUT=1 -- login --license free >trace.log
cmd = ["kiro-cli"]

# DISPLAY + GPU + DBUS for the in-cage login browser. `gui = "wayland"` binds the host Wayland
# socket (read-only) so the in-cage Chromium can map a window; `gpu = true` opens hardware-
# accelerated rendering (mesa into sbx's store + the `/dev/dri` render node), without which a
# Wayland Chromium never maps its window. `dbus = true` stands up a PRIVATE in-cage dbus-daemon +
# xdg-desktop-portal (no host bus is exposed) — the in-cage Chromium needs it to COMPLETE the
# Google OAuth sign-in (the cross-domain `SetSID` cookie step); without it the Google page hangs
# blank/spinning. Every other sbx profile that completes an OAuth inside the cage carries it. kiro
# still opens the sign-in URL via `xdg-open` (a native CLI, not the portal `OpenURI`), and its
# `http://localhost:3128` callback is normal in-browser navigation, so the private bus never
# intercepts the launch or the callback. All three are trusted-only fields, honored because this
# profile is trusted by location once imported.
gui = "wayland"
gpu = true
dbus = true

# Optional: share your host Kiro CLI state with the cage (read-write at its real path), instead
# of the app's isolated home. `binds` is a security field, honored only from this trusted
# profile. Uncomment to reuse a login you already did on the host. Must stay a top-level key
# (before the first `[table]` header): written after a `[table]`, TOML would fold it into that
# table (e.g. `network.binds`) and it would be silently ignored.
#binds = [
#    { path = "~/.local/share/kiro-cli", mode = "rw" },
#    { path = "~/.aws", mode = "rw" },
#]

# --- The agent's requirements come from its bundle ------------------------------------------------
# `use` pulls in the `kiro` BUNDLE — the CLI package, the Chromium the in-cage sign-in needs, the
# hosts both reach, and the telemetry mutes — from one declaration shared with the bundle file
# itself, so this profile cannot fall behind when the agent's requirements change. What the bundle
# may never carry is posture: the `gui`/`gpu`/`dbus` grants above and the `[open]` routing below
# stay here, and without them the browser login cannot start.
#
# THE BUNDLE IS NOT IN THIS FILE — import it too, in either order:
#     sbx bundle import examples/bundle/kiro.toml
# Without it the launch warns that the bundle is undeclared and the agent is simply absent.
use = ["kiro"]

# No `[packages]` here: the agent's packages come from its bundle — see `use` above.

# BYOK (Pro / Pro+ / Pro Max / Power tiers): the CLI reads a `KIRO_API_KEY` env var (key
# generated at app.kiro.dev). The exact wire header the CLI sends this key in is NOT
# publicly documented, so sbx does not header-inject it (a guessed injection could silently
# fail or leak). If you have a key, either use interactive login above, or — accepting that
# the value then lives inside the cage — set it explicitly with a one-shot override:
#     KIRO_API_KEY=… sbx app run kiro          (via OPS_ENV_KIRO_API_KEY, or `--env`)
# Only if you have verified the CLI sends it as `Authorization: Bearer` to the runtime host
# is the never-in-cage `[secret]` broker below usable — verify before uncommenting.
#[secret."runtime.us-east-1.kiro.dev"]
#from = "env://KIRO_API_KEY"
#header = "Authorization"
#type = "bearer"

# Egress — deny by construction except Kiro's own service hosts. Two regions are listed
# (us-east-1 primary, eu-central-1 Europe); the CLI talks to whichever your account uses.
# A host the CLI reaches that is not listed returns a 403 whose body names the exact rule to
# add — `sbx net allow <host> -a kiro` — so extend this as your first login/run surfaces one.
# NOTE: this allowlist governs DAILY runs (`chat`/`kiro-cli`), which need no browser. The
# in-cage browser LOGIN is done under `--net allow` (see the LOGIN note), which replaces this
# list for that one run — do not try to enumerate the IdP's host sprawl here.
# Where a web link opens, declared rather than scripted. sbx generates the `xdg-open` the cage
# reaches and the desktop entry the in-cage portal resolves, and freezes both, so a link opens the
# same way whichever of the two a caller uses.
#
# `mode = "detach"` is load-bearing, not a preference. kiro-cli opens the sign-in URL and WAITS for
# the opener to exit before driving the code-for-token exchange; a handler that becomes the browser
# never returns, so the login stalls on "Opening browser..." with the browser itself working fine and
# no token ever persisted. Detached, the opener returns at once and the exchange runs.
#
# The Chromium flags carry the rest of what that login needs. `--host-resolver-rules` pins the
# dynamic-port localhost callback to IPv4: kiro-cli's callback server binds 127.0.0.1 only, while the
# cage's synthetic hosts file maps `localhost` to both families and the empty netns brings up no IPv6
# loopback, so without it the redirect can try `::1` and stall. The three `--disable-*background*`
# flags keep the renderer's timers live in a window that is never focused, so the provider's
# meta-refresh redirect chain is not throttled. `--use-system-ca` makes Chromium trust sbx's
# per-session MITM CA under the allowlist. `--no-sandbox` because sbx's build strips the setuid bit
# off chrome-sandbox, so Chromium's own SUID sandbox would abort FATAL; the cage is the boundary.
# Chromium's output lands in `.sbx-open.log` in the isolated home, which is where to look if the
# window opens and the login goes nowhere.
#
# Must stay below every top-level key: written above one, TOML would fold that key into this table.
[open]
http = { cmd = ["chromium", "--no-sandbox", "--ozone-platform=wayland", "--disable-dev-shm-usage", "--use-system-ca", "--password-store=basic", "--host-resolver-rules=MAP localhost 127.0.0.1", "--disable-background-timer-throttling", "--disable-backgrounding-occluded-windows", "--disable-renderer-backgrounding", "--no-first-run", "--no-default-browser-check"], mode = "detach" }
https = { cmd = ["chromium", "--no-sandbox", "--ozone-platform=wayland", "--disable-dev-shm-usage", "--use-system-ca", "--password-store=basic", "--host-resolver-rules=MAP localhost 127.0.0.1", "--disable-background-timer-throttling", "--disable-backgrounding-occluded-windows", "--disable-renderer-backgrounding", "--no-first-run", "--no-default-browser-check"], mode = "detach" }

[network]
mode = "deny"
allow = [
    # The inference, auth, sign-in, management and update hosts all arrive with the `kiro` bundle
    # (`use` above) and are unioned into this list at resolution — inspect them with
    # `sbx bundle kiro`, and see what the launch ends up with via `sbx config show --app kiro`.
    #
    # Enterprise AWS IAM Identity Center (`--license pro`) also needs your org's portal +
    # directory hosts — uncomment and replace <region>/<directory> with yours (the OIDC host
    # above is already allowed). See kiro.dev/docs/cli/authentication.
    #"{*} https://portal.sso.us-east-1.amazonaws.com",
    #"{*} https://<directory>.awsapps.com",
    #"{GET} https://signin.aws",
]

# Telemetry / metrics we deliberately leave DENIED. The mute list itself rides the `kiro` bundle
# (`sbx bundle kiro` shows it): `mute` never changes the verdict (still refused, still counted by
# `sbx net stats`); it only keeps the refusal out of the default `sbx net log` so the actionable
# denials stay readable. See them with `sbx net log --all`, and edit from the CLI with
# `sbx net mute|unmute <host> -a kiro`.
#
# NOTE — one telemetry call canNOT be muted: kiro-cli's anonymous metrics POST to
# `cognito-identity.us-east-1.amazonaws.com` goes through an AWS SDK that, because `http_proxy` is
# set in the cage, emits an ABSOLUTE-form request INSIDE the CONNECT tunnel (`POST https://…/`
# instead of `POST /`). sbx's proxy requires the tunneled request to be origin-form and refuses
# that as `blocked (bad-request)` — a pre-verdict SECURITY GUARD, not a `deny`, and `mute` only
# suppresses `deny`. So it cannot be muted; instead the `cmd` wrapper above disables telemetry at
# the SOURCE on first launch (`kiro-cli settings telemetry.enabled false`, persisted in the isolated
# ~/.kiro/settings/cli.json), which stops cognito-identity AND every telemetry host below from being
# called at all. The mutes below stay as a belt-and-suspenders in case telemetry is re-enabled.
mute = [
    # Nothing here: the telemetry hosts, the cookie-banner beacons, `@chromium-background` and the
    # translation service arrive with the bundle and are unioned into this list at resolution.
]
