# Mistral Vibe — Mistral's minimal open-source coding agent (CLI), sandboxed by sbx.
#
#   sbx app import examples/app/vibe.toml
#   sbx app run vibe
#
# THIS PROFILE IS NOT SELF-CONTAINED, on purpose. The agent's packages, the sign-in browser and the
# hosts they reach come from a shared BUNDLE, so import it too:
#     sbx bundle import examples/bundle/vibe.toml
#     sbx app import    examples/app/vibe.toml
# One extra step, and it buys the thing that was actually broken here: a hand-copy of an agent's
# requirements silently falls behind the agent.
#
#   EGRESS GROUPS — shared lanes, imported once (shared, not per-agent):
#     sbx net groups import examples/net-groups/pypi.toml
#     sbx net groups import examples/net-groups/chromium-background.toml
#
# Vibe (github.com/mistralai/mistral-vibe) is a Python coding agent published to PyPI as the
# `mistral-vibe` package (it exposes the `vibe` command; requires Python >=3.12). sbx equips it via
# mise's pipx backend — `mise:pipx:mistral-vibe` in [packages] — so `sbx upgrade mise` rolls it
# forward (it is a real backend-managed tool, not a one-shot install). mise's pipx backend runs
# `uv tool install` because `nix:uv` puts uv on PATH (a supported Python comes from `nix:python312`),
# resolving the wheels from PyPI on the first launch (a few tens of MiB, seconds) and reusing them
# offline after. The launch `cmd` below only sets up the in-cage SSO browser, then execs `vibe`.
#
# AUTHENTICATION — Mistral account SSO, in an IN-CAGE browser (this profile's default).
# On first launch (or `vibe --setup`) Vibe's onboarding offers "sign in with your Mistral account".
# Verified against the source (vibe/setup/auth/browser_sign_in.py): this is a POLLING flow, not a
# loopback callback — Vibe calls `webbrowser.open(sign_in_url)` on console.mistral.ai, then POLLS
# console.mistral.ai until you complete sign-in, and exchanges the result for an API key saved in
# the app's isolated ~/.vibe home (so it persists there, never in the project shell). Because the
# callback is server-side polling, no `forward` is needed — a browser INSIDE the cage is enough, and
# everything (the sign-in page + the poll) closes in the sandbox.
#
# The browser is a real Chromium provisioned into the cage (see [packages] + `gui`/`gpu` below).
# Two details make it work: (1) Vibe's `webbrowser.open` BLOCKS on an unknown browser command (it
# `wait()`s for the process), so `BROWSER` points at the `sbx-open` wrapper written by `cmd`, which
# launches Chromium in the background with `nohup … &` (the cage ships no `setsid`) and returns
# immediately, so the TUI never freezes; (2) under a filtering posture on a `gui = "wayland"` cage,
# sbx seeds its per-session MITM CA into the cage's NSS db automatically (Chromium ignores the
# CA-file env vars other tools honour), so HTTPS to console.mistral.ai succeeds — `--use-system-ca`
# tells Chromium to consult that store, and `--password-store=basic` keeps the SSO cookies in a file
# store (no keyring in the cage) so the session survives a relaunch. Chromium's output is logged to
# `~/sbx-browser.log` in the isolated home, in case a launch ever fails.
#
# API-KEY (BYOK) is available as an alternative to the browser sign-in — see the [env]/[secret]
# blocks at the bottom of this file.
cmd = [
    "bash",
    "-c",
    '''
set -e
mkdir -p "$HOME/.local/bin"
# vibe opens the sign-in URL via Python's webbrowser, which BLOCKS on an unknown command; this
# wrapper backgrounds an in-cage Chromium (nohup, since the cage has no setsid) and exits 0
# immediately, so the TUI never freezes. Chromium's output is captured for troubleshooting.
cat > "$HOME/.local/bin/sbx-open" <<'WRAP'
#!/bin/sh
nohup chromium --no-sandbox --ozone-platform=wayland --disable-dev-shm-usage \
  --use-system-ca --password-store=basic --no-first-run --no-default-browser-check \
  "$@" >"$HOME/sbx-browser.log" 2>&1 &
exit 0
WRAP
chmod +x "$HOME/.local/bin/sbx-open"
export BROWSER="$HOME/.local/bin/sbx-open"
exec vibe "$@"
''',
    "vibe",
]

# DISPLAY + GPU — needed so the in-cage Chromium (the SSO sign-in window) actually maps. `gui =
# "wayland"` binds the host Wayland compositor socket (read-only) and provisions fonts; X11 is never
# offered. Isolation is compositor-dependent — Mutter (GNOME) is safe; wlroots compositors (sway,
# hyprland) expose screen-capture/input-injection to ordinary clients (see
# docs-site/docs/guide/configuration/gui.md). `gpu = true` opens hardware-accelerated rendering (mesa into
# sbx's own store, the render node under /dev/dri, the minimal /sys DRM subtree the driver needs);
# without it a Chromium window on Wayland often produces no buffer and never maps. mesa covers
# Intel/AMD/nouveau; an NVIDIA-only machine falls back to software (renders, slower). Both are
# security fields, honored only because this profile lives in your trusted config dir.
gui = "wayland"
gpu = true

# Your host Vibe config, mounted read-write at its real absolute path. `binds` is a security field,
# honored only because this profile lives in your trusted config dir; `mode = "rw"` lets the caged
# `vibe` read and write these host files (config.toml, saved API key, history). Uncomment to share
# your host Vibe setup with the cage instead of the app's isolated home (the default). Vibe stores
# its config + credentials under ~/.vibe.
#binds = [
#    { path = "~/.vibe", mode = "rw" },
#]

# --- The agent's requirements come from its bundle ------------------------------------------------
# `use` pulls in the `vibe` BUNDLE — the pipx install and its uv/Python substrate, the sign-in
# Chromium, the Mistral and SSO hosts, and the browser noise mutes — from one declaration shared
# with the bundle file itself, so this profile cannot fall behind when the agent's requirements
# change. The posture (`gui`/`gpu`) stays here: a bundle may never widen it.
#
# IMPORT THE BUNDLE FIRST — it is not in this file:
#     sbx bundle import examples/bundle/vibe.toml
# Without it the launch warns that the bundle is undeclared and the agent is simply absent.
use = ["vibe"]

# No `[packages]` here: the agent's packages come from its bundle — see `use` above.

# Egress is denied by construction except the SSO host, the Mistral API, and the install-time PyPI
# hosts. An app is read-by-default ({GET,HEAD}): the SSO + API hosts the agent POSTs to are opened
# to all verbs with `{*}`; the pure-download PyPI hosts stay `{GET}` (least privilege).
[network]
mode = "deny"
allow = [
    # Mistral's own domain, its experiments SDK, the Google SSO chain and the PyPI install lane all
    # arrive with the `vibe` bundle (`use` above) and are unioned into this list at resolution —
    # inspect them with `sbx bundle vibe`, and see the launch's own view with
    # `sbx config show --app vibe`. If you use a third-party IdP other than Google, the proxy names
    # its host: add it here.
]

# Keep Chromium's own denied telemetry out of the default `sbx net log` (still denied, still counted
# in `sbx net stats`; see them with `--all`). These are the usual Chromium background hosts; watch
# `sbx net log -a vibe` on your first sign-in and add any other host it hammers.
mute = [
    # Nothing here: the browser background services, the page telemetry and the analytics beacon
    # arrive with the bundle and are unioned in at resolution. One refusal is deliberately NOT
    # muted there — `widget.intercom.io`, which hits once and is more useful visible.
]
# NOT muted on purpose (refused by the allowlist, but only ONE hit — not spam, so keeping it VISIBLE in
# `sbx net log` is more useful than hiding it): `widget.intercom.io` (Intercom support-chat widget, not
# used from the CLI). (`experiments.mistral.services` is now ALLOWED above — Mistral's first-party flags.)

# API-KEY (BYOK) alternative to the SSO sign-in above. The real key is read on the HOST and injected
# by the egress proxy — never in the cage. Uncomment both blocks and provide $MISTRAL_API_KEY on the
# host; the in-cage placeholder lets Vibe start and issue the request, and the proxy strips it and
# substitutes the real key on the wire to api.mistral.ai. (With this path you can drop `chromium` +
# the `gui`/`gpu` lines for a much lighter cage.)
[env]
#MISTRAL_API_KEY = "sbx-placeholder-replaced-by-the-egress-proxy"

#[secret."api.mistral.ai"]
#from = "env://MISTRAL_API_KEY"
#header = "Authorization"
#type = "bearer"
