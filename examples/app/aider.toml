# aider — the AI pair-programming CLI (aider-ai/aider), sandboxed by sbx.
#
#   sbx bundle import examples/bundle/aider.toml
#   sbx app import examples/app/aider.toml
#   sbx app run aider
#
# THIS PROFILE IS NOT SELF-CONTAINED, on purpose. The agent's package and hosts come from a shared
# BUNDLE, so import it too:
#     sbx bundle import examples/bundle/aider.toml
#     sbx app import examples/app/aider.toml
# One extra step, and it buys the thing that was actually broken here: a hand-copy of an agent's
# requirements silently falls behind the agent.
#
# Aider is the original open-source pair-programming agent: a Python terminal REPL that works
# DIRECTLY on your git repo (edits go through commits you review; `git diff` drives the workflow).
# It routes to any provider via model-name prefixes (`--model sonnet`, `--model openrouter/…`,
# `--model gemini/…`, `--model groq/…`, `--model ollama/…` …), so it needs a git repo in the
# project bind and ONE provider key.
#
# The tool is equipped fresh from upstream: mise's `pipx` backend runs `uv tool install
# aider-chat` (the same clean path `vibe` uses — `nix:uv` puts uv on PATH, `nix:python312`
# supplies an interpreter in the `>=3.10,<3.15` range the project requires), resolving the
# wheels from PyPI on first launch and reusing them offline after. `sbx upgrade mise` rolls it
# forward. No nixpkgs lag, no source build, no vendor SDK shim.
#
# CONFIG + STATE — `.aider.conf.yml` in the project (or `~/.aider.conf.yml`), plus the model
# repo cache `.aider.model.settings.yml` / `.aider.model.metadata.json`; session history under
# the app's isolated home. All project-level config rides the project bind; the isolated home
# keeps the rest.
#
# CREDENTIALS — BYOK, one env var per provider (the proxy names a host the flow reaches that is
# not in `allow`; check ahead with `sbx test net <url>`):
#
#  - **OpenAI-compatible**: `OPENAI_API_KEY` (api.openai.com) — or OpenRouter via
#    `OPENROUTER_API_KEY`; either works, pick the ONE you use in `allow` + `[secret]`.
#  - **Anthropic**: `ANTHROPIC_API_KEY` → api.anthropic.com (`--model sonnet` and friends).
#  - **Gemini**: `GEMINI_API_KEY` → generativelanguage.googleapis.com.
#  - **Local** (Ollama/LM Studio on the HOST loopback): name the port with a `tcp://localhost:<port>`
#    allow rule (ollama :11434, LM Studio :1234). sbx opens a listener inside the cage on that exact
#    port and relays it to the service on YOUR loopback, so `--model ollama_chat/…` works with the
#    allowlist intact — one port at a time, no `network = "shared"` (see `openfox.toml`).
# The keys are read on the HOST and injected by the egress proxy on the wire — they never
# enter the cage (see the [secret] blocks below).
#
# ANALYTICS — aider asks once on first run (opt-in, random by default) and posts usage events
# to PostHog (`us.i.posthog.com`); `--analytics-disable` opts out permanently, or answer the
# prompt "no". The host is DENIED and muted below — a `mute` never changes the verdict (still
# refused) and never hides a count (`sbx net stats` still tallies it). Aider survives the
# failure (it disables PostHog on post errors — aider/analytics.py `posthog_error`).
#
# GIT IDENTITY — aider does not start in a repository with no `user.name`/`user.email`: it tries
# to write placeholders into `.git/config`, which the cage keeps read-only, and dies on the write.
# The cage does not see your host `~/.gitconfig`, so name yourself in the `GIT_CONFIG_*` lines of
# `[env]` below; sbx counts its own pair after them. A repository that sets its own identity needs
# nothing.
#
# STATUS — the equip, a first message through OpenRouter under `mode = "deny"` with the key
# injected by the proxy, and `--show-prompts` were run in the cage (aider 0.86.2). Not run: the
# other providers, a local model through a `tcp://localhost` relay, and the analytics prompt.
# Grounded in the sources: the PyPI packaging (name `aider-chat`, bin `aider`,
# `requires-python >=3.10,<3.15` — pyproject.toml), the config file names (aider/main.py:
# `.aider.conf.yml`, `.aider.model.settings.yml`, `.aider.model.metadata.json`), the analytics
# flags and PostHog host (aider/args.py, aider/analytics.py), and the provider model-prefix
# routing (README/`aider --help`).
#
# The command puts the C++ runtime on the loader path before starting aider. Its native wheels
# (`tokenizers`) link `libstdc++.so.6`, which the nix interpreter does not search for; the bundle
# declares `nix:gcc.cc` on the interpreter's own lock, and the library directory is read from that
# package's store references at each start, because the store path moves on every
# `sbx upgrade nix`. Arguments after `sbx app run aider --` reach aider verbatim through `"$@"`.
cmd = [
    "bash",
    "-c",
    '''
if gcc_bin="$(command -v gcc)"; then
  for ref in $(nix-store -q --references "$(dirname "$(dirname "$gcc_bin")")"); do
    if [ -e "$ref/lib/libstdc++.so.6" ]; then
      export LD_LIBRARY_PATH="$ref/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
      break
    fi
  done
fi
# The cage's summary as a read-only file, through a `--load` command file (see the note below
# `cmd`). `load` holds one file, so a `load` of yours is left in place and this one is not added.
if [ -r /opt/sbx/contract-summary.md ] && [ -z "${AIDER_LOAD:-}" ] \
   && ! grep -qs '^load:' "$HOME/.aider.conf.yml" .aider.conf.yml \
        "$(git rev-parse --show-toplevel 2>/dev/null || echo .)/.aider.conf.yml" \
   && mkdir -p /etc/aider 2>/dev/null \
   && printf '%s\n' '/read-only /opt/sbx/contract-summary.md' > /etc/aider/sbx.load; then
  set -- --load /etc/aider/sbx.load "$@"
fi
exec aider "$@"
''',
    # `$0` placeholder: the arguments after `--` arrive as `$1 $2 …`.
    "aider",
]

# The command hands aider the cage's summary (/opt/sbx/contract-summary.md: what it may reach, which
# files it protects, which operations it offers) as a read-only file: it writes a command file under
# the cage's own `/etc` (a tmpfs: it lives for this launch only and never reaches the host) holding
# `/read-only /opt/sbx/contract-summary.md`, and passes it as `--load`, which runs it before the
# session or the `--message` starts. The files the project's `read:` list (or `AIDER_READ`) names
# still load beside it; `--read` is not used, since on the command line it drops that list without a
# word. `load` holds one file: when you set your own (`load:` in a `.aider.conf.yml` of your home,
# the project or its git root, or `AIDER_LOAD`), the command leaves yours in place and adds nothing,
# and a `--load` you pass after `--` replaces this one. A bare `/drop` removes the summary for the
# rest of the session. Arguments after `sbx app run aider --` reach aider verbatim through `"$@"`.

# Your host aider config, mounted read-write at its real absolute paths. `binds` is a security
# field, honored only because this profile lives in your trusted config dir; `mode = "rw"` lets
# the caged `aider` read and write these host files (config, model cache). Uncommented, the bind
# appears at that host path and not under the cage's `$HOME` (`/home/sandbox`), so the app keeps
# its isolated home and reaches these files only by their absolute path.
#binds = [
#    { path = "~/.aider.conf.yml", mode = "rw" },
#    { path = "~/.aider.model.settings.yml", mode = "rw" },
#    { path = "~/.aider.model.metadata.json", mode = "rw" },
#]

# --- The agent's requirements come from its bundle ------------------------------------------------
# `use` pulls in the `aider` BUNDLE — the package(s), the environment it reads, the hosts it must
# reach, and its telemetry mutes — from one declaration shared with the bundle file itself, so this
# profile cannot fall behind when the agent's requirements change.
#
# THE BUNDLE IS NOT IN THIS FILE — import it too, in either order:
#     sbx bundle import examples/bundle/aider.toml
# Without it the launch warns that the bundle is undeclared and the agent is simply absent.
use = ["aider"]

# No `[packages]` here: the agent's package comes from its bundle — see `use` above.

[network]
mode = "deny"
# Egress is denied by construction except the ONE provider you actually use (the model host the
# agent POSTs to is opened to all verbs with `{*}`; an app is read-by-default). The PyPI hosts
# are the install-time fetch (same as `vibe`); the self-update/`aider --version` check rides the
# built-in github allow-set.
# The agent's OWN hosts are NOT listed here — they arrive with its bundle (`use` above) and are
# unioned into this list at resolution. Check what that adds with `sbx bundle aider`, and what the
# launch ends up with via `sbx config show --app aider`.
allow = [
    # Install-time (mise's `uv tool install`): the Python wheels and the package index.
    # BYOK provider — uncomment the ONE you use, with the matching [secret] block below.
    #"{*} https://api.openai.com",
    #"{*} https://api.anthropic.com",
    #"{*} https://openrouter.ai",
    #"{*} https://generativelanguage.googleapis.com",
]
# Silence the DENIED analytics: aider posts usage events to PostHog, refused by the allowlist
# (`denied-default`). `mute` keeps those refusals out of the default `sbx net logs` (still
# denied, still counted in `sbx net stats`; see them with `--all`). Aider disables PostHog
# automatically when the post fails, so the first-run consent question still behaves.
mute = [
]

# BYOK: the real key is read on the HOST and injected by the egress proxy — never in the cage.
# The in-cage placeholder lets `aider` start and issue the request; the proxy strips it and
# substitutes the real key on the wire to the matching host. Uncomment the pair matching the
# ONE provider `allow` opens (aider picks the provider from the model prefix, the key from the
# env var — e.g. `--model openrouter/anthropic/claude-sonnet-4`).
[env]
# The commit identity aider requires (see GIT IDENTITY above): your own name and address.
#GIT_CONFIG_COUNT = "2"
#GIT_CONFIG_KEY_0 = "user.name"
#GIT_CONFIG_VALUE_0 = "Your Name"
#GIT_CONFIG_KEY_1 = "user.email"
#GIT_CONFIG_VALUE_1 = "you@example.com"
#OPENAI_API_KEY = "sk-sbx-placeholder-replaced-by-the-egress-proxy"
#ANTHROPIC_API_KEY = "sk-ant-sbx-placeholder-replaced-by-the-egress-proxy"
#OPENROUTER_API_KEY = "sk-or-sbx-placeholder-replaced-by-the-egress-proxy"
#GEMINI_API_KEY = "sbx-placeholder-replaced-by-the-egress-proxy"

#[secret."api.openai.com"]
#from = "env://OPENAI_API_KEY"
#header = "Authorization"
#type = "bearer"
#[secret."api.anthropic.com"]
#from = "env://ANTHROPIC_API_KEY"
#header = "x-api-key"
#type = "raw"
#[secret."openrouter.ai"]
#from = "env://OPENROUTER_API_KEY"
#header = "Authorization"
#type = "bearer"
#[secret."generativelanguage.googleapis.com"]
#from = "env://GEMINI_API_KEY"
#header = "x-goog-api-key"
#type = "raw"