# VT Code — a Rust terminal coding agent with multi-provider LLM support, sandboxed by sbx.
#
#   sbx bundle import examples/bundle/vtcode.toml
#   sbx app import    examples/app/vtcode.toml
#   sbx app run vtcode
#
# THIS PROFILE IS NOT SELF-CONTAINED, on purpose. The agent's package and hosts come from a shared
# BUNDLE, so import it too:
#     sbx bundle import examples/bundle/vtcode.toml
#     sbx app import    examples/app/vtcode.toml
# One extra step, and it buys the thing that was actually broken here: a hand-copy of an agent's
# requirements silently falls behind the agent.
#
# VT Code ships as a self-contained Rust release binary on its own GitHub releases
# (`vtcode-<version>-x86_64-unknown-linux-gnu.tar.gz`) — no node, no runtime deps. sbx equips it
# fresh from upstream via mise's `github` backend (the same clean path `kilocode` uses); the binary
# lands in the app's persistent isolated home, pinned at the version installed on the first launch
# in a project. Advance it with `sbx app upgrade vtcode` — do NOT use the built-in `vtcode update`, which
# would replace the binary underneath the pinned install.
#
# The agent's own search tools are external programs: ripgrep for content search and ast-grep for
# its symbol/outline maps (upstream's one-line installer pulls both). They are declared in the
# `vtcode` bundle as `nix:` packages, so they are host-provisioned, seeded into the project store and available
# offline — no second download path.
#
# BYOK, MULTI-PROVIDER. VT Code supports 21+ providers; its own default is OpenRouter (default
# model `xiaomi/mimo-v2.5-pro`), which is what this profile keys — one key, many models,
# OpenAI-compatible bearer auth. The real key is read on the HOST and injected by the egress proxy
# on the wire to openrouter.ai — never in the cage. Provide it on the host as `$OPENROUTER_API_KEY`
# (or point `from` at a resolver, e.g. `sops://secrets.yaml#openrouter`), then uncomment the `[env]`
# placeholder and the `[secret]` block. To use a different provider, change the allowlist host + the
# `[secret]` block + the env var — e.g. Anthropic (api.anthropic.com, ANTHROPIC_API_KEY, header
# "x-api-key", type "raw") or OpenAI (api.openai.com, OPENAI_API_KEY, header "Authorization", type
# "bearer"), and set `provider` in the project's `vtcode.toml`.
#
# A LOCAL MODEL INSTEAD. VT Code also drives Ollama / LM Studio / llama.cpp. Those listen on your
# HOST loopback, which the cage crosses by naming the port: a `tcp://localhost:<port>` allow rule
# (:11434 ollama, :1234 LM Studio, :8080 llama.cpp) opens a listener on that exact port inside the
# cage and relays it to your service, so the endpoint works verbatim — one port at a time, and egress
# filtering stays on (the shape `examples/app/openfox.toml` documents).
#
# UNVERIFIED (like every profile until run with a real key): the live authentication and the model
# traffic through sbx's MITM. Grounded here: the packaging (upstream's own GitHub release), the
# default provider and model, and the provider env-var names (upstream's provider guide).
#
# The command hands VT Code the cage's summary (/opt/sbx/contract-summary.md: what it may reach,
# which files it protects, which operations it offers) as an instruction file, through the
# system-wide `/etc/vtcode/vtcode.toml`, the lowest of VT Code's config layers. `/etc` is the cage's
# own tmpfs, so the file lives for this launch only and never reaches the host. VT Code replaces an
# array from a higher layer rather than joining it: if your own config sets `agent.instruction_files`,
# yours applies and the summary is left out, so add `"/opt/sbx/contract-summary.md"` to your list to
# keep both. The same rule is why the summary is not passed as `-c agent.instruction_files=…`: that
# runtime layer sits above yours and would drop your list.
# Arguments after `sbx app run vtcode --` reach VT Code verbatim through `"$@"`.
cmd = [
    "bash",
    "-c",
    '''
if [ -r /opt/sbx/contract-summary.md ] && mkdir -p /etc/vtcode 2>/dev/null; then
  printf '%s\n' '[agent]' 'instruction_files = ["/opt/sbx/contract-summary.md"]' > /etc/vtcode/vtcode.toml
fi
exec vtcode "$@"
''',
    # `$0` placeholder: the arguments after `--` arrive as `$1 $2 …`.
    "vtcode",
]

# Your host VT Code config, mounted read-write at its real absolute path. `binds` is a security
# field, honored only because this profile lives in your trusted config dir; `mode = "rw"` lets the
# caged `vtcode` read and write these host files. Uncommented, the bind appears at that host path
# and not under the cage's `$HOME` (`/home/sandbox`), so the app keeps its isolated home and
# reaches these files only by their absolute path.
#binds = [
#    { path = "~/.config/vtcode", mode = "rw" },
#]

# --- The agent's requirements come from its bundle ------------------------------------------------
# `use` pulls in the `vtcode` BUNDLE — the package(s), the environment it reads, the hosts it must
# reach, and its telemetry mutes — from one declaration shared with the bundle file itself, so this
# profile cannot fall behind when the agent's requirements change.
#
# THE BUNDLE IS NOT IN THIS FILE — import it too, in either order:
#     sbx bundle import examples/bundle/vtcode.toml
# Without it the launch warns that the bundle is undeclared and the agent is simply absent.
use = ["vtcode"]

# No `[packages]` here: the agent's package comes from its bundle — see `use` above.
[network]
mode = "deny"
allow = [
    # The default provider. Uncomment the ONE matching your choice (see the [env]/[secret] examples
    # below); OpenRouter is VT Code's own default.
    #"{*} https://openrouter.ai",
    #"{*} https://api.anthropic.com",
    #"{*} https://api.openai.com",
]

# --- Provider key (commented) — uncomment the placeholder and the matching [secret] block. The
# in-cage placeholder lets VT Code start and issue its request; the proxy strips it and substitutes
# the real key, read on the HOST, on the wire. ---
[env]
#OPENROUTER_API_KEY = "sk-or-sbx-placeholder-replaced-by-the-egress-proxy"
#ANTHROPIC_API_KEY = "sk-ant-sbx-placeholder-replaced-by-the-egress-proxy"
#OPENAI_API_KEY = "sk-sbx-placeholder-replaced-by-the-egress-proxy"

#[secret."openrouter.ai"]
#from = "env://OPENROUTER_API_KEY"
#header = "Authorization"
#type = "bearer"
#[secret."api.anthropic.com"]
#from = "env://ANTHROPIC_API_KEY"
#header = "x-api-key"
#type = "raw"
#[secret."api.openai.com"]
#from = "env://OPENAI_API_KEY"
#header = "Authorization"
#type = "bearer"
