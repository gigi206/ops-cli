# Pi — a minimal, provider-agnostic (BYOK) terminal coding agent, sandboxed by sbx.
#
#   sbx bundle import examples/bundle/pi.toml
#   sbx app import    examples/app/pi.toml
#   sbx app run pi
#
# THIS PROFILE IS NOT SELF-CONTAINED, on purpose. The agent's package and hosts come from a shared
# BUNDLE, so import it too:
#     sbx bundle import examples/bundle/pi.toml
#     sbx app import    examples/app/pi.toml
# One extra step, and it buys the thing that was actually broken here: a hand-copy of an agent's
# requirements silently falls behind the agent.
#
# The tool is equipped fresh from upstream (mise's `aqua` backend pulls the standalone
# `pi` release binary from GitHub) — no nixpkgs lag, no node runtime needed. It is
# equipped at the latest upstream version on the first launch in a project and pinned there,
# so a later upstream release cannot change what runs under you; `sbx app upgrade pi`
# advances that pin.
#
# Pi is MULTI-PROVIDER (it speaks each provider's native API directly), so its egress
# depends on the provider you key it to. This template is set up for Anthropic; for
# OpenAI, change the allowlist to "api.openai.com" and the [secret] block to header
# "Authorization", type "bearer", env OPENAI_API_KEY. (Pi's Google Gemini path uses a
# query-parameter key, which the header-injection model below cannot broker — use
# Anthropic or OpenAI for the sandboxed credential boundary.) If a request is blocked,
# the proxy reports the host it refused — add it to `allow` (or check ahead with
# `sbx test net <url>`).
cmd = "pi"

# Your host Pi config, mounted read-write at its real absolute path. `binds` is a security field,
# honored only because this profile lives in your trusted config dir; `mode = "rw"` lets the caged
# `pi` read and write these host files (auth, API keys, sessions). Uncomment to share your host Pi
# setup with the cage instead of the app's isolated home (the default).
#binds = [
#    { path = "~/.pi/agent", mode = "rw" },
#]

# --- The agent's requirements come from its bundle ------------------------------------------------
# `use` pulls in the `pi` BUNDLE — the package(s), the environment it reads, the hosts it must
# reach, and its telemetry mutes — from one declaration shared with the bundle file itself, so this
# profile cannot fall behind when the agent's requirements change.
#
# THE BUNDLE IS NOT IN THIS FILE — import it too, in either order:
#     sbx bundle import examples/bundle/pi.toml
# Without it the launch warns that the bundle is undeclared and the agent is simply absent.
use = ["pi"]

# No `[packages]` here: the agent's package comes from its bundle — see `use` above.

# An app is read-by-default ({GET,HEAD}); the API host the agent POSTs to is opened with `{*}`.
[network]
mode = "deny"
# The agent's OWN hosts are NOT listed here — they arrive with its bundle (`use` above) and are
# unioned into this list at resolution. Check what that adds with `sbx bundle pi`, and what the
# launch ends up with via `sbx config show --app pi`.
allow = [
 # Direct-OpenRouter BYOK: uncomment together with the [secret] block below.
 #"{*} https://openrouter.ai",
]

# The real API key is read on the HOST and injected by the egress proxy — never in the
# cage. Provide it on the host as $OPENROUTER_API_KEY (or point `from` at a resolver,
# e.g. sops://secrets.yaml#openrouter). The in-cage placeholder lets the CLI start and
# issue the request; the proxy strips it and substitutes the real key on the wire to
# openrouter.ai.
[env]
#OPENROUTER_API_KEY = "sk-or-sbx-placeholder-replaced-by-the-egress-proxy"

#[secret."openrouter.ai"]
#from = "env://OPENROUTER_API_KEY"
#header = "Authorization"
#type = "bearer"
