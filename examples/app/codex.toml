# Codex — OpenAI's coding agent CLI, sandboxed by sbx.
#
#   sbx app import examples/app/codex.toml
#   sbx app run codex
#
# THIS PROFILE IS NOT SELF-CONTAINED, on purpose. The agent's package and hosts come from a shared
# BUNDLE, so import it too:
#     sbx bundle import examples/bundle/codex.toml
#     sbx app import    examples/app/codex.toml
# One extra step, and it buys the thing that was actually broken here: a hand-copy of an agent's
# requirements silently falls behind the agent.
#
# The tool is equipped fresh from upstream (mise's `aqua` backend pulls OpenAI's codex
# release binary) — no nixpkgs lag. It is equipped at the latest upstream version on the
# first launch in a project; advancing an already-installed version is not yet automated
# by `sbx upgrade`.
#
# Two authentication paths are supported:
#
#  - **API key** (header-injected): set `$OPENAI_API_KEY` on the host and uncomment the
#    `[secret."api.openai.com"]` block below. The egress proxy injects the key on the wire
#    to api.openai.com; the plaintext never enters the cage.
#  - **ChatGPT login (OAuth)**: run `sbx app run codex`, then `codex login` inside the cage.
#    Codex opens the OAuth URL in your host browser; the provider redirects to
#    http://localhost:1455/auth/callback, and `forward = [1455]` forwards that host
#    loopback port into the cage so codex (listening on its own loopback) receives the
#    code. The resulting token persists in the app's isolated `$HOME`, so login is a
#    one-time step. The allowlist below opens the OAuth/runtime hosts.
#
# Both paths ride the same Model-B allowlist; the OAuth runtime hosts the CLI talks to are
# confirmed at first login — a host the flow reaches that is not listed returns a 403 whose
# body names `sbx net allow <host>`, so add any missing host the proxy surfaces.
# sbx IS the sandbox (bwrap + seccomp + empty netns + egress allowlist), so codex's own nested
# bubblewrap sandbox is redundant here — and unreachable anyway: the cage's seccomp filter blocks
# the mount/namespace family a nested bwrap needs (unshare/mount/pivot_root), so it cannot start
# (that is the "could not find bubblewrap on PATH" warning, and the bundled fallback fails too).
# `--sandbox danger-full-access` turns codex's own sandbox off — OpenAI recommends exactly this when
# Codex runs inside a pre-existing containment environment. It drops only codex's *internal*
# restrictions; the real filesystem and network boundary stays sbx's cage and its egress allowlist.
cmd = ["codex", "--sandbox", "danger-full-access"]

# Forward the host's localhost:1455 into the cage so the OAuth callback reaches codex.
# A port already in use on the host fails the launch closed (the redirect URL is fixed).
# Must stay a top-level key: written after a `[table]` header, TOML would fold it into that
# table (e.g. `network.forward`) and it would be silently ignored.
forward = [1455]

# AUDIO — the Codex CLI has a terminal voice-transcription mode (hold space; `voice_transcription`).
# It captures the microphone through the `cpal` crate → the ALSA API, which does not itself speak
# PulseAudio. `audio = true` provisions the PulseAudio client + the ALSA→PulseAudio compatibility
# shim (alsa-plugins + an asound.conf routing `default` → pulse), so an ALSA capture reaches the host
# microphone — see docs-site/docs/guide/configuration/audio.md. A security field, trusted-only: the PulseAudio
# bus exposes the microphone AND all system-audio output. Comment it out if you never use voice.
audio = true

# Your host Codex config, mounted read-write at its real absolute path. `binds` is a security
# field, honored only because this profile lives in your trusted config dir; `mode = "rw"` lets
# the caged `codex` read and write these host files (auth.json, config.toml, sessions). Uncomment
# to share your host Codex setup with the cage instead of the app's isolated home (the default).
#binds = [
#    { path = "~/.codex", mode = "rw" },
#]

# --- The agent's requirements come from its bundle ------------------------------------------------
# `use` pulls in the `codex` BUNDLE — the package(s), the environment it reads, the hosts it must
# reach, and its telemetry mutes — from one declaration shared with the bundle file itself, so this
# profile cannot fall behind when the agent's requirements change.
#
# IMPORT THE BUNDLE FIRST — it is not in this file:
#     sbx bundle import examples/bundle/codex.toml
# Without it the launch warns that the bundle is undeclared and the agent is simply absent.
use = ["codex"]

# No `[packages]` here: the agent's package comes from its bundle — see `use` above.

# Egress is denied by construction except OpenAI's hosts: the API the CLI POSTs completions to
# (api.openai.com), the OAuth login/authorization host (auth.openai.com — the ChatGPT-login flow
# described above), and the ChatGPT backend codex streams through (chatgpt.com). The github.com
# entry serves OpenAI's plugins repo over git smart-HTTP fetch (git-upload-pack). An app is
# read-by-default ({GET,HEAD}); the API/auth/backend hosts the agent POSTs to are opened to every
# verb with `{*}`. The WebSocket stream to chatgpt.com is a distinct capability and keeps its own
# explicit {WS} grant (below).
[network]
mode = "deny"
# The agent's OWN hosts are NOT listed here — they arrive with its bundle (`use` above) and are
# unioned into this list at resolution. Check what that adds with `sbx bundle codex`, and what the
# launch ends up with via `sbx config show --app codex`.
allow = [
  #"{*} https://ab.chatgpt.com",
  # OpenAI's file-storage CDN — codex downloads files generated by its remote sandbox from a
  # regional subdomain (e.g. sdmntprnorthcentralus.oaiusercontent.com). The prefix varies by
  # region, so the apex + subdomains are opened together via `*.oaiusercontent.com` (spoof-safe);
  # the fetch is a GET, so it stays read-scoped.
  # codex streams over `wss://chatgpt.com`. A WebSocket is a distinct capability that a plain `{*}`
  # does NOT grant (it is a bidirectional, uninspected channel) — it must be named explicitly.
]

# API-key path: the real key is read on the HOST and injected by the egress proxy — never in
# the cage. Provide it on the host as $OPENAI_API_KEY (or a resolver) and uncomment to use the
# API-key path instead of the OAuth login.
[env]
#OPENAI_API_KEY = "sk-sbx-placeholder-replaced-by-the-egress-proxy"

#[secret."api.openai.com"]
#from = "env://OPENAI_API_KEY"
#header = "Authorization"
#type = "bearer"
