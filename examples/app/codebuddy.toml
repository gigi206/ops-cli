# CodeBuddy Code — Tencent's agentic coding CLI, sandboxed by sbx.
#
#   sbx bundle import examples/bundle/codebuddy.toml
#   sbx app import examples/app/codebuddy.toml
#   sbx app run codebuddy
#
# THIS PROFILE IS NOT SELF-CONTAINED, on purpose. The agent's package and hosts come from a shared
# BUNDLE, so import it too:
#     sbx bundle import examples/bundle/codebuddy.toml
#     sbx app import examples/app/codebuddy.toml
# One extra step, and it buys the thing that was actually broken here: a hand-copy of an agent's
# requirements silently falls behind the agent.
#
#   EGRESS GROUPS — shared lanes, imported once (shared, not per-agent):
#     sbx net groups import examples/net-groups/npm-audit.toml
#     sbx net groups import examples/net-groups/npm-jsr.toml
#     sbx net groups import examples/net-groups/npm-registry.toml
#
# CodeBuddy Code ships as an npm package from Tencent's own scope (`@tencent-ai/codebuddy-code`),
# a node CLI (`#!/usr/bin/env node`, Node ≥ 18.20.8 — the cage synthesises `/usr/bin/env`, so the
# shebang resolves). sbx equips it in-cage with mise's npm backend over a node runtime; the first
# launch in a project needs the network and the bundle's npm lane, and `sbx upgrade mise` rolls it
# forward afterwards.
#
# NATIVE ADDONS — why no `npm rebuild` wrapper here. The package's native pieces (`node-pty` for
# its terminal, Tencent's `sandbox-cli` helper) ship as PREBUILT platform packages resolved through
# optional dependencies, so mise's `--ignore-scripts=true` install leaves nothing to compile
# (contrast `openfox.toml`, whose addons are fetched by an install script and need an explicit
# `npm rebuild`). If a future release moves them behind a postinstall, the symptom is a missing
# `.node` at startup and the fix is that same wrapper shape.
#
# CREDENTIAL POSTURE — a CodeBuddy ACCOUNT, not a header-injectable provider key. The CLI's own
# product configuration declares an external-link login: it opens a browser at its endpoint and
# receives a bearer token (sent afterwards as `Authorization` plus an `X-User-Id` header). The
# hermetic cage has no browser, so either complete the login on your host and let the token land
# in the app's isolated home, or run the whole flow inside the sandbox with an in-cage Chromium
# (the recipe is in `examples/app/vibe.toml`). The binary also reads `CODEBUDDY_API_KEY` and
# `CODEBUDDY_AUTH_TOKEN` — observed in the shipped bundle, NOT documented publicly, so treat the
# headless path as unproven; if it works for you, pass it per launch with
# `sbx app run codebuddy --env CODEBUDDY_API_KEY=…` rather than baking it into this file.
#
# INTERNATIONAL vs CHINA. The shipped configuration carries two service families: the
# international endpoint `www.codebuddy.ai` (the default, which the bundle allows) and a China
# edition on `*.codebuddy.cn` / `copilot.tencent.com` (selected by the product's own configuration,
# not by this profile). If you use the China edition, add its hosts (offered commented in `allow`
# below) — the proxy will name whatever it refuses (`sbx net logs -a codebuddy`).
#
# UNVERIFIED (like every profile until run with a real account): the live login and the model
# traffic through sbx's MITM. Grounded here: the packaging (Tencent's own npm scope, no
# postinstall), the endpoints and auth headers (read out of the package's `product.json`), and the
# environment keys (read out of the shipped bundle).
#
# The command hands CodeBuddy the cage's summary (/opt/sbx/contract-summary.md: what it may reach,
# which files it protects, which operations it offers) through `--append-system-prompt`, which adds
# to the system prompt: the instructions in `~/.codebuddy/CODEBUDDY.md` still apply.
# `--append-system-prompt` takes text rather than a path, so the file is read here and passed as one
# argument, never evaluated; a summary too large for one argument is left out rather than stopping
# the launch. `--system-prompt` and `--system-prompt-file` would replace the system prompt instead.
# Arguments after `sbx app run codebuddy --` reach CodeBuddy verbatim through `"$@"`.
cmd = [
    "bash",
    "-c",
    '''
if [ -r "$SBX_CONTRACT_SUMMARY" ] && [ "$(wc -c < "$SBX_CONTRACT_SUMMARY")" -lt 100000 ]; then
  exec codebuddy --append-system-prompt "$(cat "$SBX_CONTRACT_SUMMARY")" "$@"
fi
exec codebuddy "$@"
''',
    # `$0` placeholder: the arguments after `--` arrive as `$1 $2 …`.
    "codebuddy",
]

# Your host CodeBuddy config, mounted read-write at its real absolute path. `binds` is a security
# field, honored only because this profile lives in your trusted config dir; `mode = "rw"` lets the
# caged CLI read and write these host files (login, settings). Uncommented, the bind appears at that
# host path and not under the cage's `$HOME` (`/home/sandbox`), so the app keeps its isolated home
# and reaches these files only by their absolute path. `CODEBUDDY_CONFIG_DIR` overrides the
# location.
#binds = [
#    { path = "~/.codebuddy", mode = "rw" },
#]

# --- The agent's requirements come from its bundle ------------------------------------------------
# `use` pulls in the `codebuddy` BUNDLE — the package(s), the environment it reads, the hosts it
# must reach, and its telemetry mutes — from one declaration shared with the bundle file itself, so
# this profile cannot fall behind when the agent's requirements change.
#
# THE BUNDLE IS NOT IN THIS FILE — import it too, in either order:
#     sbx bundle import examples/bundle/codebuddy.toml
# Without it the launch warns that the bundle is undeclared and the agent is simply absent.
use = ["codebuddy"]

# No `[packages]` here: the agent's package comes from its bundle — see `use` above.

# An app is read-by-default ({GET,HEAD}); the service endpoints carry POSTs, so they are opened to
# all verbs with `{*}`.
[network]
mode = "deny"
# The agent's OWN hosts are NOT listed here — they arrive with its bundle (`use` above) and are
# unioned into this list at resolution. Check what that adds with `sbx bundle codebuddy`, and what
# the launch ends up with via `sbx config show --app codebuddy`.
allow = [
    # Nothing here: the npm install lane and the international service hosts arrive with the bundle
    # and are unioned in at resolution.
    # China edition — uncomment these if that is your account (the international hosts stay open
    # through the bundle).
    #"{*} https://www.codebuddy.cn",
    #"{*} https://tencent.sso.codebuddy.cn",
]

# Refusals to keep OUT of the default `sbx net logs` (SELinux `dontaudit`). A `mute` never changes
# the verdict (it stays refused) and never hides a count. See it with `sbx net logs --all`; edit
# with `sbx net mute|unmute <rule> -a codebuddy`.
mute = [
    # Nothing here: the npm audit and JSR probes, irrelevant to whether the install succeeds, arrive
    # with the bundle and are unioned in at resolution.
]

[env]
