# Hermes — NousResearch's open-source agentic CLI (Hermes), sandboxed by sbx.
#
#   sbx bundle import examples/bundle/hermes.toml
#   sbx app import examples/app/hermes.toml
#   sbx app run hermes
#
# THIS PROFILE IS NOT SELF-CONTAINED, on purpose. The agent's package and hosts come from a shared
# BUNDLE, so import it too:
#     sbx bundle import examples/bundle/hermes.toml
#     sbx app import examples/app/hermes.toml
# One extra step, and it buys the thing that was actually broken here: a hand-copy of an agent's
# requirements silently falls behind the agent.
#
# Hermes ships as a nix flake, and sbx equips it via the flake's `#default` output —
# `flake:github:NousResearch/hermes-agent#default` in its bundle — so `sbx upgrade --app hermes` rolls it
# forward. That output bundles everything in one package: the Python agent (built with uv2nix, its
# own interpreter — no separate `nix:python`), the node-based TUI/web front-ends, and all the
# optional extras (voice, edge-tts, mcp, exa, firecrawl, …), each wired by the derivation's own
# wrapper (it sets HERMES_NODE / HERMES_TUI_DIR / HERMES_WEB_DIST for you). sbx builds a remote
# `flake:` ref HOST-SIDE with `nix build` (like `nix:`) into its shared store, then seeds it per
# project: the FIRST launch is a multi-minute, ~2 GiB build whose source fetches (the PyPI wheels for
# uv2nix, the npm deps for the node front-ends) use the HOST network — they are NOT subject to the
# cage's allowlist below, which governs only what the running agent may reach. Later launches reuse
# the warm build, and the build is shared with the other hermes profiles. The `hermes` bin it lands
# supports the CLI plus its built-in `--tui`/`--cli` modes; voice mode (Ctrl+B) works via
# `audio = true` below.
#
# Hermes is BYOK and multi-provider. This template keys it to OpenRouter (Hermes' default
# provider — one key, hundreds of models, OpenAI-compatible bearer auth). BYOK is commented
# out below, so this profile ships with no baked-in credential. Uncomment the [env] placeholder
# and the [secret] block, and provide $OPENROUTER_API_KEY on the host, to have the egress proxy
# inject the key on the wire to openrouter.ai — the plaintext never enters the cage. To use a
# different provider, change the allowlist host + the [secret] block + the env var — e.g.
# Anthropic (api.anthropic.com, ANTHROPIC_API_KEY, header "x-api-key", type "raw") or OpenAI
# (api.openai.com, OPENAI_API_KEY, header "Authorization", type "bearer"). If a request is
# blocked, the proxy reports the host it refused — add it to `allow` (or check ahead with
# `sbx test net <url>`).
cmd = [
    "bash",
    "-c",
    '''
# The cage's summary as the context of a managed `pre_llm_call` hook (see the note below `cmd`).
home="${HERMES_HOME:-$HOME/.hermes}"
# The interpreter Hermes runs on: the first `#!…python` along the launcher's `exec` chain (nix wraps
# the entry point in a shell script that execs the real one). The desktop app keeps its `hermes` off
# PATH and names it in its own launcher.
py=
f="$(command -v hermes 2>/dev/null)" \
  || f="$(grep -o '/nix/store/[a-z0-9]*-hermes-agent-[^/]*/bin/hermes' \
          "$(readlink -f "$(command -v hermes-desktop)" 2>/dev/null)" 2>/dev/null | head -n 1)"
f="$(readlink -f "$f" 2>/dev/null)"
for _ in 1 2 3; do
  [ -r "$f" ] && read -r first < "$f" || break
  case "$first" in
    '#!'*python*) py="${first#\#!}"; py="${py# }"; py="${py%% *}"; break ;;
  esac
  f="$(grep -o '^exec "[^"]*"' "$f" | tail -n 1)"; f="${f#exec \"}"; f="${f%\"}"
done
if [ -r /opt/sbx/contract-summary.md ] && [ -x "$py" ] \
   && ! grep -qs 'pre_llm_call' "$home/config.yaml" && mkdir -p /etc/hermes 2>/dev/null; then
  { printf '#!%s\n' "$py"; cat <<'PY'; } > /etc/hermes/sbx-contract-hook
import json, sys
try:
    payload = json.load(sys.stdin)
except ValueError:
    payload = {}
if isinstance(payload, dict) and (payload.get("extra") or {}).get("is_first_turn"):
    try:
        with open("/opt/sbx/contract-summary.md", encoding="utf-8") as f:
            print(json.dumps({"context": f.read()}))
    except OSError:
        pass
PY
  chmod 755 /etc/hermes/sbx-contract-hook
  printf '%s\n' 'hooks:' '  pre_llm_call:' '    - command: /etc/hermes/sbx-contract-hook' > /etc/hermes/config.yaml
  "$py" - "$home" <<'PY'
import json, os, sys, tempfile
home, command = sys.argv[1], "/etc/hermes/sbx-contract-hook"
path = os.path.join(home, "shell-hooks-allowlist.json")
try:
    with open(path, encoding="utf-8") as f:
        data = json.load(f)
except FileNotFoundError:
    data = {}
except (OSError, ValueError):
    sys.exit(0)
if not isinstance(data, dict):
    sys.exit(0)
approvals = data.get("approvals")
if not isinstance(approvals, list):
    approvals = data["approvals"] = []
if any(isinstance(e, dict) and e.get("event") == "pre_llm_call" and e.get("command") == command
       for e in approvals):
    sys.exit(0)
approvals.append({"event": "pre_llm_call", "command": command})
os.makedirs(home, exist_ok=True)
fd, tmp = tempfile.mkstemp(prefix=".sbx-allowlist.", dir=home)
with os.fdopen(fd, "w", encoding="utf-8") as f:
    json.dump(data, f, indent=2, sort_keys=True)
os.replace(tmp, path)
PY
fi
exec hermes "$@"
''',
    # `$0` placeholder: the arguments after `--` arrive as `$1 $2 …`.
    "hermes",
]

# The command hands Hermes the cage's summary (/opt/sbx/contract-summary.md: what it may reach,
# which files it protects, which operations it offers) through its managed configuration, the
# `/etc/hermes/config.yaml` layer Hermes reads over yours. That layer declares one `pre_llm_call`
# shell hook, `/etc/hermes/sbx-contract-hook`, which returns the summary as context on the first turn
# of a session; Hermes adds it to that turn's user message (never the system prompt) and replays it
# on the turns that follow. Your `agent.system_prompt`, personality and context files still apply.
# `/etc` is the cage's own tmpfs: both files live for this launch only and never reach the host. A
# shell hook runs only once approved, so the command adds that one hook to the approvals in
# `~/.hermes/shell-hooks-allowlist.json`, leaving yours as they are, rather than turning on
# `hooks_auto_accept`, which would approve any hook of yours still waiting. The managed layer would
# replace a `pre_llm_call` list of your own, so when your `config.yaml` has one the command adds
# nothing. `HERMES_SAFE_MODE=1` turns every shell hook off, this one included.
# Arguments after `sbx app run hermes --` reach Hermes verbatim through `"$@"`.

# AUDIO — Hermes has a first-class terminal voice mode (push-to-talk Ctrl+B: Whisper speech-to-text,
# confirmation beeps, and text-to-speech that reads the reply). It captures and plays through
# `sounddevice`/PortAudio → the ALSA API; Hermes explicitly supports running over a PulseAudio socket
# (it honors `PULSE_SERVER`). `audio = true` provisions the PulseAudio client + the ALSA→PulseAudio
# shim (alsa-plugins + an asound.conf routing `default` → pulse), so both capture and playback reach
# the host — see docs-site/docs/guide/configuration/audio.md. A security field, trusted-only: the PulseAudio bus
# exposes the microphone AND all system-audio output. Comment it out if you never use voice mode.
# (Local Whisper downloads its model on first use — if voice STT fails offline, allow the model host.)
audio = true

# BROWSER TOOLSET — `gui = "offscreen"` is what makes Hermes' 12 `browser_*` tools (navigate,
# snapshot, click, type, press, scroll, back, console, get_images, vision, cdp, dialog) appear. Hermes
# gates them on `agent-browser` being on PATH AND a Chromium build being on disk; when either is
# missing it drops them from the model's tool schema, which is why a cage without them silently
# offers fewer tools than a standard install (whose installer runs `npm install -g agent-browser &&
# agent-browser install`). The two packages below supply both — but a browser engine also needs two
# things the hermetic cage lacks, and that is this posture: fonts (without them Chromium dies the
# moment it renders a real page) and the egress proxy's CA in the cage's NSS store (Chromium reads
# its own store, not the CA-file env vars sbx sets, so every page would fail
# ERR_CERT_AUTHORITY_INVALID under the allowlist). It renders OFF-SCREEN: no window, no compositor
# socket, no host access at all — strictly less exposure than `gui = "wayland"` for the same
# capability. A trusted-only security field. Drop this line and the two packages if you do not want
# the browser tools; everything else in the profile is unaffected.
#
# Note what the sandbox does NOT change: the browser reaches only what the allowlist below allows,
# so a page on any other host is refused (and its subresources with it — a real site pulls from many
# hosts). The proxy names what it blocked, so open a site you actually want with
# `sbx net allow -a hermes <url>`. This is the deliberate posture: browsing is not opened wholesale.
gui = "offscreen"

# Your host Hermes config, mounted read-write at its real absolute path. `binds` is a security
# field, honored only because this profile lives in your trusted config dir; `mode = "rw"` lets
# the caged `hermes` read and write these host files (login, settings, sessions). Uncommented,
# the bind appears at that host path and not under the cage's `$HOME` (`/home/sandbox`), so the
# app keeps its isolated home and reaches these files only by their absolute path.
#binds = [
#    { path = "~/.hermes", mode = "rw" },
#]

# --- The agent's requirements come from its bundle ------------------------------------------------
# `use` pulls in the `hermes` BUNDLE — the package(s), the environment it reads, the hosts it must
# reach, and its telemetry mutes — from one declaration shared with the bundle file itself, so this
# profile cannot fall behind when the agent's requirements change.
#
# THE BUNDLE IS NOT IN THIS FILE — import it too, in either order:
#     sbx bundle import examples/bundle/hermes.toml
# Without it the launch warns that the bundle is undeclared and the agent is simply absent.
use = ["hermes"]

[packages]
# Hermes via the flake's `#default` output, built host-side — so `sbx upgrade --app hermes` rolls it
# forward. One package supplies the interpreter, the node TUI/web front-ends, and every optional extra
# (voice/edge-tts/mcp/exa/firecrawl/…); there is no separate `nix:uv`/`nix:python`/`nix:nodejs` and
# no launch-time `pip install`. Trusted-only [packages]; this profile is trusted by location once
# imported. First launch builds it (~2 GiB, minutes) over the HOST network, outside the cage's
# allowlist. `[voice]` (bundled) needs `audio = true` above for the actual microphone access;
# `[voice]`'s Whisper model and `[edge-tts]`'s TTS fetch runtime assets on first use from hosts in
# the allowlist below (see the voice entries) — cached in the app home after.
# The browser toolset (see `gui = "offscreen"` above). `agent-browser` is Hermes' own browser-driver
# CLI: a self-contained Rust binary shipped in its npm tarball, so mise's `--ignore-scripts` install
# is not merely harmless but wanted — it skips the postinstall that would otherwise download a
# Playwright browser, which nixpkgs' Chromium replaces. `nodejs` is required because mise's npm
# backend needs a node in the cage (the flake's own bundled node is only on the `hermes` wrapper's
# PATH, not the cage's). Chromium is HEAVY — ~620 MB unpacked, a larger closure — and lands in the
# project store on the first launch. agent-browser finds Chromium on PATH by itself; point it
# elsewhere with `AGENT_BROWSER_EXECUTABLE_PATH` if you ever need to.
chromium = "nix:chromium"
agent-browser = "mise:npm:agent-browser"

[network]
mode = "deny"
# npm's audit POST fires on every install and is refused (it is not in `allow`). The verdict is
# unchanged — this only keeps the noise out of the default `sbx net logs`, SELinux `dontaudit`-style.
# Still visible with `sbx net logs --all`.
mute = []
# The agent's OWN hosts arrive with its bundle (`use` above) and are unioned into this list at
# resolution. Check the union with `sbx config show --app hermes`.
allow = [
    # OpenRouter BYOK — OPTIONAL, and off by default: the shipped default is the NousResearch
    # account login (no BYOK key). To enable, uncomment the line below, import the group once
    # (`sbx net groups import examples/net-groups/openrouter.toml`), set OPENROUTER_API_KEY, and
    # uncomment the [secret."openrouter.ai"] block further down.
    #"@openrouter",
    # Runtime — the LLM provider. With a BYOK key (the [secret] block below) that is OpenRouter;
    # with the NousResearch account login instead (no BYOK key set — the shipped default), the
    # model traffic goes to the account's own API: portal is the OAuth token endpoint, and
    # inference-api serves the models (GET /v1/models, POST /v1/chat/completions).
    # Runtime: model catalogs (read-only; TTL-cached on disk, fail-soft if blocked).
    # Hermes' "pet" gallery (agent/pet) — a public, read-only pixel-art sprite gallery: the manifest
    # (petdex.dev/api/manifest, 307 → R2) and the sprite assets (assets.petdex.dev), all pinned to
    # *.petdex.dev by Hermes (anti-SSRF), GET-only, no data sent. Cosmetic; drop this line if you do
    # not want the pixel pets.
    # Voice STT (`/voice on` / Ctrl+B): the local faster-whisper model is fetched from Hugging Face
    # on first use — metadata/resolve on huggingface.co, the model blobs via the Xet CDN under
    # *.xethub.hf.co (read-only, cached in the app home after). Live-verified via hermes-web.
    # Voice replies / read-aloud (edge-tts) — Microsoft's free online TTS, over a WebSocket. `{WS}` is
    # the explicit WebSocket opt-in (sbx gates a WS behind it) and `{GET}` covers the voice-list fetch.
    # Two things make it work under the MITM allowlist: sbx sets `wss_proxy` so the WS routes through
    # the proxy (a WS client resolves its proxy by URL scheme — `https_proxy` alone would not cover it,
    # and it would connect directly and fail DNS in the empty netns); and the audio hole's Python shim
    # points certifi at sbx's CA, so edge-tts (which pins certifi) trusts the MITM. Live-verified.
    # The browser toolset's `agent-browser` CLI, fetched from npm at launch (mise's npm backend
    # installs in-cage, unlike the host-side `flake:` build above). The audit POST is noisy and
    # non-essential, so it is muted rather than allowed.
    # (No build-time entries: a remote `flake:` ref builds HOST-SIDE, over the host network, so the
    # build's own fetches — the PyPI wheels for uv2nix, the npm registry for the node front-ends, the
    # git smart-HTTP fetch of the hermes-agent repo, the nix binary cache — never pass through this
    # allowlist. Runtime residual, left closed on purpose: installing an OPTIONAL MCP or skill
    # (`hermes mcp install …`) DOES fetch from inside the cage, and each catalog manifest picks its
    # own mechanism — `npx -y <pkg>` hits registry.npmjs.org, a uvx/venv server hits PyPI, and a
    # `install: {type: git}` manifest hits github.com. Those are refused by default rather than
    # pre-opened; the proxy names the host it blocked, so open just the one you need with
    # `sbx net allow -a hermes <url>`. A remote-HTTP MCP (e.g. Linear's) needs its own host too.)
]

# The real API key is read on the HOST and injected by the egress proxy — never in the cage.
# Uncomment both blocks and provide $OPENROUTER_API_KEY on the host to enable BYOK; the in-cage
# placeholder lets Hermes start and issue the request, and the proxy substitutes the real key
# on the wire to openrouter.ai.
[env]
# Flags agent-browser passes to the Chromium it launches. `--no-sandbox` is MANDATORY: Chromium's own
# SUID/userns sandbox cannot come up in the cage (sbx's seccomp denylist blocks
# `clone(CLONE_NEWUSER)`), so without it the browser aborts at startup and every browser tool fails.
# Dropping Chromium's inner sandbox is acceptable here because bubblewrap + seccomp + the empty netns
# IS the boundary. `--disable-dev-shm-usage` keeps it off the cage's small /dev/shm.
#OPENROUTER_API_KEY = "sk-or-sbx-placeholder-replaced-by-the-egress-proxy"

#[secret."openrouter.ai"]
#from = "env://OPENROUTER_API_KEY"
#header = "Authorization"
#type = "bearer"
