# opencode-v2 — the OpenCode v2 agent CLI (multi-provider), sandboxed by sbx.
#
#   sbx bundle import examples/bundle/opencode-v2.toml
#   sbx app import examples/app/opencode-v2.toml
#   sbx app run opencode-v2
#
# THIS PROFILE IS NOT SELF-CONTAINED, on purpose. The agent's package and hosts come from a shared
# BUNDLE, so import it too:
#     sbx bundle import examples/bundle/opencode-v2.toml
#     sbx app import examples/app/opencode-v2.toml
# One extra step, and it buys the thing that was actually broken here: a hand-copy of an agent's
# requirements silently falls behind the agent.
#
#   EGRESS GROUPS — shared lanes, imported once (shared, not per-agent):
#     sbx net groups import examples/net-groups/models-catalog.toml
#     sbx net groups import examples/net-groups/npm-registry.toml
#     sbx net groups import examples/net-groups/npm-audit.toml
#     sbx net groups import examples/net-groups/npm-jsr.toml
#
# This is the v2 line, beside the `opencode` profile (v1). Upstream publishes v2 outside GitHub
# Releases (v2 tags carry no Release object; the binaries live on `opencode.ai/files/bin`), so no
# `mise:` token can offer it: the bundle rides `tarball:resolve` against the vendor's own update
# channel instead. The tool is equipped on the first launch in a project and pinned there, so a
# later upstream release cannot change what runs under you; `sbx app upgrade opencode-v2`
# advances that pin.
#
# V2 IS A NEW LINE, not a drop-in v1 bump: new plugin API, new server API contracts, and terminal
# client config moving to a global `cli.json` (see `https://opencode.ai/v2/docs/migrate-v1`). Both
# lines install a binary named `opencode` and read the same config locations, but each sbx app
# equips in its own isolated home, so v1 and v2 coexist — keep `opencode` until v2 does what you
# need, and do not point v1 at files converted to native v2 shapes.
#
# opencode is MULTI-PROVIDER, so its egress depends on the model you use. The
# commented template below is set up for OpenRouter; for another provider change the
# allowlist host, the [secret] block and the env var (e.g. OpenAI: allow "api.openai.com",
# header "Authorization", type "bearer", env OPENAI_API_KEY). If a request is blocked, the
# proxy reports the host it refused — add it to `allow` (or check with `sbx test net <url>`).
# The command hands opencode the cage's summary (/opt/sbx/contract-summary.md: what it may reach,
# which files it protects, which operations it offers) as its global instructions file,
# `~/.config/opencode/AGENTS.md`, which v2 loads beside the `AGENTS.md` files from the project root
# down to the working directory. That file is a symbolic link to the summary, not a copy of it: the
# app's home is shared by every cage of this app, whatever its project, while each cage mounts its
# own project's summary at the link's target, so every cage reads its own project's summary through
# the same link, and v2, which watches the file, never picks up another project's. The command
# creates the link only while that path is free, and removes it in a launch without a summary; a
# file of yours there, or a link of yours to anything else, is left untouched and the summary is no
# longer added. The file lives in the app's isolated home, which only this app's cages read.
# `XDG_CONFIG_HOME` moves it and `OPENCODE_CONFIG_DIR` replaces its directory; the command follows
# both, but only while the path they give stays under that home: a variable pointed at a host
# path (such as a bind below) leaves the file there alone, and the summary is not added, rather
# than written where your host opencode would read it. No option is used: `AGENTS.md` is the only
# instruction file v2 reads, and its config accepts an `instructions` list but loads no file named
# there, so an `OPENCODE_CONFIG_CONTENT` layer would never reach the model. Arguments after
# `sbx app run opencode-v2 --` reach opencode verbatim through `"$@"`.
cmd = [
    "bash",
    "-c",
    '''
s=/opt/sbx/contract-summary.md
f="${OPENCODE_CONFIG_DIR:-${XDG_CONFIG_HOME:-$HOME/.config}/opencode}/AGENTS.md"
case "$f" in
  "$HOME"/*)
    if [ -r "$s" ]; then
      if [ ! -e "$f" ] && [ ! -L "$f" ]; then
        mkdir -p "${f%/*}" && ln -s "$s" "$f"
      fi
    elif [ -L "$f" ] && [ "$(readlink -- "$f")" = "$s" ]; then
      rm -f "$f"
    fi
    ;;
esac
exec opencode "$@"
''',
    # `$0` placeholder: the arguments after `--` arrive as `$1 $2 …`.
    "opencode",
]

# Your host opencode config, mounted read-write at its real absolute path. `binds` is a security
# field, honored only because this profile lives in your trusted config dir; `mode = "rw"` lets
# the caged `opencode` read and write these host files. Uncommented, the bind appears at that
# host path and not under the cage's `$HOME` (`/home/sandbox`), so the app keeps its isolated
# home and reaches these files only by their absolute path. V2 reads the same locations as v1,
# so a shared bind serves both lines — but converted native-v2 shapes must not be read back by
# v1 (see the migration guide above).
#binds = [
#    { path = "~/.config/opencode", mode = "rw" },       # config
#    { path = "~/.local/share/opencode", mode = "rw" },  # auth + sessions (SQLite)
#]

# --- The agent's requirements come from its bundle ------------------------------------------------
# `use` pulls in the `opencode-v2` BUNDLE — the package(s), the environment it reads, the hosts it must
# reach, and its telemetry mutes — from one declaration shared with the bundle file itself, so this
# profile cannot fall behind when the agent's requirements change.
#
# THE BUNDLE IS NOT IN THIS FILE — import it too, in either order:
#     sbx bundle import examples/bundle/opencode-v2.toml
#     sbx app import examples/app/opencode-v2.toml
# Without it the launch warns that the bundle is undeclared and the agent is simply absent.
use = ["opencode-v2"]

# No `[packages]` here: the agent's package comes from its bundle — see `use` above.

[network]
mode = "deny"
# opencode.ai (opened by the bundle): the opencode gateway ("Zen", e.g.
# `opencode.ai/zen/v1/chat/completions`) plus auth and the config/theme schemas — opened to every
# verb with `{*}` (an app is read-by-default, and the CLI POSTs completions through the gateway).
# For a DIRECT provider instead of the gateway, add its host here (`{*} https://api.anthropic.com`
# for Anthropic, `{*} https://api.openai.com` for OpenAI) and fill the [secret] block below.
# models.dev (the bundle's `@models-catalog`): the model catalogue, a read-only fetch.
#
# registry.npmjs.org is the plugin lane, not the install path: the v2 binary arrives as a pinned
# tarball whose resolver reads the update channel host-side, on the host network (see the bundle),
# so equipping needs nothing here. What reaches npm at runtime is opencode's plugin loader, through
# the bundle's `@npm-registry` lane.
# The agent's OWN hosts are NOT listed here — they arrive with its bundle (`use` above) and are
# unioned into this list at resolution. Check what that adds with `sbx bundle opencode-v2`, and what the
# launch ends up with via `sbx config show --app opencode-v2`.
allow = [
  # /share syncs a session to opencode's servers on demand (the `/share` command), by HTTPS POST — not
  # a WebSocket. Uncomment to allow sharing.
  #"{*} https://opncd.ai",
  # opencode streams completions over HTTPS (SSE), NOT a WebSocket, so the default posture
  # (the opencode gateway, or a direct Anthropic/OpenRouter key) needs no `{WS}` grant — and it
  # never opens a WebSocket to `opencode.ai`. A WebSocket is opened only by the OpenAI "Responses"
  # transport, and it targets the OpenAI provider's OWN base host: `api.openai.com` for a direct
  # key, or your gateway host if you route OpenAI through one. A WebSocket is a distinct capability
  # a plain `{*}` does NOT grant (a bidirectional, uninspected channel), so it must be named with
  # `{WS}`. To pin the exact host: run `sbx net logs -a opencode-v2` while opencode runs and look for a
  # `WS` row — a refused one reads `deny … WS … (denied-default|denied-method)` with NO `ws` marker;
  # an established one is flagged `ws` (that marker shows only on a successful `101` upgrade). Then
  # uncomment the line below and set it to that host.
  #"{WS} https://api.openai.com",
  # Direct-OpenRouter BYOK: uncomment together with the [secret] block below.
  #"{*} https://openrouter.ai",
]

# The real key is read on the HOST and injected by the egress proxy — never in the
# cage. Provide it on the host as $OPENROUTER_API_KEY (or point `from` at a resolver,
# e.g. sops://secrets.yaml#openrouter). The in-cage placeholder lets the CLI start and
# issue the request; the proxy strips it and substitutes the real key on the wire to
# openrouter.ai. (For a direct provider add its host to `allow` above — e.g. a commented
# `{*} https://openrouter.ai` — and keep this block; for Anthropic/OpenAI change the host,
# header, and env var instead.)
[env]
# No `OPENCODE_CONFIG_CONTENT` here: v2 loads no file named by an `instructions` list, so the
# cage's summary reaches opencode through the global `AGENTS.md` link that `cmd` places (see above).
#OPENROUTER_API_KEY = "sk-or-sbx-placeholder-replaced-by-the-egress-proxy"

#[secret."openrouter.ai"]
#from = "env://OPENROUTER_API_KEY"
#header = "Authorization"
#type = "bearer"
