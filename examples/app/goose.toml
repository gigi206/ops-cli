# Goose — Block's open-source extensible AI agent (the CLI), sandboxed by sbx.
#
#   sbx bundle import examples/bundle/goose.toml
#   sbx app import examples/app/goose.toml
#   sbx app run goose
#
# THIS PROFILE IS NOT SELF-CONTAINED, on purpose. The agent's package and hosts come from a shared
# BUNDLE, so import it too:
#     sbx bundle import examples/bundle/goose.toml
#     sbx app import examples/app/goose.toml
# One extra step, and it buys the thing that was actually broken here: a hand-copy of an agent's
# requirements silently falls behind the agent.
#
# Goose is a general-purpose, multi-provider AI agent written in Rust. It ships as a
# self-contained release binary (no node, no runtime deps) distributed on GitHub releases;
# sbx equips it fresh from upstream via mise's `aqua` backend, which selects the right asset
# through the aqua registry (the plain gnu tarball, not the vulkan variant) and verifies
# GitHub artifact attestations. The binary lands in the app's persistent isolated home — no
# host mutation, no nixpkgs lag. It is equipped at the latest upstream version on the first
# launch in a project, then pinned to that version; advance it with `sbx app upgrade goose`.
#
# Goose is MULTI-PROVIDER BYOK (Anthropic, OpenAI, OpenRouter, Google, Ollama, …). This profile
# ships with NO baked-in provider or credential — authenticate however you prefer: pick a
# provider in Goose interactively (`goose configure`, persisted in the app's isolated home),
# OR uncomment one of the provider examples below (env var + [secret] block + allowlist host).
# The real key is read on the HOST and injected by the egress proxy on the wire — never in the
# cage. The examples show the three common header-injectable providers:
#   - OpenRouter : openrouter.ai , OPENROUTER_API_KEY , header "Authorization" type "bearer"
#   - Anthropic  : api.anthropic.com , ANTHROPIC_API_KEY , header "x-api-key"   type "raw"
#   - OpenAI     : api.openai.com , OPENAI_API_KEY , header "Authorization" type "bearer"
cmd = "goose"

# Your host Goose config, mounted read-write at its real absolute path. `binds` is a security
# field, honored only because this profile lives in your trusted config dir; `mode = "rw"` lets
# the caged `goose` read and write these host files (config, credentials). Uncommented, the bind
# appears at that host path and not under the cage's `$HOME` (`/home/sandbox`), so the app keeps
# its isolated home and reaches these files only by their absolute path.
#binds = [
#    { path = "~/.config/goose", mode = "rw" },
#]

# --- The agent's requirements come from its bundle ------------------------------------------------
# `use` pulls in the `goose` BUNDLE — the package(s), the environment it reads, the hosts it must
# reach, and its telemetry mutes — from one declaration shared with the bundle file itself, so this
# profile cannot fall behind when the agent's requirements change.
#
# THE BUNDLE IS NOT IN THIS FILE — import it too, in either order:
#     sbx bundle import examples/bundle/goose.toml
# Without it the launch warns that the bundle is undeclared and the agent is simply absent.
use = ["goose"]

# No `[packages]` here: the agent's package comes from its bundle — see `use` above.

[network]
mode = "deny"
# The agent's OWN hosts are NOT listed here — they arrive with its bundle (`use` above) and are
# unioned into this list at resolution. Check what that adds with `sbx bundle goose`, and what the
# launch ends up with via `sbx config show --app goose`.
allow = [
    # Nothing here: the Sigstore lane (`*.sigstore.dev`), which mise reaches at install time to
    # verify the release's artifact attestations, arrives with the bundle and is unioned in at
    # resolution. The binary download itself (github.com + release-assets.githubusercontent.com)
    # rides the built-in github allow-set.
    # Runtime provider host — uncomment the ONE matching your chosen provider (see the
    # [env]/[secret] examples below): OpenRouter, Anthropic, or OpenAI. An app is read-by-default
    # ({GET,HEAD}); the completions endpoint is a POST, so each is opened to all verbs with `{*}`.
    #"{*} https://openrouter.ai",
    #"{*} https://api.anthropic.com",
    #"{*} https://api.openai.com",
]

[env]
# The cage's summary (/opt/sbx/contract-summary.md: what it may reach, which files it protects,
# which operations it offers), read by Goose's built-in "Top Of Mind" extension and added to every
# turn, so a refused host or a read-only file reads as the sandbox rather than as a fault to work
# around. It is added next to the project's `.goosehints`/`AGENTS.md` and next to a
# `GOOSE_MOIM_MESSAGE_TEXT` of yours, never in place of them.
GOOSE_MOIM_MESSAGE_FILE = "/opt/sbx/contract-summary.md"
# `GOOSE_DISABLE_KEYRING` (read the key from the env or the config file, not a system keyring) and
# `GOOSE_TELEMETRY_OFF` (cut telemetry and update checks at the source) ride the bundle with the
# tool that reads them (`sbx bundle goose`).

# --- Provider example (commented) — uncomment ONE block to inject a key host-side. ---
# OpenRouter (one key, hundreds of models, OpenAI-compatible bearer auth):
#GOOSE_PROVIDER = "openrouter"
#GOOSE_MODEL = "anthropic/claude-sonnet-4.5"   # OpenRouter addresses models as <vendor>/<model>
#OPENROUTER_API_KEY = "sk-or-sbx-placeholder-replaced-by-the-egress-proxy"
# Anthropic direct:
#GOOSE_PROVIDER = "anthropic"
#GOOSE_MODEL = "claude-sonnet-4-5-20250514"
#ANTHROPIC_API_KEY = "sk-ant-sbx-placeholder-replaced-by-the-egress-proxy"
# OpenAI direct:
#GOOSE_PROVIDER = "openai"
#GOOSE_MODEL = "gpt-4o"
#OPENAI_API_KEY = "sk-sbx-placeholder-replaced-by-the-egress-proxy"

# --- [secret] example (commented) — uncomment the ONE matching your provider above. The real
# key is read on the HOST (as $<PROVIDER>_API_KEY, or point `from` at a resolver, e.g.
# sops://secrets.yaml#openrouter) and substituted on the wire by the egress proxy; the in-cage
# value stays the placeholder. Goose sends the key in the provider's standard header, which the
# proxy strip-and-replaces. ---
#[secret."openrouter.ai"]
#from = "env://OPENROUTER_API_KEY"
#header = "Authorization"
#type = "bearer"
#[secret."api.anthropic.com"]
#from = "env://ANTHROPIC_API_KEY"
#header = "x-api-key"
#type = "raw"
#[secret."api.openai.com"]
#from = "env://OPENAI_API_KEY"
#header = "Authorization"
#type = "bearer"
