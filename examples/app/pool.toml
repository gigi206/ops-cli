# Poolside Agent CLI — Poolside's coding agent CLI (`pool`), sandboxed by sbx.
#
#   sbx bundle import examples/bundle/pool.toml
#   sbx app import examples/app/pool.toml
#   sbx app run pool -- "<task>"            # run a task (the agent's entrypoint)
#   sbx app run pool                        # interactive REPL / terminal
#
# THIS PROFILE IS NOT SELF-CONTAINED, on purpose. The agent itself, the resolver that keeps it
# current and the hosts it reaches come from a shared BUNDLE, so import it too:
#     sbx bundle import examples/bundle/pool.toml
#     sbx app import examples/app/pool.toml
# One extra step, and it buys the thing that was actually broken here: a hand-copy of an agent's
# requirements silently falls behind the agent.
#
# PACKAGING — the vendor's own tarball, tracked automatically. Poolside publishes a statically
# linked Go binary alone inside a per-platform archive, plus a bare text file naming the current
# version — the same one their `curl … | bash` installer reads. The bundle declares it
# `tarball:resolve`, so sbx composes the URL host-side, pins it with its own content hash, and
# `sbx upgrade --app pool` rolls it forward.
#
# This profile used to run that installer inside the cage on first launch, with a one-shot
# `POOL_SBX_UPDATE=1` to advance the version. Nothing about the artifact required it: a lone
# executable at an archive root is a shape the install phase already wrapped, under the `[packages]`
# key rather than the vendor's file name. The install therefore moved host-side, and `cmd` went back
# to being the agent alone.
#
# CREDENTIAL POSTURE — a Poolside API token, NOT a header-injectable provider key.
# The platform issues a single API key (surfaced via `POOLSIDE_API_KEY`, or saved in
# `~/.config/poolside/credentials.json`); the default API URL is whatever the CLI
# saved in `settings.yaml` (overridable with `POOLSIDE_API_URL`). There is no
# documented per-provider HTTP header for sbx's `[secret]` broker to strip-and-inject,
# so this profile ships **no `[secret]` block** (contrast the BYOK profiles like
# `cline`/`opencode`). Two ways in:
#
#   1. API KEY (recommended for the cage) — set `$POOLSIDE_API_KEY` on the host and
#      inject it for a single caged launch WITHOUT baking it into this file:
#          sbx app run pool --env POOLSIDE_API_KEY=… -- "<task>"
#      (`--env` is an authoritative one-shot override read on the HOST; the value
#      reaches the cage env for that launch only, so the key never lands in the
#      committed profile. `$SBX_ENV_POOLSIDE_API_KEY` works too.) This profile ships
#      no `POOLSIDE_API_KEY` in `[env]` simply because a committed placeholder is
#      noise here — NOT because it would shadow the flag: the one-shot override is
#      applied after the app overlay and is the final word, so it beats a profile
#      `[env]` value of the same key.
#
#   2. INTERACTIVE `pool login` — the CLI opens a browser (or, with NO_OPEN_BROWSER=1,
#      prints the URL); whether it then polls Poolside's backend (which the allowlist
#      permits → works in-cage) or waits on a `localhost` OAuth callback (which binds
#      the CAGE's empty-netns loopback, unreachable from the host browser → does NOT
#      complete) is UNVERIFIED. Prefer path 1. The auth hosts are covered by the
#      `*.poolside.ai` wildcard in `allow`; run `pool whoami` to check authentication.
#
# When you do log in, the credential persists in the app's dedicated, persistent,
# isolated home, never bleeding into the project shell or another app.
#
# EGRESS — honest scope. The download no longer passes through the cage: the resolver and the
# fetch run host-side, so the allowlist governs runtime traffic alone. The RUNTIME host is a
# `*.poolside.ai` wildcard because Poolside's API host is not documented on the
# install page (the CLI stores it in `settings.yaml`, overridable via
# `POOLSIDE_API_URL`). If a request is blocked, the proxy NAMES the host it refused —
# add it to `allow` (or check ahead with `sbx test net <url>`). If your deployment uses a custom
# API URL, pass it with `--env POOLSIDE_API_URL=…` and add that host to `allow`.
# The command hands Poolside the cage's summary (/opt/sbx/contract-summary.md: what it may reach,
# which files it protects, which operations it offers) as its global instructions file,
# `~/.config/poolside/AGENTS.md`, which `pool` loads beside the `AGENTS.md` files from the git root
# down to the working directory. That file is yours to keep, so the command writes it only while you
# have none: a copy marked as sbx's, rewritten at every launch and removed by a launch without a
# summary. Once you write your own there, it is left untouched and the summary is no longer added.
# The file lives in the app's isolated home, which only this app's cages read, and
# `XDG_CONFIG_HOME` moves it (the command follows it). No option is used: Poolside documents none
# that adds instruction files, and `--agent-config-file` replaces the agent. Arguments after
# `sbx app run pool --` reach `pool` verbatim through `"$@"`.
cmd = [
    "bash",
    "-c",
    '''
s=/opt/sbx/contract-summary.md
f="${XDG_CONFIG_HOME:-$HOME/.config}/poolside/AGENTS.md"
m='<!-- sbx: the cage summary, rewritten at every launch -->'
if [ -r "$s" ]; then
  if [ ! -e "$f" ] || grep -qsF "$m" "$f"; then
    mkdir -p "${f%/*}" && { printf '%s\n' "$m"; cat "$s"; } > "$f.tmp" && mv -f "$f.tmp" "$f"
  fi
elif grep -qsF "$m" "$f"; then
  rm -f "$f"
fi
exec pool "$@"
''',
    # `$0` placeholder: the arguments after `--` arrive as `$1 $2 …`.
    "pool",
]

# Your host Poolside config, mounted read-write at its real absolute path. `binds` is a security
# field, honored only because this profile lives in your trusted config dir; `mode = "rw"` lets
# the caged `pool` read and write these host files (settings, credentials, history).
# Uncommented, the bind appears at that host path and not under the cage's `$HOME`
# (`/home/sandbox`), so the app keeps its isolated home and reaches these files only by their
# absolute path.
#binds = [
#    { path = "~/.config/poolside", mode = "rw" },
#]

# --- The agent's requirements come from its bundle ------------------------------------------------
# `use` pulls in the `pool` BUNDLE — the agent's own tarball with the resolver that keeps it
# current, and the host it reaches — from one declaration shared with the bundle file itself, so
# this profile cannot fall behind when the agent's requirements change. The bundle is COMPLETE: an
# app that names it gets the agent, with nothing to reproduce.
#
# THE BUNDLE IS NOT IN THIS FILE — import it too, in either order:
#     sbx bundle import examples/bundle/pool.toml
# Without it the launch warns that the bundle is undeclared and the agent is simply absent.
use = ["pool"]

# No `[packages]` here: what the bundle provisions comes from it — see `use` above.

# An app is read-by-default ({GET,HEAD}); a host the agent WRITES to (POSTing tasks /
# context, reading completions) is opened to all verbs with a `{*}` prefix. No download host:
# the resolver and the fetch run host-side, outside any cage allowlist.
[network]
mode = "deny"
allow = [
    # Every host this agent reaches arrives with the `pool` bundle (`use` above) and is unioned
    # into this list at resolution — inspect them with `sbx bundle pool`, and see the launch's own
    # view with `sbx config show --app pool`. A host the flow reaches that is not in the union is
    # refused and named: watch `sbx net logs -a pool`.
]

[env]
# No `POOLSIDE_API_KEY` here — see the credential note in the header: a committed
# placeholder is noise, and the `--env` override wins over it anyway. sbx injects its MITM CA into
# the cage automatically under a filtering posture via NODE_EXTRA_CA_CERTS /
# SSL_CERT_FILE, which `pool` honours for outbound TLS.
