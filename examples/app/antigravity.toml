# Antigravity IDE — Google's agentic IDE (desktop, Electron / VS Code fork), sandboxed by sbx.
#
#   sbx bundle import examples/bundle/antigravity.toml
#   sbx app import    examples/app/antigravity.toml
#   sbx app run antigravity
#
# THIS PROFILE IS NOT SELF-CONTAINED, on purpose. The IDE tarball, its auto-upgrade resolver, the
# sign-in browser and the hosts they reach come from a shared BUNDLE, so import it too:
#     sbx bundle import examples/bundle/antigravity.toml
#     sbx app import    examples/app/antigravity.toml
# One extra step, and it buys the thing that was actually broken here: a hand-copy of an app's
# requirements silently falls behind the app.
#
#   EGRESS GROUPS — shared lanes, imported once (shared, not per-agent):
#     sbx net groups import examples/net-groups/chromium-background.toml
#
# This is the GRAPHICAL IDE (a VS Code / Windsurf-class fork), distinct from the `agy` terminal CLI
# (profiled in `agy.toml`). Google ships the v2 Linux IDE **only as a plain `.tar.gz`** from its Edge
# download CDN — no official `.deb`, no `.AppImage`, no nixpkgs attribute, no official flake — so sbx
# packages the tarball directly with the `tarball:` backend. Confined by sbx, the editor sees only the
# cage filesystem (the project you launch it from + its own persistent isolated home), reaches only
# the hosts you allow, and its powers stop at the sandbox boundary (bubblewrap + seccomp + an empty
# netns + the egress allowlist).
#
# THE `tarball:resolve` BACKEND (auto-upgrade). Google's download URL is **version-stamped**
# (`.../stable/<version>-<execution_id>/...`) with no stable "latest" alias, so a direct
# `tarball:<url>` would freeze at one version. Instead this profile uses `tarball:resolve` paired with
# the `[tarball.antigravity-ide]` table below: sbx runs its `resolve` command in a hermetic sandbox to
# discover the newest release's download URL, then pins it per project on first launch. `sbx upgrade
# tarball` re-runs the command and **rolls forward** to the newest — no manual URL bump. The tarball is
# fetched + `tar -xz`-unpacked + `autoPatchelfHook`'d into sbx's store HOST-SIDE (safe: a tarball runs
# no build script), seeded and offline-reusable. FIRST LAUNCH resolves + builds it, pulling the Electron
# closure (~220 MiB tarball plus its runtime closure — a few minutes, over your HOST network, NOT the
# cage allowlist). Later launches reuse the pinned build offline (the resolve command does NOT re-run).
#
# CA TRUST (why `--use-system-ca`). Under the allowlist sbx runs a TLS-terminating proxy with a
# per-session CA. Electron/Chromium ignores the CA-file env vars sbx sets and trusts its own NSS
# database (`~/.pki/nssdb`), so it would otherwise fail every HTTPS with `ERR_CERT_AUTHORITY_INVALID`.
# For a `gui = "wayland"` cage under a filtering posture, sbx seeds its MITM CA into the cage's NSS db
# automatically (part of the GUI hole, like fonts) — no per-profile shim needed. The app only has to
# be told to consult that store, hence `--use-system-ca` (the IDE's native `language_server` binary,
# which POSTs to Google's Cloud Code backend, honours sbx's CA-file env vars and needs no extra help).
#
# DISPLAY + GPU + DBUS. `gui = "wayland"` binds the host Wayland socket (read-only) and provisions
# fonts so the window maps (X11 is never offered; isolation is compositor-dependent — Mutter/GNOME is
# safe, wlroots exposes screen-capture/input-injection, see docs-site/docs/guide/configuration/gui.md).
# `gpu = true` opens hardware-accelerated rendering (mesa into sbx's store + the `/dev/dri` render node
# + the minimal `/sys` DRM subtree); a Chromium/Electron app on Wayland with no working GL often
# produces no buffer and NO window maps. mesa covers Intel/AMD/nouveau; an NVIDIA-only machine falls
# back to software (still renders, slower). `dbus = true` gives the cage its OWN private desktop portal
# (an in-cage `dbus-daemon` + `xdg-desktop-portal` with the reference GTK backend), so the IDE's FILE
# CHOOSER opens IN-CAGE and lists only the cage filesystem, seeds + follows your host light/dark theme,
# and bridges `org.freedesktop.Notifications` — while the login keyring stays absent. The Electron
# flags: `--no-sandbox` is mandatory and acceptable (bwrap + seccomp + the empty netns IS the boundary,
# replacing Chromium's own redundant sandbox); `--ozone-platform=wayland` selects the Wayland backend;
# `--disable-dev-shm-usage` avoids the small cage `/dev/shm`. (`audio` is NOT enabled — add `audio =
# true` only if you use a voice feature; see docs-site/docs/guide/configuration/audio.md.)
#
# CREDENTIAL POSTURE — account / Google OAuth, NOT a header-injectable API key. Antigravity signs in
# with **Google Sign-In**; Google does not support a bring-your-own Gemini API key here. There is
# therefore no HTTP header for sbx's `[secret]` broker to strip-and-inject, and this profile ships
# **no `[secret]` block** (contrast the BYOK profiles like `cline`/`opencode`). You log in ONCE inside
# the cage; the token then persists in the app's dedicated, persistent, isolated home. The sandbox +
# the egress allowlist still bound everything the agent can reach.
#
# LOGIN FLOW — VERIFIED on a real Google login. The IDE (a VS Code fork) opens the Google consent in
# an external browser and receives the result back as the deep-link `antigravity-ide://oauth-success`,
# handed to the running single-instance editor via `--open-url` (a standard VS Code CLI flag). The
# hermetic cage has no browser and no desktop, so the `[open]` table below routes to an in-cage Chromium
# for the http(s) consent and routes the deep-link back to `antigravity-ide --open-url`.
#
#   THE `dbus = true` DETAIL (handled by sbx-core). Under `dbus = true` the in-cage Chromium opens the
#   `antigravity-ide://` callback via the desktop PORTAL (`xdg-desktop-portal.OpenURI`), not `xdg-open`
#   — and the portal launches a handler only if it is in the *registered/recommended* desktop-database
#   index (built by `update-desktop-database`), not merely the mimeapps.list default; without the index
#   it shows **"No apps available"**. sbx-core's portal hole now builds that index automatically
#   (provisions `desktop-file-utils` + runs `update-desktop-database` in the background), so the login
#   works under `dbus = true` with no per-profile step (verified end-to-end). If a future portal change
#   ever regresses this, the escape is `sbx app run antigravity --dbus=false` for the login ONCE
#   (Chromium then uses `xdg-open` directly, no portal/index) — the token persists in the isolated home,
#   and daily use returns to `dbus = true`.
#
#   The allowlist below is grounded on a real login (the `agy` Google chain + the observed
#   `cloudcode-pa` model backend + the VS Code CDN); if a request is refused, watch
#   `sbx net logs -a antigravity --all` and add the host (or check ahead with `sbx test net <url>`).
# A pragmatic one-time escape: `sbx app run antigravity-ide --net allow` for the login only (allow-by-
# default, no allowlist whack-a-mole; the token persists in the isolated home), then strict daily use.
# Prefer `allow` over `shared` here: it opens the same doors while keeping the proxy in front of the
# cage, so `sbx net logs -a antigravity --all` still names every host the sign-in touched and the MITM
# CA is still seeded. `--net shared` removes the proxy outright and is the last resort.
#
# CAVEATS (honest):
#   * Quitting — a GUI Electron app ignores a single Ctrl+C and closing the window may not quit. Press
#     Ctrl+C twice within 2s to force-quit the session, or `sbx session stop <id>` from another terminal.
#   * Credential persistence — the app may want the system keyring (Secret Service / dbus), which the
#     hermetic cage does not provide, and should fall back to a file under the isolated home
#     (`--password-store=basic` forces Chromium's file store). Confirm the login survives a relaunch.
#   * In-app self-update — the IDE self-updates in the background from the same updater API + gvt1 CDN.
#     A self-downloaded binary is NOT autoPatchelf'd, so it cannot run in the cage — the in-app updater
#     is inert; **`sbx upgrade tarball` is the real upgrade path**. Those hosts are muted below.
#   * The real build + launch + Google login with your account is the pending live validation, as for
#     every GUI profile (heavy build; not a per-run committed test).
#
# `--password-store=basic` (on both the app and Chromium): Chromium normally encrypts its session
# cookie with a key from the OS keyring (over dbus), which the cage's private bus does not expose — so
# without it the cookie cannot be re-decrypted next launch and you are logged out. `basic` forces the
# file store in the isolated $HOME (a weak fixed key — acceptable: the token lives only in the per-app
# isolated cage home, never the project shell).
cmd = [
    "bash",
    "-c",
    '''
# IN-CAGE BROWSER LOGIN. Antigravity's Google Sign-In opens an external browser for the consent,
# then hands the result back as a deep-link to the running editor. What each of those opens with is
# declared in `[open]` below; all that is left here is the one thing a declaration cannot express,
# Chromium's managed policy. See the header's LIVE-GATE note: the deep-link scheme is the VS
# Code-fork convention and UNVERIFIED — correct the `[open]` key if the editor does not complete
# the login after the Google consent.

# Chromium managed policy: auto-launch the deep-link with no confirmation dialog, else the callback
# never reaches the editor and login silently fails. /etc is a writable cage tmpfs; Chromium reads
# /etc/chromium/policies/managed/. (The scheme is the VERIFIED `antigravity-ide` — see the header.)
mkdir -p /etc/chromium/policies/managed 2>/dev/null && cat > /etc/chromium/policies/managed/sbx-antigravity-protocol.json <<'POLICY'
{"AutoLaunchProtocolsFromOrigins":[{"allowed_origins":["*"],"protocol":"antigravity-ide"}]}
POLICY

exec antigravity-ide --no-sandbox --ozone-platform=wayland --disable-dev-shm-usage \
    --use-system-ca --password-store=basic "$@"
''',
]

gui = "wayland"
gpu = true
dbus = true

# Your host Antigravity IDE config/login, mounted read-write at its real absolute path (so the caged
# editor shares your host login/settings). `binds` is a security field, honored only because this
# profile lives in your trusted config dir. Uncomment to share your host setup with the cage instead
# of the app's isolated home (the default). Paths UNCONFIRMED — verify with a real run before relying.
#binds = [
#    { path = "~/.config/Antigravity", mode = "rw" },
#]

# --- The app's requirements come from its bundle --------------------------------------------------
# `use` pulls in the `antigravity` BUNDLE — the IDE tarball and its auto-upgrade resolver, the
# sign-in Chromium, the hosts both reach and the telemetry mutes — from one declaration shared with
# the bundle file itself, so this profile cannot fall behind when the app's requirements change.
# What the bundle may never carry is posture: the `gui`/`gpu`/`dbus` grants and the sign-in
# preamble in `cmd` stay here.
#
# THE BUNDLE IS NOT IN THIS FILE — import it too, in either order:
#     sbx bundle import examples/bundle/antigravity.toml
# Without it the launch warns that the bundle is undeclared and the IDE is simply absent.
use = ["antigravity"]

# No `[packages]` table here, and no `[tarball.antigravity-ide]` resolver: both come from the bundle.

# An app is read-by-default ({GET,HEAD}); a host the editor/agent WRITES to (POSTing completions,
# tokens) is opened to all verbs with `{*}`. Grounded on the `agy` CLI profile's Google chain +
# claude-desktop's Google Sign-In set. See the header's LIVE-GATE note — refine from `sbx net logs`.
# Where a link opens, declared rather than scripted. `http`/`https` go to the in-cage Chromium for
# the web auth; `antigravity-ide` is the callback the provider redirects to, which must reach the
# running editor (`--open-url` is how it accepts one). One declaration covers both ways a link is
# opened — a tool calling `xdg-open` and an Electron app calling the portal under `dbus = true` —
# and sbx freezes the routing, so nothing in the cage can answer a sign-in link instead. If the
# scheme turns out not to be `antigravity-ide`, change the key.
#
# Must stay below every top-level key: written above one, TOML would fold that key into this table.
[open]
http = ["chromium", "--no-sandbox", "--ozone-platform=wayland", "--password-store=basic", "--no-first-run", "--no-default-browser-check"]
https = ["chromium", "--no-sandbox", "--ozone-platform=wayland", "--password-store=basic", "--no-first-run", "--no-default-browser-check"]
antigravity-ide = ["antigravity-ide", "--no-sandbox", "--ozone-platform=wayland", "--disable-dev-shm-usage", "--open-url"]

[network]
mode = "deny"
# NOTE on HTTP/2: `cloudcode-pa` serves BOTH HTTP/1.1 (the REST account-setup + agent calls) and
# HTTP/2 (gRPC). A `[network] http2 = [...]` entry makes the MITM *h2-only* for that host (fail-closed,
# no h1 fallback), which BREAKS the h1 account-setup call (`blocked (http2-required)`), so it is NOT
# used here — the backend works over h1, exactly as it did before (observed: 104 h1 requests to
# `daily-cloudcode-pa`). Only add an `http2` entry if a host is proven h2-*only*.
allow = [
    # The Cloud Code backend, the docs host, the Google Sign-In chain, the VS Code asset CDN and
    # the Open VSX marketplace all arrive with the `antigravity` bundle (`use` above) and are
    # unioned into this list at resolution — inspect them with `sbx bundle antigravity`, and see
    # the launch's own view with `sbx config show --app antigravity`. A host the flow reaches that
    # is not in the union is refused and named: watch `sbx net logs -a antigravity --all`.
]
# Silence deliberately-DENIED noise so `sbx net logs` reads clean (a `mute` never changes the verdict —
# the host stays denied and still counts in `sbx net stats`; see them with `--all`). These are
# telemetry / feature flags / the inert in-app self-updater / Chromium's own background services.
mute = [
    # Nothing here: the telemetry, feature-flag, self-updater and browser-engine refusals arrive
    # with the bundle and are unioned in at resolution.
]
