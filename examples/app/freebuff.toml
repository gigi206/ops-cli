# Freebuff — CodebuffAI's free terminal coding agent, sandboxed by sbx.
#
#   sbx bundle import examples/bundle/freebuff.toml
#   sbx app import examples/app/freebuff.toml
#   sbx app run freebuff
#
# THIS PROFILE IS NOT SELF-CONTAINED, on purpose. The agent's package and hosts come from a shared
# BUNDLE, so import it too:
#     sbx bundle import examples/bundle/freebuff.toml
#     sbx app import examples/app/freebuff.toml
# One extra step, and it buys the thing that was actually broken here: a hand-copy of an agent's
# requirements silently falls behind the agent.
#
#   EGRESS GROUPS — shared lanes, imported once (shared, not per-agent):
#     sbx net groups import examples/net-groups/npm-audit.toml
#     sbx net groups import examples/net-groups/npm-jsr.toml
#     sbx net groups import examples/net-groups/npm-registry.toml
#
# Freebuff is a Node CLI distributed on npm, so sbx equips it in-cage with a node
# runtime (nix) plus mise's npm backend. The npm package is a thin launcher: on the
# first run it downloads the real ~46 MB binary from www.codebuff.com into the app's
# isolated home (`~/.config/manicode/`), where it persists across launches. (This is
# why the first launch needs the network and the bundle's allowlist.)
#
# CREDENTIAL POSTURE — different from the BYOK profiles. Freebuff is NOT bring-your-
# own-key against a provider endpoint; it authenticates to a Codebuff ACCOUNT and
# routes model traffic through Codebuff's backend server-side. So there is no API key
# to inject and no [secret] block. Instead you log in ONCE inside the cage:
#
#   sbx app run freebuff        # then, in the agent: `freebuff login`
#
# The login token is written under the app's dedicated, persistent, isolated home
# (`~/.config/manicode/`), so it survives later launches and never bleeds into the
# project shell or another app. The trade-off versus the injected-key profiles: the
# token lives in the (isolated) cage home rather than never entering the cage. The
# sandbox + the egress allowlist still bound everything the agent can reach.
#
# If a request is blocked, the proxy reports the host it refused — add it to `allow`
# (or check ahead with `sbx test net <url>`).
# The command hands Freebuff the cage's summary (/opt/sbx/contract-summary.md: what it may reach,
# which files it protects, which operations it offers) as your home knowledge file.
# Freebuff reads the first of `~/.agents.md` and `~/.claude.md` it finds in your home (any letter
# case) and adds it to the project's knowledge files. That file is yours to keep, so the command
# writes `~/.agents.md` only while you have neither: a copy marked as sbx's, rewritten at every
# launch and removed by a launch without a summary, or as soon as a file of yours appears, since
# Freebuff would read only one of the two. Once you write your own, it is left untouched and the
# summary is no longer added. The file lives in the app's isolated home, which only this app's
# cages read. A `~/.knowledge.md` is not read from the home, whatever the system prompt says.
# No option is used: Freebuff takes none that carries instructions. Not measured: Freebuff needs a
# signed-in account before it assembles a session; the loader was read in the shipped binary.
# Arguments after `sbx app run freebuff --` reach Freebuff verbatim through `"$@"`.
cmd = [
    "bash",
    "-c",
    '''
s=/opt/sbx/contract-summary.md
f="$HOME/.agents.md"
m='<!-- sbx: the cage summary, rewritten at every launch -->'
other=
for x in "$HOME"/.[AaCc]*; do
  case "$(printf '%s' "${x##*/}" | tr 'A-Z' 'a-z')" in
    .agents.md|.claude.md) { [ "$x" = "$f" ] && grep -qsF "$m" "$x"; } || other=1 ;;
  esac
done
if [ -r "$s" ] && [ -z "$other" ]; then
  { printf '%s\n' "$m"; cat "$s"; } > "$f.tmp" && mv -f "$f.tmp" "$f"
elif grep -qsF "$m" "$f"; then
  rm -f "$f"
fi
exec freebuff "$@"
''',
    # `$0` placeholder: the arguments after `--` arrive as `$1 $2 …`.
    "freebuff",
]

# Your host Freebuff config, mounted read-write at its real absolute path. `binds` is a security
# field, honored only because this profile lives in your trusted config dir; `mode = "rw"` lets the
# caged `freebuff` read and write these host files (Codebuff login token, settings). Uncommented,
# the bind appears at that host path and not under the cage's `$HOME` (`/home/sandbox`), so the app
# keeps its isolated home and reaches these files only by their absolute path.
#binds = [
#    { path = "~/.config/manicode", mode = "rw" },
#]

# --- The agent's requirements come from its bundle ------------------------------------------------
# `use` pulls in the `freebuff` BUNDLE — the package(s), the environment it reads, the hosts it must
# reach, and its telemetry mutes — from one declaration shared with the bundle file itself, so this
# profile cannot fall behind when the agent's requirements change.
#
# THE BUNDLE IS NOT IN THIS FILE — import it too, in either order:
#     sbx bundle import examples/bundle/freebuff.toml
# Without it the launch warns that the bundle is undeclared and the agent is simply absent.
use = ["freebuff"]

# No `[packages]` here: the agent's package comes from its bundle — see `use` above.

[network]
mode = "deny"
# The bundle's hosts — registry.npmjs.org: the npm install of the launcher. codebuff.com: the
# launcher's hard-coded download URL, which 301-redirects to www.codebuff.com. www.codebuff.com:
# the real binary download AND Codebuff's runtime backend (REST + websocket; no rule grants `WS`,
# so a websocket upgrade is refused and named in `sbx net logs`). freebuff.com: read, plus one
# POST path. Add any further runtime host the proxy reports on first real use.
# An app is read-by-default ({GET,HEAD}): the downloads stay `{GET}`, and only the REST API
# (`www.codebuff.com/api/*`) and that one freebuff.com path take the write verbs.
# The agent's OWN hosts are NOT listed here — they arrive with its bundle (`use` above) and are
# unioned into this list at resolution. Check what that adds with `sbx bundle freebuff`, and what the
# launch ends up with via `sbx config show --app freebuff`.
allow = [
  # Nothing here: the hosts above arrive with the bundle and are unioned in at resolution.
  # Uncomment only if you route freebuff to a direct OpenRouter endpoint (see the note below).
  #"{*} https://openrouter.ai",
]

# Refusals to keep OUT of the default `sbx net logs` (SELinux `dontaudit`), so the ones worth acting
# on stay visible. A `mute` never changes the verdict (the telemetry is still refused) and never
# hides a count (`sbx net stats` still tallies it); it only keeps the line out of the default log.
# See it anytime with `sbx net logs --all`, and edit this list from the CLI with
# `sbx net mute|unmute <host> -a freebuff`. The day you decide to let the telemetry through, allow
# it with `sbx net allow '{POST} https://us.i.posthog.com/batch/' -a freebuff`.
mute = [
  # Nothing here: the mute of Codebuff's PostHog telemetry (POST /batch/ on a regional ingest
  # host, hence `*.i.posthog.com`) and the npm audit and JSR probes arrive with the bundle and
  # are unioned in at resolution.
]

# OPTIONAL direct-OpenRouter BYOK (commented). By default freebuff authenticates to a CODEBUFF
# account and routes ALL model traffic through Codebuff's backend server-side — there is no
# provider key to inject, so this block does nothing on its own and is NOT the shipped path.
# It is here only for parity with the BYOK profiles: it takes effect solely if a freebuff
# release lets you point it at OpenRouter directly (uncomment `openrouter.ai` in `allow` too).
# The real key is then read on the HOST and injected by the egress proxy on the wire — never in
# the cage.
[env]
#OPENROUTER_API_KEY = "sk-or-sbx-placeholder-replaced-by-the-egress-proxy"

#[secret."openrouter.ai"]
#from = "env://OPENROUTER_API_KEY"
#header = "Authorization"
#type = "bearer"
