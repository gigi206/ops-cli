# Hermes Desktop — NousResearch's native Electron desktop app, built from source in the cage.
#
#   sbx app import examples/app/hermes-desktop.toml
#   sbx app run hermes-desktop
#
#   EGRESS GROUPS — shared lanes, imported once (shared, not per-agent):
#     sbx net groups import examples/net-groups/npm-registry.toml
#     sbx net groups import examples/net-groups/npm-audit.toml
#     sbx net groups import examples/net-groups/models-catalog.toml
#     sbx net groups import examples/net-groups/chromium-background.toml
#
# A third way to run Hermes alongside `sbx app run hermes` (the terminal CLI) and `sbx app run hermes-web`
# (the browser dashboard). Hermes Desktop is the native Electron app — a real window with chat,
# streaming tool output, side-by-side previews, a file browser, voice, and settings. Unlike
# opencode-desktop (a prebuilt .deb), Hermes Desktop has NO prebuilt binary — but it IS a nix flake
# output (`#desktop`), so sbx builds it from source rather than from a downloaded foreign binary.
#
# HOW IT RUNS — the flake's `#desktop` output, rolled by `sbx upgrade flake`. `#desktop` is nixpkgs'
# own Electron (already patchelf'd for the store — so none of the ~95 system libs a stock/foreign
# Electron needs, which the hermetic cage lacks) wrapped around the from-source-built renderer, with
# the Python backend WIRED IN: the derivation sets `HERMES_DESKTOP_HERMES` to the flake's own
# fully-equipped `hermes`, so the desktop app spawns that as its backend (no venv, no repo clone, no
# `HERMES_DESKTOP_HERMES_ROOT`). The `cmd` therefore just sets up the in-cage OAuth browser and execs
# the `hermes-desktop` launcher with the cage's Electron flags.
#
# WHY `--no-sandbox`. Electron's own Chromium sandbox can never work in the cage (seccomp blocks the
# userns clone it needs), and there is no privilege to configure its setuid chrome-sandbox helper — so
# `--no-sandbox` is mandatory. (The old venv build ran `hermes desktop --build-only` to dodge that
# launcher's setuid-helper hard-exit; the flake's `hermes-desktop` bin is the Electron app directly,
# so there is no such launcher to appease — just pass the flag.)
#
# LOGIN NEEDS AN IN-CAGE BROWSER. Sign-in is a Privy device-code grant: the app shows a code and opens
# `portal.nousresearch.com/…?user_code=…` in a browser for you to authorize, then polls the token
# endpoint. The hermetic cage has no host browser, so the `cmd` installs an `xdg-open` wrapper (and,
# because `dbus = true` routes external opens through the portal's OpenURI, registers it as the
# default http/https handler) that launches an IN-CAGE Chromium (`nix:chromium`, see [packages]). You
# then sign in there (Privy: email / social / wallet). Google was live-proven; the login pulls Privy +
# Cloudflare Turnstile + Google OAuth hosts, all in the allowlist below.
#
# FIRST LAUNCH IS HEAVY — it provisions nix's Electron + Chromium closures and runs the clone + venv
# install + vite build (a few minutes over the allowlist). Everything lives in the app's persistent
# (global) home, so later launches are fast. `gui`/`gpu`/`dbus`/`audio` open the proven GUI hole.
#
# CREDENTIAL POSTURE — a NousResearch account (OAuth device-code, no header key), which is why the
# in-cage browser above exists; the token persists in the app's isolated home. Optionally, Hermes is
# also BYOK/multi-provider: uncomment the [env] placeholder + the [secret] block below and provide
# $OPENROUTER_API_KEY on the host to have the egress proxy inject an OpenRouter key on the wire
# instead (the plaintext never enters the cage).
cmd = [
    "bash",
    "-c",
    '''
set -e
# In-cage browser for the OAuth login. Sign-in is a Privy device-code grant: the app shows a code and
# opens `portal.nousresearch.com/...?user_code=...` in a browser (via shell.openExternal → xdg-open,
# or the portal's OpenURI under dbus=true) for you to authorize; it then polls the token endpoint. The
# hermetic cage has no host browser, so route those opens to an in-cage Chromium (see [packages]).
# Install an xdg-open wrapper AND register it as the portal's default http/https handler (under
# dbus=true Electron uses OpenURI, not xdg-open directly — without the handler the portal shows "no
# apps available" and the login link goes nowhere).
mkdir -p "$HOME/.local/bin" "$HOME/.local/share/applications" "$HOME/.config"
cat > "$HOME/.local/bin/xdg-open" <<'WRAP'
#!/bin/sh
case "$1" in
  http://*|https://*)
    exec chromium --no-sandbox --ozone-platform=wayland --password-store=basic \
      --no-first-run --no-default-browser-check "$@" ;;
  *) echo "sbx: open on the host:" "$@" >&2; exit 0 ;;
esac
WRAP
chmod +x "$HOME/.local/bin/xdg-open"
export PATH="$HOME/.local/bin:$PATH"
cat > "$HOME/.local/share/applications/sbx-open-uri.desktop" <<EOF
[Desktop Entry]
Type=Application
Name=sbx URL handler
Exec=$HOME/.local/bin/xdg-open %U
MimeType=x-scheme-handler/http;x-scheme-handler/https;
NoDisplay=true
Terminal=false
EOF
cat > "$HOME/.config/mimeapps.list" <<'MIMEAPPS'
[Default Applications]
x-scheme-handler/http=sbx-open-uri.desktop
x-scheme-handler/https=sbx-open-uri.desktop
MIMEAPPS

# Declare a Nix install so Hermes stops warning "Unsupported install method". The backend
# self-detects its platform from the code layout; the flake's uv2nix venv looks like a pip
# site-packages tree, so it falls through to "pip" (an unsupported platform) and shows the banner on
# every launch. A `.install_method` marker in HERMES_HOME is read *before* that fallback and names the
# real method — `nixos`, a supported Tier-2 platform (and it also yields the correct nix update
# hint). Unlike `HERMES_MANAGED=nixos`, this marker has NO managed-mode side effect (which would block
# the app from writing its own config). Harmless regardless: sbx manages updates via `sbx upgrade
# flake`, so Hermes' own self-updater never runs here.
HERMES_HOME_DIR="${HERMES_HOME:-$HOME/.hermes}"
mkdir -p "$HERMES_HOME_DIR"
printf 'nixos\n' > "$HERMES_HOME_DIR/.install_method"

# Launch the flake-built Electron app. `hermes-desktop` (from flake:#desktop) is nixpkgs' Electron
# wrapped around the built renderer, with HERMES_DESKTOP_HERMES already pointing at the flake's own
# fully-equipped `hermes` — so the Python backend is wired natively (no venv, no
# HERMES_DESKTOP_HERMES_ROOT). --no-sandbox is mandatory (Electron's own Chromium sandbox needs a
# userns clone that seccomp blocks in the cage); the Wayland flags map the window through the gui hole.
exec hermes-desktop --no-sandbox --ozone-platform=wayland --disable-dev-shm-usage
'''
]

# The native desktop window: the Wayland socket (gui), the GPU render node + scoped /sys (gpu), and
# a private in-cage desktop portal (dbus) so the app's file chooser renders in-cage and follows the
# host theme. All three are trusted-only security fields, honored because this profile lives in
# your trusted config dir. Drop any you don't need (the app still launches without them, software-
# rendered with no file portal).
gui = "wayland"
gpu = true
dbus = true
audio = true

[packages]
# Hermes Desktop via the flake's `#desktop` output, built host-side — so `sbx upgrade flake` rolls it
# forward. That output is nixpkgs' Electron (patchelf'd for the store — no foreign binary needing the
# system GTK/NSS stack) wrapped around the built renderer, with the Python backend wired IN
# (the derivation sets `HERMES_DESKTOP_HERMES` to the flake's own fully-equipped `hermes`), so there
# is no separate uv/python/nodejs/git/make/gcc/electron and no launch-time clone + venv + vite build.
# Trusted-only [packages]; this profile is trusted by location once imported. First launch builds it
# (~2 GiB+, minutes — the renderer + its native addons against Electron's headers) over the HOST
# network, outside the cage's allowlist.
hermes-desktop = "flake:github:NousResearch/hermes-agent#desktop"
# An in-cage Chromium, used for two things: the OAuth device-code login (see the `cmd` wrapper —
# Nous Portal sign-in opens a verification URL in a browser, and the hermetic cage has no host
# browser), and Hermes' own browser toolset. HEAVY — pulls a large nixpkgs closure into the project
# store on the first launch. It trusts the egress MITM CA via the NSS db sbx seeds (catrust, part of
# the rendering hole under an allowlist).
chromium = "nix:chromium"
# BROWSER TOOLSET — Hermes' 12 `browser_*` tools (navigate, snapshot, click, type, …) are gated on
# `agent-browser` being on PATH AND a Chromium build being on disk; when either is missing Hermes
# drops them from the model's tool schema, which is why a cage without them silently offers fewer
# tools than a standard install (whose installer runs `npm install -g agent-browser && agent-browser
# install`). Chromium is already here, so this adds the driver CLI: a self-contained Rust binary
# shipped in its npm tarball, which is why mise's `--ignore-scripts` install is not merely harmless
# but wanted — it skips the postinstall that would download a Playwright browser. `nodejs` is
# required because mise's npm backend needs a node in the cage (the flake's own bundled node is only
# on the app wrapper's PATH). The other prerequisites — fonts and the NSS CA import — already come
# with `gui = "wayland"` above; a headless profile gets them from `gui = "offscreen"` instead.
nodejs = "nix:nodejs"
agent-browser = "mise:npm:agent-browser"

# The BYOK placeholder (commented) — uncomment it together with the [secret] block below to enable
# BYOK. (No ELECTRON_GET_USE_PROXY needed: the flake builds against nixpkgs' Electron, so there is no
# @electron/get binary download at build or run time.)
[env]
# Flags agent-browser passes to the Chromium it launches for the browser tools. `--no-sandbox` is
# MANDATORY: Chromium's own SUID/userns sandbox cannot come up in the cage (sbx's seccomp denylist
# blocks `clone(CLONE_NEWUSER)`), so without it the browser aborts at startup and every browser tool
# fails. Acceptable because bubblewrap + seccomp + the empty netns IS the boundary.
AGENT_BROWSER_ARGS = "--no-sandbox,--disable-dev-shm-usage"
#OPENROUTER_API_KEY = "sk-or-sbx-placeholder-replaced-by-the-egress-proxy"

[network]
mode = "deny"
allow = [
    # (No build-time entries: a remote `flake:` ref builds HOST-SIDE, over the host network, so the
    # `#desktop` build's own fetches — the renderer's npm deps, the Python backend's PyPI wheels for
    # uv2nix, Electron's headers, the git smart-HTTP fetch of the hermes-agent repo, the nix binary
    # cache — never pass through this allowlist. Runtime residual, left closed on purpose: installing
    # an OPTIONAL MCP or skill (`hermes mcp install …`) DOES fetch from inside the cage — `npx -y
    # <pkg>` hits registry.npmjs.org, a uvx/venv server hits PyPI, a `install: {type: git}` manifest
    # hits github.com — and a remote-HTTP MCP needs its own host. Refused by default rather than
    # pre-opened; the proxy names what it blocked, so open just that one with `sbx net allow -a
    # hermes-desktop <url>` (npm's audit POST is noisy if you do open npm — `sbx net mute` it).
    # `voice`'s Whisper model and `edge-tts` fetch RUNTIME assets on first use — those hosts ARE
    # needed, and are in the runtime section below.)
    # --- The browser toolset's driver ---
    # `agent-browser`, fetched from npm at launch (mise's npm backend installs in-cage, unlike the
    # host-side `flake:` build). The audit POST is noisy and non-essential, so it is muted below.
    # The registry lane itself is the shared `@npm-registry` group.
    "@npm-registry",
    # --- Runtime ---
    # The LLM provider. With a BYOK key (the [secret] block below) that is OpenRouter; with the
    # NousResearch account login instead (no BYOK key set — the shipped default), model traffic goes
    # to the account's own API: portal is the OAuth token endpoint, inference-api serves the models.
    "{*} https://openrouter.ai",
    "{*} https://portal.nousresearch.com",
    # The portal's static assets (landing figures, images, styles) served off Nous's asset host —
    # they render on the sign-in page in the in-cage Chromium. Read-only, so {GET} (least privilege).
    "{GET} https://web-assets.nousresearch.com",
    "{*} https://inference-api.nousresearch.com",
    # Runtime: model catalogs (read-only; TTL-cached on disk, fail-soft if blocked) — the shared
    # `@models-catalog` group.
    "{*} https://hermes-agent.nousresearch.com",
    "@models-catalog",
    # Hermes' "pet" gallery (agent/pet) — a public, read-only pixel-art sprite gallery: the manifest
    # (petdex.dev/api/manifest, 307 → R2) and the sprite assets (assets.petdex.dev), all pinned to
    # *.petdex.dev by Hermes (anti-SSRF), GET-only, no data sent. Cosmetic; drop this line if you do
    # not want the pixel pets.
    "{GET} https://*.petdex.dev",
    # Voice STT (`/voice on`): the local faster-whisper model is fetched from Hugging Face on first
    # use — metadata/resolve on huggingface.co, the model blobs via the Xet CDN under *.xethub.hf.co
    # (read-only, cached in the app home after). Live-verified via hermes-web.
    "{GET,HEAD} https://huggingface.co",
    "{GET,HEAD} https://*.xethub.hf.co",
    # Voice replies / read-aloud (edge-tts) — Microsoft's free online TTS, over a WebSocket. `{WS}` is
    # the explicit WebSocket opt-in (sbx gates a WS behind it) and `{GET}` covers the voice-list fetch.
    # Two things make it work under the MITM allowlist: sbx sets `wss_proxy` so the WS routes through
    # the proxy (a WS client resolves its proxy by URL scheme — `https_proxy` alone would not cover it,
    # and it would connect directly and fail DNS in the empty netns); and the audio hole's Python shim
    # points certifi at sbx's CA, so edge-tts (which pins certifi) trusts the MITM. Live-verified.
    "{GET,WS} https://speech.platform.bing.com",
    # --- Login (Nous Portal sign-in, rendered in the in-cage Chromium) ---
    # Nous Portal authenticates with Privy (email / social / wallet). The device-code page, the Privy
    # auth modal, the Cloudflare Turnstile "checking you are human" gate, and — for "Continue with
    # Google" — the Google OAuth consent all render in the in-cage Chromium, so their hosts must be
    # reachable (live-verified end-to-end: a Google sign-in completed the device grant). If you sign
    # in a different way, watch `sbx net log -a hermes-desktop` for the refused host and add it.
    "{*} https://*.privy.io",                  # Privy auth API + embedded login modal
    "{*} https://privy.nousresearch.com",      # Nous's own Privy endpoint (a nousresearch.com subdomain, not *.privy.io)
    "{*} https://*.challenges.cloudflare.com", # Cloudflare Turnstile human-check (incl. the hagen.* interactive-challenge host)
    # "Continue with Google" — a bounded regex so it works in ANY locale (accounts.google.com/.fr/…),
    # anchored so a look-alike (accounts.google.com.evil.com) is refused.
    '{*} re:^https://accounts\.google\.[a-z.]{2,7}(/|$)',
    "{*} https://oauth2.googleapis.com",
    "{*} https://apis.google.com",
    "{GET} https://www.google.com",
    "{GET} https://ssl.gstatic.com",
    "{GET} https://www.gstatic.com",
    "{GET} https://fonts.googleapis.com",
    "{GET} https://fonts.gstatic.com",
    "{GET} https://lh3.googleusercontent.com",
    # (cache.nixos.org — the nix binary cache for uv/Python/node/electron/chromium — is already in
    # sbx's built-in nix-cache allow-set, so it needs no entry here.)
]

# Refusals to keep OUT of the default `sbx net log` (SELinux `dontaudit`). A `mute` never changes the
# verdict (the request is still refused) and never hides a count (`sbx net stats` still tallies it);
# it only keeps the line out of the default log — `sbx net log --all` shows it, tagged `muted`. Edit
# this list from the CLI with `sbx net mute|unmute -a hermes-desktop`.
mute = [
    # npm's audit POST on every install of the browser driver: refused anyway, just kept out of the
    # default log. Shared with every npm-backed profile, so it comes from a group.
    "@npm-audit",
    # A cloud SDK in the closure probes the AWS metadata endpoint on startup; the proxy refuses
    # link-local/metadata by construction (SSRF guard), nothing to discover off-cloud. Denied, muted.
    "169.254.169.254",
    # Telemetry the app / its deps POST (left denied): app RUM analytics, and the wallet-option probe
    # from the Privy modal (you signed in with Google, not a wallet).
    "browser-intake-datadoghq.com",
    "explorer-api.walletconnect.com",
    # The in-cage Chromium's own background services during the login flow — none functional to
    # Hermes, and shared with every other profile that embeds a browser engine, so they come from a
    # group rather than a copy.
    "@chromium-background",
    # Tag-manager analytics on the login page (not a Chromium background service).
    "www.googletagmanager.com",
]

# The real API key is read on the HOST and injected by the egress proxy — never in the cage.
# Uncomment the OPENROUTER_API_KEY line in the [env] block above AND the [secret] block below,
# and provide $OPENROUTER_API_KEY on the host, to enable BYOK: the in-cage placeholder lets Hermes
# start and issue the request, and the proxy substitutes the real key on the wire to openrouter.ai.
#[secret."openrouter.ai"]
#from = "env://OPENROUTER_API_KEY"
#header = "Authorization"
#type = "bearer"
