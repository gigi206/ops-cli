# opencode desktop — the Electron GUI of opencode, sandboxed by sbx (with a Wayland display).
#
#   sbx bundle import examples/bundle/opencode-desktop.toml
#   sbx app import    examples/app/opencode-desktop.toml
#   sbx app run opencode-desktop
#
# THIS PROFILE IS NOT SELF-CONTAINED, on purpose. The app's package and the hosts it reaches come
# from a shared BUNDLE, so import it too:
#     sbx bundle import examples/bundle/opencode-desktop.toml
#     sbx app import    examples/app/opencode-desktop.toml
# One extra step, and it buys the thing that was actually broken here: a hand-copy of an app's
# requirements silently falls behind the app.
#
#   EGRESS GROUPS — shared lanes, imported once (shared, not per-agent):
#     sbx net groups import examples/net-groups/models-catalog.toml
#     sbx net groups import examples/net-groups/npm-runtime.toml
#
# This is the GRAPHICAL sibling of the `opencode` profile (the terminal CLI/TUI) and of
# `opencode-web` (the same server in your browser). opencode ships a native desktop app built with
# Electron; on Linux upstream distributes it only as a `.deb`/`.rpm`, neither of which installs in
# the hermetic cage. sbx packages it with the `deb:` backend.
#
# THE `deb:github:` BACKEND (no third party, tracks upstream automatically). This profile names the
# GitHub repo — `deb:github:anomalyco/opencode` — and sbx queries the repo's LATEST release, selects
# its linux-amd64 `.deb` asset, resolves it to a content hash (asset URL and hash both pinned in the
# per-project deb lock), and builds a generated derivation that `dpkg-deb -x`-unpacks it and
# `autoPatchelfHook`s the Electron binaries against a curated library set — no bun, no from-source
# build (opencode's own flake builds from source and needs a bun newer than nixpkgs ships, which
# fails; a `.deb` sidesteps that entirely). The build is HOST-SIDE (like `nix:`), not in-cage: a
# `.deb` runs no build script, so evaluating it host-side is safe, and the result is seeded into the
# store and offline-reusable — no dependency on any community flake.
#
# Naming the REPO rather than upstream's `…/releases/latest/download/…` alias is what makes a warm
# launch stable: the pin records the release's VERSION-STAMPED asset URL, which never changes
# content, so a new upstream release leaves your pinned build working (you stay on it until an
# explicit upgrade). Pinning the moving `latest` alias instead makes every upstream release break
# the next launch with a fixed-output hash mismatch, since the pinned hash no longer matches what
# that URL now serves.
#
# FIRST LAUNCH resolves the release asset (pinning URL + hash in the per-project deb lock) and builds
# it host-side, pulling the Electron closure (hundreds of MiB) — a couple of minutes, over your host
# network (the build does NOT use the cage allowlist). Later launches reuse the pinned build offline
# and never query GitHub. `sbx upgrade deb` re-queries the repo and rolls the pin forward to the
# newest release (the rebuilt app lands at the next launch). No manual version bump.
#
# CA TRUST (why `--use-system-ca`). Under the allowlist sbx runs a TLS-terminating proxy with a
# per-session CA. Electron/Chromium ignores the CA-file env vars sbx sets and trusts its own NSS
# database (`~/.pki/nssdb`), so a Chromium app would otherwise fail every HTTPS with
# `ERR_CERT_AUTHORITY_INVALID` and its UI could not load. For a `gui = "wayland"` cage under a
# filtering posture, **sbx now seeds its MITM CA into the cage's NSS db automatically** (part of
# the GUI hole, like fonts), so the app trusts the proxy and egress stays filtered — no per-profile
# shim needed. The app only has to be told to consult that store, hence `--use-system-ca`.
#
# DISPLAY + GPU. `gui = "wayland"` binds the host Wayland compositor socket (read-only) and
# provisions fonts, so the Electron window maps on your compositor. X11 is never offered. Isolation
# is compositor-dependent — Mutter (GNOME) is safe; wlroots compositors (sway, hyprland) expose
# screen-capture/input-injection to ordinary clients (see docs-site/docs/guide/configuration/gui.md).
# `gpu = true` opens hardware-accelerated rendering: sbx provisions mesa's drivers into its own
# store, grants the render node under `/dev/dri`, and read-only-binds the minimal `/sys` DRM subtree
# the driver needs (see docs-site/docs/guide/configuration/gpu.md). Without it a Chromium/Electron app on
# Wayland often fails to produce a buffer and no window maps, so it is on by default here. mesa
# covers Intel/AMD/nouveau; an NVIDIA-only machine falls back to software (still renders, slower).
# The Electron flags: `--no-sandbox` is mandatory and acceptable because bubblewrap + seccomp + the
# empty netns IS the boundary (it replaces Chromium's own redundant sandbox); `--ozone-platform=
# wayland` selects the Wayland backend; `--disable-dev-shm-usage` avoids the small cage `/dev/shm`.
#
# DBUS. `dbus = true` gives the cage its OWN private desktop portal (a `dbus-daemon` +
# `xdg-desktop-portal` with the reference GTK backend, all in-cage), so the app's FILE CHOOSER — the
# "+" attach-a-file button — opens IN-CAGE and lists the cage filesystem (the project bind + the
# app's isolated home). It also relays desktop notifications (a host-side relay bridges the private
# bus to your notifications daemon) and follows your host light/dark theme both at launch AND live (a
# relay mirrors host theme switches into the cage), and is network-independent (the private bus
# touches no host socket). Requires `gui = "wayland"` (the GTK backend renders on the compositor).
# The login keyring is never exposed.
cmd = [
    "opencode-desktop",
    "--no-sandbox",
    "--ozone-platform=wayland",
    "--disable-dev-shm-usage",
    "--use-system-ca",
]

gui = "wayland"
gpu = true
dbus = true

# Your host opencode config/auth, mounted read-write at its real absolute path (so the GUI shares
# the same login/sessions as your host opencode). `binds` is a security field, honored only
# because this profile lives in your trusted config dir. Uncomment to share your host setup with
# the cage instead of the app's isolated home (the default).
#binds = [
#    { path = "~/.config/opencode", mode = "rw" },       # config
#    { path = "~/.local/share/opencode", mode = "rw" },  # auth + sessions (SQLite)
#]

# --- The app's requirements come from its bundle --------------------------------------------------
# `use` pulls in the `opencode-desktop` BUNDLE — the `.deb` and the hosts the app reaches — from
# one declaration shared with the bundle file itself, so this profile cannot fall behind when the
# app's requirements change. The posture above (`gui`/`gpu`/`dbus`) stays here: a bundle may never
# widen what the cage exposes of the host.
#
# THE BUNDLE IS NOT IN THIS FILE — import it too, in either order:
#     sbx bundle import examples/bundle/opencode-desktop.toml
# Without it the launch warns that the bundle is undeclared and the app is simply absent.
use = ["opencode-desktop"]

# No `[packages]` here: the app's package comes from its bundle — see `use` above.

[network]
mode = "deny"
# opencode desktop wraps the SAME opencode server as the CLI, so it is multi-provider and its
# model traffic goes to the same hosts. models.dev is the read-only model catalogue; opencode.ai
# is the gateway ("Zen") plus auth and the config/theme schemas, opened to every verb with `{*}`
# (an app is read-by-default, and the app POSTs completions through the gateway). registry.npmjs.org
# is a RUNTIME fetch — opencode pulls its `@opencode-ai/plugin` package at startup (and the app
# checks GitHub releases for updates, already covered by the built-in github allow-set) — the
# shared `@npm-runtime` group.
#
# If a request is refused, the proxy names the host — watch `sbx net logs -a opencode-desktop` and
# add it here (or check ahead with `sbx test net <url>`). For a DIRECT provider instead of the
# gateway, add its host (`{*} https://api.anthropic.com`, `{*} https://api.openai.com`, or
# `{*} https://openrouter.ai`) and fill the [secret] block below.
allow = [
    # The model catalogue, the startup npm fetch and the opencode gateway arrive with the bundle
    # (`use` above) and are unioned into this list at resolution — inspect them with
    # `sbx bundle opencode-desktop`, and see the launch's own view with
    # `sbx config show --app opencode-desktop`.
    #
    # /share syncs a session to opencode's servers on demand (HTTPS POST, not a WebSocket).
    #"{*} https://opncd.ai",
    # opencode streams completions over HTTPS (SSE), not a WebSocket, so the default posture needs
    # no `{WS}` grant. A WebSocket is opened only by the OpenAI "Responses" transport, targeting
    # the OpenAI provider's own base host — name it with `{WS}` if you use that (see the opencode
    # CLI profile for the discovery recipe).
    #"{WS} https://api.openai.com",
    # Direct-OpenRouter BYOK: uncomment together with the [secret] block below.
    #"{*} https://openrouter.ai",
]
# Silence the denied telemetry: the desktop app POSTs crash/usage envelopes to Sentry, which the
# allowlist already refuses (`denied-default`). `mute` keeps those refusals out of the default
# `sbx net logs` (still denied, still counted in `sbx net stats`; see them with `--all`).
mute = []  # the Sentry refusal is muted by the bundle

# The real key is read on the HOST and injected by the egress proxy — never in the cage. Provide
# it on the host as $OPENROUTER_API_KEY (or point `from` at a resolver, e.g.
# sops://secrets.yaml#openrouter). The in-cage placeholder lets the app start and issue the
# request; the proxy strips it and substitutes the real key on the wire to openrouter.ai. (For a
# direct provider add its host to `allow` above and keep this block; for Anthropic/OpenAI change
# the host, header, and env var instead — see the `opencode` CLI profile.)
[env]
#OPENROUTER_API_KEY = "sk-or-sbx-placeholder-replaced-by-the-egress-proxy"

#[secret."openrouter.ai"]
#from = "env://OPENROUTER_API_KEY"
#header = "Authorization"
#type = "bearer"
