# Cline — the autonomous coding agent's standalone CLI, sandboxed by sbx.
#
#   sbx bundle import examples/bundle/cline.toml
#   sbx app import examples/app/cline.toml
#   sbx app run cline
#
# THIS PROFILE IS NOT SELF-CONTAINED, on purpose. The agent's package and hosts come from a shared
# BUNDLE, so import it too:
#     sbx bundle import examples/bundle/cline.toml
#     sbx app import examples/app/cline.toml
# One extra step, and it buys the thing that was actually broken here: a hand-copy of an agent's
# requirements silently falls behind the agent.
#
#   EGRESS GROUPS — shared lanes, imported once (shared, not per-agent):
#     sbx net groups import examples/net-groups/models-catalog.toml
#     sbx net groups import examples/net-groups/npm-audit.toml
#     sbx net groups import examples/net-groups/npm-jsr.toml
#     sbx net groups import examples/net-groups/npm-registry.toml
#
# Cline ships a genuine terminal CLI on npm (the `cline` package), distributed as a
# self-contained native binary resolved through platform-specific optional dependencies
# — so sbx equips it in-cage with a node runtime (for the npm install) plus mise's npm
# backend. The native binary needs no node at runtime; the install fetches it (and the
# package's deps) from registry.npmjs.org, so the first launch in a project needs the
# network and the bundle's npm lane.
#
# Cline is BYOK and multi-provider. This template keys it to OpenRouter (one key, hundreds
# of models, OpenAI-compatible bearer auth). The real key is read on the HOST and injected
# by the egress proxy on the wire to openrouter.ai — never in the cage. Provide it on the
# host as $OPENROUTER_API_KEY (or point `from` at a resolver, e.g. sops://secrets.yaml#openrouter),
# then select OpenRouter inside Cline (`cline auth`, persisted in the app's isolated home, or
# launch `cline -P openrouter`). To use a different provider, change the allowlist host + the
# [secret] block + the env var — e.g. Anthropic (api.anthropic.com, ANTHROPIC_API_KEY, header
# "x-api-key", type "raw") or OpenAI (api.openai.com, OPENAI_API_KEY, header "Authorization",
# type "bearer"). Cline reads ANTHROPIC_API_KEY / OPENAI_API_KEY / OPENROUTER_API_KEY directly.
#
# Cline stores its config + credentials under ~/.cline in the app's persistent isolated home.
# (Cline probes the host name at startup; `hostname` comes from the `cline` bundle via `use`
# below — the hermetic cage ships none.) If a request is blocked, the proxy reports the host it refused —
# add it to `allow` (or check ahead with `sbx test net <url>`).
# The command hands Cline the cage's summary (/opt/sbx/contract-summary.md: what it may reach, which
# files it protects, which operations it offers) as a global rule: a copy at
# `~/Documents/Cline/Rules/sbx-contract.md`. Cline combines every file of its global rules
# directories with `~/.agents/AGENTS.md` and the project's rules, so nothing of yours is replaced. The
# copy lives in the app's isolated home, which only this app's cages read: it is rewritten at every
# launch, removed by a launch without a summary, and a file of yours at that path is left untouched
# (the summary is then not added). No option is used: `-s`/`--system` replaces the whole default
# system prompt, your global rules with it, and `--config`, `--data-dir` and `CLINE_DIR` would move
# your configuration. Arguments after `sbx app run cline --` reach Cline verbatim through `"$@"`.
cmd = [
    "bash",
    "-c",
    '''
s=/opt/sbx/contract-summary.md
d="$HOME/Documents/Cline/Rules"
f="$d/sbx-contract.md"
m='<!-- sbx: the cage summary, rewritten at every launch -->'
if [ -r "$s" ]; then
  if [ ! -e "$f" ] || grep -qsF "$m" "$f"; then
    mkdir -p "$d" && { printf '%s\n' "$m"; cat "$s"; } > "$f.tmp" && mv -f "$f.tmp" "$f"
  fi
elif grep -qsF "$m" "$f"; then
  rm -f "$f"
fi
exec cline "$@"
''',
    # `$0` placeholder: the arguments after `--` arrive as `$1 $2 …`.
    "cline",
]

# Your host Cline config, mounted read-write at its real absolute path. `binds` is a security
# field, honored only because this profile lives in your trusted config dir; `mode = "rw"` lets
# the caged `cline` read and write these host files (login, settings). Uncommented, the bind
# appears at that host path and not under the cage's `$HOME` (`/home/sandbox`), so the app keeps
# its isolated home and reaches these files only by their absolute path.
#binds = [
#    { path = "~/.cline", mode = "rw" },
#]

# --- The agent's requirements come from its bundle ------------------------------------------------
# `use` pulls in the `cline` BUNDLE — the package(s), the environment it reads, the hosts it must
# reach, and its telemetry mutes — from one declaration shared with the bundle file itself, so this
# profile cannot fall behind when the agent's requirements change.
#
# THE BUNDLE IS NOT IN THIS FILE — import it too, in either order:
#     sbx bundle import examples/bundle/cline.toml
# Without it the launch warns that the bundle is undeclared and the agent is simply absent.
use = ["cline"]

# No `[packages]` here: the agent's package comes from its bundle — see `use` above.

# An app is read-by-default ({GET,HEAD}); the API hosts the agent POSTs to are opened to all verbs
# with `{*}`.
[network]
mode = "deny"
# The agent's OWN hosts are NOT listed here — they arrive with its bundle (`use` above) and are
# unioned into this list at resolution. Check what that adds with `sbx bundle cline`, and what the
# launch ends up with via `sbx config show --app cline`.
allow = [
    # Nothing here: the npm install lane, Cline's API and account hosts and the models catalogue
    # arrive with the bundle and are unioned in at resolution.
    # Direct-OpenRouter BYOK: uncomment together with the [secret] block below.
    #"{*} https://openrouter.ai",
]

# Refusals to keep OUT of the default `sbx net logs` (SELinux `dontaudit`), so the ones worth acting
# on stay visible. A `mute` never changes the verdict (the host is still refused) and never hides a
# count (`sbx net stats` still tallies it); it only keeps the line out of the default log. See it
# anytime with `sbx net logs --all`, and edit this list from the CLI with
# `sbx net mute|unmute <host> -a cline`. The day you decide to let the telemetry through, allow it
# with `sbx net allow '{*} https://otel.cline.bot' -a cline`.
mute = [
    # Nothing here: the mute of Cline's OpenTelemetry sink (POST /v1/logs, which a live run hits
    # every few seconds) and the npm audit and JSR probes arrive with the bundle and are unioned in
    # at resolution.
]

# The real API key is read on the HOST and injected by the egress proxy — never in the cage.
# The in-cage placeholder lets Cline start and issue the request; the proxy strips it and
# substitutes the real key on the wire to openrouter.ai.
[env]
#OPENROUTER_API_KEY = "sk-or-sbx-placeholder-replaced-by-the-egress-proxy"

#[secret."openrouter.ai"]
#from = "env://OPENROUTER_API_KEY"
#header = "Authorization"
#type = "bearer"
