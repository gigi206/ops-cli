# Cline — the autonomous coding agent's standalone CLI, sandboxed by sbx.
#
#   sbx app import examples/app/cline.toml
#   sbx app run cline
#
# Cline ships a genuine terminal CLI on npm (the `cline` package), distributed as a
# self-contained native binary resolved through platform-specific optional dependencies
# — so sbx equips it in-cage with a node runtime (for the npm install) plus mise's npm
# backend. The native binary needs no node at runtime; the install fetches it (and the
# package's deps) from registry.npmjs.org, so the first launch in a project needs the
# network and the allowlist below.
#
# Cline is BYOK and multi-provider. This template keys it to OpenRouter (one key, hundreds
# of models, OpenAI-compatible bearer auth). The real key is read on the HOST and injected
# by the egress proxy on the wire to openrouter.ai — never in the cage. Provide it on the
# host as $OPENROUTER_API_KEY (or point `from` at a resolver, e.g. sops://secrets.yaml#openrouter),
# then select OpenRouter inside Cline (`cline auth`, persisted in the app's isolated home, or
# launch `cline -P openrouter`). To use a different provider, change the allowlist host + the
# [secret] block + the env var — e.g. Anthropic (api.anthropic.com, ANTHROPIC_API_KEY, header
# "x-api-key", type "raw") or OpenAI (api.openai.com, OPENAI_API_KEY, header "Authorization",
# type "bearer"). Cline reads ANTHROPIC_API_KEY / OPENAI_API_KEY / OPENROUTER_API_KEY directly.
#
# Cline stores its config + credentials under ~/.cline in the app's persistent isolated home.
# (Cline probes the host name at startup; `hostname` is declared in `[packages]` below since the
# hermetic cage ships none.) If a request is blocked, the proxy reports the host it refused —
# add it to `allow` (or check ahead with `sbx test net <url>`).
cmd = "cline"

# Your host Cline config, mounted read-write at its real absolute path. `binds` is a security
# field, honored only because this profile lives in your trusted config dir; `mode = "rw"` lets
# the caged `cline` read and write these host files (login, settings). Uncomment to share your
# host Cline setup with the cage instead of the app's isolated home (the default).
#binds = [
#    { path = "~/.cline", mode = "rw" },
#]

[packages]
# A node runtime (the npm install needs it), then Cline itself via mise's npm backend. The
# executed `cline` is a native binary (resolved via the package's optional dependencies), so
# node is needed only to install. Both are trusted-only [packages]; this profile is trusted
# by location once imported.
nodejs = "nix:nodejs"
cline = "mise:npm:cline"
# Cline probes the host name at startup; the hermetic cage ships no `hostname`,
# so provide it to avoid the `hostname: command not found` noise.
hostname = "nix:hostname"

# An app is read-by-default ({GET,HEAD}); these are write hosts (install POSTs, API POSTs), so
# each is opened to all verbs with `{*}`.
[network]
mode = "deny"
allow = [
    # Install: the packument (`npm view`/version resolution hits `/cline`, as does `sbx upgrade`),
    # the tarball (`/cline/-/…`), and the platform binary (an optional dependency published at its
    # own top-level path) — npm spreads these across sibling paths, so the registry host is opened
    # read-only as a whole (like the other npm-backed profiles), not path-scoped.
    "{GET} https://registry.npmjs.org",
    # Runtime: Cline's backend/account control plane and its telemetry endpoint. Telemetry can
    # be turned off in Cline's settings; keep `data.cline.bot` here (or deny it explicitly) to
    # avoid silent drops. Cline publishes no exhaustive host list — if a real run is refused a
    # host, the proxy names it; add it here.
    "{*} https://api.cline.bot",
    "{*} https://data.cline.bot",
    # A third-party model catalogue Cline fetches to suggest models (observed on a live run).
    "{GET} https://models.dev",
    # WorkOS device-authorization endpoint — Cline's account login flow.
    "{*} https://api.workos.com",
    # Direct-OpenRouter BYOK: uncomment together with the [secret] block below.
    #"{*} https://openrouter.ai",
]

# Refusals to keep OUT of the default `sbx net log` (SELinux `dontaudit`): hosts we deliberately
# leave DENIED — here Cline's OpenTelemetry telemetry sink (POST /v1/logs), which a live run hammers
# every few seconds and whose `denied-default` lines would drown the ones worth acting on. A `mute`
# never changes the verdict (the telemetry is still refused) and never hides a count (`sbx net stats`
# still tallies it); it only keeps the line out of the default log. See it anytime with
# `sbx net log --all`, and edit this list from the CLI with `sbx net mute|unmute <host> -a cline`.
# Remove the entry here the day you decide to allow the endpoint (uncomment the `{*} https://otel.cline.bot`
# line above instead).
mute = [
    "otel.cline.bot",                  # Cline OpenTelemetry telemetry (POST /v1/logs)
    "{POST} https://registry.npmjs.org/-/npm/v1/security/advisories/*",  # npm audit (non-essential to install, noisy)
]

# The real API key is read on the HOST and injected by the egress proxy — never in the cage.
# The in-cage placeholder lets Cline start and issue the request; the proxy strips it and
# substitutes the real key on the wire to openrouter.ai.
[env]
#OPENROUTER_API_KEY = "sk-or-sbx-placeholder-replaced-by-the-egress-proxy"

#[secret."openrouter.ai"]
#from = "env://OPENROUTER_API_KEY"
#header = "Authorization"
#type = "bearer"
