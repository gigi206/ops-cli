# Hermes — NousResearch's open-source agent, served as a browser dashboard by sbx.
#
#   sbx bundle import examples/bundle/hermes.toml
#   sbx app import examples/app/hermes-web.toml
#   sbx app run hermes-web        # then open http://127.0.0.1:9119 in your host browser
#
# THIS PROFILE IS NOT SELF-CONTAINED, on purpose. The agent's package and hosts come from a shared
# BUNDLE, so import it too:
#     sbx bundle import examples/bundle/hermes.toml
#     sbx app import examples/app/hermes-web.toml
# One extra step, and it buys the thing that was actually broken here: a hand-copy of an agent's
# requirements silently falls behind the agent.
#
#   EGRESS GROUPS — shared lanes, imported once (shared, not per-agent):
#     sbx net groups import examples/net-groups/models-catalog.toml
#     sbx net groups import examples/net-groups/npm-registry.toml
#     sbx net groups import examples/net-groups/npm-audit.toml
#     sbx net groups import examples/net-groups/npm-jsr.toml
#     sbx net groups import examples/net-groups/huggingface-hub.toml
#
# A second way to run Hermes alongside `sbx app run hermes` (the terminal CLI). Hermes ships a
# browser dashboard — `hermes dashboard` serves a FastAPI/React SPA (the built `web_dist/`
# bundle, packaged inside the wheel) on 127.0.0.1:9119. sbx serves it headless in the cage
# (`--no-open`, no in-cage browser) and forwards the host's localhost:9119 into the cage, so
# you reach the same agent in a real browser UI on the host: chat with streaming tool output,
# side-by-side previews, a file browser, settings — no terminal.
#
# sbx equips Hermes via the flake's `#default` output —
# `flake:github:NousResearch/hermes-agent#default` in the `hermes` bundle — so `sbx upgrade --app
# hermes-web` rolls it forward. That one package bundles the Python agent (uv2nix, its own interpreter), the
# node front-ends, the web dashboard assets (`web_dist`), and every optional extra (web/voice/edge-tts/
# mcp/…), all wired by the derivation's own wrapper (it sets HERMES_WEB_DIST / HERMES_TUI_DIR /
# HERMES_NODE) — so the dashboard's server AND its `/chat` node terminal work with no manual
# `nix:nodejs`/`HERMES_TUI_DIR` plumbing. sbx builds a remote `flake:` ref HOST-SIDE with `nix build`
# (like `nix:`) into its shared store, then seeds it per project: the FIRST launch is a multi-minute,
# ~2 GiB build whose PyPI + npm source fetches use the HOST network — they are NOT subject to the
# cage's allowlist below, which governs only what the running agent may reach. Later launches reuse
# the warm build, which is shared with the other hermes profiles.
#
# CREDENTIAL POSTURE — identical to the CLI profile. Hermes is BYOK and multi-provider; this
# template keys it to OpenRouter (Hermes' default — one key, hundreds of models, OpenAI-
# compatible bearer auth). BYOK is commented out below, so this profile ships with no baked-in
# credential. Uncomment the [env] placeholder and the [secret] block, and provide
# $OPENROUTER_API_KEY on the host, to have the egress proxy inject the key on the wire to
# openrouter.ai — the plaintext never enters the cage. To use a different provider, change the
# allowlist host + the [secret] block + the env var — e.g. Anthropic (api.anthropic.com,
# ANTHROPIC_API_KEY, header "x-api-key", type "raw") or OpenAI (api.openai.com, OPENAI_API_KEY,
# header "Authorization", type "bearer"). The dashboard itself may ask you to complete an auth
# step in the browser (the same provider login, or a local dashboard password); that traffic
# rides the allowlist below. If a request is blocked, the proxy reports the host it refused —
# add it to `allow` (or check ahead with `sbx test net <url>`).
cmd = [
    "bash",
    "-c",
    '''
# The cage's summary as the context of a managed `pre_llm_call` hook (see the note below `cmd`).
home="${HERMES_HOME:-$HOME/.hermes}"
# The interpreter Hermes runs on: the first `#!…python` along the launcher's `exec` chain (nix wraps
# the entry point in a shell script that execs the real one). The desktop app keeps its `hermes` off
# PATH and names it in its own launcher.
py=
f="$(command -v hermes 2>/dev/null)" \
  || f="$(grep -o '/nix/store/[a-z0-9]*-hermes-agent-[^/]*/bin/hermes' \
          "$(readlink -f "$(command -v hermes-desktop)" 2>/dev/null)" 2>/dev/null | head -n 1)"
f="$(readlink -f "$f" 2>/dev/null)"
for _ in 1 2 3; do
  [ -r "$f" ] && read -r first < "$f" || break
  case "$first" in
    '#!'*python*) py="${first#\#!}"; py="${py# }"; py="${py%% *}"; break ;;
  esac
  f="$(grep -o '^exec "[^"]*"' "$f" | tail -n 1)"; f="${f#exec \"}"; f="${f%\"}"
done
if [ -r /opt/sbx/contract-summary.md ] && [ -x "$py" ] \
   && ! grep -qs 'pre_llm_call' "$home/config.yaml" && mkdir -p /etc/hermes 2>/dev/null; then
  { printf '#!%s\n' "$py"; cat <<'PY'; } > /etc/hermes/sbx-contract-hook
import json, sys
try:
    payload = json.load(sys.stdin)
except ValueError:
    payload = {}
if isinstance(payload, dict) and (payload.get("extra") or {}).get("is_first_turn"):
    try:
        with open("/opt/sbx/contract-summary.md", encoding="utf-8") as f:
            print(json.dumps({"context": f.read()}))
    except OSError:
        pass
PY
  chmod 755 /etc/hermes/sbx-contract-hook
  printf '%s\n' 'hooks:' '  pre_llm_call:' '    - command: /etc/hermes/sbx-contract-hook' > /etc/hermes/config.yaml
  "$py" - "$home" <<'PY'
import json, os, sys, tempfile
home, command = sys.argv[1], "/etc/hermes/sbx-contract-hook"
path = os.path.join(home, "shell-hooks-allowlist.json")
try:
    with open(path, encoding="utf-8") as f:
        data = json.load(f)
except FileNotFoundError:
    data = {}
except (OSError, ValueError):
    sys.exit(0)
if not isinstance(data, dict):
    sys.exit(0)
approvals = data.get("approvals")
if not isinstance(approvals, list):
    approvals = data["approvals"] = []
if any(isinstance(e, dict) and e.get("event") == "pre_llm_call" and e.get("command") == command
       for e in approvals):
    sys.exit(0)
approvals.append({"event": "pre_llm_call", "command": command})
os.makedirs(home, exist_ok=True)
fd, tmp = tempfile.mkstemp(prefix=".sbx-allowlist.", dir=home)
with os.fdopen(fd, "w", encoding="utf-8") as f:
    json.dump(data, f, indent=2, sort_keys=True)
os.replace(tmp, path)
PY
fi
exec hermes dashboard --no-open "$@"
''',
    # `$0` placeholder: the arguments after `--` arrive as `$1 $2 …`.
    "hermes",
]

# The command hands Hermes the cage's summary (/opt/sbx/contract-summary.md: what it may reach,
# which files it protects, which operations it offers) through its managed configuration, the
# `/etc/hermes/config.yaml` layer Hermes reads over yours. That layer declares one `pre_llm_call`
# shell hook, `/etc/hermes/sbx-contract-hook`, which returns the summary as context on the first turn
# of a session; Hermes adds it to that turn's user message (never the system prompt) and replays it
# on the turns that follow. Your `agent.system_prompt`, personality and context files still apply.
# `/etc` is the cage's own tmpfs: both files live for this launch only and never reach the host. A
# shell hook runs only once approved, so the command adds that one hook to the approvals in
# `~/.hermes/shell-hooks-allowlist.json`, leaving yours as they are, rather than turning on
# `hooks_auto_accept`, which would approve any hook of yours still waiting. The managed layer would
# replace a `pre_llm_call` list of your own, so when your `config.yaml` has one the command adds
# nothing. `HERMES_SAFE_MODE=1` turns every shell hook off, this one included.
# The dashboard registers these hooks the way the CLI does (read in its `tui_gateway`); the reply
# of a model was measured on the CLI, not here.

# Forward the host's localhost:9119 into the cage so your host browser reaches the dashboard.
# `hermes dashboard` binds 127.0.0.1:9119 inside the cage; this hole bridges it to the host. A
# port already in use on the host fails the launch closed. Must stay a top-level key: written
# after a `[table]` header, TOML would fold it into that table (e.g. `network.forward`) and it
# would be silently ignored.
forward = [9119]

# Your host Hermes config, mounted read-write at its real absolute path. `binds` is a security
# field, honored only because this profile lives in your trusted config dir; `mode = "rw"` lets
# the caged `hermes` read and write these host files (login, settings, sessions). Uncommented,
# the bind appears at that host path and not under the cage's `$HOME` (`/home/sandbox`), so the
# app keeps its isolated home and reaches these files only by their absolute path.
#binds = [
#    { path = "~/.hermes", mode = "rw" },
#]

# Microphone + audio playback for the dashboard's voice mode (`/voice on`). A security field,
# honored only because this profile is trusted by location; it provisions the PulseAudio client +
# the ALSA→PulseAudio shim and binds the host's PulseAudio socket into the cage. The PulseAudio bus
# is NOT per-client isolated — it exposes the microphone AND all system-audio output — so this is
# trusted-only. Comment it out if you never use voice mode. Must stay a top-level key (like
# `forward`): written after a `[table]` header, TOML would fold it into that table and drop it.
audio = true

# BROWSER TOOLSET — `gui = "offscreen"` is what makes Hermes' 12 `browser_*` tools (navigate,
# snapshot, click, type, press, scroll, back, console, get_images, vision, cdp, dialog) appear. Hermes
# gates them on `agent-browser` being on PATH AND a Chromium build being on disk; when either is
# missing it drops them from the model's tool schema, which is why a cage without them silently
# offers fewer tools than a standard install (whose installer runs `npm install -g agent-browser &&
# agent-browser install`). The two packages below supply both — but a browser engine also needs two
# things the hermetic cage lacks, and that is this posture: fonts (without them Chromium dies the
# moment it renders a real page) and the egress proxy's CA in the cage's NSS store (Chromium reads
# its own store, not the CA-file env vars sbx sets, so every page would fail
# ERR_CERT_AUTHORITY_INVALID under the allowlist). It renders OFF-SCREEN: no window, no compositor
# socket, no host access at all. A trusted-only security field, and it must stay a TOP-LEVEL key:
# written after a `[table]` header, TOML would fold it into that table and silently drop it. Drop
# this line and the two packages if you do not want the browser tools.
#
# Note what the sandbox does NOT change: the browser reaches only what the allowlist below allows, so
# a page on any other host is refused (and its subresources with it — a real site pulls from many
# hosts). The proxy names what it blocked, so open a site you actually want with
# `sbx net allow -a hermes-web <url>`. This is the deliberate posture: browsing is not opened wholesale.
gui = "offscreen"

# --- The agent's requirements come from its bundle ------------------------------------------------
# `use` pulls in the `hermes` BUNDLE — the package(s), the environment it reads, the hosts it must
# reach, and its telemetry mutes — from one declaration shared with the bundle file itself, so this
# profile cannot fall behind when the agent's requirements change.
#
# THE BUNDLE IS NOT IN THIS FILE — import it too, in either order:
#     sbx bundle import examples/bundle/hermes.toml
# Without it the launch warns that the bundle is undeclared and the agent is simply absent.
use = ["hermes"]

[packages]
# Hermes itself rides the bundle: the flake's `#default` output, built host-side — so `sbx upgrade
# --app hermes-web` rolls it forward. One package supplies the interpreter, the node runtime, the
# web dashboard assets, the `/chat` tab's embedded TUI, and every optional extra — so there is no
# separate `nix:uv`/`nix:python`/`nix:nodejs` and no launch-time `pip install`, and the `/chat` node
# terminal that used to need a manual
# `nix:nodejs` + `HERMES_TUI_DIR` sentinel now works natively (the derivation's wrapper sets both).
# Trusted-only [packages]; this profile is trusted by location once imported. First launch builds it
# (~2 GiB, minutes) over the HOST network, outside the cage's allowlist.
#
# The `#default` build bundles the `full` extra set (voice, edge-tts, exa, firecrawl, mcp, and the
# chat-platform / cloud SDKs), so every dashboard feature is available — heavier than the old curated
# venv, but upgradeable and self-wiring. Some extras fetch runtime assets on FIRST USE — `voice`'s
# Whisper model from Hugging Face, `edge-tts` from a Microsoft endpoint — which the bundle's
# allowlist carries; a host the proxy refuses shows in `sbx net logs -a hermes-web`, add it with
# `sbx net allow -a hermes-web <url>`.
# The browser toolset (see `gui = "offscreen"` above). `agent-browser` is Hermes' own browser-driver
# CLI: a self-contained Rust binary shipped in its npm tarball, so mise's `--ignore-scripts` install
# is not merely harmless but wanted — it skips the postinstall that would otherwise download a
# Playwright browser, which nixpkgs' Chromium replaces. `nodejs` (in the bundle) is required because
# mise's npm backend needs a node in the cage (the flake's own bundled node is only on the `hermes`
# wrapper's PATH, not the cage's). Chromium is HEAVY — ~620 MB unpacked, a larger closure — and
# lands in the project store on the first launch. agent-browser finds Chromium on PATH by itself;
# point it elsewhere with `AGENT_BROWSER_EXECUTABLE_PATH` if you ever need to.
chromium = "nix:chromium"
agent-browser = "mise:npm:agent-browser"

[network]
mode = "deny"
# Silence the cloud-metadata probe (169.254.169.254 / AWS IMDS) that a cloud SDK in the closure
# fires on startup to auto-discover credentials. There is nothing to discover off-cloud, and the
# proxy refuses link-local/metadata addresses by construction (SSRF guard) — the verdict is
# unchanged, this only drops the noisy denied line from the default `sbx net logs` (SELinux
# dontaudit semantics). Still visible via `sbx net logs --all`.
mute = [
    "169.254.169.254",
    # The npm audit and JSR mutes (refused anyway, just kept out of the default log) arrive with
    # the bundle and are unioned in at resolution.
]
# The agent's OWN hosts arrive with its bundle (`use` above) and are unioned into this list at
# resolution. Check the union with `sbx config show --app hermes-web`.
allow = [
    # OpenRouter BYOK — OPTIONAL, and off by default: the shipped default is the NousResearch
    # account login (no BYOK key). To enable, uncomment the line below, import the group once
    # (`sbx net groups import examples/net-groups/openrouter.toml`), set OPENROUTER_API_KEY, and
    # uncomment the [secret."openrouter.ai"] block further down.
    #"@openrouter",
    # Nothing here: the npm lane `agent-browser` installs from, the NousResearch account hosts
    # (portal, inference-api — the dashboard's own auth flow rides them too), the model catalogs,
    # the pet gallery and the voice assets (Hugging Face, edge-tts's `{GET,WS}` host) arrive with
    # the bundle and are unioned in at resolution. edge-tts works under the MITM because sbx sets
    # `wss_proxy` and the audio hole's Python shim points certifi at sbx's CA. (No build-time
    # entries: a remote `flake:` ref builds HOST-SIDE, over the host network, so the build's own
    # fetches — the PyPI wheels for uv2nix, the npm registry for the node front-ends, the git
    # smart-HTTP fetch of the hermes-agent repo, the nix binary cache — never pass through this
    # allowlist. Runtime residual, left closed on purpose: installing an OPTIONAL MCP or skill
    # (`hermes mcp install …`) DOES fetch from inside the cage, and each catalog manifest picks its
    # own mechanism — `npx -y <pkg>` hits registry.npmjs.org, a uvx/venv server hits PyPI, and a
    # `install: {type: git}` manifest hits github.com. Those are refused by default rather than
    # pre-opened; the proxy names the host it blocked, so open just the one you need with `sbx net
    # allow -a hermes-web <url>`. A remote-HTTP MCP (e.g. Linear's) needs its own host too.)
]

# The real API key is read on the HOST and injected by the egress proxy — never in the cage.
# Uncomment both blocks and provide $OPENROUTER_API_KEY on the host to enable BYOK; the in-cage
# placeholder lets Hermes start and issue the request, and the proxy substitutes the real key
# on the wire to openrouter.ai.
[env]
# `AGENT_BROWSER_ARGS` (the flags agent-browser passes to the Chromium it launches: the mandatory
# `--no-sandbox`, since Chromium's own sandbox cannot come up in the cage, and
# `--disable-dev-shm-usage`) rides the bundle with the tool that reads it (`sbx bundle hermes`).
# No HERMES_TUI_DIR needed — the flake's `#default` wrapper sets it (and HERMES_NODE / HERMES_WEB_DIST)
# to the bundled TUI/web assets, so the `/chat` node terminal works out of the box.
#OPENROUTER_API_KEY = "sk-or-sbx-placeholder-replaced-by-the-egress-proxy"

#[secret."openrouter.ai"]
#from = "env://OPENROUTER_API_KEY"
#header = "Authorization"
#type = "bearer"
