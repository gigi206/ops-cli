# GitHub Copilot CLI — the Copilot coding agent in your terminal, sandboxed by sbx.
#
#   sbx bundle import examples/bundle/copilot.toml
#   sbx app import    examples/app/copilot.toml
#   sbx app run copilot
#
# THIS PROFILE IS NOT SELF-CONTAINED, on purpose. The agent's package and hosts come from a shared
# BUNDLE, and its GitHub account sign-in from a shared egress GROUP — import both:
#     sbx bundle import    examples/bundle/copilot.toml
#     sbx net groups import examples/net-groups/github-oauth.toml
#     sbx app import       examples/app/copilot.toml
# One extra step, and it buys the thing that was actually broken here: a hand-copy of an agent's
# requirements silently falls behind the agent.
#
# GitHub ships the Copilot CLI as a self-contained release binary (`copilot-linux-x64.tar.gz`
# on github/copilot-cli releases) — no node runtime, no nixpkgs attribute needed. sbx equips it
# fresh from upstream via mise's `aqua` backend, which selects the asset through the aqua
# registry and verifies it against the release's own `SHA256SUMS.txt` (a checksum published in
# the same release — so, unlike `goose`, there is no external signing infrastructure to reach).
# The binary lands in the app's persistent isolated home; it is equipped at the latest upstream
# version on the first launch in a project, then pinned — advance it with `sbx app upgrade copilot`.
#
# CREDENTIAL POSTURE — GitHub ACCOUNT, not a header-injectable provider key. Copilot
# authenticates to your GitHub account, so there is no per-provider HTTP header for sbx's
# `[secret]` broker to strip-and-inject, and this profile ships no `[secret]` block (contrast
# the BYOK profiles like `cline`/`vtcode`). Two ways in, both documented upstream:
#
#  - **`/login` inside the CLI** — the device flow: Copilot prints a code and a
#    `github.com/login/device` URL. The hermetic cage has no browser, so open that URL on your
#    host and type the code there; the CLI polls and stores the token in its own config under
#    the app's isolated `$HOME`. One-time, and it survives relaunches.
#  - **A fine-grained PAT** with the "Copilot Requests" permission
#    (github.com/settings/personal-access-tokens/new), passed for ONE launch and never baked
#    into this file:
#        sbx app run copilot --env GH_TOKEN=github_pat_…
#    (`GH_TOKEN` takes precedence over `GITHUB_TOKEN`, per GitHub's docs.)
#
# EGRESS. The hosts below come from GitHub's own Copilot allowlist reference, narrowed to what a
# CLI session needs; the telemetry/experimentation endpoints are deliberately left DENIED and
# `mute`d (they are refused either way — the mute only keeps their lines out of the default log).
# If a real session is refused a host, the proxy names it: add it with
# `sbx net allow -a copilot '{*} https://<host>'`, or check ahead with `sbx test net <url>`.
#
# UNVERIFIED (like every profile until run with a real account): the live login and the model
# traffic through sbx's MITM. What is grounded here is the packaging (official GitHub release via
# aqua), the auth mechanisms (GitHub's own README), and the host list (GitHub's allowlist doc).
cmd = "copilot"

# Your host Copilot CLI config, mounted read-write at its real absolute path. `binds` is a
# security field, honored only because this profile lives in your trusted config dir; `mode = "rw"`
# lets the caged `copilot` read and write these host files (login, settings). Uncomment to share
# your host Copilot setup with the cage instead of the app's isolated home (the default).
#binds = [
#    { path = "~/.config/copilot", mode = "rw" },
#]

# --- The agent's requirements come from its bundle ------------------------------------------------
# `use` pulls in the `copilot` BUNDLE — the package(s), the environment it reads, the hosts it must
# reach, and its telemetry mutes — from one declaration shared with the bundle file itself, so this
# profile cannot fall behind when the agent's requirements change.
#
# THE BUNDLE AND THE GROUP ARE NOT IN THIS FILE — import them too, in any order:
#     sbx bundle import    examples/bundle/copilot.toml
#     sbx net groups import examples/net-groups/github-oauth.toml
# Without them the launch warns that a bundle/group is undeclared and the agent is simply absent.
# The `copilot` bundle carries the agent itself; the GitHub account sign-in hosts
# (github.com/login/* path-scoped, plus the api.github.com entitlement lookups) arrive together
# with the shared `@github-oauth` group.
use = ["copilot"]

# No `[packages]` here: the agent's package comes from its bundle — see `use` above.

# An app is read-by-default ({GET,HEAD}); the endpoints below carry POSTs (the device flow, the
# chat completions), so each is opened to all verbs with `{*}`.
[network]
mode = "deny"
# The agent's OWN hosts (the Copilot API and the suggestion/proxy services) arrive with its bundle
# (`use` above); the GitHub ACCOUNT hosts arrive with the shared `@github-oauth` group named in the
# header. Check the union with `sbx config show --app copilot`.
allow = [
    # GitHub account sign-in: the device-flow `/login` pages (path-scoped: only the login
    # endpoints, not all of github.com, whose read-only lane the built-in allow-set already
    # provides) and the `api.github.com` entitlement lookups (`/user`, `/copilot_internal/*`,
    # where the built-in GET lane is not enough and the CLI POSTs). The set is the account lane
    # itself, not this agent's, so it comes from a group rather than a copy.
    "@github-oauth",
]

# Refusals to keep OUT of the default `sbx net log` (SELinux `dontaudit`): the telemetry and
# experimentation endpoints, which nothing above allows. A `mute` never changes the verdict and
# never hides a count (`sbx net stats` still tallies it); it only keeps the lines out of the default
# log, so the refusals worth acting on stay visible. See everything with `sbx net log --all`, and
# edit this list from the CLI with `sbx net mute|unmute <host> -a copilot`.
#
# One nuance, measured rather than assumed: `copilot-telemetry.githubusercontent.com` sits under
# sbx's built-in always-on `{GET,HEAD} *.githubusercontent.com` lane (the self-equip read-only
# allowance), so its GETs are ALLOWED and only its writes — which is what a telemetry upload is —
# are refused and muted here. The other two are refused outright.
mute = [
]

[env]
# No system keyring exists in the hermetic cage; nothing here needs one — the token lands in
# Copilot's own config file under the app's isolated home. Pass a PAT for a single launch with
# `--env GH_TOKEN=…` rather than writing it below (a profile is a shared artifact, not a vault).
#GH_TOKEN = "github_pat_…"
