# siGit Code — a local-LLM-first coding agent: the model runs in the cage, sandboxed by sbx.
#
#   sbx bundle import examples/bundle/sigit.toml
#   sbx app import examples/app/sigit.toml
#   sbx app run sigit
#
# THIS PROFILE IS NOT SELF-CONTAINED, on purpose. The agent's package and hosts come from a shared
# BUNDLE, so import it too:
#     sbx bundle import examples/bundle/sigit.toml
#     sbx app import examples/app/sigit.toml
# One extra step, and it buys the thing that was actually broken here: a hand-copy of an agent's
# requirements silently falls behind the agent.
#
#   EGRESS GROUPS — shared lanes, imported once (shared, not per-agent):
#     sbx net groups import examples/net-groups/npm-audit.toml
#     sbx net groups import examples/net-groups/npm-jsr.toml
#     sbx net groups import examples/net-groups/npm-registry.toml
#     sbx net groups import examples/net-groups/huggingface-hub.toml
#
# **The profile with no credential at all.** Every other agent here talks to somebody's API; siGit
# Code runs the model itself — it downloads a Qwen3 GGUF from Hugging Face on first launch (roughly
# 1–2 GB, into the app's persistent isolated home) and infers in-process. So there is no account, no
# BYOK key, no `[secret]` block, and nothing for the egress proxy to inject: after the model is on
# disk, the agent works with **no model host reachable at all**.
#
# That also makes it the profile the cage fits best. A local model means the code you point it at
# never leaves your machine — and here it additionally cannot leave the cage, since the only hosts
# it can reach are read-only lanes: the bundle's npm install lane and model downloads, beside sbx's
# built-in read-only set.
#
# PACKAGING. Upstream publishes the npm package as `@getsigit/sigit` (formerly `@smbcloud/sigit`,
# which now prints a notice pointing to the new name) alongside cargo/brew/pip; it is a small shim
# that dispatches to a prebuilt platform package (`@getsigit/sigit-linux-x64`, ~78 MB) — a plain
# optional dependency with **no install script**, so mise's `--ignore-scripts` costs nothing. The
# binary is dynamically linked and runs through the cage's nix-ld shim. `sbx upgrade mise` rolls
# it forward.
#
# COST AND SPEED, stated plainly: the first launch pays a 1–2 GB download, and inference runs on
# **your CPU** unless you have GPU offload configured (`gpu = true` opens the render node — see
# `docs-site/docs/guide/configuration/gpu.md` — but whether this build uses it is unproven here). A 4B model on
# CPU is usable for focused edits, not for large refactors. Upstream also offers a hosted option at
# `code.sigit.si` for people who would rather not run a model locally; that is a different posture
# (a service account), not what this profile does.
#
# WHAT YOU WILL SEE AT THE FIRST START, and why it is not a fault. siGit asks `sigit.si` for its
# vendor's MCP tool server before anything else, this profile refuses that host, and siGit says so
# in its own log: `server 'sigit' unavailable … returned 403 … not allowed by the network policy`.
# That is the posture working. The agent starts and edits normally; what it loses is that one
# remote toolset. The line comes from siGit, not from sbx, so it is printed whatever sbx does; the
# bundle mutes the host so that sbx's own egress log does not ALSO report a refusal the profile
# intends, the way it already mutes the search backend. To take the other
# posture, `sbx net allow sigit.si --app sigit` — and read the paragraph above first, since the
# point of this profile is that nothing leaves the cage.
#
# UNVERIFIED (like every profile until run for real): the model download and the first inference in
# the cage. The bundle's two model-download rules were measured against the shapes Hugging Face
# redirects to — both `cdn-lfs-us-1.hf.co` and `cas-bridge.xethub.hf.co` are covered — but whether
# a real download stays inside them is not proven; if a fetch is refused, `sbx net logs -a sigit`
# names the host it wanted.
# Grounded here: the packaging (read out of the published packages), the model provider and the
# absence of any credential (read out of the shipped binary and upstream's README).
# The command hands siGit the cage's summary (/opt/sbx/contract-summary.md: what it may reach, which
# files it protects, which operations it offers) as its global instructions file,
# `~/.config/sigit/AGENTS.md`, which siGit loads first, beneath the `AGENTS.md`/`CLAUDE.md` files
# from the repository root down to the working directory. That file is yours to keep, so the
# command writes it only while you have none: a copy marked as sbx's, rewritten at every launch and
# removed by a launch without a summary. Once you write your own there, it is left untouched and the
# summary is no longer added. It is not written while a `CLAUDE.md` of yours sits in that directory
# either, since siGit reads only the first of the two names there. The file lives in the app's
# isolated home, which only this app's cages read, and `SIGIT_CONFIG_DIR` moves it (the command
# follows it). Measured with `sigit -p` against an OpenAI-compatible provider (`OPENAI_BASE_URL`),
# which answers from it beside the project's `AGENTS.md`; headless mode never loads the local model.
cmd = [
    "bash",
    "-c",
    '''
d="${SIGIT_CONFIG_DIR:-$HOME/.config/sigit}"
s=/opt/sbx/contract-summary.md
f="$d/AGENTS.md"
m='<!-- sbx: the cage summary, rewritten at every launch -->'
if [ -r "$s" ] && [ ! -e "$d/CLAUDE.md" ]; then
  if [ ! -e "$f" ] || grep -qsF "$m" "$f"; then
    mkdir -p "$d" && { printf '%s\n' "$m"; cat "$s"; } > "$f.tmp" && mv -f "$f.tmp" "$f"
  fi
elif grep -qsF "$m" "$f"; then
  rm -f "$f"
fi
exec sigit "$@"
''',
    # `$0` placeholder: the arguments after `--` arrive as `$1 $2 …`.
    "sigit",
]

# Your host siGit model cache, mounted read-write at its real absolute path. `binds` is a security
# field, honored only because this profile lives in your trusted config dir. Uncomment to reuse a
# model you have already downloaded on the host instead of paying for a second copy in the app's
# isolated home (the default) — check upstream's cache location for your platform first.
#binds = [
#    { path = "~/.cache/sigit", mode = "rw" },
#]

# --- The agent's requirements come from its bundle ------------------------------------------------
# `use` pulls in the `sigit` BUNDLE — the package(s), the environment it reads, the hosts it must
# reach, and its telemetry mutes — from one declaration shared with the bundle file itself, so this
# profile cannot fall behind when the agent's requirements change.
#
# THE BUNDLE IS NOT IN THIS FILE — import it too, in either order:
#     sbx bundle import examples/bundle/sigit.toml
# Without it the launch warns that the bundle is undeclared and the agent is simply absent.
use = ["sigit"]

# No `[packages]` here: the agent's package comes from its bundle — see `use` above.

# An app is read-by-default ({GET,HEAD}) — which is all a model download needs, so nothing here is
# opened to writes.
[network]
mode = "deny"
# The agent's OWN hosts are NOT listed here — they arrive with its bundle (`use` above) and are
# unioned into this list at resolution. Check what that adds with `sbx bundle sigit`, and what the
# launch ends up with via `sbx config show --app sigit`.
allow = [
    # Nothing here: the install lane (the packument, also used by `sbx upgrade mise`, and the
    # tarballs — the shim plus its ~78 MB platform package) and the model itself (the repository
    # metadata, and the LFS/CAS content hosts it redirects to) arrive with the bundle and are
    # unioned in at resolution.
    # Its web-search tool's backend — refused on purpose, since a local-model agent that reaches no
    # network at all is the point of this profile. Uncomment to let that tool work; the bundle's
    # mute of that host then has nothing to suppress (a mute only ever hides a *refusal*).
    #"{*} https://html.duckduckgo.com",
]

# Refusals to keep OUT of the default `sbx net logs` (SELinux `dontaudit`). A `mute` never changes
# the verdict and never hides a count. See everything with `sbx net logs --all`; edit with
# `sbx net mute|unmute <rule> -a sigit`.
mute = [
    # Nothing here: npm's audit endpoint, the JSR mirror, the web-search backend left denied just
    # above and the vendor's MCP server (`sigit.si`) arrive with the bundle and are unioned in at
    # resolution.
]
