# freebuff desktop — the Electron GUI of Freebuff (by CodebuffAI), sandboxed by sbx (Wayland display).
#
#   sbx app import examples/app/freebuff-desktop.toml
#   sbx app run freebuff-desktop
#
# Freebuff is CodebuffAI's free desktop coding agent: an Electron shell whose UI is served by a bundled
# Bun "orchestrator" child process on the cage loopback, driving the `@codebuff/sdk`. On Linux upstream
# distributes it ONLY as an `.AppImage` (no `.deb`, no nixpkgs attr, no buildable flake), so sbx packages
# it with the `appimage:` backend. Confined by sbx it sees only the cage filesystem (the project you
# launch it from, its own persistent isolated home, and any `binds` below), reaches only the hosts you
# allow, and its powers stop at the sandbox boundary (bubblewrap + seccomp + an empty netns + the egress
# allowlist).
#
# THE `appimage:resolve` BACKEND (auto-upgrade — why NOT a direct `appimage:<url>`). Freebuff's official
# Linux download is a STABLE REDIRECT endpoint, `https://freebuff.com/api/desktop/download/linux`, which
# 302-redirects to the CURRENT versioned `.AppImage` on GitHub (e.g.
# `…/CodebuffAI/codebuff-community/releases/download/freebuff-desktop-v0.0.30/Freebuff-0.0.30-linux-x86_64.AppImage`).
# That endpoint is NOT a literal `.AppImage` URL, so a direct `appimage:<url>` is rejected (sbx requires
# an `appimage:` URL to end in `.AppImage`, a deliberate typo/injection guard — the value is interpolated
# into a generated nix expression). And `appimage:github:CodebuffAI/codebuff-community` does NOT work
# either: that repo is a MONOREPO whose `releases/latest` is the freebuff CLI (a `.tar.gz`, no AppImage),
# with the desktop on interspersed `freebuff-desktop-v*` tags — so "latest" would never be the desktop.
# The clean answer is the auto-upgrade resolver form: `appimage:resolve` paired with the
# `[appimage.freebuff]` table below. sbx runs its `resolve` command in a HERMETIC sandbox (sbx's own base
# tools — curl; a shared network to reach the vendor; sbx's own CA bundle for TLS), the command prints the
# CURRENT `.AppImage` URL by following the redirect, and sbx re-validates that URL, resolves it to a
# content hash, and pins BOTH in the per-project appimage lock. `sbx upgrade appimage` re-runs the command
# and rolls the pin forward when the vendor bumps the version; a warm launch reuses the pin WITHOUT
# re-running it (offline). No manual version bump, no third party.
#
# The AppImage is EXTRACTED at BUILD time, never self-mounted at runtime: `appimage-run`/`wrapType2`/the
# raw AppImage all need a runtime FUSE/namespace mount the cage's seccomp denylist blocks, so sbx unpacks
# the squashfs at build time (`appimageTools.extractType2`) and `autoPatchelfHook`s the Electron binaries
# against a curated library set. The build is HOST-SIDE (an AppImage runs no maintainer script, so
# evaluating it host-side is safe), seeded into the store, and offline-reusable after the first launch.
#
# FIRST LAUNCH resolves + builds the AppImage host-side AND pulls in-cage Chromium (see "SIGN-IN" below) —
# a large Electron + Chromium closure (hundreds of MiB), a couple of minutes, over your HOST network (the
# build does NOT use the cage allowlist). Later launches reuse the pinned build offline.
#
# SIGN-IN — why the `cmd` is a bash wrapper (this is the fix for "clicking sign-in does nothing"). The
# renderer runs on the cage loopback; the "sign-in to freebuff" button opens the login page at an OFF-ORIGIN
# https URL, which Electron's main process hands to `shell.openExternal` (verified in the app's own
# `main.cjs`). A hermetic cage has NO system browser and NO registered URL handler, so `openExternal` does
# NOTHING — the click is silently dropped. Freebuff's login is a device-code flow (open a codebuff.com URL,
# then the in-cage orchestrator polls for completion), so the WHOLE flow must close IN-CAGE. The wrapper
# therefore provisions an IN-CAGE Chromium and makes it the URL handler two ways: an `xdg-open` shim on
# PATH, AND — the load-bearing one under `dbus = true`, where `openExternal` routes through the portal's
# `org.freedesktop.portal.OpenURI` and consults the desktop database, never `xdg-open` — a registered
# `.desktop` handler + `mimeapps.list` default for http/https. Same pattern as `examples/app/t3code.toml` /
# `examples/app/claude-desktop.toml`. `--password-store=basic` forces the file cookie store (no keyring in the
# cage) so a login survives a relaunch. If you would rather sign in with an API key (no browser), drop the
# `chromium` package and the wrapper for a bare `freebuff` argv with the Electron flags.
#
# CA TRUST (why `--use-system-ca`). Under the allowlist sbx runs a TLS-terminating proxy with a
# per-session CA. Electron/Chromium ignores the CA-file env vars sbx sets and trusts its own NSS database
# (`~/.pki/nssdb`), so it would otherwise fail every HTTPS with `ERR_CERT_AUTHORITY_INVALID`. For a
# `gui = "wayland"` cage under a filtering posture, sbx seeds its MITM CA into the cage's NSS db
# automatically (part of the GUI hole, like fonts); `--use-system-ca` tells Chromium to consult that store.
#
# DISPLAY + GPU + DBUS. `gui = "wayland"` binds the host Wayland compositor socket (read-only) and
# provisions fonts, so the Electron window maps. X11 is never offered. Isolation is compositor-dependent
# — Mutter (GNOME) is safe; wlroots compositors (sway, hyprland) expose screen-capture/input-injection to
# ordinary clients (see docs/guide/configuration/gui.md). `gpu = true` opens hardware-accelerated rendering
# (mesa provisioned into sbx's own store, the render node under `/dev/dri`, the minimal `/sys` DRM subtree
# the driver needs) — without it a Chromium/Electron app on Wayland often produces no buffer and no window
# maps, so it is on. mesa covers Intel/AMD/nouveau; an NVIDIA-only machine falls back to software (renders,
# slower). `dbus = true` gives the cage its OWN private desktop portal (needed for the OpenURI handler
# above), a file picker that opens IN-CAGE, notification relaying, and host light/dark theme following. The
# Electron flags: `--no-sandbox` is mandatory and acceptable because bubblewrap + seccomp + the empty netns
# IS the boundary (it replaces Chromium's own redundant sandbox); `--ozone-platform=wayland` selects the
# Wayland backend; `--disable-dev-shm-usage` avoids the small cage `/dev/shm`.
cmd = [
    "bash",
    "-c",
    '''
# --- In-cage browser as the http/https handler, so "sign-in to freebuff" opens (see SIGN-IN header) ---
mkdir -p "$HOME/.local/bin"
cat > "$HOME/.local/bin/xdg-open" <<'WRAP'
#!/bin/sh
case "$1" in
  http://*|https://*)
    exec chromium --no-sandbox --ozone-platform=wayland --password-store=basic \
      --no-first-run --no-default-browser-check "$@" ;;
  *)
    exec freebuff --no-sandbox --ozone-platform=wayland --disable-dev-shm-usage "$@" ;;
esac
WRAP
chmod +x "$HOME/.local/bin/xdg-open"
export PATH="$HOME/.local/bin:$PATH"

# Under `dbus = true` Electron opens external URLs via `org.freedesktop.portal.OpenURI`, not `xdg-open`
# directly; the portal shows "no apps available" unless a default http/https handler is registered. The
# Exec path is ABSOLUTE ($HOME expanded here) because the portal-launched handler does not inherit PATH.
mkdir -p "$HOME/.local/share/applications" "$HOME/.config"
cat > "$HOME/.local/share/applications/sbx-open-uri.desktop" <<EOF
[Desktop Entry]
Type=Application
Name=sbx URL handler
Exec=$HOME/.local/bin/xdg-open %U
MimeType=x-scheme-handler/http;x-scheme-handler/https;
NoDisplay=true
Terminal=false
EOF
cat > "$HOME/.config/mimeapps.list" <<'MIMEAPPS'
[Default Applications]
x-scheme-handler/http=sbx-open-uri.desktop
x-scheme-handler/https=sbx-open-uri.desktop
MIMEAPPS

exec freebuff --no-sandbox --ozone-platform=wayland --disable-dev-shm-usage \
    --use-system-ca --password-store=basic
''',
]
home_scope = "global"

gui = "wayland"
gpu = true
dbus = true

[packages]
# The Freebuff desktop app, tracked automatically via the auto-upgrade resolver form (see "THE
# `appimage:resolve` BACKEND" above). The package name is `freebuff`, so it binds to `[appimage.freebuff]`
# below and is wrapped as `bin/freebuff` — matching the `exec freebuff` in `cmd`. Trusted-only [packages];
# this profile is trusted by location (it lives in your config dir). `sbx upgrade appimage` rolls it forward.
freebuff = "appimage:resolve"

# In-cage Chromium for the sign-in flow (see "SIGN-IN" above). HEAVY — pulls a large nixpkgs closure into
# the project store on first launch. Drop this (and the wrapper in `cmd`) if you authenticate with an API
# key instead of a browser login.
chromium = "nix:chromium"

# The `appimage:resolve` command for `freebuff` above. sbx runs it in a HERMETIC sandbox (base tools only
# — curl; a SHARED network to reach the vendor; sbx's own CA bundle for TLS) and pins the `.AppImage` URL
# it prints. Freebuff's download endpoint is a stable 302 redirect to the current versioned `.AppImage`
# (no `…/latest/…` alias in the monorepo's releases — see the header), so this asks curl for the redirect
# TARGET (`-w '%{redirect_url}'`, first hop only — the clean `github.com/.../*.AppImage` URL, not the
# time-limited S3 URL a full `-L` follow would end at). `-fsS` fails closed on an HTTP error and stays
# quiet on success. The printed URL is re-validated as an `.AppImage` URL before it is fetched, so an
# unexpected response cannot point sbx at a non-`.AppImage` source. `sbx upgrade appimage` re-runs this
# and rolls forward; a warm launch reuses the pin WITHOUT re-running it (offline).
[appimage.freebuff]
resolve = ["sh", "-c", '''
curl -fsS -o /dev/null -w '%{redirect_url}' "https://freebuff.com/api/desktop/download/linux"
''']

[network]
# EGRESS — the filtering allowlist WORKS for Freebuff (its Bun orchestrator honors the proxy sbx sets:
# verified live, the backend traffic to freebuff.com/codebuff.com flows under `deny`). The allow/mute sets
# below were grounded on a real run's `sbx net logs`. If you ever see the app go "offline" with its OWN
# backend hosts (freebuff.com/codebuff.com) denied, the escape hatch is
# `sbx app run freebuff-desktop --net shared` (or `network = "shared"` here) — you keep bubblewrap +
# seccomp + the isolated home + the minimal /dev, only egress FILTERING is off. When a NEW host is refused,
# the proxy names it: watch `sbx net logs -a freebuff-desktop` and add the functional ones to `allow`, the
# noise to `mute`.
mode = "deny"
# Freebuff authenticates to a CodebuffAI account and routes model traffic through Codebuff's backend, so
# the runtime hosts are the codebuff.com API/site plus the OAuth providers you sign in with. These are a
# STARTING POINT — the definitive list is what the app actually calls: watch `sbx net logs -a
# freebuff-desktop` on your first launch/login and add any refused host (or check ahead with
# `sbx test net <url>`).
allow = [
  # Codebuff account + model backend (Freebuff is CodebuffAI's free tier). The login page + device-code
  # flow + model traffic all target codebuff.com; the app POSTs, so all verbs.
  "{*} https://api.codebuff.com",
  "{*} https://www.codebuff.com",
  "{*} https://codebuff.com",
  # Freebuff's own site/API (login landing, update checks). Its own vendor domain, not a third party.
  "{*} https://freebuff.com",
  "{*} https://www.freebuff.com",
  # Runtime npm fetches — Freebuff's Bun orchestrator/SDK pulls packages (agent CLIs, plugins) at runtime.
  "{*} https://registry.npmjs.org",
  # GitHub OAuth (sign in with GitHub). github.com/api.github.com are also in sbx's built-in
  # nix-cache allow-set, so they are always reachable; listed here for clarity.
  "{*} https://github.com",
  "{*} https://api.github.com",
  # Google OAuth (sign in with Google).
  '{*} re:^https://accounts\.google\.[a-z.]{2,7}(/|$)',
  "{*} https://oauth2.googleapis.com",
  "{GET} https://www.google.com",
  "{GET} https://ssl.gstatic.com",
  "{GET} https://www.gstatic.com",
  "{GET} https://fonts.gstatic.com",
  "{GET} https://fonts.googleapis.com",
  "{GET} https://lh3.googleusercontent.com",       # Google account avatar
  # Domain favicons the app shows next to links/repos (Google's favicon services). GET images only — this
  # is what makes those icons appear instead of blank. Google serves them from two endpoints: the older
  # `s2.googleusercontent.com/s2/favicons`, and `faviconV2` on the rotating `t0`–`t9.gstatic.com` shards
  # (path-scoped regex, so only the favicon path on those shards is opened).
  "{GET} https://s2.googleusercontent.com",
  '{GET} re:^https://t[0-9]\.gstatic\.com/faviconV2',
  # DuckDuckGo's favicon service (`icons.duckduckgo.com/ip3/<domain>.ico`) — the app uses it too.
  "{GET} https://icons.duckduckgo.com",
  # The in-cage Chromium's spellcheck dictionaries (`…/edgedl/chrome/dict/<lang>.bdic`), served from
  # rotating `*.gvt1.com` redirectors. GET-only, path-scoped to the dictionary path. Drop it if you do not
  # need spellcheck in text fields.
  '{GET} re:^https://[a-z0-9.-]+\.gvt1\.com/edgedl/chrome/dict/',
  # OPTIONAL — using your OWN Claude/ChatGPT subscription through Freebuff (not the default Codebuff
  # account). Uncomment the provider(s) you log into; discover exact hosts via `sbx net logs`.
  #"{*} https://claude.com",
  #"{*} https://platform.claude.com",
  #"{*} https://api.anthropic.com",
  #"{*} https://auth.openai.com",
  #"{*} https://api.openai.com",
]
# Silence denied noise so `sbx net logs -a freebuff-desktop` reads clean by default (still DENIED, still
# counted in `sbx net stats`; see them with `--all`). These are NOT needed for the app to work — they are
# the in-cage Chromium's own background phone-home (update / safe-browsing / time / checkin / on-device
# model / translate) plus telemetry + third-party ad pixels pulled in by page content.
mute = [
  # App / page telemetry + ad pixels
  "*.posthog.com",
  "*.sentry.io",
  "www.redditstatic.com",
  "code.trygravity.ai",
  # In-cage Chromium's own Google background traffic (none required for function): update checks, safe
  # browsing, time/checkin, autofill predictions, on-device model, translate, push signaling, Play
  # logging, cross-property session sync, and the leaked-password check (which would send password data
  # to Google — denying it is a feature, not a loss).
  "clients2.google.com",
  "android.clients.google.com",
  "accounts.youtube.com",
  "play.google.com",
  "update.googleapis.com",
  "safebrowsing.googleapis.com",
  "optimizationguide-pa.googleapis.com",
  "translate.googleapis.com",
  "content-autofill.googleapis.com",
  "signaler-pa.googleapis.com",
  "passwordsleakcheck-pa.googleapis.com",
]

# CREDENTIAL POSTURE — account / OAuth, NOT a header-injectable API key.
# You log in ONCE inside the cage (via the in-cage browser the `cmd` wrapper sets up — sign in to your
# Codebuff account, or GitHub/Google). The token persists in the app's dedicated, persistent, isolated home
# (`home_scope = "global"` → one login, shared across projects). There is no [secret] block because no HTTP
# header key is injected host-side.

# Optional: share your host Freebuff/Codebuff setup with the cage instead of the app's isolated home (the
# default). `binds` is a security field, honored only because this profile lives in your trusted config
# dir. The app's real config path lives under the isolated home — inspect it with
# `sbx app show freebuff-desktop` after a first launch, then point these at the matching host paths.
#binds = [
#    { path = "~/.config/codebuff", mode = "rw" },
#]

# OPTIONAL direct-OpenRouter BYOK (commented). By default Freebuff authenticates to a CODEBUFF account and
# routes ALL model traffic through Codebuff's backend — there is no provider key to inject, so this block
# does nothing on its own and is NOT the shipped path. It is here only for parity with the BYOK profiles:
# it takes effect solely if a Freebuff release lets you point it at OpenRouter directly (uncomment
# `openrouter.ai` in `allow` too). The real key is then read on the HOST and injected by the egress proxy
# on the wire — never in the cage.
#[env]
#OPENROUTER_API_KEY = "sk-or-sbx-placeholder-replaced-by-the-egress-proxy"
#
#[secret."openrouter.ai"]
#from = "env://OPENROUTER_API_KEY"
#header = "Authorization"
#type = "bearer"
