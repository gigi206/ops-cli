# `npm-jsr` — a shared egress GROUP, not a bundle: it carries egress
# entries ONLY, so the repo's native mechanism is a group referenced with `@<name>` in an
# app's — or a bundle's — mute list.
#
#   sbx net groups import examples/net-groups/npm-jsr.toml
#   # then in an app's or bundle's mute list:   "@npm-jsr"
#
# The JSR mirror an npm install lane reaches while it resolves a tree: denied by the
# deny-by-default posture, and muted so its refusals do not drown the actionable ones in
# `sbx net logs` (still denied, still counted in `sbx net stats`). The reach is speculative —
# the agents that carry this group install from `registry.npmjs.org` alone, and the packages
# land whether or not the JSR mirror answers — so the entry is a mute rather than an allow:
# opening a second package origin would widen the supply chain the install trusts, for
# nothing the install needs.
#
# Its own group rather than an entry in `npm-audit`: that group is the audit report, this one is
# the resolver's reach, and a reader deciding whether to open either must be able to tell them
# apart. Both travel with the npm install lane, so a bundle that references one usually
# references the other.

entries = [
    "npm.jsr.io",
]
