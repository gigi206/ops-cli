# `google-oauth` — a shared egress GROUP (`[network.groups]`), not a bundle: it carries egress
# entries ONLY, so the repo's native mechanism is a group referenced with `@<name>` in an app's
# allow list — a bundle exists to carry maps (`packages`/`env`/`[secret]`), which a pure host
# set has none of.
#
#   sbx net groups import examples/net-groups/google-oauth.toml
#   # then in an app profile's [network]:   allow = ["@google-oauth"]
#
# The Google ACCOUNT sign-in host set, shared by agents that log in with a Google account:
# the sign-in pages (`accounts.google.com`), the token endpoints
# (`oauth2.googleapis.com`, `www.googleapis.com/oauth2/*`), and the post-auth profile fetch
# (`lh3.googleusercontent.com`). `agy` names it: its consent is completed in the HOST browser from
# a printed URL, so the cage needs the `.com` host only. A profile that completes the consent in an
# IN-CAGE browser needs more, because Google redirects it to a country-code domain
# (`accounts.google.fr`, …); those profiles carry their own anchored regex alongside the browser
# hosts their Chromium needs, which is why the shipped desktop profiles do not name this group.
# The consuming agent's bundle keeps its own product/API hosts; this group is the account.
# Groups are global-only (like bundles): an app's allow may reference one, a project may not
# define one.

[network.groups]
google-oauth = [
    "{*} https://accounts.google.com",
    "{*} https://oauth2.googleapis.com",
    "{GET} https://www.googleapis.com/oauth2/*",
    "{GET} https://lh3.googleusercontent.com",
]
