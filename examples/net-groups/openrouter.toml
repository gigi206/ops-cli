# `openrouter` — a shared egress GROUP, not a bundle: it carries egress
# entries ONLY, so the repo's native mechanism is a group referenced with `@<name>` in an app's
# allow list — a bundle exists to carry maps (`packages`/`env`/`[secret]`), which a pure host
# set has none of.
#
#   sbx net groups import examples/net-groups/openrouter.toml
#   # then in an app profile's [network]:   allow = ["@openrouter"]
#
# The OpenRouter API host, for agents that route through OpenRouter. It is a BYOK CHOICE: where a
# profile references it COMMENTED, nothing changes until you enable it — uncomment `"@openrouter"`
# in the app, or add it live with `sbx net allow @openrouter -a <app>` — and a profile or bundle
# that offers several providers side by side names it opened beside the others. OpenRouter is an
# API-KEY provider, not OAuth: the group carries the egress only, and the consuming app supplies
# the key, either through a `[secret."openrouter.ai"]` block (`env://OPENROUTER_API_KEY`, bearer)
# beside an in-cage `OPENROUTER_API_KEY` placeholder, or in the app's own settings. Groups are
# global-only (like bundles): an app's allow may reference one, a project may not define one.

entries = [
    # All verbs: chat completions are a POST, the models catalogue and key check are GETs.
    "{*} https://openrouter.ai",
]
