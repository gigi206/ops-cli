# `github-api` — a shared egress GROUP (`[net.groups]`), not a bundle: it carries egress
# entries ONLY, so the repo's native mechanism is a group referenced with `@<name>` in an
# app's — or a bundle's — allow list. A bundle exists to carry maps (`packages`/`env`/
# `[secret]`), which a pure host set has none of.
#
#   sbx net groups import examples/net-groups/github-api.toml
#   # then in an app's or bundle's allow list:   "@github-api"
#
# The GitHub API runtime lane: api.github.com opened to EVERY verb (`{*}`) — for the apps
# that POST to the API at runtime (entitlement/account lookups, git-forge API calls). NOT
# the read-only INSTALL lane (`@github-install` carries api.github.com as `{GET}`) and not
# the web host (separate `@github` fragment — a group expands into the list that references
# it, so an app takes the lane it needs, verb-exact). Groups are global-only (like
# bundles): an app's or bundle's lists may reference one, a project may not define one.

[net.groups]
github-api = [
    "{*} https://api.github.com",
]
