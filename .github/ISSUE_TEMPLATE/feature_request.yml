name: Feature request
description: Suggest a new subcommand, flag, or integration.
title: "[feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Scope reminder: `sbx` is a sandbox launcher (a static Rust binary) that
        runs tools and AI agents inside a bubblewrap + daemonless-nix sandbox.
        Requests that fit the sandbox model stay in scope.

  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What are you trying to do that sbx makes hard today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: |
        Concrete shape of the change — a new flag, a new subcommand, a config
        field, etc. Mention edge cases you already thought about.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Existing flags / config fields / external tools you tried first.

  - type: checkboxes
    id: fit
    attributes:
      label: Scope fit
      options:
        - label: Fits the sandbox-launcher model (does not turn sbx into a container / orchestration manager).
        - label: Respects the security model (least privilege, fail-closed, no weakening of the sandbox boundary).
        - label: Can be covered by a test.
