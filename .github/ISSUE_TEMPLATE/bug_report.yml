name: Bug report
description: Something in sbx does not behave as documented.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. Before submitting, please
        skim the existing issues to avoid duplicates.

  - type: input
    id: sbx-version
    attributes:
      label: sbx version
      description: Output of `sbx --version` (or the git SHA if you run from a clone).
      placeholder: "sbx 2.0.0"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Host OS
      description: e.g. `Ubuntu 24.04`, `Arch`.
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: sbx doctor output
      description: Paste the output of `sbx doctor` — it reports the sandbox prerequisites (user namespaces, bwrap, …).
      render: shell

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What happened instead? Paste full error output if any.
      render: shell
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: |
        The exact commands (plus a relevant `.sbx.toml` excerpt) that trigger
        the bug. Smaller = faster fix.
      render: bash
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else that might help (related issues, workarounds tried).
