name: Bug report
description: Something in ops-cli does not behave as documented.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. Before submitting, please
        skim the [README](../blob/main/README.md#troubleshooting) troubleshooting
        section and existing issues to avoid duplicates.

  - type: input
    id: ops-version
    attributes:
      label: ops version
      description: Output of `ops --version` (or the git SHA if you run from a clone).
      placeholder: "ops 1.0.0"
    validations:
      required: true

  - type: dropdown
    id: runtime
    attributes:
      label: Container runtime
      options:
        - docker
        - podman
        - nerdctl
        - other / N/A
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Host OS
      description: e.g. `Ubuntu 24.04`, `Arch`, `macOS 14.5`.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What happened instead? Paste full error output if any.
      render: shell
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: |
        The exact commands (plus relevant `ops.conf` excerpt or Dockerfile
        diff) that trigger the bug. Smaller = faster fix.
      render: bash
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else that might help (related issues, workarounds tried, `ops doctor` output…).
