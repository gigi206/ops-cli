# Catalogue build — provisions every shipped app that carries a prebuilt package, the way a launch
# does, and fails on any that no longer builds.
#
# WHAT PROBLEM THIS SOLVES. A prebuilt package (`deb:`, `appimage:`, `tarball:`, `binary:`) is a
# vendor's binary, autoPatchelf'd against a library set when it is built. A vendor that adds a
# native module linking a library the set does not carry breaks the build, and nothing in this
# repository notices until someone launches the app: Claude Desktop 4.23118.0 shipped a module
# linking `libpipewire-0.3.so.0`, and its `.deb` stopped building the day `sbx upgrade` rolled it.
# `catalogue.yml` asks whether each package can still be *found*; this asks whether it still
# *builds*.
#
# HOW. A release-free build of sbx imports the shipped groups, bundles and apps into throwaway
# homes, then launches each app whose resolved packages include a prebuilt one, without a display
# (`--gui none`). Provisioning runs before the cage and prints `cannot provision` when a build
# fails, which is the one line this job judges by: what the app's own command does next, headless
# on a runner, is no part of the question. Each app's tree is purged and the store collected before
# the next, so the run fits the runner's disk.
#
# THE NIXPKGS IS THE ONE A FIRST LAUNCH RESOLVES. The homes start empty, so sbx pins the default
# channel's current revision, which is what an installed sbx builds these packages against. The
# engines' pinned revision would test a toolchain no app launch uses.
#
# WHAT A RED MEANS. A package that no longer builds, named with the cause sbx printed, or a vendor
# briefly unreachable while its package was fetched. Read it as "go look at the named app".
#
# WHEN IT RUNS. Weekly, on demand, and whenever a shipped profile, bundle or group changes. A
# `schedule` runs from the default branch alone, which is `ops-v2`.
#
# ACTIONS ARE PINNED BY COMMIT, as everywhere in this repository.

name: Catalogue build

on:
  schedule:
    - cron: "43 5 * * 1"
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/catalogue-build.yml
      - examples/app/**
      - examples/bundle/**
      - examples/net-groups/**

permissions:
  contents: read

concurrency:
  group: catalogue-build
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: every shipped prebuilt package still builds
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Make room for the packages
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install the engine and allow unprivileged user namespaces
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap
          knob=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          if [ -e "$knob" ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      # A build from source embeds no store engine and looks for one on PATH; without it every launch
      # stops before provisioning, which reads as no package failing.
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build sbx
        run: cargo build

      - name: Provision every app that carries a prebuilt package
        env:
          # Lifts the anonymous cap on the GitHub-backed locators and resolvers. Read only.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          sbx="$PWD/target/debug/sbx"
          root="$RUNNER_TEMP/sbx-catalogue"
          export XDG_DATA_HOME="$root/d" XDG_CONFIG_HOME="$root/c" XDG_STATE_HOME="$root/s"
          mkdir -p "$XDG_DATA_HOME" "$XDG_CONFIG_HOME" "$XDG_STATE_HOME" "$root/project"

          for f in examples/net-groups/*.toml; do "$sbx" net groups import "$f" >/dev/null; done
          for f in examples/bundle/*.toml; do "$sbx" bundle import "$f" >/dev/null; done
          for f in examples/app/*.toml; do "$sbx" app import "$f" >/dev/null; done

          cd "$root/project"
          failed=()
          checked=0
          for f in "$GITHUB_WORKSPACE"/examples/app/*.toml; do
            app="$(basename "$f" .toml)"
            if ! "$sbx" config show --app "$app" --details 2>/dev/null \
                | grep -qE -- '-> (deb|appimage|tarball|binary):'; then
              continue
            fi
            checked=$((checked + 1))
            echo "::group::$app"
            # The app's own exit status says nothing here (headless, it may well fail to start),
            # and the step's shell runs with `-e`: only provisioning's line is judged.
            out="$(timeout 1800 "$sbx" app run "$app" --gui none -- --version 2>&1)" || true
            echo "$out" | grep -vE '^copying path|^  /nix/store/' | tail -n 40
            echo "::endgroup::"
            # A launch that never reached provisioning judges nothing, and is a failure of its own
            # rather than a package that built.
            if grep -qE 'cannot provision|the sandbox cannot run' <<<"$out"; then
              failed+=("$app: $(grep -E 'cannot provision|the sandbox cannot run' <<<"$out" | head -n 1)")
            fi
            "$sbx" app rm "$app" --purge >/dev/null 2>&1 || true
            "$sbx" gc --all --prune >/dev/null 2>&1 || true
            df -h / | tail -n 1
          done

          echo "checked $checked app(s) that carry a prebuilt package"
          if [ "$checked" -eq 0 ]; then
            echo "::error::no shipped app carries a prebuilt package: the selection is broken"
            exit 1
          fi
          if [ "${#failed[@]}" -gt 0 ]; then
            printf '::error::%s\n' "${failed[@]}"
            exit 1
          fi
