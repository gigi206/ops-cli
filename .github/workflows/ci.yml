# CI — runs on every push and pull request.
#
# Mirrors `mise run ci` (fmt + clippy + rustdoc + test). Unlike the local full run, the
# integration e2e that need userns + nix + network are skipped on a hosted
# runner; here they are simply not selected unless their source file changed.
#
# And what *is* selected does not all run: a test whose prerequisites are absent
# returns early, which `cargo test` counts as a pass. The last step reports how
# many did that, so this workflow's green check states its own blind spot instead
# of implying the sandbox was exercised.
#
# Test selection is change-driven:
#   - a core change (Cargo.toml/Cargo.lock/build.rs/src/**)  -> full suite
#   - only tests/*.rs changed                               -> those files
#   - otherwise                                             -> unit tests only

# ACTIONS ARE PINNED BY COMMIT, HERE AND IN EVERY OTHER WORKFLOW. A tag is a mutable pointer: the
# owner can move `v7` onto anything, and a workflow that names one runs whatever it points at on the
# day it runs. This repository already refuses that reasoning one level down — an apt index is
# checked against the signature its repository published, a nixpkgs revision against the history it
# claims — and a third-party action runs with more of this repository's trust than either. The tag
# stays as a trailing comment so dependabot can propose the bump, and so a reader can tell at a
# glance what version a hash is.

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: rustfmt
    # Pinned rather than `ubuntu-latest`: GitHub migrates that label to the next LTS over a month or
    # two, so a run pinned to nothing changes host without anyone deciding to. Cage keeps a
    # `ubuntu-24.04` arm, so the older systemd stays covered.
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo clippy --all-targets -- -D warnings

  rustdoc:
    name: rustdoc
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # `--document-private-items` is required, not decorative: this is a binary crate, so without
      # it rustdoc documents almost nothing and the job passes over a tree full of dead references.
      - run: cargo doc --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: "-D warnings"

  test:
    name: test (change-driven)
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Select and run tests for the changed files
        shell: bash
        env:
          # A hosted runner has no userns, no bwrap and no nix, so every test that needs a cage
          # returns early -- and `cargo test` counts an early return as a pass. Without this the
          # green check below says nothing about whether the sandbox was ever exercised. Each skip
          # appends one line here, and the summary step reports the total.
          SBX_SKIP_LOG: ${{ github.workspace }}/target/test-skips.log
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$SBX_SKIP_LOG")"
          : > "$SBX_SKIP_LOG"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}" --depth=1
            BASE="origin/${{ github.base_ref }}"
          else
            BASE="${{ github.event.before }}"
            # github.event.before can be all-zeros on a first push; fall back to HEAD~1.
            if [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
              BASE="HEAD~1"
            fi
          fi

          # A selection that cannot see the diff must widen, never narrow. The old form ended the
          # pipeline with `|| true`, so a BASE this clone does not carry — a force-push rewrote it
          # away, or the branch has a single commit and `HEAD~1` does not resolve — left the list
          # empty and ran the unit tests alone, reporting a green indistinguishable from a full
          # run. Both ways of not knowing now mean the full suite.
          CORE_CHANGED=0
          TESTS_CHANGED=()
          CHANGED=()
          if ! git rev-parse --verify --quiet "$BASE^{commit}" >/dev/null; then
            echo "::warning::base '$BASE' is not in this clone — running the full test suite"
            CORE_CHANGED=1
          elif ! DIFF=$(git diff --name-only "$BASE" HEAD -- '*.rs' 'Cargo.toml' 'Cargo.lock' 'build.rs'); then
            echo "::warning::cannot diff against '$BASE' — running the full test suite"
            CORE_CHANGED=1
          else
            mapfile -t CHANGED <<< "$DIFF"
          fi

          for f in "${CHANGED[@]:-}"; do
            [ -z "$f" ] && continue
            case "$f" in
              Cargo.toml|Cargo.lock|build.rs|src/*)
                CORE_CHANGED=1
                ;;
              tests/*.rs)
                stem="${f#tests/}"
                stem="${stem%.rs}"
                TESTS_CHANGED+=("$stem")
                ;;
            esac
          done

          # The scope goes in the run summary, not only in a `::notice::`. A green whose scope is
          # buried in the log reads the same as a green over everything, and reading it as the
          # latter is how a narrow run gets treated as proof it never offered.
          {
            echo "### Test scope"
            if [ "$CORE_CHANGED" -eq 1 ]; then
              echo "Full suite: a core change, or the diff could not be read."
            elif [ "${#TESTS_CHANGED[@]}" -gt 0 ]; then
              echo "Unit tests (\`--bins\`), plus the integration suites that changed: ${TESTS_CHANGED[*]}."
            else
              echo "**Unit tests only** (\`--bins\`): no core change. This run does not cover the integration suites."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          # `--no-fail-fast` throughout: without it cargo stops at the first target that reports a
          # failure, so one red test hides every later binary and the check reports a suite with one
          # problem instead of a suite whose tail was never asked. A green run is identical either
          # way. The per-suite loop below keeps going for the same reason, remembering the code.
          rc=0

          if [ "$CORE_CHANGED" -eq 1 ]; then
            echo "::notice::core change detected — running the full test suite"
            # See the comment below: the systemd `systemd-run` dollar-escape test
            # is host-dependent and fails on the ubuntu-24.04 hosted runner.
            cargo test --no-fail-fast -- --skip sandbox::cgroup::tests::an_escaped_dollar_argument_reaches_the_program_verbatim || rc=$?
          else
            echo "::notice::no core change — running unit tests (--bins) only"
            # The dollar-escape unit test asserts the behaviour of the host's
            # `systemd-run` (specifier unescaping), which differs across systemd
            # versions: it fails on the ubuntu-24.04 hosted runner while passing
            # on other hosts. Skip it here so the hosted suite is deterministic;
            # it stays enabled in local full runs.
            cargo test --bins --no-fail-fast -- --skip sandbox::cgroup::tests::an_escaped_dollar_argument_reaches_the_program_verbatim || rc=$?
            if [ "${#TESTS_CHANGED[@]}" -gt 0 ]; then
              echo "::notice::changed integration test files: ${TESTS_CHANGED[*]}"
              for t in "${TESTS_CHANGED[@]}"; do
                cargo test --test "$t" --no-fail-fast || rc=$?
              done
            fi
          fi

          exit $rc

      - name: Report the tests that reported ok without running
        if: always()
        shell: bash
        env:
          SBX_SKIP_LOG: ${{ github.workspace }}/target/test-skips.log
        run: |
          set -uo pipefail
          n=0
          [ -f "$SBX_SKIP_LOG" ] && n=$(wc -l < "$SBX_SKIP_LOG" | tr -d ' ')
          echo "::notice::$n test(s) reported ok without running: this runner has no userns, no bwrap and no nix, so anything needing a cage skips. A green check here does not mean the sandbox was exercised."
          if [ "$n" -gt 0 ]; then
            sort "$SBX_SKIP_LOG" | uniq -c | sort -rn | head -40
          fi
