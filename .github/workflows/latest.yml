# Latest — a rolling release that always tracks the leading edge of the
# develop branch (ops-v2) and `main`.
#
# On every push to `ops-v2` or `main` we rebuild the self-contained (nix+bwrap
# bundled) static musl binary and OVERWRITE the `latest` release: the `latest`
# git tag is force-moved onto the current commit and the existing release (with
# its old assets) is deleted and recreated as a pre-release. `make_latest` is
# disabled so it never shadows a real versioned release.
#
# Consumers that want "always the newest build" pin to the `latest` tag.

name: Latest

on:
  push:
    branches:
      - ops-v2
      - main

permissions:
  contents: write

concurrency:
  group: latest
  # Do not cancel a run mid-flight: a half-finished overwrite would leave the
  # latest release in an inconsistent state (tag moved, assets not yet uploaded).
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  NIXPKGS_REV: "89570f24e97e614aa34aa9ab1c927b6578a43775"

jobs:
  build:
    name: build + overwrite latest release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust (with the musl target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install zig (linker for the musl target)
        uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0

      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --locked

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_conf: |
            experimental-features = nix-command flakes

      - name: Realise the pinned static nix engine
        id: nix
        run: |
          set -euo pipefail
          ref="github:NixOS/nixpkgs/${NIXPKGS_REV}#pkgsStatic.nix"
          for out in $(nix build "$ref" --no-link --print-out-paths); do
            if [ -e "$out/bin/nix" ]; then
              echo "path=$out/bin/nix" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "no bin/nix in the pkgsStatic.nix outputs" >&2; exit 1

      - name: Realise the pinned static bwrap engine
        id: bwrap
        run: |
          set -euo pipefail
          ref="github:NixOS/nixpkgs/${NIXPKGS_REV}#pkgsStatic.bubblewrap"
          for out in $(nix build "$ref" --no-link --print-out-paths); do
            if [ -e "$out/bin/bwrap" ]; then
              echo "path=$out/bin/bwrap" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "no bin/bwrap in the pkgsStatic.bubblewrap outputs" >&2; exit 1

      # Sanity gate: the default-feature unit suite must pass before we spend
      # minutes bundling engines. (The sandbox e2e skip on a hosted runner.)
      # The dollar-escape test asserts behaviour of the host's `systemd-run`
      # that differs across systemd versions, so it is excluded here exactly as
      # in ci.yml.
      - name: Unit tests (default features)
        run: |
          set -euo pipefail
          RUSTFLAGS="-D warnings" cargo test --bins \
            -- --skip sandbox::cgroup::tests::an_escaped_dollar_argument_reaches_the_program_verbatim

      - name: Build the bundled static musl binary
        env:
          SBX_BUNDLED_NIX: ${{ steps.nix.outputs.path }}
          SBX_BUNDLED_BWRAP: ${{ steps.bwrap.outputs.path }}
        run: |
          set -euo pipefail
          cargo zigbuild --release --target x86_64-unknown-linux-musl \
            --features bundled-nix,bundled-bwrap
          cp target/x86_64-unknown-linux-musl/release/sbx sbx-linux-x86_64
          sha256sum sbx-linux-x86_64 | cut -d' ' -f1 > sbx-linux-x86_64.sha256

      - name: Force-move the latest tag onto this commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f latest
          git push -f origin latest

      - name: Recreate the latest release (overwrite)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release delete latest --yes || true
          NOTES="Rolling build of ${GITHUB_REF_NAME} @ ${GITHUB_SHA::8}."$'\n'"\n"$'\n'"Built from: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"
          gh release create latest \
            --prerelease \
            --latest=false \
            --title "latest (rolling, tracks ops-v2 + main)" \
            --notes "$NOTES" \
            sbx-linux-x86_64 \
            sbx-linux-x86_64.sha256