# Latest — a rolling release that always tracks the leading edge of the
# develop branch (ops-v2) and `main`.
#
# On every push to `ops-v2` or `main` we rebuild the self-contained (nix+bwrap
# bundled) static musl binary and OVERWRITE the `latest` release: the `latest`
# git tag is force-moved onto the current commit and the existing release (with
# its old assets) is deleted and recreated as a pre-release. `make_latest` is
# disabled so it never shadows a real versioned release.
#
# Consumers that want "always the newest build" pin to the `latest` tag.

name: Latest

on:
  push:
    branches:
      - ops-v2
      - main

permissions:
  contents: write

concurrency:
  group: latest
  # Do not cancel a run mid-flight: a half-finished overwrite would leave the
  # latest release in an inconsistent state (tag moved, assets not yet uploaded).
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  NIXPKGS_REV: "89570f24e97e614aa34aa9ab1c927b6578a43775"

jobs:
  build:
    name: build + overwrite latest release
    # Pinned rather than `ubuntu-latest`: GitHub migrates that label to the next LTS over a month or
    # two, so a run pinned to nothing changes host without anyone deciding to. Cage keeps a
    # `ubuntu-24.04` arm, so the older systemd stays covered.
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Build the self-contained static musl binary
        uses: ./.github/actions/build-static-sbx
        with:
          nixpkgs-rev: ${{ env.NIXPKGS_REV }}

      - name: Force-move the latest tag onto this commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f latest
          git push -f origin latest

      - name: Recreate the latest release (overwrite)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release delete latest --yes || true
          NOTES="Rolling build of ${GITHUB_REF_NAME} @ ${GITHUB_SHA::8}."$'\n'"\n"$'\n'"Built from: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"
          gh release create latest \
            --prerelease \
            --latest=false \
            --title "latest (rolling, tracks ops-v2 + main)" \
            --notes "$NOTES" \
            sbx-linux-x86_64 \
            sbx-linux-x86_64.sha256
