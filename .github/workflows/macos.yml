# macOS — proves the cage runs in a Lima guest on a Mac, on a Mac runner GitHub hosts.
#
# WHAT PROBLEM THIS SOLVES. sbx rests on capability-bearing unprivileged user namespaces and
# `doctor` hard-fails rather than emulating when they are absent, so macOS is not a host it runs
# on: it is a host it is reached from, through a Linux guest, the same way Windows is. Nothing in
# that arrangement is exercised by any other workflow here, and all of it can rot without a commit
# in this repository: Lima changes, the VZ driver changes, the image the template boots changes,
# and the rolling release the guest installs from is rewritten on every push.
#
# WHAT THIS RUN ASSERTS. That `dist/macos/sbx.yaml` still produces a guest whose user namespaces
# carry capabilities, that `dist/macos/sbx` still reaches it from a Mac shell with the working
# directory carried over, that a directory the guest does not share is refused rather than
# swapped for one of the same name on the guest's own disk, and that the Mac's own filesystem is
# absent from the cage the guest builds. The preflight assertion is in two halves and the order matters: `doctor`'s exit status
# first, then the evidence line. `doctor` prints "capability-bearing" on its success line, on its
# cannot-prove line, and on the line that blames bubblewrap for a failed launch, and its
# remediation text contains the phrase too. Grepping for it alone would read a red as a green.
#
# WHAT IS DELIBERATELY NOT ASSERTED. The window. `video.display: vz` opens a native macOS window
# showing the guest's whole screen, and a runner has no one looking at it: an arm added here would
# start a compositor, watch it exit zero, and prove nothing about whether anything was drawn. The
# GPU is not asserted either, and that one is not a gap to be closed: `vz` provides no GPU to the
# guest at all, and the scope this template commits to is CLI plus GUI.
#
# WHERE IT RUNS. On a runner GitHub hosts, and on its Intel one: `macos-26-intel`. The guest is a
# virtual machine, so the runner must let a job use the CPU's virtualization. GitHub's Apple Silicon
# runners do not, and its Intel runners do; Lima's own CI starts its `vz` guests on Intel runners for
# that reason. The wrapper's support is written for macOS x86_64 with Lima 2.2.1, which is the
# version this installs, so the run measures the platform the documentation names. Apple Silicon
# stays outside CI until a hosted runner lets a job start a virtual machine there. macOS 26 is the
# last release Apple ships for Intel Macs, so no newer Intel image can follow this one; when GitHub
# retires it, this workflow has no host to run on.

name: macos

on:
  workflow_dispatch:
  schedule:
    # Weekly, an hour after `wsl`. Lima, the VZ driver, the guest image and the release the guest
    # installs from all move underneath this without a commit here.
    - cron: "0 5 * * 1"
  push:
    paths:
      - .github/workflows/macos.yml
      - dist/macos/**

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    name: exercise the cage in a Lima guest
    runs-on: macos-26-intel
    # Above the sum of the deadlines below, so a step that hangs fails on its own deadline
    # rather than the job being cancelled first.
    timeout-minutes: 100
    env:
      # The wrapper reaches the instance it is told to and defaults to `sbx`. This run creates
      # `sbx-ci`, and every wrapper call below reaches it through this; without it each one fails on
      # an instance that does not exist.
      SBX_LIMA_INSTANCE: sbx-ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Lima 2.2.1, the version the wrapper is supported with
        # The official archive rather than Homebrew, whose formula moves on its own schedule: the
        # version is the one the support statement names, and the bytes are checked against the
        # release's SHA256SUMS before anything in them runs.
        env:
          LIMA_VERSION: 2.2.1
          LIMA_SHA256: 6b776e4bc41f358e6ee01fefcc78e2eb26f11635a0fcff632234af77a566c6c4
        run: |
          set -euo pipefail
          tarball="lima-${LIMA_VERSION}-Darwin-x86_64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/lima-vm/lima/releases/download/v${LIMA_VERSION}/$tarball"
          echo "${LIMA_SHA256}  $RUNNER_TEMP/$tarball" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/lima"
          tar -C "$RUNNER_TEMP/lima" -xzf "$RUNNER_TEMP/$tarball"
          echo "$RUNNER_TEMP/lima/bin" >> "$GITHUB_PATH"

      - name: Report what this host can do
        # The report is written whatever happens next, so a failing assertion below lands beside
        # the platform it failed on rather than beside a guess about it.
        run: |
          set -uo pipefail
          {
            echo "### host"
            echo
            echo '```'
            sw_vers 2>/dev/null || true
            echo "arch: $(uname -m)"
            echo "kern.hv_support: $(sysctl -n kern.hv_support 2>/dev/null || echo unknown)"
            limactl --version 2>/dev/null || echo "limactl: absent"
            echo '```'
          } | tee "$HOME/summary.md"
          command -v limactl >/dev/null 2>&1 || {
            echo "this runner has no limactl, and the guest is the whole of what is measured here"
            exit 1
          }

      - name: Create the guest from the template this repository ships
        # Past `limactl start`'s own thirty minutes, for the download and the creation before it.
        timeout-minutes: 35
        run: |
          set -euo pipefail
          # A project under the host home, named by the same parameter a user would pass, so the
          # mount this exercises is the one the template documents rather than a CI-only shape.
          mkdir -p "$HOME/ci-projects/project"
          # Two witnesses for the absence assertions further down, both written rather than
          # assumed: a path that does not exist on the host is "absent" from the cage trivially,
          # which would make that assertion pass while measuring nothing.
          #   - inside the mount but outside the project: the guest sees it, the cage must not.
          #   - outside the mount: neither the guest nor the cage may see it.
          echo "witness" > "$HOME/ci-projects/beside-the-project"
          echo "witness" > "$HOME/outside-the-mount"
          # The template also mounts the two channels to the Mac, and Lima mounts only a directory
          # that exists.
          mkdir -p "$HOME/.local/state/sbx/lima/theme" "$HOME/.local/state/sbx/lima/notify"
          limactl delete --force sbx-ci 2>/dev/null || true
          # One CPU, as Lima's own CI gives its `vz` guests on GitHub's runners ("--cpus=1 is needed
          # for running vz on GHA", lima-vm/lima .github/workflows/test.yml). The template sets no
          # CPU count, so this is the only place the run departs from what a user creates.
          limactl create --tty=false --name sbx-ci --cpus=1 --param projects=ci-projects \
            "$GITHUB_WORKSPACE/dist/macos/sbx.yaml"
          # `limactl start` waits ten minutes by default for the provisioning to finish, and one
          # CPU installing the template's packages can take longer. The deadline is the host's
          # wait, not the guest's shape. It stays well inside the job's own limit, so a start that
          # gives up still leaves the step below the time to read the guest.
          limactl start --tty=false --timeout=30m sbx-ci

      - name: Let nix ask GitHub as this run
        timeout-minutes: 5
        # The first launch resolves the nixpkgs channel through GitHub's API, and an anonymous
        # request is counted against the hosted runner's shared address: once that quota is spent,
        # the launch fails on a 403 that says nothing about the Mac. The run's own token is counted
        # against this repository instead. It is written to the guest user's nix configuration,
        # which the bundled nix reads and the cage never sees (the guest home is absent from it),
        # and it crosses into the guest on standard input rather than on a command line.
        env:
          NIX_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [ -n "${NIX_GITHUB_TOKEN:-}" ] || { echo "the run has no token to hand to nix"; exit 1; }
          printf 'access-tokens = github.com=%s\n' "$NIX_GITHUB_TOKEN" \
            | limactl shell --workdir / sbx-ci sh -c \
                'umask 077 && mkdir -p "$HOME/.config/nix" && cat > "$HOME/.config/nix/nix.conf"'
          limactl shell --workdir / sbx-ci sh -c 'test -s "$HOME/.config/nix/nix.conf"' \
            || { echo "the token did not reach the guest's nix configuration"; exit 1; }

      - name: The preflight must pass inside the guest
        timeout-minutes: 5
        run: |
          set -uo pipefail
          cd "$HOME/ci-projects/project"
          "$GITHUB_WORKSPACE/dist/macos/sbx" doctor 2>&1 | tee "$HOME/doctor.txt"
          status=${PIPESTATUS[0]}
          {
            echo "### doctor"
            echo
            echo '```'
            cat "$HOME/doctor.txt"
            echo '```'
          } >> "$HOME/summary.md"
          [ "$status" -eq 0 ] || { echo "doctor exited $status"; exit 1; }
          # The boundary itself, which never degrades. Checked only after the exit status above,
          # because three of doctor's lines carry this phrase and two of them are failures.
          grep -q "capability-bearing" "$HOME/doctor.txt" \
            || { echo "doctor passed without proving capability-bearing namespaces"; exit 1; }

      - name: A real cage must launch, as the sandbox user, in the directory the Mac stood in
        # The first launch fetches the cage's tools through nix, the one long step after the guest
        # is up; it has taken six to nine minutes.
        timeout-minutes: 20
        # The preflight is not the product. This also proves the wrapper carried the working
        # directory across: `sbx run` builds the cage around the cwd, so a wrapper that silently
        # landed in the guest home would report a different project here.
        run: |
          set -uo pipefail
          cd "$HOME/ci-projects/project"
          "$GITHUB_WORKSPACE/dist/macos/sbx" run -- sh -c 'id; pwd' 2>&1 | tee "$HOME/run.txt"
          status=${PIPESTATUS[0]}
          {
            echo "### a real cage launch"
            echo
            echo '```'
            cat "$HOME/run.txt"
            echo '```'
          } >> "$HOME/summary.md"
          [ "$status" -eq 0 ] || { echo "the launch exited $status"; exit 1; }
          grep -q "uid=$(id -u)(sandbox)" "$HOME/run.txt" \
            || { echo "the cage did not report the sandbox name on the caller's uid"; exit 1; }
          grep -q "$HOME/ci-projects/project" "$HOME/run.txt" \
            || { echo "the cage was not built around the directory the Mac stood in"; exit 1; }

      - name: The guest must have a compositor on its display and a sound card behind its sink
        timeout-minutes: 5
        # Neither needs anyone looking at the screen. The compositor's socket under the fixed name
        # the wrapper looks for is what a `gui = "wayland"` launch binds; a default sink on the ALSA
        # card, rather than PipeWire's null sink, is what an `audio = true` cage plays into.
        run: |
          set -uo pipefail
          limactl shell --workdir / sbx-ci sh -c 'test -S "/run/user/$(id -u)/wayland-sbx"' \
            || { echo "no compositor socket wayland-sbx in the guest"; exit 1; }
          echo "the compositor socket is there"
          sink=$(limactl shell --workdir / sbx-ci wpctl inspect @DEFAULT_AUDIO_SINK@ 2>&1)
          case "$sink" in
            *api.alsa.*) echo "the default sink is the guest's sound card" ;;
            *) echo "the default sink is not on the sound card: $sink"; exit 1 ;;
          esac

      - name: The Mac's filesystem must be absent from the cage
        timeout-minutes: 10
        # Confidentiality by absence is the model. The guest mounts one subtree of the host home,
        # so everything else on the Mac has two chances to leak: it can be visible to the guest, or
        # visible to the cage the guest builds. Both are asked here.
        run: |
          set -uo pipefail
          cd "$HOME/ci-projects/project"
          # Asked as a predicate the cage answers, so the verdict is a word rather than a phrase:
          # an error mentioning the path would satisfy a text match while meaning the opposite.
          # Three branches, not two: a launch that never ran also exits non-zero, and reading that
          # as "the path is absent" would turn a broken probe into a passing assertion.
          probe() {
            "$GITHUB_WORKSPACE/dist/macos/sbx" run -- \
              sh -c "if [ -e '$1' ]; then echo VISIBLE; else echo ABSENT; fi" 2>&1
          }
          # Both witnesses were written on the host by the creation step, so ABSENT here is a
          # measurement rather than a path that never existed.
          # The two channels to the Mac are mounted in the guest and must be absent from the cage
          # too: a cage that saw the notification queue could raise notes on the Mac.
          for path in "$HOME/ci-projects/beside-the-project" "$HOME/outside-the-mount" \
            /mnt/sbx-mac/theme /mnt/sbx-mac/notify; do
            out=$(probe "$path")
            case "$out" in
              *VISIBLE*) echo "$path is reachable inside the cage"; exit 1 ;;
              *ABSENT*)  echo "$path absent from the cage, as the model requires" ;;
              *)         echo "the probe for $path did not run: $out"; exit 1 ;;
            esac
          done
          # And the converse, so the probe is shown to be able to say VISIBLE at all: the project
          # itself is mounted read-write, and a probe that answered ABSENT for everything would
          # pass the loop above while proving nothing.
          out=$(probe "$HOME/ci-projects/project")
          case "$out" in
            *VISIBLE*) echo "the project is visible, so the probe can tell the two apart" ;;
            *) echo "the project itself did not read as visible, so the probe is broken: $out"; exit 1 ;;
          esac

      - name: A directory the guest also has must be refused, not swapped for the guest's own
        timeout-minutes: 5
        # `/tmp` exists on both sides, so a wrapper that only tried to cd into the Mac's directory
        # would land in the guest's `/tmp` and build the cage there without a word. The witness is
        # written on the Mac, so a launch that ran anyway is told apart from one that was refused.
        run: |
          set -uo pipefail
          mkdir -p /tmp/sbx-ci-witness
          echo "witness" > /tmp/sbx-ci-witness/on-the-mac
          cd /tmp
          # The refusal is a non-zero exit, and the runner's shell is `bash -e`: the status is
          # taken inside the `if`, where errexit does not end the step before it is read.
          if out=$("$GITHUB_WORKSPACE/dist/macos/sbx" run -- ls /tmp/sbx-ci-witness/on-the-mac 2>&1); then
            status=0
          else
            status=$?
          fi
          rm -rf /tmp/sbx-ci-witness
          [ "$status" -ne 0 ] || { echo "the wrapper ran a cage from /tmp, which the guest does not share: $out"; exit 1; }
          case "$out" in
            *"is not visible inside the"*) echo "/tmp refused by name, as the wrapper documents" ;;
            *) echo "the launch failed, but not with the wrapper's refusal: $out"; exit 1 ;;
          esac

      - name: Show where the guest stood, when a step failed
        # `limactl start` gives up on its own deadline while the guest keeps running, so what the
        # provisioning was doing at that moment can still be read. Lima's logs on the host show the
        # boot; the guest's cloud-init log carries the provisioning scripts' output; the process
        # list and the pending systemd jobs tell a script still working from one waiting on
        # something that will not come. Every step that reaches the guest has a deadline of its
        # own: a step past it fails rather than being cancelled, so this runs after a hang, which it
        # would not after the job itself was cancelled.
        if: failure()
        timeout-minutes: 5
        run: |
          set -uo pipefail
          for f in "$HOME"/.lima/sbx-ci/ha.stderr.log "$HOME"/.lima/sbx-ci/serial*.log; do
            [ -f "$f" ] || continue
            echo "::group::$f"
            tail -n 80 "$f"
            echo "::endgroup::"
          done
          echo "::group::/var/log/cloud-init-output.log in the guest"
          limactl shell --workdir / sbx-ci sudo tail -n 150 /var/log/cloud-init-output.log || true
          echo "::endgroup::"
          echo "::group::processes and pending jobs in the guest"
          limactl shell --workdir / sbx-ci sh -c \
            'ps -eo pid,etimes,args | grep -E "[a]pt|[d]pkg|[c]url|[u]nattended|[c]loud-init|[n]ix|[s]bx|[b]wrap"; systemctl list-jobs --no-pager' \
            || true
          echo "::endgroup::"

      - name: Publish the report
        if: always()
        run: |
          cat "$HOME/summary.md" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
