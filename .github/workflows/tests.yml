name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-flight runs when a new commit lands on the same ref.
# PR pushes and `main` pushes each get their own queue so a rebased PR
# doesn't kill the main-branch build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Workflow-wide least-privilege: read-only access to repo contents.
# Individual jobs may widen this (they currently don't need to).
permissions:
  contents: read

jobs:
  bats:
    name: bats + shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache apt packages
        id: apt-cache
        uses: actions/cache@v4
        with:
          path: |
            /var/cache/apt/archives/*.deb
          # Bump the suffix when the install list changes so stale caches
          # do not hide a missing package.
          key: apt-bats-shellcheck-luarocks-${{ runner.os }}-v3

      - name: Install bats + shellcheck + luacheck
        run: |
          # luacheck is no longer available in ubuntu-24.04 (noble) main/universe
          # apt indexes -- it ships only as a luarocks package upstream. Install
          # luarocks via apt then luacheck via luarocks (the apt path picks the
          # bats + shellcheck binaries which are still packaged).
          sudo apt-get update
          sudo apt-get install -y bats shellcheck luarocks
          sudo luarocks install luacheck

      - name: Shellcheck ops.sh + helper scripts (style level)
        # scripts/*.sh ship in the image (google-chrome wrapper, nix wrappers)
        # and historically drifted without lint coverage. Keep them at the same
        # -S style bar as ops.sh.
        run: shellcheck -S style ops.sh scripts/*.sh

      - name: Bash syntax check
        run: |
          bash -n ops.sh
          for f in scripts/*.sh; do bash -n "$f"; done

      - name: Luacheck mise/ plugin
        # All knobs (globals, excluded files, accepted warnings) live in
        # the repo-root .luacheckrc — keep CI and local `mise run lint`
        # in lockstep without duplicating flags.
        run: luacheck mise/

      - name: Run bats tests
        run: bats --tap tests/ | tee bats-output.tap

      - name: Upload bats TAP log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bats-tap-log
          path: bats-output.tap
          retention-days: 14

  hadolint:
    name: hadolint Dockerfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: hadolint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          # DL3008: apt pin — intentional for pacman base image, not applicable
          # DL3059: multiple RUN — we batch on purpose for cacheability
          # DL3004: sudo in RUN — required post-USER for /etc and /usr writes,
          #         relying on the NOPASSWD sudoers entry installed for the
          #         build user; gosu is not a fit here (no runtime supervision)
          # SC2028 (hadolint-shellcheck): false positive on the `echo '…'`
          #         lines in the bashrc append block; no escape sequences
          #         are actually present
          ignore: DL3008,DL3059,DL3004,SC1091,SC2028
      - name: hadolint Dockerfile.debian (if present)
        if: hashFiles('Dockerfile.debian') != ''
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile.debian
          # Same ignore list as the Arch Dockerfile above — Dockerfile.debian
          # is a parity twin and uses the same `sudo` + `echo alias=…` blocks,
          # so the same DL3004 / SC2028 waivers apply.
          ignore: DL3008,DL3059,DL3004,SC1091,SC2028

  trivy-fs:
    name: trivy (filesystem + config)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Run trivy filesystem scan
        # Scans the working tree for CVEs in pinned dependencies + misconfigs
        # in Dockerfiles / workflows. Non-blocking (exit-code 0) so a new
        # advisory doesn't freeze the main branch — CI surfaces findings via
        # the workflow log, triage happens out-of-band.
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'
          format: table

  runtime-build:
    name: build smoke (${{ matrix.runtime }})
    runs-on: ubuntu-latest
    needs: [bats, hadolint]
    strategy:
      fail-fast: false
      matrix:
        runtime: [docker, podman, nerdctl]
    steps:
      - uses: actions/checkout@v4

      - name: Install docker
        if: matrix.runtime == 'docker'
        run: |
          # docker is preinstalled on ubuntu-latest, just verify
          docker --version

      - name: Install podman
        if: matrix.runtime == 'podman'
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Prepare systemd user session (nerdctl)
        if: matrix.runtime == 'nerdctl'
        run: |
          # Rootless containerd prereqs that ubuntu-latest doesn't ship by
          # default. Without these `containerd-rootless-setuptool.sh install`
          # bails out half-way and leaves no containerd.service unit behind,
          # which is what produced "Unit containerd.service not found" in
          # earlier runs.
          #   uidmap            -> newuidmap/newgidmap (subuid/subgid mapping)
          #   slirp4netns       -> rootless network stack
          #   fuse-overlayfs    -> rootless snapshotter
          #   dbus-user-session -> per-user DBus + `systemctl --user`
          sudo apt-get update
          sudo apt-get install -y uidmap slirp4netns fuse-overlayfs dbus-user-session
          # Ubuntu 24.04 (noble) ships AppArmor with
          # `kernel.apparmor_restrict_unprivileged_userns=1` by default,
          # which blocks `unshare(CLONE_NEWUSER)` from non-root processes.
          # rootlesskit needs that syscall to fork its child PID-1 -- without
          # the override the install fails with
          # "fork/exec /proc/self/exe: operation not permitted".
          # Same remedy for the older `unprivileged_userns_clone` knob on
          # kernels that still expose it.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
          # Make sure the runner user has subuid/subgid ranges (rootlesskit
          # needs at least 65536 IDs). ubuntu-latest *usually* ships these,
          # but we add them defensively so a future image change doesn't
          # silently re-introduce the failure.
          if ! grep -q "^$USER:" /etc/subuid; then
            echo "$USER:100000:65536" | sudo tee -a /etc/subuid >/dev/null
          fi
          if ! grep -q "^$USER:" /etc/subgid; then
            echo "$USER:100000:65536" | sudo tee -a /etc/subgid >/dev/null
          fi
          # enable-linger keeps the user's systemd instance alive between
          # workflow steps (each step is a fresh non-interactive shell).
          # Surface the failure explicitly: a silent `|| true` previously
          # cascaded into a confusing "Unit not found" three steps later.
          sudo loginctl enable-linger "$USER"
          # XDG_RUNTIME_DIR must exist *and* be exported in every subsequent
          # step; persist it via $GITHUB_ENV so `Install nerdctl` and `Build
          # image` inherit the same value as this step.
          XDG_RUNTIME_DIR="/run/user/$(id -u)"
          sudo install -d -o "$(id -u)" -g "$(id -g)" "$XDG_RUNTIME_DIR"
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
          # `loginctl enable-linger` only takes effect on the *next* login --
          # force-start the user manager now so `systemctl --user` works in
          # this step (and the units installed below survive into the next).
          sudo systemctl start "user@$(id -u).service"
          # Wait for the user systemd instance to actually accept commands
          # (DBus listener takes a beat to come up after user@.service starts).
          for _ in $(seq 1 30); do
            systemctl --user show-environment >/dev/null 2>&1 && break
            sleep 1
          done
          systemctl --user show-environment >/dev/null

      - name: Install nerdctl via ops.sh
        if: matrix.runtime == 'nerdctl'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # Non-interactive install: pipe Y so the "Overwrite?" prompt is accepted.
          # ops.sh now propagates `containerd-rootless-setuptool.sh install`
          # failures, so a missing prereq fails the step instead of silently
          # leaving the system without a containerd.service unit.
          yes Y | OPS_RUNTIME=nerdctl ./ops.sh nerdctl install
          # daemon-reload picks up the unit file freshly written under
          # ~/.config/systemd/user/ (the install step created it but did
          # not necessarily reload this user manager).
          systemctl --user daemon-reload
          systemctl --user start containerd.service
          # Wait for the rootless containerd socket so the build step can
          # attach to it without racing the daemon startup.
          for _ in $(seq 1 30); do
            [ -S "$XDG_RUNTIME_DIR/containerd-rootless/containerd.sock" ] && break
            sleep 1
          done
          systemctl --user is-active containerd.service

      - name: Build image (${{ matrix.runtime }})
        env:
          OPS_RUNTIME: ${{ matrix.runtime }}
          GITHUB_TOKEN: ${{ github.token }}
          # Skip the nix cleanup step to keep CI under ~5 min
          # (the actual Nix build still runs; only the GC is skipped)
        run: |
          # Minimal smoke: parse + tag the Dockerfile without pulling the
          # entire Nix tree. We run `build` with a tiny base to validate the
          # full pipeline of ops.sh (flags, lock, hash, labels) against every
          # runtime — not the heavy Arch image itself (which would take 30min+).
          cat > Dockerfile.cismoke <<'EOF'
          # syntax=docker/dockerfile:1.6
          FROM docker.io/library/alpine:3.19
          ARG USER_UID=1000
          ARG USER_GID=1000
          ARG USER_NAME=ci
          ARG USER_LANG=C
          RUN addgroup -g "$USER_GID" "$USER_NAME" \
           && adduser -D -u "$USER_UID" -G "$USER_NAME" "$USER_NAME"
          USER ${USER_NAME}
          CMD ["sh"]
          EOF
          OPS_IMAGE=localhost/ops-ci-smoke \
          OPS_DOCKERFILE=Dockerfile.cismoke \
            ./ops.sh build
          # Sanity: the image must exist and carry the ops.dockerfile label
          if [ "$OPS_RUNTIME" = "nerdctl" ]; then
            bin="$HOME/.local/share/ops/nerdctl/bin/nerdctl"
          else
            bin="$OPS_RUNTIME"
          fi
          "$bin" image inspect localhost/ops-ci-smoke --format '{{index .Config.Labels "ops.dockerfile"}}' | grep -q 'Dockerfile.cismoke'

  image_changes:
    name: detect image-affecting changes
    # Lightweight gate for image-integration on PRs: skip the 15-min Arch
    # build when nothing under Dockerfile* / mise/ / scripts/ / the workflow
    # itself moved, but force-run it when those paths *do* change so a
    # Dockerfile / Nix regression can't slip through review.
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    outputs:
      image: ${{ steps.filter.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            image:
              - 'Dockerfile'
              - 'Dockerfile.*'
              - 'mise/**'
              - 'scripts/**'
              - 'ops.sh'
              - '.github/workflows/tests.yml'

  image-integration:
    name: image integration (Arch)
    # Runs on:
    #   - push to main + workflow_dispatch (full pre-merge + manual coverage)
    #   - pull_request when the PR touches an image input (Dockerfile*,
    #     mise/, scripts/, ops.sh, this workflow). The full Arch build is
    #     ~15 min so we skip it on doc/test-only PRs but enforce it whenever
    #     a Dockerfile/Nix regression is actually possible.
    #
    # `always()` is required because image_changes is skipped on push /
    # workflow_dispatch events (it only runs on pull_request); without
    # `always()`, GitHub propagates the skip into this job too. We then
    # gate explicitly on bats/hadolint success and on the appropriate
    # event_name + paths-filter combination.
    if: |
      always()
      && needs.bats.result == 'success'
      && needs.hadolint.result == 'success'
      && (
        github.event_name == 'push'
        || github.event_name == 'workflow_dispatch'
        || (github.event_name == 'pull_request' && needs.image_changes.result == 'success' && needs.image_changes.outputs.image == 'true')
      )
    runs-on: ubuntu-latest
    needs: [bats, hadolint, image_changes]
    steps:
      - uses: actions/checkout@v4

      - name: Install bats
        run: |
          sudo apt-get update
          sudo apt-get install -y bats

      - name: Build localhost/ops-dev (full Arch image)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        # NIX_CLEANUP=true (default) is important here: the GC root fix is
        # only exercised when nix-collect-garbage -d actually runs.
        run: ./ops.sh build

      - name: Run integration tests against the built image
        run: bats --tap tests/test_image_integration.bats
