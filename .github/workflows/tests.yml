name: tests

on:
  push:
    branches: [main, bwrap]
  pull_request:
    branches: [main, bwrap]
  workflow_dispatch:

# Cancel in-flight runs when a new commit lands on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Workflow-wide least-privilege: read-only access to repo contents.
permissions:
  contents: read

jobs:
  cargo:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install rustfmt + clippy
        run: rustup component add rustfmt clippy

      - name: Cache cargo registry + build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Format check
        run: cargo fmt --check

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: Unit tests
        # The integration e2e under tests/*.rs need user namespaces + nix + network,
        # which a hosted runner does not provide; they skip rather than fail, so CI
        # runs the unit tests (--bins). Run the full `cargo test` locally where the
        # host can sandbox.
        run: cargo test --bins
