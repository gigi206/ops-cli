# Docs — builds the Docusaurus docs site and publishes it to GitHub Pages.
#
# Triggered on every push to `main` and `ops-v2`, and on every `v*` tag, so the
# published documentation always matches the shipping release.
#
# The build is the same as `mise run docs-build` (docusaurus build + pagefind),
# so broken links, missing anchors and markdown errors fail here exactly as they
# do locally. The static output is uploaded with `actions/upload-pages-artifact`
# and deployed with `actions/deploy-pages`.

name: Docs

on:
  push:
    branches:
      - main
      - ops-v2
    tags:
      - "v*.*.*"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Docusaurus docs
    # Pinned rather than `ubuntu-latest`: GitHub migrates that label to the next LTS over a month or
    # two, so a run pinned to nothing changes host without anyone deciding to. Cage keeps a
    # `ubuntu-24.04` arm, so the older systemd stays covered.
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Install the docs-site dependencies
        run: npm ci

      - name: Build the static site (+ pagefind search index)
        run: npm run build

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: docs-site/build

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
