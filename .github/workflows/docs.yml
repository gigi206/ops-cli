# Docs — builds the Docusaurus docs site and publishes it to GitHub Pages.
#
# Triggered on every push to `main` and `ops-v2`, and on every `v*` tag, so the
# published documentation always matches the shipping release. A pull request
# runs the build alone and deploys nothing: an update to the site's dependencies
# that breaks it, which is most of what Dependabot proposes there, is then seen
# before it is merged rather than by the deployment that follows.
#
# The build is the same as `mise run docs-build` (check-docs + docusaurus build +
# pagefind), so broken links, missing anchors, a page nothing links to, a stale
# imported recipe and markdown errors fail here exactly as they
# do locally. The static output is uploaded with `actions/upload-pages-artifact`
# and deployed with `actions/deploy-pages`.

name: Docs

on:
  push:
    branches:
      - main
      - ops-v2
    tags:
      - "v*.*.*"
  pull_request:

# Each job asks for what it uses; only the deployment writes to Pages.
permissions:
  contents: read

# The publishing runs share one group, so a newer push replaces an older deployment. A pull
# request gets a group of its own, so its build never cancels one.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('docs-pr-{0}', github.ref) || 'docs-pages' }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Docusaurus docs
    # Pinned rather than `ubuntu-latest`: GitHub migrates that label to the next LTS over a month or
    # two, so a run pinned to nothing changes host without anyone deciding to. Cage keeps a
    # `ubuntu-24.04` arm, so the older systemd stays covered.
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Install the docs-site dependencies
        run: npm ci

      # Also run by `npm run build` as its prebuild step; named here so a stale
      # generated page or a page nothing links to reads as its own failed step
      # rather than as a build that died before webpack started.
      - name: Check the docs navigation and the imported recipes
        run: npm run check-docs

      - name: Build the static site (+ pagefind search index)
        run: npm run build

      - name: Upload the Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: docs-site/build

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
