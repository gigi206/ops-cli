# Release — builds the self-contained (nix+bwrap bundled) static musl binaries and
# attaches them to a GitHub Release created from the pushed tag.
#
# Trigger: any tag matching v*.*.* (e.g. v2.0.0, v2.0.1-alpha.0 is NOT matched by
# that glob — use v2.0.1-alpha0 style, or widen the pattern below if you want
# pre-release tags to publish too).
#
# The bundled engines are pinned. Keep the nixpkgs REV and the expected_sha in
# sync with build.rs / mise.toml when you bump them.
#
# Two architectures, one build definition: the matrix below pairs each target with a
# runner of that same architecture, because the action's unit gate runs the suite for
# the *host*. See the note in `.github/actions/build-static-sbx/action.yml`.

name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Static musl engines pinned in build.rs. Same nixpkgs rev as mise.toml.
  NIXPKGS_REV: "89570f24e97e614aa34aa9ab1c927b6578a43775"

jobs:
  build:
    name: build ${{ matrix.asset }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      # One architecture failing must not hide the other's result: a release that cannot
      # be published is worth diagnosing once rather than one arm at a time.
      fail-fast: false
      matrix:
        include:
          # Pinned rather than `ubuntu-latest`: GitHub migrates that label to the next LTS over a
          # month or two, so a run pinned to nothing changes host without anyone deciding to. Cage
          # keeps a `ubuntu-24.04` arm, so the older systemd stays covered.
          - runner: ubuntu-26.04
            target: x86_64-unknown-linux-musl
            asset: sbx-linux-x86_64
          # `ubuntu-24.04-arm` and not the 26.04 ARM label: that one is still a public preview,
          # and the architecture is what this arm is here to cover, not the distribution version.
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            asset: sbx-linux-aarch64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build the self-contained static musl binary
        uses: ./.github/actions/build-static-sbx
        with:
          nixpkgs-rev: ${{ env.NIXPKGS_REV }}
          target: ${{ matrix.target }}
          asset: ${{ matrix.asset }}

      # Named after the asset, not after the workflow: two matrix arms uploading under one
      # name is a conflict, and the name is what `publish` globs for below.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.sha256
          retention-days: 1

  publish:
    name: publish release assets
    # Every arm, so a release never carries one architecture and not the other.
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Collect every architecture's asset
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: sbx-linux-*
          merge-multiple: true

      # Every asset in hand before anything is published. `fail_on_unmatched_files` below is
      # documented as failing when a `files` **glob** matches nothing, which says nothing about a
      # literal path that is absent — so the completeness of the set is asserted here, the same
      # way the two rolling publishers assert it, rather than inferred from that flag.
      - name: Every architecture's asset must be present
        run: |
          set -euo pipefail
          for f in sbx-linux-x86_64 sbx-linux-x86_64.sha256 \
                   sbx-linux-aarch64 sbx-linux-aarch64.sha256; do
            test -f "$f" || { echo "missing release asset: $f"; exit 1; }
          done

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          files: |
            sbx-linux-x86_64
            sbx-linux-x86_64.sha256
            sbx-linux-aarch64
            sbx-linux-aarch64.sha256
          # A tag containing a hyphen (e.g. v2.0.0-alpha.0) is a pre-release.
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
