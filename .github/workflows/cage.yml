# Cage — the run that makes the sandbox suites prove they ran.
#
# WHAT PROBLEM THIS SOLVES. `ci.yml`'s green says, in its own words, that 189 tests reported ok
# without running: a hosted runner has no user namespace, no bubblewrap and no nix, so everything
# that needs a cage returns early, and `cargo test` counts an early return as a pass. The check is
# therefore green precisely where the coverage is absent, and on the file that exercises the cage it
# means close to the opposite of what it looks like.
#
# A hosted runner can in fact provide all three. It has passwordless sudo, so bubblewrap is an
# apt-get away and the Ubuntu 24.04 apparmor restriction on unprivileged user namespaces is a
# sysctl; nix is already installed by the publish workflows. What was missing was a workflow that
# asks for them.
#
# WHAT THE RUN PROVIDES, AND WHY. Arming `SBX_REQUIRE_CAPABLE=1` once turned every capability skip
# into a failure and so named what this runner was missing: zsh, a Wayland compositor, a PulseAudio
# socket, and a cgroup delegation root. The steps below provide the first three, because a suite
# that reports ok without running is coverage that exists only on someone's machine. They also open
# a real user session -- which is what creates `/run/user/<uid>`, where the compositor and the sound
# server publish the sockets the GUI and audio suites resolve.
#
# THE FOURTH IS NOT PROVIDED, AND WHAT IT UNCOVERED IS FIXED. A hosted job runs under the runner's
# own system service, so `sbx` finds no `user@<uid>.service` to ask for a capped scope and applies
# no limits. Placing the suites in a user scope does give it one -- and every launch then went
# through `systemd-run`, where the older systemd does not undo a dollar-doubling the launch used to
# rely on: the egress preamble every networked cage carries died on a syntax error, and the skip
# count went from 14 to 110, all of them reading "host cannot sandbox". The launch no longer
# doubles; it asks for no substitution at all. The scope is still not taken here, because a run
# placing its own processes in one measures a host this runner is not, and the four resource-limit
# tests skip for a reason that is true of it. What the disagreement produced is kept: the report
# below measures the dollar behaviour every run, and `--bin sbx` carries the guard that asserts
# it.
#
# It still does not enforce by default. `require-capable` arms it for a run, and arming it as the
# default is a decision for a run whose skip count below actually reads zero -- read from that
# report, never inferred from what the steps here appear to have installed.
#
# THE SKIP COUNT IS THE MEASUREMENT, NOT THE PASS COUNT. `skip_incapable!` (`src/testskip.rs`)
# prints its reason and returns, so `cargo test` counts a skipped test as PASSED and never as
# ignored: by the line `cargo` prints, a suite that ran nothing is indistinguishable from one that
# ran everything. `SBX_SKIP_LOG` is what counts them, and the report below is where that number
# appears. Reading `0 ignored` answers a different question than the one this workflow exists to
# ask, and answers it the reassuring way.
#
# WHEN IT RUNS. `schedule` and `workflow_dispatch` only exist once a workflow is on the repository's
# DEFAULT branch, so on a development branch neither fires. The `push` trigger below is narrowed to
# this file so that a change to the run itself is exercised once, which is what makes the first
# measurement possible at all.

name: Cage

on:
  workflow_dispatch:
    inputs:
      require-capable:
        description: >
          Turn every capability skip into a failure (SBX_REQUIRE_CAPABLE=1). For a runner that has
          been given the prerequisites; the default reports the skips instead of failing on them.
        type: boolean
        default: false
  schedule:
    - cron: "0 3 * * *"
  push:
    paths:
      - .github/workflows/cage.yml

permissions:
  contents: read

concurrency:
  group: cage-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  cage:
    name: exercise the cage (${{ matrix.image }})
    # Both images, pinned, and neither cancels the other. `ubuntu-latest` is not a version: GitHub
    # migrates the label to the next LTS over a month or two, so a run pinned to nothing would have
    # moved from 24.04 to 26.04 on its own -- and the dollar-doubling defect below, which shows only
    # on the older systemd, would have stopped reproducing without anyone deciding it was fixed.
    #
    # 24.04 is the witness: it is where a launch through `systemd-run` breaks, and it is what an LTS
    # user runs. 26.04 is the host this repository is developed on. Running both is what makes a
    # disagreement between them a standing measurement rather than an accident someone stumbles on,
    # which is exactly how this one was found. `fail-fast: false` so the red arm never hides the
    # other's report.
    strategy:
      fail-fast: false
      matrix:
        image: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.image }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install the engines and the desktop pieces the suites look for
        # `bubblewrap` is what a cage is built from. The other three are what the suites probe for
        # before deciding to run: `zsh` for the completion drives, `weston` for a compositor whose
        # socket the GUI tests bind into a cage, `pulseaudio` for the socket the audio posture
        # binds. `dbus-user-session` brings the user manager's own bus, which the resource-limit
        # path gates on -- see the session step below.
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bubblewrap zsh weston pulseaudio dbus-user-session

      - name: Allow unprivileged user namespaces
        # Ubuntu 24.04 ships `kernel.apparmor_restrict_unprivileged_userns=1`, which refuses the
        # namespace a cage is built from. The knob does not exist on every image, and its absence is
        # not a failure — it means nothing is restricting them.
        run: |
          set -euo pipefail
          knob=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          if [ -e "$knob" ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          else
            echo "no apparmor restriction on this image"
          fi

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          extra_conf: |
            experimental-features = nix-command flakes

      - name: Open a real user session, so the desktop sockets have somewhere to live
        # `/run/user/<uid>` is created by `user@<uid>.service`, and a hosted job has no login to
        # start one. `enable-linger` starts it without anyone logging in, which is what gives the
        # compositor and the sound server a runtime directory to publish into -- and what lets the
        # report below read the delegated controllers at all, even though the suites do not run
        # inside the session (see the note on the suites step).
        #
        # The session bus is a separate unit from the manager, and `sbx` gates its limiter on that
        # socket existing rather than on the runtime directory being named: a manager without a bus
        # would leave the limits off while every other sign said the session was there.
        #
        # Exported through `$GITHUB_ENV` because each `run:` is a fresh shell; an export here would
        # not reach the suites.
        run: |
          set -euo pipefail
          uid=$(id -u)
          sudo loginctl enable-linger "$USER"
          runtime="/run/user/$uid"
          for _ in $(seq 1 50); do [ -d "$runtime" ] && break; sleep 0.2; done
          export XDG_RUNTIME_DIR="$runtime"
          systemctl --user enable --now dbus.socket || true
          for _ in $(seq 1 50); do [ -S "$runtime/bus" ] && break; sleep 0.2; done
          {
            echo "XDG_RUNTIME_DIR=$runtime"
            echo "DBUS_SESSION_BUS_ADDRESS=unix:path=$runtime/bus"
          } >> "$GITHUB_ENV"

      - name: Stand up a headless compositor and a sound server
        # Neither needs a screen or a card. What the suites read is the socket: `wayland_socket()`
        # in `tests/run.rs` resolves `WAYLAND_DISPLAY` under `XDG_RUNTIME_DIR` and requires the
        # file to exist, and the audio posture looks for `$XDG_RUNTIME_DIR/pulse/native`. Both are
        # started in the background and waited for, so a failure to come up is reported here rather
        # than as a skip five minutes later.
        env:
          WAYLAND_DISPLAY: wayland-1
        run: |
          set -uo pipefail
          # Weston 13 spells the headless backend `headless`; earlier releases want the module
          # file name. Try the current spelling first and fall back, so the image moving under us
          # is a slower start rather than a missing compositor.
          for backend in headless headless-backend.so; do
            weston --backend="$backend" --socket="$WAYLAND_DISPLAY" --idle-time=0 \
              >"$RUNNER_TEMP/weston.log" 2>&1 &
            for _ in $(seq 1 50); do [ -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" ] && break; sleep 0.2; done
            [ -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" ] && break
          done
          if [ ! -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" ]; then
            echo "::warning::no compositor came up -- the GUI suites will report rather than run"
            tail -20 "$RUNNER_TEMP/weston.log" || true
          fi
          pulseaudio --start --exit-idle-time=-1 || true
          for _ in $(seq 1 50); do [ -S "$XDG_RUNTIME_DIR/pulse/native" ] && break; sleep 0.2; done
          if [ ! -S "$XDG_RUNTIME_DIR/pulse/native" ]; then
            echo "::warning::no sound server came up -- the audio suites will report rather than run"
          fi
          echo "WAYLAND_DISPLAY=$WAYLAND_DISPLAY" >> "$GITHUB_ENV"

      - name: Report what this runner can do
        # Measured before the suites run, and kept whatever they do: when a cage test fails, the
        # first question is whether the host could have run it, and the answer belongs in the same
        # place as the failure rather than in a reader's inference.
        run: |
          set -uo pipefail
          {
            echo "### Host capability"
            echo
            echo '```'
            echo "bwrap:     $(command -v bwrap || echo absent)"
            echo "nix:       $(command -v nix || echo absent)"
            echo "nix-store: $(command -v nix-store || echo absent)"
            echo "zsh:       $(command -v zsh || echo absent)"
            printf 'userns:    '
            if unshare --user --map-root-user true 2>/dev/null; then echo "usable"; else echo "REFUSED"; fi
            printf 'systemd:   '
            if systemctl --user show-environment >/dev/null 2>&1; then echo "user session present"; else echo "no user session"; fi
            echo
            echo "# the sockets the suites resolve, at the paths they resolve them"
            echo "XDG_RUNTIME_DIR:  ${XDG_RUNTIME_DIR:-unset}"
            printf 'session bus:      '
            if [ -S "${XDG_RUNTIME_DIR:-/nonexistent}/bus" ]; then echo present; else echo ABSENT; fi
            echo "WAYLAND_DISPLAY:  ${WAYLAND_DISPLAY:-unset}"
            printf 'wayland socket:   '
            if [ -S "${XDG_RUNTIME_DIR:-/nonexistent}/${WAYLAND_DISPLAY:-none}" ]; then echo present; else echo ABSENT; fi
            printf 'pulse socket:     '
            if [ -S "${XDG_RUNTIME_DIR:-/nonexistent}/pulse/native" ]; then echo present; else echo ABSENT; fi
            echo
            echo "# what decides the four resource-limit tests"
            echo "own cgroup:       $(cut -d: -f3 /proc/self/cgroup | head -1)"
            printf 'delegated:        '
            cat "/sys/fs/cgroup/user.slice/user-$(id -u).slice/user@$(id -u).service/cgroup.controllers" 2>/dev/null || echo "no delegation root"
            echo
            echo "# whether a doubled dollar survives systemd-run: \`sbx\` doubles every dollar in a"
            echo "# wrapped argument so systemd's own substitution restores the byte. Where the"
            echo "# doubling is not undone, the argument reaches the program with both dollars and a"
            echo "# shell preamble dies on it. Expected: A"
            echo "systemd:          $(systemd-run --version 2>/dev/null | head -1 || echo absent)"
            printf 'doubled dollar:   '
            systemd-run --user --scope -q --collect --unit="probe-dollar-$$" -- \
              bash -c 'echo "A$$B"' 2>&1 | head -1
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Run the sandbox suites
        env:
          SBX_SKIP_LOG: ${{ github.workspace }}/target/test-skips.log
          # Off by default, because the four prerequisites this runner does not offer are named in
          # the header: enforcing would fail every run on the host's shape rather than on a
          # regression, which is the opposite of a finding. The report below names each skip
          # instead, so a prerequisite that goes missing is still visible.
          #
          # `require-capable` arms it for a run. On a push or a schedule there is no `inputs`, so
          # this resolves to the empty string, which the skip macro reads as unset since
          # `src/testskip.rs` requires a value that is neither empty nor `0`.
          SBX_REQUIRE_CAPABLE: ${{ inputs.require-capable && '1' || '' }}
        run: |
          set -uo pipefail
          mkdir -p "$(dirname "$SBX_SKIP_LOG")"
          : > "$SBX_SKIP_LOG"
          # The fourteen suites that carry a cage skip, named rather than globbed so a new one is a
          # deliberate addition. Kept in step with `mise run test-cage`, which runs the same list.
          # NOT run inside a user scope, deliberately. Placing the suites under
          # `user@<uid>.service` gives `sbx` the delegation root it looks for, so every launch would
          # then go through `systemd-run`. That path is no longer broken -- the launch asks for no
          # variable substitution rather than escaping for one -- but a run that puts its own
          # processes in a scope measures a host this runner is not. The behaviour that mattered is
          # asserted instead by `a_dollar_argument_reaches_the_program_verbatim` in `--bin sbx`,
          # which raises a throwaway scope of its own and needs no delegation root to do it: tying
          # it to one made it skip here, on a runner where a scope creates fine, and a skip reads as
          # a pass. The dollar report above keeps measuring the same thing without asserting it, so
          # the day a systemd default moves again, this says so either way.
          rc=0
          for suite in attach completion config detach doctor fs netns plugins proc run sessions shell stop upgrade; do
            cargo test --test "$suite" --no-fail-fast || rc=$?
          done
          # The unit tests too, and on a capable host they are not a formality: the guards that need a real
          # scope, a real bus or a real store skip everywhere else, so this is the only run where they have
          # teeth. `an_escaped_dollar_argument_reaches_the_program_verbatim` is the one that matters most --
          # it drives a throwaway scope and compares the arguments that arrive, so it measures the behaviour a
          # launch depends on rather than the version of the host it is running on.
          cargo test --bin sbx --no-fail-fast || rc=$?
          exit $rc

      - name: Report what still skipped
        if: always()
        env:
          SBX_SKIP_LOG: ${{ github.workspace }}/target/test-skips.log
        run: |
          set -uo pipefail
          n=0
          [ -f "$SBX_SKIP_LOG" ] && n=$(wc -l < "$SBX_SKIP_LOG" | tr -d ' ')
          {
            echo "### Tests that reported ok without running: $n"
            echo
            if [ "$n" -gt 0 ]; then
              echo '```'
              sort "$SBX_SKIP_LOG" | uniq -c | sort -rn | head -40
              echo '```'
              echo
              echo "Each line is a prerequisite this runner did not offer. Re-run with"
              echo "\`require-capable\` to make them failures."
            else
              echo "None: every selected test ran."
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
