name: Build the self-contained static sbx
description: >
  Build the static musl `sbx` with its own `nix` and `bwrap` bundled in, and write it to the
  workspace under the caller's asset name, beside its `.sha256`.

# WHY THIS IS AN ACTION AND NOT THREE COPIES.
#
# `release`, `nightly` and `latest` publish different things — a tagged asset, and two rolling
# tags that are force-moved — but they build the SAME artifact, and they used to say so three
# times. That is not a tidiness complaint: the toolchain versions live in these steps, and three
# copies is how they drift. One of them once carried a zig three major versions from the one the
# repository resolved locally, and nothing failed to report it, because a differently built binary
# is still a binary. The build is written once here; what each workflow keeps is its own publish.
#
# The contract with the caller is the two files named by `asset`, left in the workspace. The caller
# checks out first (this action does not, so a workflow that needs `fetch-depth: 0` for a tag push
# can ask for it) and publishes after.
#
# WHY THE TARGET IS AN INPUT AND THE RUNNER IS THE CALLER'S.
#
# The published binary exists for two architectures, and the build is the same one twice — so the
# target travels as an input rather than forking the action. What does not travel is the runner:
# each architecture builds on a host of its own kind, because the `Unit tests` step below runs the
# suite for the *host*, not for `target`. Cross-building `aarch64` from an `x86_64` runner would
# publish an ARM binary on which no test had run, and the seccomp denylist is one of the places
# where the two architectures genuinely differ.

inputs:
  release-tag:
    description: >
      The tag the binary is published under (`latest`, `nightly`, `v1.2.3`). Stamped into the build
      with the commit and the repository, so `sbx --version` names the release and `sbx upgrade
      self` knows which one to follow; a build without the stamp is a build from source. Passed by
      each caller because only the caller knows where it publishes.
    required: true
  nixpkgs-rev:
    description: >
      The nixpkgs revision the bundled engines are realised from. Passed rather than read from the
      environment so the value a workflow uses is visible at its call site.
    required: true
  target:
    description: >
      The Rust target triple to build. The caller pairs it with a runner of the same architecture
      (see the note above); building a target the runner cannot execute leaves the unit gate
      measuring the wrong thing.
    required: false
    default: x86_64-unknown-linux-musl
  asset:
    description: >
      The file name the built binary is written to, beside `<asset>.sha256`. Named by the caller
      rather than derived from `target`, so the file a release publishes is readable at the call
      site — the same reason `nixpkgs-rev` is passed in.
    required: false
    default: sbx-linux-x86_64
  skip-test:
    description: >
      The one unit test excluded from the pre-build gate. It asserts the behaviour of the host's
      `systemd-run`, which differs across systemd versions and fails on a hosted runner while
      passing locally.
    required: false
    default: sandbox::cgroup::tests::a_dollar_argument_reaches_the_program_verbatim

runs:
  using: composite
  steps:
    - name: Install Rust (with the musl target)
      uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1
      with:
        targets: ${{ inputs.target }}

    - name: Install zig (linker for the musl target)
      uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
      with:
        version: 0.13.0

    - name: Install cargo-zigbuild
      # Pinned to the version `mise.toml` names, so the local musl build and the published one go
      # through the same wrapper. Bump the two together.
      shell: bash
      run: cargo install cargo-zigbuild@0.23.0 --locked

    - name: Install Nix
      uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      with:
        extra_nix_config: |
          experimental-features = nix-command flakes

    - name: Realise the pinned static nix engine
      id: nix
      shell: bash
      env:
        NIXPKGS_REV: ${{ inputs.nixpkgs-rev }}
      run: |
        set -euo pipefail
        ref="github:NixOS/nixpkgs/${NIXPKGS_REV}#pkgsStatic.nix"
        for out in $(nix build "$ref" --no-link --print-out-paths); do
          if [ -e "$out/bin/nix" ]; then
            echo "path=$out/bin/nix" >> "$GITHUB_OUTPUT"
            exit 0
          fi
        done
        echo "no bin/nix in the pkgsStatic.nix outputs" >&2; exit 1

    - name: Realise the pinned static bwrap engine
      id: bwrap
      shell: bash
      env:
        NIXPKGS_REV: ${{ inputs.nixpkgs-rev }}
      run: |
        set -euo pipefail
        ref="github:NixOS/nixpkgs/${NIXPKGS_REV}#pkgsStatic.bubblewrap"
        for out in $(nix build "$ref" --no-link --print-out-paths); do
          if [ -e "$out/bin/bwrap" ]; then
            echo "path=$out/bin/bwrap" >> "$GITHUB_OUTPUT"
            exit 0
          fi
        done
        echo "no bin/bwrap in the pkgsStatic.bubblewrap outputs" >&2; exit 1

    # The hashes `build.rs` pins, printed before it asserts them. They are per target, because the
    # same pinned attribute realises different bytes per architecture — so a bumped nixpkgs ref, or
    # a target whose engines no host here has ever realised, reads its expected values from this
    # step rather than from a failed assertion. Printing costs nothing and is the only place some
    # of these bytes are ever hashed.
    - name: The engines' SHA-256, as build.rs will hash them
      shell: bash
      env:
        NIX_ENGINE: ${{ steps.nix.outputs.path }}
        BWRAP_ENGINE: ${{ steps.bwrap.outputs.path }}
        TARGET: ${{ inputs.target }}
      run: |
        set -euo pipefail
        echo "pinned engine hashes for ${TARGET}:"
        sha256sum "$NIX_ENGINE" "$BWRAP_ENGINE"

    # Sanity gate: the default-feature unit suite must pass before minutes are spent bundling
    # engines. The sandbox e2e skip on a hosted runner, so this proves the unit surface only.
    # `-D warnings` here matches what `ci.yml` compiles under: the three publish paths previously
    # disagreed about it, and the loosest of them decided what shipped.
    #
    # This runs for the runner's own architecture, which is why the caller pairs runner and target.
    # `ci.yml` is x86_64 only, so on an ARM runner this is the sole gate that compiles and runs the
    # `#[cfg(target_arch = "aarch64")]` branches at all.
    - name: Unit tests (default features)
      shell: bash
      env:
        SKIP_TEST: ${{ inputs.skip-test }}
      run: |
        set -euo pipefail
        RUSTFLAGS="-D warnings" cargo test --bins -- --skip "$SKIP_TEST"

    # The unpack's seccomp allowlist is written per architecture, and the one test that runs a real
    # layer through the unpack's own process, in its cage and under its filters, needs a `bwrap` on
    # the PATH and a user namespace. A hosted runner gives neither, so in the step above that test
    # returns without running and reports `ok`. On ARM nothing else would run it: `ci.yml` and
    # `cage.yml` are x86_64 only.
    #
    # The `bwrap` is the pinned engine realised above, the one the published binary carries. The
    # AppArmor knob is lifted the way `cage.yml` lifts it. `SBX_REQUIRE_CAPABLE` turns the skip into
    # a failure, and the count is read back so that a filter matching nothing cannot pass either.
    # `RUSTFLAGS` is the step above's, so the test binary is reused rather than rebuilt.
    - name: The unpack in its cage, under the aarch64 filters
      if: runner.arch == 'ARM64'
      shell: bash
      env:
        BWRAP_ENGINE: ${{ steps.bwrap.outputs.path }}
        SBX_REQUIRE_CAPABLE: "1"
      run: |
        set -euo pipefail
        knob=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
        if [ -e "$knob" ]; then
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        fi
        t=unpack::tests::a_layer_unpacked_in_its_cage_lands_in_the_tree_and_reaches_nothing_else
        log="$RUNNER_TEMP/unpack-in-its-cage.log"
        PATH="$(dirname "$BWRAP_ENGINE"):$PATH" RUSTFLAGS="-D warnings" \
          cargo test --bins -- "$t" | tee "$log"
        grep -q '^test result: ok\. 1 passed' "$log"

    # The release stamp rides this step alone. The unit gate above compiles without it, as every
    # build from source does, and `src/release.rs` refuses a stamp that is partial or malformed, so
    # a bad value fails here rather than shipping.
    - name: Build the bundled static musl binary
      shell: bash
      env:
        SBX_BUNDLED_NIX: ${{ steps.nix.outputs.path }}
        SBX_BUNDLED_BWRAP: ${{ steps.bwrap.outputs.path }}
        SBX_RELEASE_TAG: ${{ inputs.release-tag }}
        SBX_RELEASE_COMMIT: ${{ github.sha }}
        SBX_RELEASE_REPO: ${{ github.repository }}
        TARGET: ${{ inputs.target }}
        ASSET: ${{ inputs.asset }}
      run: |
        set -euo pipefail
        cargo zigbuild --release --target "$TARGET" \
          --features bundled-nix,bundled-bwrap
        cp "target/$TARGET/release/sbx" "$ASSET"
        sha256sum "$ASSET" | cut -d' ' -f1 > "$ASSET.sha256"

    # The binary just built is the one a release publishes and `install.sh` hands to a machine of
    # this architecture, and nothing above runs it: the unit gate runs the host's own build, not
    # this static one with its engines inside. So it is run here, on a runner of its architecture,
    # the way the installer runs it: `--version`, then `doctor`, which unpacks the bundled engines,
    # launches a hardened process through them and exits non-zero on a missing prerequisite. The
    # engines must be the bundled ones, read back from the report, so a `bwrap` or `nix` the runner
    # happens to carry cannot stand in for them. The AppArmor knob is lifted as the unpack step
    # lifts it, and the data directory is short, since sbx binds sockets under it.
    - name: Run the built binary (--version, doctor)
      shell: bash
      env:
        ASSET: ${{ inputs.asset }}
        TAG: ${{ inputs.release-tag }}
        COMMIT: ${{ github.sha }}
      run: |
        set -euo pipefail
        knob=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
        if [ -e "$knob" ]; then
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        fi
        # The stamp must be in the binary that ships, not merely in the step that built it.
        version="$("./$ASSET" --version)"
        echo "$version"
        case "$version" in
          "sbx "*" ($TAG, ${COMMIT:0:7})") ;;
          *) echo "the binary does not name its release ($TAG, ${COMMIT:0:7})" >&2; exit 1 ;;
        esac
        data="$(mktemp -d /tmp/sbx.XXXXXX)"
        log="$RUNNER_TEMP/doctor.log"
        SBX_DATA_DIR="$data" "./$ASSET" doctor </dev/null | tee "$log"
        for engine in nix bubblewrap; do
          grep -Eq "^[[:space:]]*\[ ok \] $engine[[:space:]]+$data/engine/" "$log" \
            || { echo "doctor did not use the bundled $engine" >&2; exit 1; }
        done
        grep -Eq '^[[:space:]]*\[ ok \] sandbox[[:space:]]' "$log" \
          || { echo "doctor did not launch a hardened process" >&2; exit 1; }
