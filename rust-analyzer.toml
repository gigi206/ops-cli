# rust-analyzer configuration for this repository.
#
# Read by rust-analyzer as workspace-local config, rather than by one editor's settings, so it does
# not depend on which client starts the server. What a given setting then reaches is its own
# question, and the `[files]
# Nothing under these is Rust the analyzer needs: the Docusaurus site, the example app
# profiles (TOML), and the image assets. Paths are relative to the workspace root and
# globs are not supported.
#
# WHAT THIS DOES NOT DO. It bounds what is ANALYSED, not what is WATCHED, so it is not a guard
# against inotify exhaustion and an earlier revision of this file was wrong to present it as one.
# Measured against this analyzer, comparing the inodes in `/proc/<pid>/fdinfo` — matched on the
# (inode, device) pair, since inode numbers repeat across filesystems — with the real directories:
# the watch set is **identical**, to the watch, with no exclusion at all, with `src` excluded, with
# `target` excluded, and with `docs-site` excluded. The channel is live while that happens: an
# ill-typed value comes straight back as `invalid config value: /files/exclude`, and the older
# spelling `excludeDirs` is still accepted as an alias, so neither the name nor the delivery was
# ever the reason.
#
# WHAT DECIDES IT is `files.watcher`, and no configuration reaches it. The analyzer resolves it to
# `Client` only when the editor advertises dynamic registration for `didChangeWatchedFiles`, and to
# `Server` otherwise; under `Server` it walks and watches the workspace itself, one inotify watch per
# directory. So whether the machine's `max_user_watches` survives depends on which client started
# the server, not on anything written here. What breaks when they run out is not the analyzer:
# systemd loses the cgroup watches a transient scope needs to learn its cage emptied, so the scope is
# never collected.
#
# The remedy therefore is not a setting but a location: the cage suite roots its fixtures through
# `SBX_TEST_TMPDIR`, and `mise run test` points that outside the workspace, where one run's hundreds
# of thousands of directories cost nothing to watch because nothing walks them.
#
# That subtree only, never `target` itself: `targetDir` above puts the analyzer's own
# build under `target/`, and four `include!(concat!(env!("OUT_DIR"), ...))` sites read
# generated sources from it. Excluding the parent would hide them and break the crate.
exclude = ["docs-site", "examples", "assets", "target/test-tmp"]
