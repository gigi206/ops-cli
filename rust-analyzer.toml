# rust-analyzer configuration for this repository.
#
# Read natively by rust-analyzer as workspace-local config, so it applies to every
# client alike -- the editor's server and Claude Code's LSP plugin.

[cargo]
# Give rust-analyzer its own target directory. Without it, its `cargo check` and its
# initial build-script and proc-macro build lock `Cargo.lock` against the project's own
# `cargo test` and `mise run build`, and the two starve each other -- measured here, an
# initial index took ~25 minutes while a cage test suite was running. The cost is a
# duplicated build tree; `/target` is already git-ignored, so nothing of it is tracked.
targetDir = "target/rust-analyzer"

[files]
# Nothing under these is Rust the analyzer needs: the Docusaurus site, the example app
# profiles (TOML), and the image assets. Paths are relative to the workspace root and
# globs are not supported.
#
# `target/test-tmp` is the cage suite's scratch root, and it is listed for a different
# reason than the three above: not that watching it is useless, but that watching it is
# harmful. Every run leaves a tree holding a copy of a nix store, a tree that outlives a
# panic or an interrupted suite, and inotify spends one watch per DIRECTORY -- so the
# analyzer walks into millions of them and exhausts `fs.inotify.max_user_watches` for the
# whole machine. What breaks then is not the analyzer: systemd loses the watches it needs
# to observe a cgroup, so a transient scope never learns its cage emptied, is never
# collected, and the next invocation asking for that unit name is refused. The suite that
# fills the directory is the suite the exhaustion breaks.
#
# That subtree only, never `target` itself: `targetDir` above puts the analyzer's own
# build under `target/`, and four `include!(concat!(env!("OUT_DIR"), ...))` sites read
# generated sources from it. Excluding the parent would hide them and break the crate.
excludeDirs = ["docs-site", "examples", "assets", "target/test-tmp"]
