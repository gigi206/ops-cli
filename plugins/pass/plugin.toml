name        = "pass"
type        = "resolver"
scheme      = "pass"
exec        = "resolve"
version     = "0.2.0"
description  = "Read a secret from the pass(1) password store: pass://<path> (the first line)"

[sandbox]
# The store, the GnuPG home (public keyring + trustdb), and the gpg-agent socket — which
# lives under $XDG_RUNTIME_DIR/gnupg/, not ~/.gnupg. Binding the live agent socket lets the
# resolver use the already-running host agent, so a read-only grant suffices (the agent holds
# the secret keys and does the decryption; the client writes nothing).
#
# The last five entries are where pass(1) itself is installed. The cage's PATH is
# `/usr/bin:/bin` and only the host `/usr` is bound, so a user-mode install (a nix profile,
# Homebrew, ~/.local/bin) is otherwise invisible; a nix profile's binaries are symlinks into
# the store, so /nix/store must come with it. Every entry is bound only if present, so one
# manifest stays portable: add your own location here if pass(1) lives elsewhere.
#
# /nix/store is the widest of them, and a deliberate trade: the whole store rather than the
# one package, because a profile's binaries are symlinks into it and their interpreters and
# libraries live there too. It is read-only and world-readable on the host, so it holds no
# secret of its own, but it does show this resolver every package installed through nix. Drop
# it if pass(1) does not come from nix, and keep the list to the locations you actually use.
allow_paths = ["~/.password-store", "~/.gnupg", "$XDG_RUNTIME_DIR/gnupg",
               "~/.nix-profile/bin", "/nix/store",
               "/home/linuxbrew/.linuxbrew", "/opt/homebrew", "~/.local/bin"]
# GNUPGHOME for a non-default keyring, PASSWORD_STORE_DIR for a store outside
# ~/.password-store — each passed through only when set in sbx's environment (an unset one is
# simply omitted), and each naming a path that must also be added to `allow_paths` above, or
# the resolver finds nothing where it was told to look. XDG_RUNTIME_DIR is deliberately not
# passed: GnuPG derives its socket directory from /run/user/<uid> and HOME, never from it.
allow_env   = ["GNUPGHOME", "PASSWORD_STORE_DIR"]
network     = false
