# mise.toml — development toolchain for the sbx sandbox launcher.
#
# Run once after cloning:
#
#     mise trust          # allow mise to source this file (first time only)
#     mise install        # install the tools below
#
# Then `mise run lint`, `mise run test`, `mise run build`, `mise run ci`.
# The invocations mirror `.github/workflows/ci.yml` — if CI passes,
# `mise run ci` locally should too (and vice versa).

min_version = "2024.12.0"

[tools]
rust                            = "latest"
# The Rust language server (LSP). Pinned so every `git clone` + `mise install`
# contributor gets a working LSP out of the box (rustup does not ship it by default).
"github:rust-lang/rust-analyzer" = "latest"
# The shipping binary is a static musl build; some dependencies carry C/asm, so
# the musl target needs a musl-targeting C compiler. zig provides a self-contained
# musl cross-cc and cargo-zigbuild wires it into cargo — no system musl-gcc package
# required. Build with:
#   mise run build   # == cargo zigbuild --release --target x86_64-unknown-linux-musl
zig                             = "latest"
"github:rust-cross/cargo-zigbuild" = "latest"
# Source-based code coverage. Prebuilt + checksum-verified via aqua. On its first run it
# provisions the `llvm-tools-preview` rustup component (llvm-cov / llvm-profdata) itself, so
# nothing else is needed. Run `mise run coverage`.
"aqua:taiki-e/cargo-llvm-cov"      = "latest"
# Docs site (Docusaurus) runs on Node. Its dependencies are pinned in
# docs-site/package.json (the lockfile source of truth); `mise run docs-install`
# materialises them into docs-site/node_modules via `npm install`. Keep the two in
# sync when bumping a version. `pagefind` (the search indexer) is a dev dep too.
node                            = "latest"
# The TS/JS language server for the Docusaurus docs-site. `typescript` is capped at
# the 5.x line because it is the last to ship tsserver (typescript 7/tsgo does not,
# and typescript-language-server needs it); docs-site keeps its own
# `typescript: ^7` devDependency for `npm run typecheck` — the two coexist.
# Keep the `tsserver.path` in the omp LSP config (~/.omp/agent/lsp.json) in sync
# with the resolved typescript version when it bumps.
"npm:typescript"                = "5"
"npm:typescript-language-server" = "latest"

# ============================================================================
# Tasks — invoked via `mise run <name>`. `mise run ci` is the full one-liner you
# would run before pushing; it mirrors the CI pipeline one-for-one.
# ============================================================================

[tasks.fmt]
description = "Check formatting (rustfmt)"
run = "cargo fmt --check"

[tasks.lint]
description = "Run clippy over all targets, denying warnings"
run = "cargo clippy --all-targets -- -D warnings"

[tasks.rustdoc]
description = "Build the crate's own rustdoc, denying warnings (a doc reference that resolves to nothing)"
# `--document-private-items` is not a nicety here: sbx is a binary crate, so without it rustdoc
# documents almost nothing and the guard guards nothing.
#
# What it catches is a reference in a doc comment that names a symbol which was renamed, moved, or
# never existed. rustdoc drops the link and renders the label as plain code font, so a normal build
# never says the pointer is dead — and a confident, false pointer costs the reader more than no
# pointer at all. It also catches the two ways a reference is lost silently: one that is ambiguous
# (`load` is both a module and a function here, so the form has to say which), and one written on a
# `mod` declaration, whose outer doc comment merges with the module's own header and moves the whole
# block's resolution into the declaring module's scope.
#
# `RUSTDOCFLAGS` takes part in cargo's fingerprint, so a warm `target/doc` built without it does not
# short-circuit this. An unchanged tree does, which is what keeps it cheap to chain.
run = 'RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --document-private-items'

[tasks.test-cage]
description = "Run the sandbox e2e with skips turned into failures — the run that proves the cage was exercised"
# `mise run test` is honest about what skipped, but honesty is not enforcement: on a host that
# cannot sandbox, every cage test returns early and the suite is still green. This task is the other
# half — `SBX_REQUIRE_CAPABLE=1` turns `skip_incapable!` into a panic (`src/testskip.rs`), so a host
# that was *supposed* to manage has to prove it.
#
# Run it where the cage can actually start: unprivileged userns available (on Ubuntu 24.04 that
# means `kernel.apparmor_restrict_unprivileged_userns=0`), plus `nix` and `bwrap` reachable. On a
# host without them this task is *meant* to fail — that failure is the finding, not a flake.
#
# Scoped to the fourteen suites that carry a cage skip rather than to the whole tree: those are the
# ones a hosted runner silently skips, and they are what "the cage was exercised" has to mean. The
# list is written out rather than globbed so that a new suite carrying a skip is a deliberate
# addition here, not a silent omission.
run = """
set -uo pipefail
export SBX_REQUIRE_CAPABLE=1
rc=0
for suite in attach completion config detach doctor fs netns plugins proc run sessions shell stop upgrade; do
  cargo test --test "$suite" --no-fail-fast || rc=$?
done
exit $rc
"""

[tasks.test]
description = "Run the full test suite and report the tests that skipped for want of a prerequisite"
# Locally this runs the integration e2e too where the host can sandbox. CI runs
# `cargo test --bins` (the unit tests) because the sandbox e2e need userns + nix +
# network a hosted runner does not provide — there they skip, buying no coverage.
#
# And a skip is invisible without this: `cargo test` has no outcome for a precondition that fails
# at runtime, so a test that returns early is counted *passed* and the harness swallows what it
# printed. `SBX_SKIP_LOG` is where the skip macros (`src/testskip.rs`) record one line each, so the
# run can end by saying how many of its green tests did nothing, and why.
#
# The log is truncated first — a killed run leaves its own behind — and read only after every test
# binary has finished, since `cargo test` runs them one target at a time.
#
# `--no-fail-fast` is load-bearing. Without it cargo stops at the first target that reports a
# failure and every later test binary never runs at all: one red test in `tests/run.rs` takes the
# five suites that sort after it with it, and the report then shows a suite with a single problem
# rather than a suite whose tail was never asked. A green run is identical either way — every binary
# ran — so the flag costs nothing except on the runs that have something to say.
run = '''
set -uo pipefail
LOG="${SBX_SKIP_LOG:-target/test-skips.log}"
mkdir -p "$(dirname "$LOG")"
: > "$LOG"
export SBX_SKIP_LOG="$LOG"

# Root the fixtures OUTSIDE the workspace. Every suite reads `SBX_TEST_TMPDIR`, and the default it
# falls back to is inside `target/`, where one run leaves hundreds of thousands of directories. A
# language server watching the workspace spends one inotify watch per directory and exhausts the
# machine's `max_user_watches`; what breaks then is not the analyzer but systemd, which loses the
# cgroup watches a transient scope needs to learn its cage emptied. No analyzer setting avoids it:
# an exclude bounds what is analysed, not what is watched. Still on disk rather than a tmpfs, whose
# fixed inode budget a nix-store seed exhausts, and the same filesystem as `$HOME` so a fixture's
# reflink and rename semantics are the ones production sees. Reclaim a killed run's leftovers with
# `chmod -R u+w "$SBX_TEST_TMPDIR" && rm -rf "$SBX_TEST_TMPDIR"` — a bare `rm -rf` walks into a
# store's `0555` directories and silently leaves most of the tree behind.
export SBX_TEST_TMPDIR="${SBX_TEST_TMPDIR:-${XDG_CACHE_HOME:-$HOME/.cache}/sbx/test-tmp}"
mkdir -p "$SBX_TEST_TMPDIR"

rc=0
cargo test --no-fail-fast || rc=$?

n=$(wc -l < "$LOG" | tr -d ' ')
if [ "$n" -gt 0 ]; then
  echo
  echo "$n test(s) reported ok without running — their prerequisites were absent:"
  sort "$LOG" | uniq -c | sort -rn | sed 's/^/  /'
  echo "  (SBX_REQUIRE_CAPABLE=1 turns the host-capability ones into failures.)"
fi
exit $rc
'''

[tasks.coverage]
description = "Report unit-test coverage with cargo-llvm-cov (fast, deterministic; pass --html for a browsable report)"
# `--bins` measures the unit tests only — fast, network-free, and reproducible everywhere (the
# scope CI runs). The heavy sandbox e2e are left out on purpose: under coverage instrumentation
# the full suite runs ~25 min, its parallel nix-store seeds are large, and one flaky e2e would
# sink the whole report. For the complete picture on a sandbox-capable host — the e2e spawn the
# instrumented binary, so they add real coverage of the launch/proxy paths — run:
# `cargo llvm-cov --ignore-run-fail -- --test-threads=6` (bounded threads bound the peak disk the
# concurrent stores take under `target/test-tmp`). A killed run leaks its fixtures there; reclaim
# them with `chmod -R u+w target/test-tmp && rm -rf target/test-tmp` — a bare `rm -rf` walks into a
# store's `0555` directories and silently leaves most of the tree behind.
run = "cargo llvm-cov --bins"

[tasks.build]
description = "Build the shipping static musl binary"
run = "cargo zigbuild --release --target x86_64-unknown-linux-musl"

# The pinned static nix engine the `bundled-nix` feature embeds. Pinned by revision for
# reproducibility; build.rs verifies its sha256, so a drift fails the build loudly. Bump
# this ref and the `nix` `expected_sha` in build.rs (the `ENGINES` table) together.
[tasks.static-nix]
description = "Realise the pinned static nix and print the path to its bin/nix"
hide = true
run = '''
set -euo pipefail
ref='github:NixOS/nixpkgs/89570f24e97e614aa34aa9ab1c927b6578a43775#pkgsStatic.nix'
for out in $(nix build "$ref" --no-link --print-out-paths); do
  if [ -e "$out/bin/nix" ]; then echo "$out/bin/nix"; exit 0; fi
done
echo "no bin/nix in the pkgsStatic.nix outputs" >&2; exit 1
'''

# The pinned static bwrap (bubblewrap) engine the `bundled-bwrap` feature embeds. Same
# nixpkgs revision as static-nix; build.rs verifies its sha256. Bump this ref and the
# `bwrap` `expected_sha` in build.rs together.
[tasks.static-bwrap]
description = "Realise the pinned static bwrap and print the path to its bin/bwrap"
hide = true
run = '''
set -euo pipefail
ref='github:NixOS/nixpkgs/89570f24e97e614aa34aa9ab1c927b6578a43775#pkgsStatic.bubblewrap'
for out in $(nix build "$ref" --no-link --print-out-paths); do
  if [ -e "$out/bin/bwrap" ]; then echo "$out/bin/bwrap"; exit 0; fi
done
echo "no bin/bwrap in the pkgsStatic.bubblewrap outputs" >&2; exit 1
'''

[tasks.build-bundled]
description = "Build the shipping static musl binary WITH the embedded nix + bwrap engines (needs host nix)"
run = '''
set -euo pipefail
SBX_BUNDLED_NIX="$(mise run static-nix)"
SBX_BUNDLED_BWRAP="$(mise run static-bwrap)"
export SBX_BUNDLED_NIX SBX_BUNDLED_BWRAP
cargo zigbuild --release --target x86_64-unknown-linux-musl --features bundled-nix,bundled-bwrap
'''

[tasks.lint-bundled]
description = "Compile + clippy the bundled-* feature paths (not covered by default CI; needs host nix)"
run = '''
set -euo pipefail
SBX_BUNDLED_NIX="$(mise run static-nix)"
SBX_BUNDLED_BWRAP="$(mise run static-bwrap)"
export SBX_BUNDLED_NIX SBX_BUNDLED_BWRAP
cargo clippy --bins --features bundled-nix,bundled-bwrap -- -D warnings
'''

[tasks.ci]
description = "Full local reproduction of the CI pipeline (fmt + lint + rustdoc + test)"
depends = ["fmt", "lint", "rustdoc", "test"]

[tasks.docs-install]
description = "Install the Docusaurus docs-site dependencies into docs-site/node_modules (Node tool + pinned npm packages from [tools])"
run = "npm --prefix docs-site install"

[tasks.docs]
description = "Serve the Docusaurus docs site locally with live reload (http://localhost:3000)"
depends = ["docs-install"]
run = "npm --prefix docs-site run start"

[tasks.docs-build]
description = "Build the Docusaurus docs site into docs-site/build/ (broken links fail the build)"
depends = ["docs-install"]
run = "npm --prefix docs-site run build"

[tasks.docs-serve]
description = "Serve the built docs site from docs-site/build/ (http://localhost:3000): search needs this, the index only exists after a build"
depends = ["docs-build"]
run = "npm --prefix docs-site run serve"
