# mise.toml — development toolchain for the ops sandbox launcher.
#
# Run once after cloning:
#
#     mise trust          # allow mise to source this file (first time only)
#     mise install        # install the tools below
#
# Then `mise run lint`, `mise run test`, `mise run build`, `mise run ci`.
# The invocations mirror `.github/workflows/tests.yml` — if CI passes,
# `mise run ci` locally should too (and vice versa).

min_version = "2024.12.0"

[tools]
# The shipping binary is a static musl build; some dependencies carry C/asm, so
# the musl target needs a musl-targeting C compiler. zig provides a self-contained
# musl cross-cc and cargo-zigbuild wires it into cargo — no system musl-gcc package
# required. Build with:
#   mise exec -- cargo zigbuild --release --target x86_64-unknown-linux-musl
zig                             = "latest"
"github:rust-cross/cargo-zigbuild" = "latest"

# ============================================================================
# Tasks — invoked via `mise run <name>`. `mise run ci` is the full one-liner you
# would run before pushing; it mirrors the CI pipeline one-for-one.
# ============================================================================

[tasks.fmt]
description = "Check formatting (rustfmt)"
run = "cargo fmt --check"

[tasks.lint]
description = "Run clippy over all targets, denying warnings"
run = "cargo clippy --all-targets -- -D warnings"

[tasks.test]
description = "Run the full test suite (the heavy sandbox e2e skip when userns/nix/network are absent)"
# Locally this runs the integration e2e too where the host can sandbox. CI runs
# `cargo test --bins` (the unit tests) because the sandbox e2e need userns + nix +
# network a hosted runner does not provide — there they skip, buying no coverage.
run = "cargo test"

[tasks.build]
description = "Build the shipping static musl binary"
run = "cargo zigbuild --release --target x86_64-unknown-linux-musl"

# The pinned static nix engine the `bundled-nix` feature embeds. Pinned by revision for
# reproducibility; build.rs verifies its sha256, so a drift fails the build loudly. Bump
# this ref and the `nix` `expected_sha` in build.rs (the `ENGINES` table) together.
[tasks.static-nix]
description = "Realise the pinned static nix and print the path to its bin/nix"
hide = true
run = '''
set -euo pipefail
ref='github:NixOS/nixpkgs/89570f24e97e614aa34aa9ab1c927b6578a43775#pkgsStatic.nix'
for out in $(nix build "$ref" --no-link --print-out-paths); do
  if [ -e "$out/bin/nix" ]; then echo "$out/bin/nix"; exit 0; fi
done
echo "no bin/nix in the pkgsStatic.nix outputs" >&2; exit 1
'''

# The pinned static bwrap (bubblewrap) engine the `bundled-bwrap` feature embeds. Same
# nixpkgs revision as static-nix; build.rs verifies its sha256. Bump this ref and the
# `bwrap` `expected_sha` in build.rs together.
[tasks.static-bwrap]
description = "Realise the pinned static bwrap and print the path to its bin/bwrap"
hide = true
run = '''
set -euo pipefail
ref='github:NixOS/nixpkgs/89570f24e97e614aa34aa9ab1c927b6578a43775#pkgsStatic.bubblewrap'
for out in $(nix build "$ref" --no-link --print-out-paths); do
  if [ -e "$out/bin/bwrap" ]; then echo "$out/bin/bwrap"; exit 0; fi
done
echo "no bin/bwrap in the pkgsStatic.bubblewrap outputs" >&2; exit 1
'''

[tasks.build-bundled]
description = "Build the shipping static musl binary WITH the embedded nix + bwrap engines (needs host nix)"
run = '''
set -euo pipefail
OPS_BUNDLED_NIX="$(mise run static-nix)"
OPS_BUNDLED_BWRAP="$(mise run static-bwrap)"
export OPS_BUNDLED_NIX OPS_BUNDLED_BWRAP
cargo zigbuild --release --target x86_64-unknown-linux-musl --features bundled-nix,bundled-bwrap
'''

[tasks.lint-bundled]
description = "Compile + clippy the bundled-* feature paths (not covered by default CI; needs host nix)"
run = '''
set -euo pipefail
OPS_BUNDLED_NIX="$(mise run static-nix)"
OPS_BUNDLED_BWRAP="$(mise run static-bwrap)"
export OPS_BUNDLED_NIX OPS_BUNDLED_BWRAP
cargo clippy --bins --features bundled-nix,bundled-bwrap -- -D warnings
'''

[tasks.ci]
description = "Full local reproduction of the CI pipeline (fmt + lint + test)"
depends = ["fmt", "lint", "test"]
