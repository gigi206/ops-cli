# sbx docs site — Material for MkDocs.
#
# Source: docs/guide/ (the design documents in docs/*.md are deliberately
# outside docs_dir: this site is the user guide only). Build with
# `mise run docs-build`, preview with `mise run docs`.

site_name: sbx
site_description: >-
  sbx — a sandbox launcher that runs tools and encapsulated AI agents in a
  bubblewrap sandbox, where they can install a project's full dependency set
  via daemonless nix without mutating the host OS.
repo_url: https://github.com/gigi206/ops-cli
docs_dir: docs/guide

theme:
  name: material
  # Dark first: the security-cockpit default; the light scheme only kicks in
  # when the OS asks for it. The toggle flips between the two.
  palette:
    - scheme: slate
      primary: cyan
      accent: lime
      toggle:
        icon: material/weather-night
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: cyan
      accent: lime
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
  font:
    text: Inter
    code: JetBrains Mono
  logo: assets/logo.svg
  favicon: assets/logo-mark.svg
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - header.autohide
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
      # GitHub-style slugs (punctuation dropped, `--` runs), so the in-page
      # anchors the guide links to (written for the GitHub view) resolve here too.
      # Note: pymdown-extensions ≥ 11 renamed the module slugify → slugs, and
      # the old `!!python/name:` reference no longer loads.
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.highlight
  - pymdownx.superfences

plugins:
  - search
  # Render ```` ```mermaid ```` fenced blocks as SVG at build time. Without this
  # plugin the Mermaid source is rendered as plain code in a fenced box; with it,
  # Material picks up the SVGs and displays them inline. The plugin registers a
  # custom fence via `pymdownx.superfences` automatically — no extra markdown
  # extension config needed.
  - mermaid2

# The repo's guide hub (docs/guide/README.md) doubles as the GitHub landing
# page; on the site its role is played by index.md. Exclude it explicitly so
# the strict build does not trip on the index.md/README.md URL conflict.
exclude_docs: |
  /README.md

extra_css:
  - stylesheets/extra.css

extra:
  generator: false

