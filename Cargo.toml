[package]
name = "sbx"
version = "2.0.0-alpha.0"
edition = "2021"
description = "Sandbox launcher for reproducible dev environments and encapsulated AI agents (bubblewrap + daemonless nix)"
license = "Apache-2.0"
repository = "https://github.com/gigi206/ops-cli"

[[bin]]
name = "sbx"
path = "src/main.rs"

[features]
# Embed a statically-linked `nix` engine inside the sbx binary, so the shipped
# binary drives its own store with no host nix. Off by default — development and
# CI builds resolve nix from `SBX_NIX_BIN`/`PATH` and stay fast and offline. On
# only in the release build (`mise run build-bundled`), which supplies the engine
# via `SBX_BUNDLED_NIX`.
bundled-nix = []

# Embed a statically-linked `bwrap` (bubblewrap) engine inside the sbx binary, so the
# shipped binary launches its own sandbox with no host bubblewrap on most hosts, and
# pins a known-good version (every flag sbx relies on is present). Off by default, like
# `bundled-nix`; on in the release build, which supplies the engine via `SBX_BUNDLED_BWRAP`.
# Note: on a host enforcing AppArmor unprivileged-userns restriction the embedded engine
# cannot create a user namespace (the kernel grants that only to the path-profiled
# `/usr/bin/bwrap`), so sbx prefers the host engine there — see `store::resolve_bwrap`.
bundled-bwrap = []

[dependencies]
# The in-cage desktop notifications relay (`dbus = true`): bridges the cage's private D-Bus bus
# to the host `org.freedesktop.Notifications`. The async runtime is the pure-Rust `async-io` backend
# (NOT tokio), driven by `async_io::block_on` on a single dedicated thread inside `notify_relay`, so
# nothing async leaks into sbx's std-thread world (the egress proxy stays sync std threads).
async-channel = "2"
async-io = "2"
# The egress proxy's HTTP/2 (gRPC) man-in-the-middle path. `h2` is tokio-based, so a designated
# `[network] http2` host is handled on a per-connection current-thread tokio runtime confined to the
# h2 branch — the synchronous HTTP/1.1 path is untouched. `tokio-rustls` reuses the project's rustls
# 0.23 (ring) stack; `http`/`bytes` are the header-map + DATA-chunk types `h2` exposes.
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await-macro"] }
h2 = "0.4"
http = "1"
libc = "0.2"
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem", "crypto"] }
regex = "1"
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
seccompiler = "0.5"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
toml_edit = "0.22"
tokio = { version = "1", default-features = false, features = ["rt", "net", "io-util", "time", "macros"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
zbus = { version = "5", default-features = false, features = ["async-io"] }

[build-dependencies]
# Hash the embedded engines (nix, bwrap) at build time (same crate as the runtime dep,
# so no new third-party surface). Used only when a `bundled-*` feature is enabled.
sha2 = "0.10"

[profile.release]
strip = true
lto = true

# Keep the debug build's disk footprint down. `line-tables-only` retains file+line for panic
# backtraces (how the test suite is debugged) but drops the variable/type DWARF that only a
# step-debugger uses — shrinking every debug binary ~2-3x. Third-party deps, never stepped
# through, carry no debug info at all. Flip `[profile.dev].debug` back to 2 for a gdb session.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
