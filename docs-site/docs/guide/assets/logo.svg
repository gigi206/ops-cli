<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="sbx — sandbox launcher">
  <title>sbx — sandbox launcher</title>
  <defs>
    <linearGradient id="cageStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#020617"/>
    </radialGradient>
  </defs>

  <!-- Rounded slate background (matches Material dark scheme) -->
  <rect x="0" y="0" width="256" height="256" rx="36" ry="36" fill="url(#bgGlow)"/>

  <!-- Hexagonal cage outline (the bwrap boundary) -->
  <polygon points="128,30 216,82 216,174 128,226 40,174 40,82"
           fill="none"
           stroke="url(#cageStroke)"
           stroke-width="6"
           stroke-linejoin="round"/>

  <!-- Three lime wrap stripes (bubblewrap texture) -->
  <g stroke="#a3e635" stroke-width="3" stroke-linecap="round" opacity="0.85">
    <line x1="76" y1="86" x2="180" y2="86" stroke-dasharray="10 6"/>
    <line x1="68" y1="108" x2="188" y2="108" stroke-dasharray="10 6"/>
    <line x1="76" y1="130" x2="180" y2="130" stroke-dasharray="10 6"/>
  </g>

  <!-- sbx wordmark -->
  <text x="128" y="184"
        text-anchor="middle"
        font-family="'JetBrains Mono','SF Mono','Menlo','Consolas','DejaVu Sans Mono','Courier New',monospace"
        font-size="56"
        font-weight="700"
        fill="#f0f9ff"
        letter-spacing="3">sbx</text>

  <!-- Terminal cursor accent (live CLI feel) -->
  <rect x="218" y="26" width="14" height="6" rx="1" ry="1" fill="#a3e635"/>
</svg>
